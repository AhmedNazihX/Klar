# Obligations table: role x risk class -> duty, article, applies_from (story C7; INIT > Scope, Roles).
#
# Source of truth for `list_obligations` (backend/aiact/obligations/list.py) and for the database seed.
# After editing, regenerate the SQL seed with `uv run --project backend aiact obligations seed`;
# a test fails while supabase/seed/obligations.sql is stale.
#
# Each entry expands to one row per role, risk class and date. `applies_from` is either one date, or,
# for a high-risk-only entry whose date depends on the route, a map from route to date:
#   annex_iii: 2027-12-02   Art. 113(c)(i): high-risk under Art. 6(2) and Annex III
#   annex_i:   2028-08-02   Art. 113(c)(ii): high-risk under Art. 6(1) and Annex I
# A map with one route means the duty exists only on that route.
# Art. 111(2) is applied at lookup time, not stored here: for a high-risk system already on the market
# or in use before its route's date, `list_obligations(legacy=...)` marks the rows dated per route (C7b).
# Other dates: 2025-02-02 for Chapters I and II (Art. 113(a)), 2026-12-02 for Art. 5(1)(ba) and (bb)
# (Art. 113(a)), 2026-08-02 for everything else (Art. 113, second paragraph).
#
# Article ids are provision ids of the consolidated AI Act (data/parsed/ai-act-consolidated.en.jsonl);
# a test checks that each one exists there. `dates_reviewed`: the user checked the dates (2026-09-28; the Art. 49(4) and Art. 53(1)(b) rows on 2026-09-29).
# `is_informational: true` marks a row that informs rather than states a formal duty of that role.
#
# The screens' texts (C9; decision 026):
#   duty_de             the formal duty in German, in the terms of the official German text (`duty` is
#                       the English one); the report for a lawyer shows it
#   label_en, label_de  a short plain label, as an action, for the checklists ("Keep the logs it
#                       creates for at least six months"); German follows docs/design-system/localisation.md
#   group               build, prove or after_launch (the provider layout's Build it right, Prove it,
#                       After launch); only on entries a provider has, and on every high-risk one
#   document            the drafting template that answers the duty (aiact/drafting/templates.py, P8a;
#                       the provider skeletons, P8b), if any
#   applies_if_de       the condition in German (P11); required wherever `applies_if` is set
#   relief_note_de      the SME relief in German (P11); required wherever `relief_note` is set
# German labels reviewed and approved by the user, 2026-10-07 (C9); the English and German labels of the
# Art. 9 to 15 rows split from Art. 16(a) (hr-provider-risk-management to hr-provider-accuracy) too, 2026-10-07.

law_version: amended
checked_on: 2026-09-28
dates_reviewed: true

obligations:
  # --- Every in-scope class except prohibited -------------------------------------------------
  - key: ai-literacy
    roles: [provider, deployer]
    risk_classes: [high_risk, limited_risk, minimal_risk]
    duty: Take measures to support the AI literacy of staff and others who operate or use the system on your behalf.
    duty_de: >-
      Maßnahmen ergreifen, um die KI-Kompetenz Ihres Personals und anderer Personen zu unterstützen,
      die in Ihrem Auftrag mit dem Betrieb und der Nutzung des Systems befasst sind.
    label_en: "Help the people who run or use it build their AI literacy"
    label_de: "Die KI-Kompetenz der Personen fördern, die es betreiben oder nutzen"
    group: after_launch
    article: art:4:1
    applies_from: 2025-02-02
    note: >-
      The Omnibus softened this duty: the original text required ensuring "a sufficient level of AI
      literacy"; the amended text requires supporting measures and no specific level.

  # --- Prohibited -------------------------------------------------------------------------------
  - key: prohibited-practice
    roles: [provider, deployer, importer]
    risk_classes: [prohibited]
    duty: &prohibited Do not place the system on the market, put it into service or use it.
    duty_de: &prohibited-de "Das System nicht in Verkehr bringen, nicht in Betrieb nehmen und nicht verwenden."
    label_en: &prohibited-label-en "Don't offer it, put it into service or use it"
    label_de: &prohibited-label-de "Das System weder anbieten noch in Betrieb nehmen noch verwenden"
    article: art:5:1
    applies_from: 2025-02-02
    applies_if: The practice falls under Art. 5(1) points (a) to (h).
    applies_if_de: Die Praxis fällt unter Art. 5 Abs. 1 Buchst. a bis h.

  - key: prohibited-intimate-imagery
    roles: [provider, deployer, importer]
    risk_classes: [prohibited]
    duty: *prohibited
    duty_de: *prohibited-de
    label_en: *prohibited-label-en
    label_de: *prohibited-label-de
    article: art:5:1:ba
    applies_from: 2026-12-02
    applies_if: >-
      The system generates or manipulates realistic intimate or sexually explicit images, video or
      audio of an identifiable person without their explicit consent (new prohibition added by the Omnibus).
    applies_if_de: >-
      Das System erzeugt oder manipuliert realistische intime oder sexuell explizite Bilder, Videos oder
      Tonaufnahmen einer bestimmbaren Person ohne deren ausdrückliche Zustimmung (neues Verbot, durch
      den Omnibus eingefügt).

  - key: prohibited-csam
    roles: [provider, deployer, importer]
    risk_classes: [prohibited]
    duty: *prohibited
    duty_de: *prohibited-de
    label_en: *prohibited-label-en
    label_de: *prohibited-label-de
    article: art:5:1:bb
    applies_from: 2026-12-02
    applies_if: >-
      The system generates or manipulates child sexual abuse material (new prohibition added by the
      Omnibus).
    applies_if_de: >-
      Das System erzeugt oder manipuliert Darstellungen sexuellen Missbrauchs von Kindern (neues Verbot,
      durch den Omnibus eingefügt).

  - key: prohibited-distributor
    roles: [distributor]
    risk_classes: [prohibited]
    duty: &distributor-prohibited >-
      This system can't lawfully be placed on the EU market or used (Art. 5). The Act doesn't name
      distributors in Art. 5, but don't supply it.
    duty_de: &distributor-prohibited-de >-
      Dieses System darf in der EU nicht rechtmäßig in Verkehr gebracht oder verwendet werden
      (Art. 5). Art. 5 nennt Händler nicht ausdrücklich, liefern Sie es dennoch nicht.
    label_en: &distributor-prohibited-label-en "Don't supply it: it can't lawfully be sold or used in the EU"
    label_de: &distributor-prohibited-label-de "Nicht liefern: Es darf in der EU weder in Verkehr gebracht noch verwendet werden"
    article: art:5:1
    applies_from: 2025-02-02
    is_informational: true
    applies_if: The practice falls under Art. 5(1) points (a) to (h).
    applies_if_de: Die Praxis fällt unter Art. 5 Abs. 1 Buchst. a bis h.

  - key: prohibited-distributor-intimate-imagery
    roles: [distributor]
    risk_classes: [prohibited]
    duty: *distributor-prohibited
    duty_de: *distributor-prohibited-de
    label_en: *distributor-prohibited-label-en
    label_de: *distributor-prohibited-label-de
    article: art:5:1:ba
    applies_from: 2026-12-02
    is_informational: true
    applies_if: The system generates or manipulates realistic intimate or sexually explicit images, video or audio of an identifiable person without their explicit consent.
    applies_if_de: >-
      Das System erzeugt oder manipuliert realistische intime oder sexuell explizite Bilder, Videos oder
      Tonaufnahmen einer bestimmbaren Person ohne deren ausdrückliche Zustimmung.

  - key: prohibited-distributor-csam
    roles: [distributor]
    risk_classes: [prohibited]
    duty: *distributor-prohibited
    duty_de: *distributor-prohibited-de
    label_en: *distributor-prohibited-label-en
    label_de: *distributor-prohibited-label-de
    article: art:5:1:bb
    applies_from: 2026-12-02
    is_informational: true
    applies_if: The system generates or manipulates child sexual abuse material.
    applies_if_de: Das System erzeugt oder manipuliert Darstellungen sexuellen Missbrauchs von Kindern.

  # --- High-risk: provider (Art. 16 and the duties it points to) --------------------------------
  # Art. 16(a) ("meet the requirements in Section 2") is listed as one row per requirement, as the
  # provider layout shows them (user, 2026-10-07, C9); Art. 11 has its own row below.
  - key: hr-provider-risk-management
    roles: [provider]
    risk_classes: [high_risk]
    duty: >-
      Establish, implement, document and maintain a risk management system, run as a continuous
      process over the system's whole lifecycle.
    duty_de: >-
      Ein Risikomanagementsystem einrichten, anwenden, dokumentieren und aufrechterhalten, als
      kontinuierlichen Prozess über den gesamten Lebenszyklus des Systems.
    label_en: "Run a risk management system for its whole life"
    label_de: "Ein Risikomanagementsystem über den gesamten Lebenszyklus betreiben"
    group: build
    document: art_9_risk_management
    article: art:9
    applies_from: {annex_iii: 2027-12-02, annex_i: 2028-08-02}

  - key: hr-provider-data-governance
    roles: [provider]
    risk_classes: [high_risk]
    duty: >-
      Develop the system on training, validation and testing data sets that meet the quality
      criteria of Art. 10 and are subject to appropriate data governance and management practices.
    duty_de: >-
      Das System mit Trainings-, Validierungs- und Testdatensätzen entwickeln, die den
      Qualitätskriterien des Art. 10 entsprechen und geeigneten Daten-Governance- und
      Datenverwaltungsverfahren unterliegen.
    label_en: "Use training and test data that fit the purpose"
    label_de: "Trainings- und Testdaten verwenden, die zum Zweck passen"
    group: build
    article: art:10
    applies_from: {annex_iii: 2027-12-02, annex_i: 2028-08-02}

  - key: hr-provider-record-keeping
    roles: [provider]
    risk_classes: [high_risk]
    duty: Make sure the system technically allows the automatic recording of events (logs) over its lifetime.
    duty_de: >-
      Sicherstellen, dass die Technik des Systems die automatische Aufzeichnung von Ereignissen
      (Protokollierung) während seines Lebenszyklus ermöglicht.
    label_en: "Make it log its operation automatically"
    label_de: "Den Betrieb automatisch protokollieren lassen"
    group: build
    article: art:12
    applies_from: {annex_iii: 2027-12-02, annex_i: 2028-08-02}

  - key: hr-provider-transparency
    roles: [provider]
    risk_classes: [high_risk]
    duty: >-
      Design the system so that its operation is transparent enough for deployers to interpret its
      output and use it appropriately, and give it concise, complete, correct and clear instructions
      for use.
    duty_de: >-
      Das System so konzipieren und entwickeln, dass sein Betrieb hinreichend transparent ist, damit
      die Betreiber seine Ausgaben angemessen interpretieren und verwenden können, und ihm präzise,
      vollständige, korrekte und eindeutige Betriebsanleitungen beifügen.
    label_en: "Write clear instructions for the people who use it"
    label_de: "Eine verständliche Betriebsanleitung für die Betreiber erstellen"
    group: build
    article: art:13
    applies_from: {annex_iii: 2027-12-02, annex_i: 2028-08-02}

  - key: hr-provider-human-oversight
    roles: [provider]
    risk_classes: [high_risk]
    duty: >-
      Design the system so that natural persons can oversee it effectively while it is in use,
      including through appropriate human-machine interface tools.
    duty_de: >-
      Das System so konzipieren und entwickeln, dass es während der Dauer seiner Verwendung, auch
      mit geeigneten Instrumenten einer Mensch-Maschine-Schnittstelle, von natürlichen Personen
      wirksam beaufsichtigt werden kann.
    label_en: "Design it so people can oversee and override it"
    label_de: "Es so gestalten, dass Menschen es beaufsichtigen und eingreifen können"
    group: build
    article: art:14
    applies_from: {annex_iii: 2027-12-02, annex_i: 2028-08-02}

  - key: hr-provider-accuracy
    roles: [provider]
    risk_classes: [high_risk]
    duty: >-
      Design the system to achieve an appropriate level of accuracy, robustness and cybersecurity,
      and to perform consistently in those respects throughout its lifecycle.
    duty_de: >-
      Das System so konzipieren und entwickeln, dass es ein angemessenes Maß an Genauigkeit,
      Robustheit und Cybersicherheit erreicht und in dieser Hinsicht während seines gesamten
      Lebenszyklus beständig funktioniert.
    label_en: "Make it accurate, robust and secure"
    label_de: "Für Genauigkeit, Robustheit und Cybersicherheit sorgen"
    group: build
    article: art:15
    applies_from: {annex_iii: 2027-12-02, annex_i: 2028-08-02}

  - key: hr-provider-contact
    roles: [provider]
    risk_classes: [high_risk]
    duty: Put your name, registered trade name or trade mark and contact address on the system, its packaging or its documentation.
    duty_de: >-
      Ihren Namen, Ihren eingetragenen Handelsnamen bzw. Ihre eingetragene Handelsmarke und Ihre
      Kontaktanschrift auf dem System oder, falls dies nicht möglich ist, auf seiner Verpackung oder
      in der beigefügten Dokumentation angeben.
    label_en: "Put your name and contact address on it"
    label_de: "Ihren Namen und Ihre Kontaktanschrift darauf angeben"
    group: prove
    article: art:16:b
    applies_from: {annex_iii: 2027-12-02, annex_i: 2028-08-02}

  - key: hr-provider-qms
    roles: [provider]
    risk_classes: [high_risk]
    duty: Have a documented quality management system (Art. 17).
    duty_de: "Über ein dokumentiertes Qualitätsmanagementsystem verfügen, das Art. 17 entspricht."
    label_en: "Set up a quality management system"
    label_de: "Ein Qualitätsmanagementsystem einrichten"
    group: prove
    document: art_17_quality_management
    article: art:16:c
    applies_from: {annex_iii: 2027-12-02, annex_i: 2028-08-02}
    relief_note: >-
      The quality management system may be proportionate to the size of the organisation for SMEs,
      including start-ups, and SMCs (Art. 17(2)). SMEs without partner or linked enterprises may
      comply with certain elements in a simplified manner (Art. 63(1)).
    relief_note_de: >-
      Für KMU, einschließlich Start-up-Unternehmen, und kleine Midcap-Unternehmen kann das
      Qualitätsmanagementsystem in einem angemessenen Verhältnis zur Größe der Organisation stehen (Art.
      17 Abs. 2). KMU ohne Partnerunternehmen oder verbundene Unternehmen können bestimmte Elemente in
      vereinfachter Weise einhalten (Art. 63 Abs. 1).

  - key: hr-provider-technical-documentation
    roles: [provider]
    risk_classes: [high_risk]
    duty: Draw up the technical documentation (Annex IV) before placing the system on the market, and keep it up to date.
    duty_de: >-
      Die technische Dokumentation (Anhang IV) erstellen, bevor das System in Verkehr gebracht oder
      in Betrieb genommen wird, und sie auf dem neuesten Stand halten.
    label_en: "Write the technical documentation and keep it up to date"
    label_de: "Die technische Dokumentation erstellen und aktuell halten"
    group: prove
    document: annex_iv_technical_documentation
    article: art:11:1
    applies_from: {annex_iii: 2027-12-02, annex_i: 2028-08-02}
    relief_note: >-
      SMEs, including start-ups, and SMCs may provide the Annex IV elements in a simplified manner,
      using the Commission's simplified form (Art. 11(1)). As of 24 September 2026 the form did not
      appear to be published.
    relief_note_de: >-
      KMU, einschließlich Start-up-Unternehmen, und kleine Midcap-Unternehmen können die Angaben nach
      Anhang IV in vereinfachter Weise bereitstellen, mit dem vereinfachten Formular der Kommission
      (Art. 11 Abs. 1). Am 24. September 2026 schien das Formular noch nicht veröffentlicht zu sein.

  - key: hr-provider-keep-documentation
    roles: [provider]
    risk_classes: [high_risk]
    duty: Keep the technical documentation, quality management documents and declaration of conformity for 10 years (Art. 18).
    duty_de: >-
      Die technische Dokumentation, die Unterlagen zum Qualitätsmanagementsystem und die EU-
      Konformitätserklärung zehn Jahre lang aufbewahren (Art. 18).
    label_en: "Keep the documentation and declaration for 10 years"
    label_de: "Dokumentation und Konformitätserklärung zehn Jahre aufbewahren"
    group: after_launch
    article: art:16:d
    applies_from: {annex_iii: 2027-12-02, annex_i: 2028-08-02}

  - key: hr-provider-logs
    roles: [provider]
    risk_classes: [high_risk]
    duty: Keep the logs the system generates automatically, where they are under your control (Art. 19).
    duty_de: >-
      Die vom System automatisch erzeugten Protokolle gemäß Art. 19 aufbewahren, soweit sie Ihrer
      Kontrolle unterliegen.
    label_en: "Keep the logs it creates, where you control them"
    label_de: "Die automatisch erzeugten Protokolle aufbewahren, soweit Sie sie kontrollieren"
    group: after_launch
    article: art:16:e
    applies_from: {annex_iii: 2027-12-02, annex_i: 2028-08-02}

  - key: hr-provider-conformity-assessment
    roles: [provider]
    risk_classes: [high_risk]
    duty: Have the system undergo the relevant conformity assessment (Art. 43) before placing it on the market or putting it into service.
    duty_de: >-
      Sicherstellen, dass das System vor dem Inverkehrbringen oder der Inbetriebnahme dem
      betreffenden Konformitätsbewertungsverfahren gemäß Art. 43 unterzogen wird.
    label_en: "Have its conformity assessed before launch"
    label_de: "Vor dem Marktstart die Konformitätsbewertung durchlaufen"
    group: prove
    article: art:16:f
    applies_from: {annex_iii: 2027-12-02, annex_i: 2028-08-02}

  - key: hr-provider-declaration
    roles: [provider]
    risk_classes: [high_risk]
    duty: Draw up an EU declaration of conformity (Art. 47).
    duty_de: "Eine EU-Konformitätserklärung gemäß Art. 47 ausstellen."
    label_en: "Sign the EU declaration of conformity"
    label_de: "Die EU-Konformitätserklärung ausstellen"
    group: prove
    article: art:16:g
    applies_from: {annex_iii: 2027-12-02, annex_i: 2028-08-02}

  - key: hr-provider-ce-marking
    roles: [provider]
    risk_classes: [high_risk]
    duty: Affix the CE marking to the system, its packaging or its documentation (Art. 48).
    duty_de: >-
      Die CE-Kennzeichnung gemäß Art. 48 am System oder, falls dies nicht möglich ist, auf seiner
      Verpackung oder in der beigefügten Dokumentation anbringen.
    label_en: "Affix the CE marking"
    label_de: "Die CE-Kennzeichnung anbringen"
    group: prove
    article: art:16:h
    applies_from: {annex_iii: 2027-12-02, annex_i: 2028-08-02}

  - key: hr-provider-registration
    roles: [provider]
    risk_classes: [high_risk]
    duty: Register yourself and the system in the EU database before placing it on the market (Art. 49(1)).
    duty_de: >-
      Sich und das System vor dem Inverkehrbringen oder der Inbetriebnahme in der EU-Datenbank
      registrieren (Art. 49 Abs. 1).
    label_en: "Register it in the EU database"
    label_de: "Es in der EU-Datenbank registrieren"
    group: prove
    article: art:16:i
    applies_from: {annex_iii: 2027-12-02}
    note: Systems in Annex III point 2 (critical infrastructure) are registered at national level instead (Art. 49(5)).

  - key: hr-provider-corrective-actions
    roles: [provider]
    risk_classes: [high_risk]
    duty: Take corrective action and inform others when the system is not in conformity (Art. 20).
    duty_de: >-
      Die erforderlichen Korrekturmaßnahmen ergreifen und die gemäß Art. 20 erforderlichen
      Informationen bereitstellen, wenn das System nicht konform ist.
    label_en: "Take corrective action and inform others if it doesn't conform"
    label_de: "Korrekturmaßnahmen ergreifen und andere informieren, wenn es nicht konform ist"
    group: after_launch
    article: art:16:j
    applies_from: {annex_iii: 2027-12-02, annex_i: 2028-08-02}

  - key: hr-provider-demonstrate-conformity
    roles: [provider]
    risk_classes: [high_risk]
    duty: Demonstrate the system's conformity when a national competent authority asks.
    duty_de: >-
      Auf begründete Anfrage einer zuständigen nationalen Behörde nachweisen, dass das System die
      Anforderungen an Hochrisiko-KI-Systeme erfüllt.
    label_en: "Show an authority it conforms, when asked"
    label_de: "Auf Anfrage einer Behörde die Konformität nachweisen"
    group: prove
    article: art:16:k
    applies_from: {annex_iii: 2027-12-02, annex_i: 2028-08-02}

  - key: hr-provider-accessibility
    roles: [provider]
    risk_classes: [high_risk]
    duty: Make sure the system meets the accessibility requirements of Directives (EU) 2016/2102 and (EU) 2019/882.
    duty_de: >-
      Sicherstellen, dass das System die Barrierefreiheitsanforderungen gemäß den Richtlinien (EU)
      2016/2102 und (EU) 2019/882 erfüllt.
    label_en: "Make it accessible to people with disabilities"
    label_de: "Es barrierefrei gestalten"
    group: build
    article: art:16:l
    applies_from: {annex_iii: 2027-12-02, annex_i: 2028-08-02}

  - key: hr-provider-authorised-representative
    roles: [provider]
    risk_classes: [high_risk]
    duty: Appoint an authorised representative established in the Union, by written mandate, before making the system available.
    duty_de: >-
      Vor der Bereitstellung des Systems auf dem Unionsmarkt schriftlich einen in der Union
      niedergelassenen Bevollmächtigten benennen.
    label_en: "Appoint an authorised representative in the EU"
    label_de: "Einen Bevollmächtigten in der EU benennen"
    group: prove
    article: art:22:1
    applies_from: {annex_iii: 2027-12-02, annex_i: 2028-08-02}
    applies_if: The provider is established outside the Union.
    applies_if_de: Der Anbieter ist außerhalb der Union niedergelassen.

  - key: hr-provider-post-market-monitoring
    roles: [provider]
    risk_classes: [high_risk]
    duty: Set up and document a post-market monitoring system based on a monitoring plan.
    duty_de: >-
      Ein System zur Beobachtung nach dem Inverkehrbringen auf Grundlage eines Plans für die
      Beobachtung nach dem Inverkehrbringen einrichten und dokumentieren.
    label_en: "Monitor how it performs in use"
    label_de: "Beobachten, wie es sich im Einsatz bewährt"
    group: after_launch
    article: art:72:1
    applies_from: {annex_iii: 2027-12-02, annex_i: 2028-08-02}
    note: >-
      Chapter IX formally applies from 2 August 2026 (Art. 113, general date), but these duties
      only reach high-risk systems once their high-risk rules apply.

  - key: hr-provider-serious-incidents
    roles: [provider]
    risk_classes: [high_risk]
    duty: >-
      Report serious incidents to the market surveillance authority: at the latest 15 days after
      becoming aware, 10 days in case of death, 2 days for a widespread infringement.
    duty_de: >-
      Schwerwiegende Vorfälle der Marktüberwachungsbehörde melden: spätestens 15 Tage, nachdem Sie
      davon Kenntnis erlangt haben, im Todesfall spätestens nach zehn Tagen, bei einem
      weitverbreiteten Verstoß spätestens nach zwei Tagen.
    label_en: "Report serious incidents to the authority"
    label_de: "Schwerwiegende Vorfälle der Behörde melden"
    group: after_launch
    article: art:73:1
    applies_from: {annex_iii: 2027-12-02, annex_i: 2028-08-02}
    note: >-
      Chapter IX formally applies from 2 August 2026 (Art. 113, general date), but these duties
      only reach high-risk systems once their high-risk rules apply.

  # --- High-risk: deployer (Art. 26, 27) --------------------------------------------------------
  - key: hr-deployer-instructions
    roles: [deployer]
    risk_classes: [high_risk]
    duty: Use the system according to the provider's instructions for use, with appropriate technical and organisational measures.
    duty_de: >-
      Das System gemäß der beigefügten Betriebsanleitung verwenden und dafür geeignete technische
      und organisatorische Maßnahmen treffen.
    label_en: "Use the tool as the vendor's instructions say"
    label_de: "Das Tool gemäß der Betriebsanleitung des Anbieters einsetzen"
    article: art:26:1
    applies_from: {annex_iii: 2027-12-02, annex_i: 2028-08-02}

  - key: hr-deployer-human-oversight
    roles: [deployer]
    risk_classes: [high_risk]
    duty: Assign human oversight to people with the necessary competence, training, authority and support.
    duty_de: >-
      Die menschliche Aufsicht natürlichen Personen übertragen, die über die erforderliche
      Kompetenz, Ausbildung und Befugnis verfügen, und ihnen die erforderliche Unterstützung
      zukommen lassen.
    label_en: "Put trained people in charge of reviewing its output"
    label_de: "Geschulten Personen die menschliche Aufsicht übertragen"
    document: art_26_2_oversight
    article: art:26:2
    applies_from: {annex_iii: 2027-12-02, annex_i: 2028-08-02}

  - key: hr-deployer-input-data
    roles: [deployer]
    risk_classes: [high_risk]
    duty: Make sure the input data is relevant and sufficiently representative for the intended purpose.
    duty_de: >-
      Dafür sorgen, dass die Eingabedaten der Zweckbestimmung des Systems entsprechen und
      ausreichend repräsentativ sind.
    label_en: "Check that the input data suits the purpose, where you control it"
    label_de: "Prüfen, ob die Eingabedaten zum Zweck passen, soweit Sie sie kontrollieren"
    article: art:26:4
    applies_from: {annex_iii: 2027-12-02, annex_i: 2028-08-02}
    applies_if: You control the input data.
    applies_if_de: Die Eingabedaten unterliegen Ihrer Kontrolle.

  - key: hr-deployer-monitoring
    roles: [deployer]
    risk_classes: [high_risk]
    duty: >-
      Monitor the system's operation; if it presents a risk, inform the provider or distributor and
      the market surveillance authority and suspend its use; report serious incidents to the provider first.
    duty_de: >-
      Den Betrieb des Systems überwachen; birgt es ein Risiko, den Anbieter oder Händler und die
      Marktüberwachungsbehörde informieren und die Verwendung aussetzen; schwerwiegende Vorfälle
      zuerst dem Anbieter melden.
    label_en: "Watch how it performs and report serious problems to the vendor"
    label_de: "Den Betrieb überwachen und schwerwiegende Probleme dem Anbieter melden"
    article: art:26:5
    applies_from: {annex_iii: 2027-12-02, annex_i: 2028-08-02}

  - key: hr-deployer-logs
    roles: [deployer]
    risk_classes: [high_risk]
    duty: Keep the logs the system generates, where they are under your control, for at least six months.
    duty_de: >-
      Die vom System automatisch erzeugten Protokolle, soweit sie Ihrer Kontrolle unterliegen,
      mindestens sechs Monate aufbewahren.
    label_en: "Keep the logs it creates for at least six months"
    label_de: "Die automatisch erzeugten Protokolle mindestens sechs Monate aufbewahren"
    article: art:26:6
    applies_from: {annex_iii: 2027-12-02, annex_i: 2028-08-02}

  - key: hr-deployer-inform-workers
    roles: [deployer]
    risk_classes: [high_risk]
    duty: Inform workers' representatives and the affected workers before using the system at the workplace.
    duty_de: >-
      Vor der Inbetriebnahme oder Verwendung am Arbeitsplatz die Arbeitnehmervertreter und die
      betroffenen Arbeitnehmer informieren, dass sie der Verwendung des Systems unterliegen werden.
    label_en: "Tell workers' representatives and staff before you start"
    label_de: "Arbeitnehmervertretung und Beschäftigte vor dem Einsatz informieren"
    document: art_26_7_workers
    article: art:26:7
    applies_from: {annex_iii: 2027-12-02, annex_i: 2028-08-02}
    applies_if: You are an employer and use the system at the workplace.
    applies_if_de: Sie sind Arbeitgeber und verwenden das System am Arbeitsplatz.

  - key: hr-deployer-registration
    roles: [deployer]
    risk_classes: [high_risk]
    duty: Register the use of the system in the EU database (Art. 49(3)); do not use a system that is not registered.
    duty_de: >-
      Die Verwendung des Systems in der EU-Datenbank registrieren (Art. 49 Abs. 3); ein System, das
      dort nicht registriert ist, nicht verwenden.
    label_en: "Register your use in the EU database, and don't use an unregistered system"
    label_de: >-
      Die Verwendung in der EU-Datenbank registrieren und kein unregistriertes System einsetzen
    article: art:26:8
    applies_from: {annex_iii: 2027-12-02}
    applies_if: You are a public authority or a Union institution, body, office or agency.
    applies_if_de: >-
      Sie sind eine Behörde oder ein Organ, eine Einrichtung oder eine sonstige Stelle der Union.

  - key: hr-deployer-dpia
    roles: [deployer]
    risk_classes: [high_risk]
    duty: Use the provider's information (Art. 13) for your data protection impact assessment.
    duty_de: >-
      Die gemäß Art. 13 bereitgestellten Informationen für Ihre Datenschutz-Folgenabschätzung
      verwenden.
    label_en: "Use the vendor's information for your data protection impact assessment"
    label_de: "Die Angaben des Anbieters für Ihre Datenschutz-Folgenabschätzung nutzen"
    article: art:26:9
    applies_from: {annex_iii: 2027-12-02, annex_i: 2028-08-02}
    applies_if: A data protection impact assessment is required under Art. 35 GDPR or Art. 27 of Directive (EU) 2016/680.
    applies_if_de: >-
      Eine Datenschutz-Folgenabschätzung ist nach Art. 35 DSGVO oder Art. 27 der Richtlinie (EU)
      2016/680 erforderlich.

  - key: hr-deployer-post-remote-biometric
    roles: [deployer]
    risk_classes: [high_risk]
    duty: >-
      Get prior (or, at the latest within 48 hours, subsequent) authorisation from a judicial or
      binding administrative authority for each use, limit each use to a specific offence, document
      every use in the police file and report annually to the authorities.
    duty_de: >-
      Für jede Verwendung vorab oder spätestens binnen 48 Stunden die Genehmigung einer
      Justizbehörde oder einer Verwaltungsbehörde mit bindender Entscheidung einholen, jede
      Verwendung auf die Ermittlung einer bestimmten Straftat beschränken, jede Verwendung in der
      Polizeiakte dokumentieren und den Behörden jährlich Bericht erstatten.
    label_en: "Get authorisation for each use and limit it to a specific offence"
    label_de: >-
      Jede Verwendung genehmigen lassen und auf eine bestimmte Straftat beschränken
    article: art:26:10
    applies_from: {annex_iii: 2027-12-02}
    applies_if: >-
      You use post-remote biometric identification for law enforcement (targeted search of a person
      suspected or convicted of a criminal offence).
    applies_if_de: >-
      Sie verwenden ein System zur nachträglichen biometrischen Fernidentifizierung zur Strafverfolgung
      (gezielte Suche nach einer Person, die einer Straftat verdächtigt wird oder wegen einer Straftat
      verurteilt wurde).

  - key: hr-deployer-inform-persons
    roles: [deployer]
    risk_classes: [high_risk]
    duty: Inform the people concerned that they are subject to the use of the high-risk system.
    duty_de: >-
      Die betroffenen natürlichen Personen darüber informieren, dass sie der Verwendung des
      Hochrisiko-KI-Systems unterliegen.
    label_en: "Tell the people affected that it's used in decisions about them"
    label_de: >-
      Betroffene Personen informieren, dass das Tool bei Entscheidungen über sie eingesetzt wird
    document: art_26_11_affected
    article: art:26:11
    applies_from: {annex_iii: 2027-12-02}
    applies_if: The system makes, or helps make, decisions about natural persons.
    applies_if_de: Das System trifft Entscheidungen über natürliche Personen oder wirkt daran mit.

  - key: hr-deployer-cooperate
    roles: [deployer]
    risk_classes: [high_risk]
    duty: Cooperate with the competent authorities in any action they take about the system.
    duty_de: >-
      Mit den zuständigen Behörden bei allen Maßnahmen zusammenarbeiten, die diese im Zusammenhang
      mit dem System ergreifen.
    label_en: "Cooperate with the authorities when they act on it"
    label_de: "Mit den Behörden bei ihren Maßnahmen zusammenarbeiten"
    article: art:26:12
    applies_from: {annex_iii: 2027-12-02, annex_i: 2028-08-02}

  - key: hr-deployer-fria
    roles: [deployer]
    risk_classes: [high_risk]
    duty: Carry out a fundamental rights impact assessment before first use, and notify the market surveillance authority of the results.
    duty_de: >-
      Vor der ersten Verwendung eine Grundrechte-Folgenabschätzung durchführen und der
      Marktüberwachungsbehörde die Ergebnisse mitteilen.
    label_en: "Assess its impact on fundamental rights before first use"
    label_de: "Vor der ersten Verwendung die Folgen für die Grundrechte abschätzen"
    document: art_27_fria
    article: art:27:1
    applies_from: {annex_iii: 2027-12-02}
    applies_if: >-
      You are a body governed by public law or a private entity providing public services (except for
      Annex III point 2), or the system is used for creditworthiness or credit scoring, or for risk
      assessment and pricing in life and health insurance (Annex III points 5(b) and (c)).
    applies_if_de: >-
      Sie sind eine Einrichtung des öffentlichen Rechts oder eine private Einrichtung, die öffentliche
      Dienste erbringt (außer bei Anhang III Nr. 2), oder das System dient der Kreditwürdigkeitsprüfung
      oder Bonitätsbewertung oder der Risikobewertung und Preisbildung in der Lebens- und
      Krankenversicherung (Anhang III Nr. 5 Buchst. b und c).
    note: The AI Office is to publish a questionnaire template to simplify this assessment (Art. 27(5)).

  - key: hr-deployer-explanation
    roles: [deployer]
    risk_classes: [high_risk]
    duty: >-
      On request, give an affected person clear and meaningful explanations of the role of the system
      in the decision and the main elements of the decision taken.
    duty_de: >-
      Betroffenen Personen auf Anfrage eine klare und aussagekräftige Erläuterung zur Rolle des
      Systems im Entscheidungsprozess und zu den wichtigsten Elementen der getroffenen Entscheidung
      geben.
    label_en: "Explain its role in a decision when an affected person asks"
    label_de: "Auf Anfrage Betroffener die Rolle des Systems bei einer Entscheidung erläutern"
    article: art:86:1
    applies_from: {annex_iii: 2027-12-02}
    applies_if: >-
      Decisions taken on the basis of the system's output produce legal effects on people or
      similarly significantly affect them (not for Annex III point 2, critical infrastructure).
    applies_if_de: >-
      Entscheidungen auf Grundlage der Ausgaben des Systems haben rechtliche Auswirkungen auf Personen
      oder beeinträchtigen sie ähnlich erheblich (nicht bei Anhang III Nr. 2).
    note: >-
      Chapter IX formally applies from 2 August 2026 (Art. 113, general date), but these duties
      only reach high-risk systems once their high-risk rules apply.

  # --- High-risk: law enforcement, migration, asylum and border control (Art. 49(4)) -------------
  # Added by E7 (C7 follow-up). The date follows the registrations it modifies (Art. 113(c)(i));
  # the user reviewed it on 2026-09-29.
  - key: hr-registration-non-public
    roles: [provider, deployer]
    risk_classes: [high_risk]
    duty: >-
      Register in the secure non-public section of the EU database, with only the reduced set of
      information Art. 49(4) lists; only the Commission and the authorities in Art. 74(8) can see it.
    duty_de: >-
      Die Registrierung im sicheren nicht öffentlichen Teil der EU-Datenbank vornehmen, nur mit den
      in Art. 49 Abs. 4 genannten Angaben; nur die Kommission und die in Art. 74 Abs. 8 genannten
      Behörden haben Zugang.
    label_en: "Register it in the non-public section of the EU database"
    label_de: "Es im nicht öffentlichen Teil der EU-Datenbank registrieren"
    group: prove
    article: art:49:4
    applies_from: {annex_iii: 2027-12-02}
    applies_if: >-
      The system is listed in Annex III point 1, 6 or 7 and is used in law enforcement, migration,
      asylum or border control management.
    applies_if_de: >-
      Das System fällt unter Anhang III Nr. 1, 6 oder 7 und wird in den Bereichen Strafverfolgung,
      Migration, Asyl oder Grenzkontrolle verwendet.
    note: >-
      Replaces the public registration of Art. 49(1) to (3) for these systems.

  # --- High-risk: importer (Art. 23) ------------------------------------------------------------
  - key: hr-importer-verify
    roles: [importer]
    risk_classes: [high_risk]
    duty: >-
      Before placing the system on the market, verify that the provider carried out the conformity
      assessment, drew up the technical documentation, affixed the CE marking with the declaration of
      conformity and instructions, and appointed an authorised representative.
    duty_de: >-
      Vor dem Inverkehrbringen überprüfen, ob der Anbieter das Konformitätsbewertungsverfahren
      durchgeführt und die technische Dokumentation erstellt hat, ob das System mit der CE-
      Kennzeichnung versehen ist und ihm die EU-Konformitätserklärung und die Betriebsanleitung
      beigefügt sind und ob der Anbieter einen Bevollmächtigten benannt hat.
    label_en: "Before you bring it to market, check the provider did its conformity work"
    label_de: >-
      Vor dem Inverkehrbringen prüfen, ob der Anbieter seine Konformitätspflichten erfüllt hat
    article: art:23:1
    applies_from: {annex_iii: 2027-12-02, annex_i: 2028-08-02}

  - key: hr-importer-nonconformity
    roles: [importer]
    risk_classes: [high_risk]
    duty: Do not place a non-conforming or falsified system on the market; if it presents a risk, inform the provider, the authorised representative and the authorities.
    duty_de: >-
      Ein nichtkonformes oder gefälschtes System nicht in Verkehr bringen; birgt es ein Risiko, den
      Anbieter, den Bevollmächtigten und die Marktüberwachungsbehörden informieren.
    label_en: "Don't bring a non-conforming or falsified system to market; report risks"
    label_de: "Kein nichtkonformes oder gefälschtes System in Verkehr bringen; Risiken melden"
    article: art:23:2
    applies_from: {annex_iii: 2027-12-02, annex_i: 2028-08-02}

  - key: hr-importer-contact
    roles: [importer]
    risk_classes: [high_risk]
    duty: Put your name, registered trade name or trade mark and contact address on the system and its packaging or documentation.
    duty_de: >-
      Ihren Namen, Ihren eingetragenen Handelsnamen oder Ihre eingetragene Handelsmarke und Ihre
      Kontaktanschrift auf der Verpackung oder gegebenenfalls in der beigefügten Dokumentation
      angeben.
    label_en: "Put your name and contact address on its packaging or documentation"
    label_de: >-
      Ihren Namen und Ihre Kontaktanschrift auf der Verpackung oder in der Dokumentation angeben
    article: art:23:3
    applies_from: {annex_iii: 2027-12-02, annex_i: 2028-08-02}

  - key: hr-importer-storage
    roles: [importer]
    risk_classes: [high_risk]
    duty: Make sure storage and transport do not jeopardise the system's compliance while it is under your responsibility.
    duty_de: >-
      Sicherstellen, dass die Lagerungs- oder Transportbedingungen die Konformität des Systems nicht
      beeinträchtigen, solange es sich in Ihrer Verantwortung befindet.
    label_en: "Store and transport it so it stays compliant"
    label_de: "Lagerung und Transport so gestalten, dass es konform bleibt"
    article: art:23:4
    applies_from: {annex_iii: 2027-12-02, annex_i: 2028-08-02}

  - key: hr-importer-keep-documents
    roles: [importer]
    risk_classes: [high_risk]
    duty: Keep the notified body's certificate (if any), the instructions for use and the declaration of conformity for 10 years.
    duty_de: >-
      Ein Exemplar der Bescheinigung der notifizierten Stelle (falls vorhanden), die
      Betriebsanleitung und die EU-Konformitätserklärung zehn Jahre lang bereithalten.
    label_en: "Keep the certificate, instructions and declaration for 10 years"
    label_de: "Bescheinigung, Betriebsanleitung und Konformitätserklärung zehn Jahre bereithalten"
    article: art:23:5
    applies_from: {annex_iii: 2027-12-02, annex_i: 2028-08-02}

  - key: hr-importer-provide-information
    roles: [importer]
    risk_classes: [high_risk]
    duty: Give the competent authorities the information and documentation they ask for to demonstrate conformity.
    duty_de: >-
      Den zuständigen Behörden auf begründete Anfrage alle Informationen und Dokumentation
      übermitteln, die zum Nachweis der Konformität des Systems erforderlich sind.
    label_en: "Give the authorities the documents they ask for"
    label_de: "Den Behörden auf Anfrage die nötigen Unterlagen übermitteln"
    article: art:23:6
    applies_from: {annex_iii: 2027-12-02, annex_i: 2028-08-02}

  - key: hr-importer-cooperate
    roles: [importer]
    risk_classes: [high_risk]
    duty: Cooperate with the competent authorities in any action they take about the system.
    duty_de: >-
      Mit den zuständigen Behörden bei allen Maßnahmen zusammenarbeiten, die diese im Zusammenhang
      mit dem System ergreifen.
    label_en: "Cooperate with the authorities when they act on it"
    label_de: "Mit den Behörden bei ihren Maßnahmen zusammenarbeiten"
    article: art:23:7
    applies_from: {annex_iii: 2027-12-02, annex_i: 2028-08-02}

  # --- High-risk: distributor (Art. 24) ---------------------------------------------------------
  - key: hr-distributor-verify
    roles: [distributor]
    risk_classes: [high_risk]
    duty: >-
      Before making the system available, verify the CE marking, the declaration of conformity and
      instructions for use, and that the provider and importer put their names and contact details on it.
    duty_de: >-
      Vor der Bereitstellung auf dem Markt überprüfen, ob das System mit der CE-Kennzeichnung
      versehen ist, ob ihm die EU-Konformitätserklärung und die Betriebsanleitung beigefügt sind und
      ob Anbieter und Einführer ihren Namen und ihre Kontaktanschrift angegeben haben.
    label_en: "Before you supply it, check its CE marking, declaration and instructions"
    label_de: >-
      Vor der Bereitstellung CE-Kennzeichnung, Erklärung und Betriebsanleitung prüfen
    article: art:24:1
    applies_from: {annex_iii: 2027-12-02, annex_i: 2028-08-02}

  - key: hr-distributor-nonconformity
    roles: [distributor]
    risk_classes: [high_risk]
    duty: Do not make a non-conforming system available; if it presents a risk, inform the provider or importer.
    duty_de: >-
      Ein nichtkonformes System nicht auf dem Markt bereitstellen; birgt es ein Risiko, den Anbieter
      oder den Einführer informieren.
    label_en: "Don't supply a non-conforming system; report risks to the provider or importer"
    label_de: "Kein nichtkonformes System bereitstellen; Risiken dem Anbieter oder Einführer melden"
    article: art:24:2
    applies_from: {annex_iii: 2027-12-02, annex_i: 2028-08-02}

  - key: hr-distributor-storage
    roles: [distributor]
    risk_classes: [high_risk]
    duty: Make sure storage and transport do not jeopardise the system's compliance while it is under your responsibility.
    duty_de: >-
      Sicherstellen, dass die Lagerungs- oder Transportbedingungen die Konformität des Systems nicht
      beeinträchtigen, solange es sich in Ihrer Verantwortung befindet.
    label_en: "Store and transport it so it stays compliant"
    label_de: "Lagerung und Transport so gestalten, dass es konform bleibt"
    article: art:24:3
    applies_from: {annex_iii: 2027-12-02, annex_i: 2028-08-02}

  - key: hr-distributor-corrective-actions
    roles: [distributor]
    risk_classes: [high_risk]
    duty: For a non-conforming system you made available, take corrective action, withdraw or recall it, or make sure the provider or importer does.
    duty_de: >-
      Für ein nichtkonformes System, das Sie auf dem Markt bereitgestellt haben, die erforderlichen
      Korrekturmaßnahmen ergreifen, es zurücknehmen oder zurückrufen oder sicherstellen, dass der
      Anbieter oder der Einführer dies tut.
    label_en: "Fix, withdraw or recall a non-conforming system you supplied"
    label_de: >-
      Ein nichtkonformes System korrigieren, zurücknehmen oder zurückrufen
    article: art:24:4
    applies_from: {annex_iii: 2027-12-02, annex_i: 2028-08-02}

  - key: hr-distributor-provide-information
    roles: [distributor]
    risk_classes: [high_risk]
    duty: Give the competent authorities the information and documentation they ask for about your actions.
    duty_de: >-
      Den zuständigen Behörden auf begründete Anfrage alle Informationen und Dokumentation zu Ihren
      Maßnahmen übermitteln.
    label_en: "Give the authorities information about what you did"
    label_de: "Den Behörden auf Anfrage Auskunft über Ihre Maßnahmen geben"
    article: art:24:5
    applies_from: {annex_iii: 2027-12-02, annex_i: 2028-08-02}

  - key: hr-distributor-cooperate
    roles: [distributor]
    risk_classes: [high_risk]
    duty: Cooperate with the competent authorities in any action they take about the system.
    duty_de: >-
      Mit den zuständigen Behörden bei allen Maßnahmen zusammenarbeiten, die diese im Zusammenhang
      mit dem System ergreifen.
    label_en: "Cooperate with the authorities when they act on it"
    label_de: "Mit den Behörden bei ihren Maßnahmen zusammenarbeiten"
    article: art:24:6
    applies_from: {annex_iii: 2027-12-02, annex_i: 2028-08-02}

  # --- Transparency (Art. 50); they stack on high-risk --------------------------------------------
  - key: transparency-interaction
    roles: [provider]
    risk_classes: [limited_risk, high_risk]
    duty: Design the system so that people are informed they are interacting with an AI system, unless that is obvious.
    duty_de: >-
      Das System so konzipieren und entwickeln, dass Personen informiert werden, dass sie mit einem
      KI-System interagieren, es sei denn, dies ist offensichtlich.
    label_en: "Tell people they're talking to an AI system"
    label_de: "Personen darüber informieren, dass sie mit einem KI-System interagieren"
    group: build
    article: art:50:1
    applies_from: 2026-08-02
    applies_if: The system is intended to interact directly with natural persons.
    applies_if_de: Das System ist für die direkte Interaktion mit natürlichen Personen bestimmt.

  - key: transparency-marking
    roles: [provider]
    risk_classes: [limited_risk, high_risk]
    duty: Mark the system's outputs in a machine-readable format so they are detectable as artificially generated or manipulated.
    duty_de: >-
      Die Ausgaben des Systems in einem maschinenlesbaren Format kennzeichnen, sodass sie als
      künstlich erzeugt oder manipuliert erkennbar sind.
    label_en: "Mark its outputs as AI-generated in a machine-readable way"
    label_de: "Die Ausgaben maschinenlesbar als KI-erzeugt kennzeichnen"
    group: build
    article: art:50:2
    applies_from: 2026-08-02
    applies_if: The system generates synthetic audio, image, video or text content.
    applies_if_de: Das System erzeugt synthetische Audio-, Bild-, Video- oder Textinhalte.
    note: >-
      Systems placed on the market before 2 August 2026 have until 2 December 2026 to comply
      (Art. 111(4), added by the Omnibus).

  - key: transparency-emotion-biometric
    roles: [deployer]
    risk_classes: [limited_risk, high_risk]
    duty: Inform the people exposed to the system that it is operating, and process their personal data under the GDPR.
    duty_de: >-
      Die betroffenen natürlichen Personen über den Betrieb des Systems informieren und
      personenbezogene Daten gemäß der Verordnung (EU) 2016/679 (DSGVO) verarbeiten.
    label_en: "Tell people the emotion recognition or biometric categorisation is running"
    label_de: >-
      Betroffene informieren, dass Emotionserkennung oder biometrische Kategorisierung läuft
    document: art_50_3_disclosure
    article: art:50:3
    applies_from: 2026-08-02
    applies_if: The system is an emotion recognition or biometric categorisation system.
    applies_if_de: >-
      Das System ist ein Emotionserkennungssystem oder ein System zur biometrischen Kategorisierung.

  - key: transparency-deep-fake
    roles: [deployer]
    risk_classes: [limited_risk, high_risk]
    duty: >-
      Disclose that deep-fake image, audio or video content, or text published to inform the public on
      matters of public interest, has been artificially generated or manipulated.
    duty_de: >-
      Offenlegen, dass Deepfake-Bild-, Ton- oder Videoinhalte oder Texte, die veröffentlicht werden,
      um die Öffentlichkeit über Angelegenheiten von öffentlichem Interesse zu informieren,
      künstlich erzeugt oder manipuliert wurden.
    label_en: "Disclose AI-made content that could pass as real"
    label_de: "Offenlegen, wenn Inhalte echt wirken, aber KI-erzeugt sind"
    document: art_50_4_disclosure
    article: art:50:4
    applies_from: 2026-08-02
    applies_if: >-
      The system generates or manipulates deep fakes, or text published to inform the public on
      matters of public interest (not needed for text under human editorial control).
    applies_if_de: >-
      Das System erzeugt oder manipuliert Deepfakes oder Texte, die veröffentlicht werden, um die
      Öffentlichkeit über Angelegenheiten von öffentlichem Interesse zu informieren (nicht bei Texten
      unter redaktioneller Kontrolle eines Menschen).

  # --- Art. 6(3) exemption: not high-risk, but still documented and registered --------------------
  - key: annex-iii-exemption
    roles: [provider]
    risk_classes: [limited_risk, minimal_risk]
    duty: >-
      Document the assessment before placing the system on the market, register it in the EU database
      (Art. 49(2)), and hand the assessment to national authorities on request.
    duty_de: >-
      Die Bewertung vor dem Inverkehrbringen oder der Inbetriebnahme dokumentieren, das System in
      der EU-Datenbank registrieren (Art. 49 Abs. 2) und die Dokumentation der Bewertung den
      zuständigen nationalen Behörden auf Verlangen vorlegen.
    label_en: "Document why it isn't high-risk, and register it"
    label_de: "Dokumentieren, warum es nicht hochriskant ist, und es registrieren"
    group: prove
    article: art:6:4
    applies_from: 2027-12-02
    applies_if: The system is listed in Annex III, but you concluded under Art. 6(3) that it is not high-risk.
    applies_if_de: >-
      Das System ist in Anhang III aufgeführt, aber Sie sind nach Art. 6 Abs. 3 zu dem Schluss gekommen,
      dass es nicht hochriskant ist.
    note: >-
      The Omnibus kept this registration but simplified its content (Omnibus recital 22). The date
      follows Art. 113(c)(i), as the Commission's AI Act Service Desk timeline reads it (Annex III
      rules from 2 December 2027). That provision names systems "classified as high-risk", so a
      literal reading could give 2 August 2026. Check with a lawyer.

  # --- Systems built on a general-purpose AI model (Art. 53) -------------------------------------
  # Added by E7: flags the model provider's duties (INIT > Roles). The user reviewed the date on 2026-09-29.
  - key: gpai-model-provider-duties
    roles: [provider]
    risk_classes: [high_risk, limited_risk, minimal_risk]
    duty: >-
      The provider of the general-purpose AI model has its own duties under Chapter V (Art. 53, and
      Art. 55 for models with systemic risk), which this assessment doesn't cover. It must give you
      the information and documentation you need to understand the model's capabilities and
      limitations and to meet your own duties (Art. 53(1)(b)).
    duty_de: >-
      Der Anbieter des KI-Modells mit allgemeinem Verwendungszweck hat eigene Pflichten nach Kapitel
      V (Art. 53, bei Modellen mit systemischem Risiko auch Art. 55), die diese Bewertung nicht
      abdeckt. Er muss Ihnen die Informationen und die Dokumentation bereitstellen, die Sie
      brauchen, um die Fähigkeiten und Grenzen des Modells zu verstehen und Ihren eigenen Pflichten
      nachzukommen (Art. 53 Abs. 1 Buchst. b).
    label_en: "Get the information you need from the model's maker"
    label_de: "Vom Anbieter des Modells die Informationen erhalten, die Sie brauchen"
    group: build
    article: art:53:1:b
    applies_from: 2025-08-02
    is_informational: true
    applies_if: The system is built on a general-purpose AI model from another provider.
    applies_if_de: >-
      Das System beruht auf einem KI-Modell mit allgemeinem Verwendungszweck eines anderen Anbieters.
    note: Chapter V applies from 2 August 2025 (Art. 113(b)).
