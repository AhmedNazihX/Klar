[project]
name = "aiact"
version = "0.1.0"
description = "AI Act Classification Assistant: classifies AI systems under the EU AI Act, with steps, citations and measured accuracy."
requires-python = ">=3.12,<3.13"
dependencies = [
    "docling-slim[convert-core,format-pdf,models-local]>=2.130.0",
    "httpx>=0.28.1",
    "langchain-openrouter>=0.2.9",
    "lxml>=6.1.3",
    "opencv-python-headless>=5.0.0.93",
    "openrouter>=0.11.46",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "typer>=0.27.2",
]

[project.scripts]
aiact = "aiact.cli:app"

[dependency-groups]
dev = [
    "lxml-stubs>=0.5.1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-recording>=0.13.4",
    "ruff>=0.16.9",
]

[build-system]
requires = ["uv_build>=0.11.33,<0.12"]
build-backend = "uv_build"

[tool.uv]
# docling-core caps typer below 0.27 for its own CLI tools, which aiact never calls; the
# override keeps our typer. Torch has no Intel-mac wheels, so the lock skips that platform.
override-dependencies = ["typer>=0.27.2"]
environments = ["sys_platform != 'darwin' or platform_machine != 'x86_64'"]

[tool.uv.build-backend]
module-name = "aiact"
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
pythonVersion = "3.12"
include = ["aiact", "tests"]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Live model tests are skipped by default; run them with `uv run pytest -m live`
# (a later -m on the command line overrides this one). The network is blocked except for
# local hosts (the database) and tests marked live; see tests/conftest.py.
addopts = [
    "-m",
    "not live",
    "--strict-markers",
    "--block-network",
    "--allowed-hosts=127.0.0.1,localhost",
]
markers = [
    "live: calls a real model or service; skipped unless run with -m live",
    "db: needs the local Supabase Postgres (`supabase start`); skipped when it isn't reachable",
]
