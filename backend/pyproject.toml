[project]
name = "aiact"
version = "0.1.0"
description = "AI Act Classification Assistant: classifies AI systems under the EU AI Act, with steps, citations and measured accuracy."
requires-python = ">=3.12,<3.13"
dependencies = [
    "docling-core>=2.96.0",
    "fastapi>=0.142.2",
    "fpdf2>=2.8.9",
    "httpx>=0.28.1",
    "langchain-openrouter>=0.2.9",
    "langgraph>=1.2.12",
    "langsmith>=0.14.1",
    "lxml>=6.1.3",
    "mcp>=2.2.0",
    "openrouter>=0.11.46",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "python-docx>=1.2.0",
    "pyyaml>=6.0.3",
    "typer>=0.27.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
aiact = "aiact.cli:app"

[dependency-groups]
dev = [
    "lxml-stubs>=0.5.1",
    "pypdf>=6.19.0",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-recording>=0.13.4",
    "ruff>=0.16.9",
]
ingest = [
    "docling-slim[convert-core,format-pdf,models-local]>=2.130.0",
    "opencv-python-headless>=5.0.0.93",
]
eval = [
    "openai>=2.54.0",
    "ragas>=0.4.3",
]

[build-system]
requires = ["uv_build>=0.11.33,<0.12"]
build-backend = "uv_build"

[tool.uv]
# docling-core caps typer below 0.27 for its own CLI tools, which aiact never calls; the
# override keeps our typer. The `ingest` group (Docling's PDF models, for
# `aiact corpus guidelines`; install with `uv sync --group ingest`) pulls in torch, which has
# no Intel-mac wheels, so the lock skips that platform. Plain `uv sync` and CI leave it out.
override-dependencies = ["typer>=0.27.2"]
# The `eval` group (RAGAS and the OpenAI SDK it drives, for `aiact evaluate ragas`) is installed by
# plain `uv sync` and CI, but stays out of a runtime install (`uv sync --no-default-groups`).
default-groups = ["dev", "eval"]
# ragas 0.4.3 imports langchain_community.chat_models.vertexai at import time, which
# langchain-community 0.4.2 removed; 0.4.1 still has it. openai 3 moved to httpx2, which the
# test recordings (vcrpy) can't replay, so the RAGAS model's client stays on openai 2 (V6).
constraint-dependencies = ["langchain-community<0.4.2", "openai<3"]
environments = ["sys_platform != 'darwin' or platform_machine != 'x86_64'"]

[tool.uv.build-backend]
module-name = "aiact"
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
pythonVersion = "3.12"
include = ["aiact", "tests"]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Live model tests are skipped by default; run them with `uv run pytest -m live`
# (a later -m on the command line overrides this one). The network is blocked except for
# local hosts (the database) and tests marked live; see tests/conftest.py.
addopts = [
    "-m",
    "not live",
    "--strict-markers",
    "--block-network",
    "--allowed-hosts=127.0.0.1,localhost",
]
markers = [
    "live: calls a real model or service; skipped unless run with -m live",
    "db: needs the local test database (TEST_DATABASE_URL, default 127.0.0.1:54322; `supabase start -x ...`); skipped when it isn't reachable",
]
