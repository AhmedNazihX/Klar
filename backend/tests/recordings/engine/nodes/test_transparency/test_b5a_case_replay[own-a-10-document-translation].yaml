    body: '{"input":["Instruct: Given a description of an AI system or a question
      about the EU AI Act, retrieve the provisions of the AI Act that apply\nQuery:Wir
      sind ein mittelgro\u00dfes Sprachtechnologie-Unternehmen aus S\u00fcddeutschland.
      Unser Produkt \u00fcbersetzt Gesch\u00e4ftsdokumente wie Vertr\u00e4ge, Handb\u00fccher
      und Pr\u00e4sentationen zwischen 18 Sprachen. Kunden laden die Datei hoch und
      bekommen sie \u00fcbersetzt im selben Layout zur\u00fcck; Inhalt und Aussage
      bleiben gleich, eigene Texte oder Zusammenfassungen schreibt das System nicht.
      Einen Chat gibt es nicht. Das neuronale \u00dcbersetzungsmodell haben wir selbst
      trainiert, auf dem Markt sind wir seit 2023 und haben inzwischen rund 2.000
      Firmenkunden in der EU. Im Fr\u00fchjahr haben wir unser Logo erneuert."],"model":"qwen/qwen3-embedding-8b","dimensions":1536,"encoding_format":"float","provider":{"allow_fallbacks":false,"data_collection":"deny","order":["nebius"],"zdr":true}}'
