interactions:
- request:
    body: '{"input":["Instruct: Given a description of an AI system or a question
      about the EU AI Act, retrieve the article, Annex point or recital of the AI
      Act that governs it\nQuery:Our firm in Leipzig employs 60 people and has supplied
      a door-entry product to gym chains in Germany since 2025. Each member signs
      up with a photo that is linked to their membership card. When a member taps
      the card at the entrance turnstile, a camera takes a picture, and our model
      compares that face with the photo on file for this one card. On a match the
      turnstile unlocks; otherwise a staff member at the front desk gets an alert.
      Gyms use it to stop members lending their cards to friends. The pictures taken
      at the turnstile are discarded after each comparison."],"model":"qwen/qwen3-embedding-8b","dimensions":1536,"encoding_format":"float","provider":{"allow_fallbacks":false,"data_collection":"deny","order":["nebius"],"zdr":true}}'
