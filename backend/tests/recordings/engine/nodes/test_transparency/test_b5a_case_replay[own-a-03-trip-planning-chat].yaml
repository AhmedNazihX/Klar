    body: '{"input":["Instruct: Given a description of an AI system or a question
      about the EU AI Act, retrieve the article, Annex point or recital of the AI
      Act that governs it\nQuery:We''re a mid-sized online travel company in northern
      Italy. In May 2026 we launched a trip-planning assistant on our booking site
      and app. Travellers chat with it in plain language (\"four days in Lisbon with
      two kids, not too much walking\"), it asks follow-up questions and then writes
      a day-by-day itinerary with restaurant tips, which they can book through us.
      It runs on a large language model we license from a US provider, wrapped in
      our own prompts, booking connections and safety filters, and it carries our
      brand. About 30,000 people used it over the summer. The team behind it also
      looks after our loyalty programme."],"model":"qwen/qwen3-embedding-8b","dimensions":1536,"encoding_format":"float","provider":{"allow_fallbacks":false,"data_collection":"deny","order":["nebius"],"zdr":true}}'
