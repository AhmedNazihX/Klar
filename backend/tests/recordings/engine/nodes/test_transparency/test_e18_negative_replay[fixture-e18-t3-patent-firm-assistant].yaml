    body: '{"input":["Instruct: Given a description of an AI system or a question
      about the EU AI Act, retrieve the article, Annex point or recital of the AI
      Act that governs it\nQuery:We are a legal-tech company in Munich with 35 employees.
      Since 2025 we have licensed a research assistant to about 60 patent law firms
      in Germany and Austria. Patent attorneys and paralegals type questions into
      a chat window, for example about deadlines under the European Patent Convention
      or about earlier filings in their firm''s own archive, and the assistant replies
      in writing, with links to the passages it relied on. Our licence terms allow
      accounts only for a firm''s own patent attorneys and paralegals, and an account
      is activated only after the person has completed our one-day course, which explains
      that the assistant is a large language model, how such models work, where they
      go wrong and how to check every answer. The firms'' clients have no access to
      it."],"model":"qwen/qwen3-embedding-8b","dimensions":1536,"encoding_format":"float","provider":{"allow_fallbacks":false,"data_collection":"deny","order":["nebius"],"zdr":true}}'
