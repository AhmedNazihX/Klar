    body: '{"input":["Instruct: Given a description of an AI system or a question
      about the EU AI Act, retrieve the provisions of the AI Act that apply\nQuery:Wir
      sind ein Audio-Tech-Unternehmen aus dem Rheinland mit einigen Dutzend Leuten.
      Am 1. September 2026 haben wir unseren H\u00f6rbuch-Dienst gestartet: Verlage
      laden ein Manuskript hoch, w\u00e4hlen eine von 30 Stimmen, die wir mit bezahlten
      Sprecherinnen und Sprechern aufgenommen und lizenziert haben, und bekommen nach
      ein paar Stunden das fertige H\u00f6rbuch als Audiodatei. Die Stimme erzeugt
      dabei vollst\u00e4ndig unser eigenes Sprachsynthese-Modell, live eingelesen
      wird nichts mehr. Gechattet wird nicht, die Verlage arbeiten nur \u00fcber ein
      Upload-Portal. Erste Kunden sind drei Kinderbuchverlage aus Hamburg und Wien.
      Nebenbei betreiben wir noch ein kleines Tonstudio f\u00fcr Werbespots."],"model":"qwen/qwen3-embedding-8b","dimensions":1536,"encoding_format":"float","provider":{"allow_fallbacks":false,"data_collection":"deny","order":["nebius"],"zdr":true}}'
