    body: '{"input":["Instruct: Given a description of an AI system or a question
      about the EU AI Act, retrieve the article, Annex point or recital of the AI
      Act that governs it\nQuery:We''re a family-owned dairy in the south of Ireland.
      Our autumn campaign is a series of short video ads made with a generative video
      service we pay for monthly: a herd of cows in sunglasses surfs huge waves and
      argues, in strong local accents, about whose milk makes the best butter. Our
      two-person marketing team writes the prompts and approves every clip, and nothing
      in the videos shows our real farm, staff or customers. The clips run on Instagram
      and TikTok from October 2026. We picked the service partly because its interface
      is available in Irish."],"model":"qwen/qwen3-embedding-8b","dimensions":1536,"encoding_format":"float","provider":{"allow_fallbacks":false,"data_collection":"deny","order":["nebius"],"zdr":true}}'
