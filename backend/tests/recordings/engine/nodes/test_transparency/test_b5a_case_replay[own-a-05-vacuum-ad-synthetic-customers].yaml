    body: '{"input":["Instruct: Given a description of an AI system or a question
      about the EU AI Act, retrieve the provisions of the AI Act that apply\nQuery:We''re
      a home-appliance retailer with about a hundred stores in Central Europe and
      an online shop. For our new cordless vacuum we made a 30-second video ad with
      a video-generation tool we subscribe to: realistic-looking \"customers\" in
      a realistic flat show how easily it picks up crumbs and pet hair, and say how
      happy they are with it. None of these people exist and nothing was filmed. The
      ad runs on our website, on YouTube and on regional TV from October 2026. We
      didn''t change the tool in any way; our marketing team writes the prompts and
      picks the takes. The vacuum also comes in a pink edition."],"model":"qwen/qwen3-embedding-8b","dimensions":1536,"encoding_format":"float","provider":{"allow_fallbacks":false,"data_collection":"deny","order":["nebius"],"zdr":true}}'
