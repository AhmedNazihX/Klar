interactions:
- request:
    body: '{"input":["Instruct: Given a description of an AI system or a question
      about the EU AI Act, retrieve the article, Annex point or recital of the AI
      Act that governs it\nQuery:We publish a regional daily newspaper in a mid-sized
      Finnish city, in print and online, with a newsroom of a few dozen journalists.
      Since spring 2026 reporters use a licensed AI writing tool to turn their notes
      and press releases into first drafts of short news items, for example on municipal
      budgets or road closures. Every draft is then fact-checked and reworked where
      needed by the reporter and approved by the duty editor before it goes online,
      and the tool touches nothing after that. A named editor-in-chief is legally
      responsible for everything we publish, and the name and contact details are
      in our imprint. We also run a crossword app."],"model":"qwen/qwen3-embedding-8b","dimensions":1536,"encoding_format":"float","provider":{"allow_fallbacks":false,"data_collection":"deny","order":["nebius"],"zdr":true}}'
