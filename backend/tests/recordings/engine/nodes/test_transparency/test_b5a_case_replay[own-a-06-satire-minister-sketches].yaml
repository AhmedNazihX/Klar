    body: '{"input":["Instruct: Given a description of an AI system or a question
      about the EU AI Act, retrieve the article, Annex point or recital of the AI
      Act that governs it\nQuery:Wir sind eine kleine Produktionsfirma aus S\u00fcdwestdeutschland
      und machen f\u00fcr unseren YouTube-Kanal (mehrere hunderttausend Abonnenten)
      jede Woche Comedy-Sketche \u00fcber die Bundespolitik. F\u00fcr die neue Staffel
      ab Oktober 2026 lassen wir mit einem gekauften KI-Videotool echte Minister in
      absurden Szenen auftreten: Eine Ministerin singt zum Beispiel ein Schlaflied
      \u00fcber die Schuldenbremse, mit ihrem Gesicht und einer t\u00e4uschend echten
      Stimme. Am Tool \u00e4ndern wir nichts, wir schreiben nur die Drehb\u00fccher
      und geben die Szenen vor. Jedes Video beginnt mit unserem Kanal-Jingle. Gedreht
      wird sonst in einem alten Weinkeller."],"model":"qwen/qwen3-embedding-8b","dimensions":1536,"encoding_format":"float","provider":{"allow_fallbacks":false,"data_collection":"deny","order":["nebius"],"zdr":true}}'
