    body: '{"input":["Instruct: Given a description of an AI system or a question
      about the EU AI Act, retrieve the article, Annex point or recital of the AI
      Act that governs it\nQuery:We''re a regional water utility in Belgium with several
      hundred staff. Since November 2025 our website and app have a chat window, built
      by our own digital team. Customers type a question in their own words, for example
      about a meter reading or a payment plan; a machine-learning model we trained
      on two years of past enquiries works out what they mean and replies with one
      of roughly 400 answers that our customer service team wrote and approved. It
      never writes sentences of its own, and anything it can''t match is handed to
      a human agent. The chat is open to anyone visiting the site. The same team rebuilt
      our outage map last year."],"model":"qwen/qwen3-embedding-8b","dimensions":1536,"encoding_format":"float","provider":{"allow_fallbacks":false,"data_collection":"deny","order":["nebius"],"zdr":true}}'
