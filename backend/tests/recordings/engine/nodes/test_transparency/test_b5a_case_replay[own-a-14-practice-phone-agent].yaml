      AI Act.\n\n3. [guide:guide-art50:para:31] (31) AI agents are covered by Article
      50(1) AI Act if they are capable of interacting with the persons instructing
      them or with other natural persons in the execution of the tasks (e.g. making
      bookings, managing correspondence, negotiating or concluding contracts, executing
      purchases, etc). AI agents must be designed and developed in such a way that
      they disclose both their artificial nature and the person on whose behalf they
      are acting, considering the need for transparency of the origin and the delegation
      of authority and accountability for the consequences of their actions. This
      includes cases where AI agents are capable of interacting in complex multi-agent
      architectures with other AI agents that directly interact with the natural persons
      in the execution of the task. Nevertheless, it may not always be possible for
      the provider of the AI agent to identify in advance individual instances of
      direct interaction of an AI agent with other natural persons once the AI agent
