- request:
    body: '{"input":["Instruct: Given a description of an AI system or a question
      about the EU AI Act, retrieve the provisions of the AI Act that apply\nQuery:Wir
      sind ein mittelgro\u00dfer Anbieter von Praxissoftware aus Bayern. Seit dem
      17. August 2026 bieten wir Arztpraxen ein Zusatzmodul an: Muss eine Praxis Termine
      verschieben, ruft ein KI-Telefonagent die betroffenen Patientinnen und Patienten
      an, spricht mit ihnen in nat\u00fcrlicher Sprache, schl\u00e4gt neue Termine
      vor und tr\u00e4gt die Zusage direkt in den Kalender ein. Die Stimme wird synthetisch
      erzeugt und klingt sehr menschlich. Medizinische Fragen beantwortet der Agent
      nicht, die gibt er an das Praxisteam weiter. Das Sprachmodell darunter lizenzieren
      wir von einem gro\u00dfen KI-Anbieter, das Modul l\u00e4uft unter unserem Namen.
      Bisher nutzen es \u00fcber hundert Praxen in S\u00fcddeutschland."],"model":"qwen/qwen3-embedding-8b","dimensions":1536,"encoding_format":"float","provider":{"allow_fallbacks":false,"data_collection":"deny","order":["nebius"],"zdr":true}}'
