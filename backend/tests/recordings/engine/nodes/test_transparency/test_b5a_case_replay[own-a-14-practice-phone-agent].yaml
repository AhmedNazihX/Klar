      in dem gemeinsame Vorschriften f\u00fcr die Umsetzung dieser Pflichten festgelegt
      werden.\n\nGuidelines on the transparency obligations under Article 50, passages:\n\n1.
      [guide:guide-art50:para:11] (11) Providers must ensure their interactive or
      generative AI systems have transparency embedded into the system''s design and
      operation and ensure all relevant transparency obligations in Articles 50(1),
      (2) and (5) AI Act are met at the latest when those systems are placed on the
      market or put into service. All natural persons interacting with the AI system
      or exposed to its outputs in scope must be effectively and consistently informed
      throughout the lifecycle of the AI system, as placed on the market or put into
      service by that provider (irrespective of who the deployers or other users of
      the system are).\n\nFor example, a company provides a generative or interactive
      AI application (e.g. a chatbot, image generator, AI agent) on the Union market
      under its own name or trademark to consumers, professional users or other legal
      entities who may directly use the AI system for interaction or content generation
      (including by integrating the system into their existing processes and using
      it accordingly without the need for modifications or additional components).
      The company is a provider responsible for compliance with the transparency obligations
