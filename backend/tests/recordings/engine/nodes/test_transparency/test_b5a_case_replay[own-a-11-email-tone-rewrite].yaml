    body: '{"input":["Instruct: Given a description of an AI system or a question
      about the EU AI Act, retrieve the article, Annex point or recital of the AI
      Act that governs it\nQuery:We''re a small software company in the Baltics making
      an email app for small businesses. In September 2026 we added a \"Polish\" button:
      you write a draft, pick \"more formal\", \"friendlier\" or \"shorter\", and
      the app rewrites your email in that tone using a language model we fine-tuned
      ourselves. It keeps your facts, names and dates but may reorder sentences and
      swap most of the wording; you see the new version and send it yourself. There
      is no chat, and it never writes an email from scratch. Most of our 15,000 paying
      users are in the Baltics and Finland."],"model":"qwen/qwen3-embedding-8b","dimensions":1536,"encoding_format":"float","provider":{"allow_fallbacks":false,"data_collection":"deny","order":["nebius"],"zdr":true}}'
