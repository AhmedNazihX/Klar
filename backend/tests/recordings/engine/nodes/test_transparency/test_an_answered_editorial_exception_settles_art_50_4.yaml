- request:
    body: '{"input":["Instruct: Given a description of an AI system or a question
      about the EU AI Act, retrieve the article, Annex point or recital of the AI
      Act that governs it\nQuery:Wir betreiben mit sechs Leuten ein werbefinanziertes
      Nachrichtenportal f\u00fcr einen l\u00e4ndlichen Landkreis in Mitteldeutschland.
      Seit August 2026 nutzen wir ein gekauftes KI-Textwerkzeug: Es liest die Protokolle
      der Gemeinderats- und Kreistagssitzungen, sobald sie online stehen, und schreibt
      daraus automatisch kurze Artikel, etwa \u00fcber neue Baugebiete oder die Grundsteuer.
      Die Artikel gehen sofort und ohne Gegenlesen online, weil wir f\u00fcr rund
      zwanzig Gemeinden schlicht nicht genug Redaktion haben, rund 150 Texte im Monat.
      Ein Impressum mit unserem Chefredakteur gibt es nat\u00fcrlich, und eine schriftliche
      Redaktionsrichtlinie auch. Am meisten gelesen werden trotzdem die Vereinsnachrichten.\n\nAntworten
      auf R\u00fcckfragen:\n- editorial_control: Ja. Ein Mensch pr\u00fcft und bearbeitet
      jeden Text vor der Ver\u00f6ffentlichung, und unser Unternehmen tr\u00e4gt die
      redaktionelle Verantwortung f\u00fcr die Ver\u00f6ffentlichung."],"model":"qwen/qwen3-embedding-8b","dimensions":1536,"encoding_format":"float","provider":{"allow_fallbacks":false,"data_collection":"deny","order":["nebius"],"zdr":true}}'
