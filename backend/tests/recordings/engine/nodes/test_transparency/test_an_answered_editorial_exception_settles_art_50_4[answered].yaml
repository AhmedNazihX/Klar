    body: '{"input":["Instruct: Given a description of an AI system or a question
      about the EU AI Act, retrieve the article, Annex point or recital of the AI
      Act that governs it\nQuery:We are a regional public health office. Since September
      2026 we have used a text generator from a software company to write the weekly
      bulletin on our website about air quality, pollen levels and outbreaks of infectious
      disease in the region. The generator turns our monitoring data into short articles,
      which appear on our website and our social media accounts.\n\nAnswers to follow-up
      questions:\n- editorial_control: Yes. An editor on our staff checks every text
      against the monitoring data, corrects and rewrites it where needed, and approves
      it before it is published; the office holds editorial responsibility for the
      publication."],"model":"qwen/qwen3-embedding-8b","dimensions":1536,"encoding_format":"float","provider":{"allow_fallbacks":false,"data_collection":"deny","order":["nebius"],"zdr":true}}'
