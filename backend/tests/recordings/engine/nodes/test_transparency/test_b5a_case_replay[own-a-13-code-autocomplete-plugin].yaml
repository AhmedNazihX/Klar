    body: '{"input":["Instruct: Given a description of an AI system or a question
      about the EU AI Act, retrieve the provisions of the AI Act that apply\nQuery:We''re
      a small developer-tools start-up in the Netherlands. Our product is a plug-in
      for the common code editors that suggests the next lines of code as a programmer
      types; they press Tab to accept or keep typing to ignore it. It only produces
      code and the short comments that belong in it, never explanations, chat replies
      or other prose. The model is our own, trained on permissively licensed open-source
      code, and since March 2025 we have sold team licences to about 600 software
      companies. Our customers'' developers are the only users. We sponsor a local
      hackathon every autumn."],"model":"qwen/qwen3-embedding-8b","dimensions":1536,"encoding_format":"float","provider":{"allow_fallbacks":false,"data_collection":"deny","order":["nebius"],"zdr":true}}'
