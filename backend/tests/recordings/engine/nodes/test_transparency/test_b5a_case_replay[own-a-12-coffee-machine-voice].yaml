- request:
    body: '{"input":["Instruct: Given a description of an AI system or a question
      about the EU AI Act, retrieve the article, Annex point or recital of the AI
      Act that governs it\nQuery:Wir sind ein mittelst\u00e4ndischer Hersteller von
      Kaffeevollautomaten. Unser neues Modell, seit Juni 2026 im Handel, l\u00e4sst
      sich per Sprache bedienen: Man sagt etwa \u201ezwei Cappuccino, extra stark\u201c,
      und die Maschine legt los. Die Spracherkennung l\u00e4uft mit einem kleinen
      neuronalen Netz direkt auf dem Ger\u00e4t, ohne Internet. Die Maschine antwortet
      nur mit ein paar fest aufgenommenen S\u00e4tzen wie \u201eBitte Milchbeh\u00e4lter
      auff\u00fcllen\u201c und versteht nichts au\u00dfer Befehlen rund um Kaffee,
      Reinigung und Einstellungen. Eine App gibt es nicht. Das Mahlwerk ist aus Keramik,
      darauf achten unsere Kunden besonders."],"model":"qwen/qwen3-embedding-8b","dimensions":1536,"encoding_format":"float","provider":{"allow_fallbacks":false,"data_collection":"deny","order":["nebius"],"zdr":true}}'
