      chatten auf der Karriereseite des Kunden mit ihm: Er fragt nach Erfahrung, Verf\u00fcgbarkeit
      und Gehaltswunsch, formuliert R\u00fcckfragen selbst, bewertet die Antworten
      mit Punkten und sortiert alle Bewerbungen in eine Rangliste, nach der die Personaler
      entscheiden, wen sie einladen. Gebaut ist er auf einem lizenzierten gro\u00dfen
      Sprachmodell. Im Moment testen wir nur intern mit erfundenen Bewerbungen; verkaufen
