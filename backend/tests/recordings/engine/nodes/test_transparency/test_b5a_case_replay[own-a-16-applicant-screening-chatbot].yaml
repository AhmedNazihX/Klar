    body: '{"input":["Instruct: Given a description of an AI system or a question
      about the EU AI Act, retrieve the article, Annex point or recital of the AI
      Act that governs it\nQuery:Wir sind ein kleines HR-Tech-Start-up aus Norddeutschland
      und entwickeln einen Chatbot f\u00fcr die Personalabteilungen von Handelsketten.
      Bewerberinnen und Bewerber chatten auf der Karriereseite des Kunden mit ihm:
      Er fragt nach Erfahrung, Verf\u00fcgbarkeit und Gehaltswunsch, formuliert R\u00fcckfragen
      selbst, bewertet die Antworten mit Punkten und sortiert alle Bewerbungen in
      eine Rangliste, nach der die Personaler entscheiden, wen sie einladen. Gebaut
      ist er auf einem lizenzierten gro\u00dfen Sprachmodell. Im Moment testen wir
      nur intern mit erfundenen Bewerbungen; verkaufen wollen wir ihn unter unserem
      Namen ab Februar 2028. Unser erster Messeauftritt ist im Herbst."],"model":"qwen/qwen3-embedding-8b","dimensions":1536,"encoding_format":"float","provider":{"allow_fallbacks":false,"data_collection":"deny","order":["nebius"],"zdr":true}}'
