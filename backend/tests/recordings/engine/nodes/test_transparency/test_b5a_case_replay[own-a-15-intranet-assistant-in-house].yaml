    body: '{"input":["Instruct: Given a description of an AI system or a question
      about the EU AI Act, retrieve the provisions of the AI Act that apply\nQuery:Wir
      sind ein Maschinenbauer aus Baden-W\u00fcrttemberg mit mehreren tausend Besch\u00e4ftigten.
      Seit M\u00e4rz 2026 nutzt unsere Belegschaft im Intranet einen Assistenten,
      den unsere eigene IT auf Basis eines offenen Sprachmodells gebaut hat. Er beantwortet
      Fragen zu IT-Problemen, Einkaufsrichtlinien und Reisekosten und formuliert auf
      Wunsch Entw\u00fcrfe, zum Beispiel f\u00fcr eine Bestellanforderung. Verkauft
      oder an andere Firmen weitergegeben wird er nicht, er l\u00e4uft nur bei uns.
      Wer ihn nutzen will, muss vorher unsere Pflichtschulung zu KI-Werkzeugen absolvieren.
      \u00dcber Besch\u00e4ftigte entscheidet oder bewertet er nichts. In einem unserer
      Werke testen wir gerade neue Kantinenzeiten."],"model":"qwen/qwen3-embedding-8b","dimensions":1536,"encoding_format":"float","provider":{"allow_fallbacks":false,"data_collection":"deny","order":["nebius"],"zdr":true}}'
