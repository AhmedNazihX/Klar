interactions:
- request:
    body: '{"input":["Instruct: Given a description of an AI system or a question
      about the EU AI Act, retrieve the article, Annex point or recital of the AI
      Act that governs it\nQuery:Our Ghent-based software firm has 40 staff. Our product
      checks incoming supplier invoices for the accounts payable teams of mid-sized
      firms. A clerk uploads a batch of invoices as PDF files; a model we trained
      reads each invoice, compares it with the purchase order and the supplier''s
      master data, and returns a review report: a table of the invoices it flagged,
      each with a reason code and a short pointer such as \"amount differs from order
      4711 by EUR 120\" or \"VAT number does not match the supplier\". For the archive
      it also returns a copy of each invoice with the bank account numbers blacked
      out. The clerk works through the table and decides what to do with each flagged
      invoice. We have sold it to about 300 companies in the EU since 2024."],"model":"qwen/qwen3-embedding-8b","dimensions":1536,"encoding_format":"float","provider":{"allow_fallbacks":false,"data_collection":"deny","order":["nebius"],"zdr":true}}'
    headers:
      content-type:
      - application/json
    method: POST
    uri: https://openrouter.ai/api/v1/embeddings
