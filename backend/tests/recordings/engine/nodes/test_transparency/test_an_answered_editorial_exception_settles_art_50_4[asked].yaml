      bulletin on our website about air quality, pollen levels and outbreaks of infectious
      disease in the region. The generator turns our monitoring data into short articles,
      which appear on our website and our social media accounts."],"model":"qwen/qwen3-embedding-8b","dimensions":1536,"encoding_format":"float","provider":{"allow_fallbacks":false,"data_collection":"deny","order":["nebius"],"zdr":true}}'
