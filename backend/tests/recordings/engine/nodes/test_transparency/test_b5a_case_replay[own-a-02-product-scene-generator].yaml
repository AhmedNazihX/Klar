    body: '{"input":["Instruct: Given a description of an AI system or a question
      about the EU AI Act, retrieve the article, Annex point or recital of the AI
      Act that governs it\nQuery:Wir sind ein kleines Software-Haus aus Ostdeutschland.
      Seit Februar 2025 verkaufen wir Onlineh\u00e4ndlern ein Abo-Tool: Der H\u00e4ndler
      l\u00e4dt ein Freisteller-Foto seines Produkts hoch, etwa eines Sessels, w\u00e4hlt
      einen Stil wie \u201eskandinavisches Wohnzimmer\u201c, und unser Bildmodell
      erzeugt daraus komplett neue, fotorealistische Raumszenen mit dem Produkt darin.
      Die Bilder landen direkt im Shop-Backend der Kunden; einen Chat oder Assistenten
      gibt es nicht. Das Modell haben wir selbst trainiert. Unsere rund 1.200 Kunden
      sitzen vor allem in Deutschland und den Niederlanden. N\u00e4chstes Jahr ziehen
      wir in ein gr\u00f6\u00dferes B\u00fcro."],"model":"qwen/qwen3-embedding-8b","dimensions":1536,"encoding_format":"float","provider":{"allow_fallbacks":false,"data_collection":"deny","order":["nebius"],"zdr":true}}'
