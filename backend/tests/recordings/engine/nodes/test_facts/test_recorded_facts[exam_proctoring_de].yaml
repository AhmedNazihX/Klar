interactions:
- request:
    body: '{"messages":[{"content":"You extract the facts about one AI system from
      a company''s description of it, as the first step of a classification under
      the EU AI Act (Regulation (EU) 2024/1689, as amended by the Digital Omnibus).
      You do not classify the system. Later steps check, in this order: scope (Art.
      2-3), prohibited practices (Art. 5), high-risk (Art. 6 with Annex I and Annex
      III, and the Art. 6(3) exception), transparency duties (Art. 50), and the company''s
      role and obligations (Art. 16, 23-26). Extract the facts those checks depend
      on, and ask about the ones the description leaves open.\n\n## Facts\n\nList
      the facts that matter for the checks above, one fact per entry, each a short
      sentence. Tag each one with its evidence:\n\n- `stated`: the description says
      it. Give `quote`: the shortest passage of the description that says it, copied
      character for character, in the description''s own language. Do not fix typos,
      translate, shorten with \"...\" or join separate passages. A stated fact has
      no `question`.\n- `inferred`: the description doesn''t say it, but it follows
      from what it says (for example, a tool that \"shows HR a ranked shortlist\"
      ranks people). `quote` is null. Give a `question` asking the user to confirm
      it.\n- `assumed`: nothing in the description points either way, and you take
      the usual default (for example, that the system is used in the EU). `quote`
      is null. Give a `question` asking the user to confirm it.\n\nNever tag a fact
      `stated` unless the quote really says it. When in doubt, tag it `inferred`.\n\nThe
      facts the checks usually depend on:\n\n- What the system does and what it is
      for: its purpose, its outputs, and the area it is used in (employment, education,
      credit, insurance, public benefits, law enforcement, migration, justice, elections,
      critical infrastructure, biometrics, a product covered by EU product law).\n-
      Whether it is an AI system at all: it infers from inputs how to produce outputs
      such as predictions, content, recommendations or decisions, rather than following
      fixed rules written by people.\n- Where it is used or placed on the market (the
      EU or not), and any exclusion: military or national security use, scientific
      research only, purely personal use.\n- Whether it ranks, scores, filters, profiles
      or makes decisions about people, and what those decisions affect.\n- Whether
      a person reviews its outputs before they take effect.\n- Who uses it: the company
      itself, its customers, a public authority, or someone acting on behalf of one.\n-
      The company''s role: whether it built the system or had it built, bought it,
      puts its own name or brand on it, modified it substantially, or uses it for
      a purpose other than the one it was sold for; whether it is built on a general-purpose
      AI model; whether the company imports or resells it.\n- Whether it talks to
      people, generates or edits text, images, audio or video, or recognises emotions
      or sorts people by biometric data.\n\n## Key-fact questions\n\n`questions` lists
      what the user should be asked about facts the description does not settle, when
      the answer could change the outcome of a check. Each question asks about one
      fact, in plain words, and can be answered in a sentence. Ask at most 6, most
      decisive first. Do not repeat a question already attached to an inferred or
      assumed fact.\n\nSome features flip an outcome when present. When the description
      matches the base case but does not say whether the feature is there, ask about
      it:\n\n- Checking transactions or customers for fraud or money laundering: does
      it enrich the data with other personal data or build profiles of individuals?\n-
      Analysing faces, voices or behaviour (for example in interviews, exams, border
      checks or at work): does it infer emotions, stress, truthfulness or deception?\n-
      Supporting a court, authority or dispute body with documents or cases: does
      it recommend whether something is admissible or how to decide, or does it change
      the content of a decision?\n- Supporting political campaigns or public debate:
      does it generate new content, or target or profile voters?\n- Rating or scoring
      people''s reliability or behaviour: is the score used outside the context where
      the data was collected, or does it predict whether a person will commit a crime?\n-
      Workplace or education monitoring by webcam, voice or keystrokes: does it infer
      emotions?\n- Public benefits, pensions or social services: is the scheme run
      by or for a public authority?\n- Scholarships or funding: does the decision
      decide admission, or only fund students already admitted?\n\n## Ids and language\n\nEach
      question has an `id`: a short snake_case name for the fact it asks about, starting
      with a letter, for example `human_review`, `eu_use`, `infers_emotions`. Use
      the same id every time you ask about the same fact. `about` names the check
      the answer matters for: `scope`, `prohibited`, `high_risk`, `transparency` or
      `role_obligations`.\n\nWrite every fact `text` and question `text` in the language
      the user message asks for (`en`: English, `de`: German). Quotes stay in the
      description''s own language.\n\nAnswer with JSON matching the schema, and nothing
      else.\n","role":"system"},{"content":"Language for facts and questions: de\n\nDescription:\nUnsere
      Hochschule nutzt bei Online-Pr\u00fcfungen eine gekaufte Software, die \u00fcber
      die Webcam das Verhalten der Studierenden auswertet und auff\u00e4llige Stellen
      f\u00fcr die Aufsicht markiert.","role":"user"}],"max_tokens":4000,"model":"openai/gpt-6-luna-20260922","provider":{"allow_fallbacks":false,"data_collection":"deny","order":["azure/eu"],"zdr":true},"response_format":{"json_schema":{"name":"facts_answer","schema":{"$defs":{"EvidenceTag":{"description":"Where
      a fact came from; used instead of a numeric confidence score.","enum":["stated","inferred","assumed"],"title":"EvidenceTag","type":"string"},"ExtractedFact":{"additionalProperties":false,"description":"One
      fact as the model returns it. Enum fields carry no description: strict structured\noutput
      rejects keywords next to a `$ref`; the prompt explains every field instead.","properties":{"text":{"minLength":1,"title":"Text","type":"string"},"evidence":{"$ref":"#/$defs/EvidenceTag"},"quote":{"anyOf":[{"type":"string"},{"type":"null"}],"description":"For
      a stated fact: the passage, copied verbatim.","title":"Quote"},"question":{"anyOf":[{"$ref":"#/$defs/FollowUpQuestion"},{"type":"null"}],"description":"For
      an inferred or assumed fact: the question that confirms it."}},"required":["text","evidence","quote","question"],"title":"ExtractedFact","type":"object"},"FollowUpQuestion":{"additionalProperties":false,"description":"A
      key-fact question. Its `id` keys the user''s answer when the engine runs again.","properties":{"id":{"description":"Stable
      slug, for example `human_review`.","pattern":"^[a-z][a-z0-9_]{0,63}$","title":"Id","type":"string"},"text":{"minLength":1,"title":"Text","type":"string"},"about":{"anyOf":[{"type":"string"},{"type":"null"}],"default":null,"description":"What
      the answer settles, for example a step or provision_id.","title":"About"}},"required":["id","text","about"],"title":"FollowUpQuestion","type":"object"}},"additionalProperties":false,"description":"The
      model''s whole answer; also the JSON schema it must fill.","properties":{"facts":{"items":{"$ref":"#/$defs/ExtractedFact"},"title":"Facts","type":"array"},"questions":{"description":"Key-fact
      questions the description leaves open, most decisive first.","items":{"$ref":"#/$defs/FollowUpQuestion"},"title":"Questions","type":"array"}},"required":["facts","questions"],"title":"FactsAnswer","type":"object"}},"type":"json_schema"},"stream":false,"temperature":0.0}'
