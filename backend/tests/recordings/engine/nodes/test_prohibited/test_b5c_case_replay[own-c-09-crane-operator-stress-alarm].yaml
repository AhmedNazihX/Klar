interactions:
- request:
    body: '{"input":["Instruct: Given a description of an AI system or a question
      about the EU AI Act, retrieve the provisions of the AI Act that apply\nQuery:We
      run a container terminal in Rotterdam with about 1,200 staff. From March 2028
      we will use a system from a Danish vendor in the cabins of our ship-to-shore
      cranes: a camera and a wristband detect when an operator shows acute stress
      or panic while moving containers, and the system then slows the crane and alerts
      the shift supervisor. We are using it exactly as supplied, under the vendor''s
      name. The data is used only for that alarm, never for performance reviews; an
      occupational physician recommended it after two serious near-misses, and the
      works council agreed to it. Operators have been told about it. We''re also replacing
      the terminal''s lighting."],"model":"qwen/qwen3-embedding-8b","dimensions":1536,"encoding_format":"float","provider":{"allow_fallbacks":false,"data_collection":"deny","order":["nebius"],"zdr":true}}'
