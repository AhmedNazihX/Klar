    body: '{"input":["Instruct: Given a description of an AI system or a question
      about the EU AI Act, retrieve the provisions of the AI Act that apply\nQuery:We
      run a celebrity gossip website from Dublin with 25 staff. Our editors use a
      well-known commercial image generator on a team subscription for article graphics.
      Since January 2027 they have also been using it, with a prompt trick that gets
      around its filters, to make fake \"leaked\" nude photos of actresses and singers,
      which we publish as teasers behind a paywall; traffic has doubled. None of the
      women depicted has been asked, let alone agreed. We haven''t changed the generator
      itself, we only type prompts into it, and we don''t sell it to anyone. Last
      month we also redesigned our newsletter. It is now February 2027."],"model":"qwen/qwen3-embedding-8b","dimensions":1536,"encoding_format":"float","provider":{"allow_fallbacks":false,"data_collection":"deny","order":["nebius"],"zdr":true}}'
