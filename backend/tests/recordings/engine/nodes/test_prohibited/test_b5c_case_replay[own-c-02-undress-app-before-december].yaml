      e | Ungezieltes Auslesen zur Entwicklung von Datenbanken zur Gesichtserkennung
      | kriminellen Aktivit\u00e4t stehen, zu untermauern KI-Systeme, die Datenbanken
      zur Gesichtserkennung durch das ungezielte Auslesen von Gesichtsbildern aus
      dem Internet oder von \u00dcberwachungsaufnahmen erstellen oder erweitern |\n|
      Artikel 5 Absatz 1 Buchstabe | Emotionserkennung | KI-Systeme, die Emotionen
      am Arbeitsplatz oder in Bildungseinrichtungen ableiten, au\u00dfer aus medizinischen
      Gr\u00fcnden oder Sicherheitsgr\u00fcnden |\n| f Artikel 5 Absatz 1 Buchstabe
      g | Biometrische Kategorisierung | KI-Systeme, mit denen nat\u00fcrliche Personen
      auf der Grundlage ihrer biometrischen Daten kategorisiert werden, um ihre Rasse,
      ihre politischen Einstellungen, ihre |\n\n| Artikel 5 Absatz 1 Buchstabe h |
      Biometrische Echtzeit- Fernidentifizierung (RBI) | Gewerkschaftszugeh\u00f6rigkeit,
      ihre religi\u00f6sen oder weltanschaulichen \u00dcberzeugungen, ihr Sexualleben
      oder ihre sexuelle Ausrichtung zu erschlie\u00dfen oder abzuleiten; mit Ausnahme
      der Kennzeichnung oder Filterung rechtm\u00e4\u00dfig erworbener biometrischer
      Datens\u00e4tze, auch im Bereich der Strafverfolgung KI-Systeme f\u00fcr die
      biometrische Echtzeit- Fernidentifizierung in \u00f6ffentlich zug\u00e4nglichen
      R\u00e4umen f\u00fcr die Zwecke der Strafverfolgung, au\u00dfer wenn dies im
      Hinblick auf die gezielte Suche nach bestimmten Opfern von Entf\u00fchrung,
      das Abwenden einer konkreten Gefahr einschlie\u00dflich der Gefahr eines Terroranschlags
      oder das Aufsp\u00fcren von Personen, die der Begehung bestimmter Straftaten
      verd\u00e4chtigt werden, erforderlich ist (weitere Verfahrensvorschriften, darunter
      f\u00fcr die Genehmigung, sind in Artikel 5 Abs\u00e4tze 2-7 der KI-Verordnung
      dargelegt). |\n|---|---|---|\n\n4. [guide:guide-prohibited:para:139] (139) Die
      Verbote in Artikel 5 Absatz 1 Buchstaben a und b der KI-Verordnung erg\u00e4nzen
      dar\u00fcber hinaus die Verordnung (EU) 2022/2065 (Gesetz \u00fcber digitale
      Dienste), die\n\n95 Von besonderer Relevanz ist in diesem Zusammenhang das Urteil
      des Gerichtshofs (Gro\u00dfe Kammer) vom 4. Juli 2023, Rechtssache C-252/21,
      Meta Platforms Inc u. a./Bundeskartellamt. Der EuGH stellt zwar unter anderem
      fest, dass die Verarbeitung au\u00dferhalb des Dienstes erfasster personenbezogener
      Daten zu Zwecken der Direktwerbung durch eine gro\u00dfe Plattform sozialer
      Netzwerke als f\u00fcr ein berechtigtes Interesse des Verantwortlichen erfolgt
      angesehen werden kann, doch kann dies aufgrund der Interessen und Grundrechte
      eines solchen Nutzers, die unter den Umst\u00e4nden dieses Falles, insbesondere
      der umfangreichen Verarbeitung, Vorrang vor dem Interesse dieses Betreibers
      an einer solchen personalisierten Werbung haben, \u00fcber die soziale Plattformen
      ihre T\u00e4tigkeiten finanzieren, nicht ohne Einwilligung des Nutzers als Rechtsgrundlage
      erfolgen (vgl. Urteil Meta Platforms, Rn. 115 bis 118). 96 Beispielsweise Richtlinie
      2000/43/EG des Rates vom 29. Juni 2000 zur Anwendung des Gleichbehandlungsgrundsatzes
      ohne Unterschied der Rasse oder der ethnischen Herkunft (ABl. L 180 vom 19.7.2000,
      S. 22), Richtlinie 2000/78/EG des Rates vom 27. November 2000 zur Festlegung
      eines allgemeinen Rahmens f\u00fcr die Verwirklichung der Gleichbehandlung in
      Besch\u00e4ftigung und Beruf (ABl. L 303 vom 2.12.2000, S. 16), Richtlinie 2006/54/EG
      des Europ\u00e4ischen Parlaments und des Rates vom 5. Juli 2006 zur Verwirklichung
      des Grundsatzes der Chancengleichheit und Gleichbehandlung von M\u00e4nnern
      und Frauen in Arbeits- und Besch\u00e4ftigungsfragen (Neufassung) (ABl. L 204
      vom 26.7.2006, S. 23), Richtlinie 2004/113/EG des Rates vom 13. Dezember 2004
      zur Verwirklichung des Grundsatzes der Gleichbehandlung von M\u00e4nnern und
      Frauen beim Zugang zu und bei der Versorgung mit G\u00fctern und Dienstleistungen
      (ABl. L 373 vom 21.12.2004, S. 37).\n\nOnline-Vermittlungsdienste wie Online-Plattformen
      und Suchmaschinen regelt und Transparenz und Rechenschaftspflicht bei der Bereitstellung
      dieser Dienste gew\u00e4hrleistet. Insbesondere verbietet Artikel 25 Absatz
      1 des Gesetzes \u00fcber digitale Dienste Dark Patterns innerhalb der Benutzerschnittstelle,
      um sicherzustellen, dass Anbieter von Online-Plattformen die Nutzer nicht irref\u00fchren
      oder zu Handlungen zwingen, die m\u00f6glicherweise nicht ihren tats\u00e4chlichen
      Absichten entsprechen. Wenn sie wahrscheinlich erhebliche Sch\u00e4den verursachen,
      sollten solche Dark Patterns als Beispiel f\u00fcr manipulative oder t\u00e4uschende
      Techniken im Sinne von Artikel 5 Absatz 1 Buchstabe a der KI-Verordnung verstanden
      werden.\n\n5. [guide:guide-prohibited:para:133] (133) Dar\u00fcber hinaus wird
      in Erw\u00e4gungsgrund 29 der KI-Verordnung klargestellt, dass \u00fcbliche
      und rechtm\u00e4\u00dfige Gesch\u00e4ftspraktiken wie Werbung \"als solche\"
      oder ihrer Art nach nicht als sch\u00e4dliche manipulative, t\u00e4uschende
      oder ausbeuterische KI-gest\u00fctzte Praktiken gelten sollten.\n\nBeispiele:\n\n-
      Werbetechniken, bei denen KI zur Personalisierung von Inhalten auf der Grundlage
      von Nutzerpr\u00e4ferenzen verwendet wird, sind von Natur aus nicht manipulativ,
      wenn sie keine unterschwelligen, absichtlich manipulativen oder t\u00e4uschenden
      Techniken einsetzen, die die individuelle Autonomie untergraben oder Vulnerabilit\u00e4ten
      auf eine sch\u00e4dliche, nach Artikel 5 Absatz 1 Buchstaben a und b der KI-Verordnung
      verbotene Weise ausnutzen. Die Erf\u00fcllung der einschl\u00e4gigen Verpflichtungen
      aus der DSGVO, dem Verbraucherschutzrecht und der Verordnung (EU) 2022/2065
      (im Folgenden \"Gesetz \u00fcber digitale Dienste\") tr\u00e4gt dazu bei, diese
      Risiken zu mindern.\n\n93 Leitlinien des Europ\u00e4ischen Datenschutzausschusses,
      https://www.edpb.europa.eu/system/files/2023-02/edpb_03-2022_guidelines_on_deceptive_design_patterns_in_social_media_platform_interfaces_v2_en_0.pdf,
      Rn. 18.\n\n94 Urteil des Gerichtshofs vom 4. Juli 2023, Meta Platforms u. a.,
      C-252/21, ECLI:EU:C:2023:537 (im Folgenden \"Urteil in der Sache Meta Platforms\").\n\n-
      Die Entwicklung von KI-Modellen und Klassifizierern zur Aufdeckung sexuellen
      Kindesmissbrauchs im Internet, die im Einklang mit dem geltenden Recht erfolgt,
      ist eine legitime Praxis, die die Vulnerabilit\u00e4t von Kindern nicht ausbeutet,
      sondern - im Gegenteil - von wesentlicher Bedeutung f\u00fcr die Verbesserung
      der Sicherheit von Kindern im Internet ist.\n\n- KI-Systeme, die f\u00fcr die
      Erbringung von Bankdienstleistungen wie Hypotheken und Darlehen verwendet werden,
      die im Einklang mit den Rechtsvorschriften der Union \u00fcber Finanzdienstleistungen,
      Verbraucherschutz, Datenschutz und Nichtdiskriminierung das Alter oder eine
      bestimmte sozio\u00f6konomische Situation des Kunden als Input nutzen, gelten
      dann nicht als Ausnutzung von Vulnerabilit\u00e4t oder Schutzbed\u00fcrftigkeit
      im Sinne des Artikels 5 Absatz 1 Buchstabe b der KIVerordnung, wenn sie darauf
      ausgelegt sind, Menschen zu sch\u00fctzen und zu unterst\u00fctzen, die aufgrund
      ihres Alters, einer Behinderung oder einer besonderen sozio\u00f6konomischen
      Situation als schutzbed\u00fcrftig eingestuft wurden, wenn sie f\u00fcr diese
      Gruppen von Vorteil sind und zudem zu gerechteren und nachhaltigeren Finanzdienstleistungen
