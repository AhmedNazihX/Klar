    body: '{"input":["Instruct: Given a description of an AI system or a question
      about the EU AI Act, retrieve the article, Annex point or recital of the AI
      Act that governs it\nQuery:Wir sind zu dritt und haben in Leipzig eine App entwickelt,
      die seit dem 1. September 2026 in den App-Stores in Deutschland und \u00d6sterreich
      zu haben ist. Man l\u00e4dt ein Foto einer beliebigen Person hoch, und die App
      erzeugt daraus ein t\u00e4uschend echtes Bild, auf dem dieselbe Person nackt
      zu sehen ist. Ob die abgebildete Person einverstanden ist, fragen wir nicht
      ab. Das Bildmodell haben wir selbst trainiert; die Bilder bekommen keinen Hinweis
      und keine Kennzeichnung, dass sie k\u00fcnstlich erzeugt sind. Bezahlt wird
      \u00fcber ein Monatsabo. Heute ist der 16. November 2026. Nebenbei bieten wir
      noch eine App f\u00fcr Passfotos an."],"model":"qwen/qwen3-embedding-8b","dimensions":1536,"encoding_format":"float","provider":{"allow_fallbacks":false,"data_collection":"deny","order":["nebius"],"zdr":true}}'
