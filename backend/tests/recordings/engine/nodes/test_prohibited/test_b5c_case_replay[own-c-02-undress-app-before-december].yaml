      a und b der KI-Verordnung ist, dass die KI-gest\u00fctzte Manipulation und Ausnutzung
      von Vulnerabilit\u00e4ten erheblichen Schaden verursacht oder mit hinreichender
      Wahrscheinlichkeit verursachen wird. Alle manipulativen, t\u00e4uschenden und
      ausbeuterischen KI-Anwendungen, die mit hinreichender Wahrscheinlichkeit keine
      erheblichen Sch\u00e4den verursachen, fallen grunds\u00e4tzlich nicht in den
