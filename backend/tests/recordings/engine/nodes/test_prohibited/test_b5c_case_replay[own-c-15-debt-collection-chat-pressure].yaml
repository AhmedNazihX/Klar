      solche Verwendung ausgeschlossen hat.\n\n6. [guide:guide-prohibited:para:81]
      (81) Im Zusammenhang mit dem Verbot nach Artikel 5 Absatz 1 Buchstabe a der
      KIVerordnung m\u00fcssen die Markt\u00fcberwachungsbeh\u00f6rden auch die konkreten
      Sachverhalte und Umst\u00e4nde jedes Einzelfalls untersuchen und beurteilen,
      ob die von dem KI-System eingesetzte unterschwellige, absichtlich manipulative
      oder t\u00e4uschende Technik geeignet ist, die Entscheidungsfindung, die individuelle
