      - Leitlinien zur Auslegung und Anwendung der Richtlinie 2005/29/EG des Europ\u00e4ischen
      Parlaments und des Rates \u00fcber unlautere Gesch\u00e4ftspraktiken von Unternehmen
      gegen\u00fcber Verbrauchern im Binnenmarkt (ABl. C 526 vom 29.12.2021, S. 1).\n\n71
      Siehe Erw\u00e4gungsgr\u00fcnde 18 und 19 der Richtlinie \u00fcber unlautere
      Gesch\u00e4ftspraktiken. Ein \"Durchschnittsverbraucher\" ist eine Person, die
      unter Ber\u00fccksichtigung sozialer, kultureller und sprachlicher Faktoren
      angemessen informiert, aufmerksam und verst\u00e4ndig ist. Der Begriff des Durchschnittsverbrauchers
      beruht dabei nicht auf einer statistischen Grundlage (d. h. es muss nicht nachgewiesen
      werden, dass ein bestimmter Prozentsatz der Verbraucher durch eine Gesch\u00e4ftspraxis
