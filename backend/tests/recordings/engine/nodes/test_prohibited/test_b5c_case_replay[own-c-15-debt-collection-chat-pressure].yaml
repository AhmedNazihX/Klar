      des Europ\u00e4ischen Parlaments und des Rates \u00fcber unlautere Gesch\u00e4ftspraktiken
      von Unternehmen gegen\u00fcber Verbrauchern im Binnenmarkt (ABl. C 526 vom 29.12.2021,
      S. 1).\n\n68 Urteil des Gerichtshofs (F\u00fcnfte Kammer) vom 26. Oktober 2016,
