      sollte sie in einem weiten Sinne so verstanden werden, dass sie die Verwendung
      oder den Einsatz des Systems zu jedem Zeitpunkt seines\n\n6 Artikel 3 Nummer
      10 der KI-Verordnung.\n\n7 Artikel 3 Nummer 12 der KI-Verordnung.\n\nLebenszyklus
      nach dem Inverkehrbringen oder der Inbetriebnahme umfasst. Dies kann sich auch
      auf die Integration des KI-Systems in die Dienste und Prozesse der das KISystem
      nutzenden Personen erstrecken und auch als Teil komplexerer Systeme, Prozesse
      oder Infrastrukturen erfolgen. W\u00e4hrend die Anbieter von KI-Systemen die
      Bedingungen f\u00fcr die Verwendung ber\u00fccksichtigen m\u00fcssen, die vern\u00fcnftigerweise
      vor dem Inverkehrbringen ihrer KI-Systeme vorhersehbar sind (bestimmungsgem\u00e4\u00dfe
      Verwendung und vern\u00fcnftigerweise vorhersehbare Fehlanwendung 8 ), bleiben
