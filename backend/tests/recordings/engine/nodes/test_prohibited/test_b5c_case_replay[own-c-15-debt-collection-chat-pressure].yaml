    body: '{"input":["Instruct: Given a description of an AI system or a question
      about the EU AI Act, retrieve the provisions of the AI Act that apply\nQuery:Wir
      sind ein Inkassounternehmen aus N\u00fcrnberg mit 90 Besch\u00e4ftigten. Seit
      Juni 2026 schreibt ein zugekaufter Chat-Assistent eines M\u00fcnchner Anbieters
      die Zahlungserinnerungen an Schuldner per SMS und Chat und beantwortet ihre
      R\u00fcckfragen. Er passt Ton und Zeitpunkt der Nachrichten daran an, wie die
      Person bisher reagiert hat, und arbeitet mit Fristen wie \u201enur noch heute\u201c
      oder \u201eletzte Warnung vor dem Gericht\u201c, auch wenn an diesem Tag gar
      nichts passieren w\u00fcrde. Die Zahlungsquote ist um ein F\u00fcnftel gestiegen.
      Ob die Leute daf\u00fcr an anderer Stelle sparen oder Kredite aufnehmen, wissen
      wir nicht. Die Forderungen selbst sind berechtigt. Wir nutzen den Assistenten
      so, wie er geliefert wird. Unsere Zentrale zieht n\u00e4chstes Jahr um."],"model":"qwen/qwen3-embedding-8b","dimensions":1536,"encoding_format":"float","provider":{"allow_fallbacks":false,"data_collection":"deny","order":["nebius"],"zdr":true}}'
