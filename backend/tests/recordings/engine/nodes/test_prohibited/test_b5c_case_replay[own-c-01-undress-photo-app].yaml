    body: '{"input":["Instruct: Given a description of an AI system or a question
      about the EU AI Act, retrieve the article, Annex point or recital of the AI
      Act that governs it\nQuery:We''re a four-person app studio in Lisbon. Our photo
      app launched in the EU app stores in September 2026 and its headline feature
      is the one our ads lead with: upload any photo of a person and the app produces
      a realistic version of the same person without clothes. It works on photos of
      anyone, friends, colleagues or celebrities; we don''t ask whether the person
      in the picture agreed, and there is no check on who they are. The model is our
      own, trained on images we bought from adult websites. Users pay per image with
      in-app credits. We also offer a background remover, which hardly anyone uses.
      It is now mid-December 2026."],"model":"qwen/qwen3-embedding-8b","dimensions":1536,"encoding_format":"float","provider":{"allow_fallbacks":false,"data_collection":"deny","order":["nebius"],"zdr":true}}'
