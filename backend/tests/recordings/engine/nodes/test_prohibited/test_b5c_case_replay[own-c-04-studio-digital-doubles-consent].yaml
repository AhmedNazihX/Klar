    body: '{"input":["Instruct: Given a description of an AI system or a question
      about the EU AI Act, retrieve the provisions of the AI Act that apply\nQuery:Wir
      sind ein Erwachsenenfilm-Studio aus K\u00f6ln mit 22 Besch\u00e4ftigten. Seit
      Februar 2027 erstellen wir mit einer gekauften Videosoftware eines kanadischen
      Herstellers digitale Doubles unserer Darstellerinnen und Darsteller und erzeugen
      damit Szenen, die nie gedreht wurden. Das machen wir nur mit Personen, die daf\u00fcr
      einen eigenen schriftlichen Zusatzvertrag unterschrieben haben: Darin steht
      genau, welche Art von Szenen erzeugt wird, die Zustimmung kann jederzeit widerrufen
      werden, und wer ablehnt, bekommt trotzdem weiter Drehtage. Die Software nutzen
      wir so, wie sie geliefert wird. Ver\u00f6ffentlicht werden die Filme auf unserer
      eigenen Bezahlplattform. Heute ist der 1. M\u00e4rz 2027. Unser B\u00fcro liegt
      \u00fcbrigens direkt \u00fcber einer B\u00e4ckerei."],"model":"qwen/qwen3-embedding-8b","dimensions":1536,"encoding_format":"float","provider":{"allow_fallbacks":false,"data_collection":"deny","order":["nebius"],"zdr":true}}'
