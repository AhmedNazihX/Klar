      to take effective and verifiable measures to build in safeguards and prevent
      and mitigate such harmful behaviour and misuse to the extent they are reasonably
      foreseeable and the measures are feasible and proportionate depending on the
      specific AI system and circumstances of the case. In their contractual relationships
