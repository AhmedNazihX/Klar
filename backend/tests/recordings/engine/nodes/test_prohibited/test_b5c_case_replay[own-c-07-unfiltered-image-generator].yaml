      also section 3.2.3.(c)).\n\n33 Defined in Article 3(12) AI Act as the use for
      which an AI system is intended by the provider, including the specific context
      and conditions of use, as specified in the information supplied by the provider
      in the instructions for use, promotional or sales materials and statements,
      as well as in the technical documentation.\n\n34 See Article 3(66) AI Act.\n\n35
      This follows in particular from the reference to ''placing on the market'' or
