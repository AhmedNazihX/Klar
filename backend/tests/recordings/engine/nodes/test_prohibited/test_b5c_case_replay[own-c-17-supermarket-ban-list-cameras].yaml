- request:
    body: '{"input":["Instruct: Given a description of an AI system or a question
      about the EU AI Act, retrieve the article, Annex point or recital of the AI
      Act that governs it\nQuery:Wir sind eine Supermarktkette aus Bayern mit 120
      Filialen. Ab April 2028 wollen wir an den Eing\u00e4ngen eine Gesichtserkennung
      eines israelischen Herstellers einsetzen: Die Kameras gleichen jedes Gesicht,
      das hereinkommt, sofort mit den Fotos von Personen ab, gegen die wir wegen Ladendiebstahls
      ein Hausverbot ausgesprochen haben, und schicken bei einem Treffer eine Meldung
      aufs Diensthandy der Marktleitung, die die Person dann anspricht und hinausbittet.
      Die Liste f\u00fchren wir selbst, die Polizei ist daran nicht beteiligt. Das
      System \u00fcbernehmen wir so, wie der Hersteller es anbietet. Parallel stellen
      wir alle Filialen auf Selbstbedienungskassen um."],"model":"qwen/qwen3-embedding-8b","dimensions":1536,"encoding_format":"float","provider":{"allow_fallbacks":false,"data_collection":"deny","order":["nebius"],"zdr":true}}'
