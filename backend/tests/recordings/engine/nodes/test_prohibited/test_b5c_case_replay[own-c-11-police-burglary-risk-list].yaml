      except for labelling or filtering of lawfully acquired biometric datasets, including
      in the area of law enforcement |\n| Article 5(1)(h) | Real-time remote biometric
      identification (''RBI'') | AI systems for real-time remote biometric identification
      in publicly accessible spaces for the purposes of law enforcement; except if
      necessary for the targeted search of specific victims, the prevention of specific
      threats including terrorist attacks, or the search of suspects of specific offences
      (further procedural requirements, including for authorisation, outlined in Article
      5(2- 7) AI Act). |\n\n5. [guide:guide-prohibited:para:190] (190) Crime prediction
      AI systems identify patterns within historical data, associating indicators
      with the likelihood of a crime occurring, and then generate risk scores as predictive
      outputs. For example, such systems may be used for planning police task forces,
      for monitoring high-risk situations, and for conducting controls of persons
      predicted as likely (re-)offenders. Such systems bring opportunities for law
      enforcement authorities, especially those with scarce resources, increasing
      efficiency, and enabling a proactive approach for detecting, deterring, and
      anticipating criminal offences. 131 However, such use of historical data on
      crimes committed to predict other persons'' future behaviour may perpetuate
      or even reinforce biases, and may result in crucial individual circumstances
      being ''overlooked'' when these circumstances are not part of the data set or
      considered in the algorithms on which the particular AI system operates. This
      may also undermine public trust in law enforcement and the justice system in
      general. 132\n\n6. [guide:guide-prohibited:para:177] (177) Compliance with sectoral
      Union legislation, such as in the field of credit-scoring, antimoney laundering,
      etc., that specifies the type of data that can be used as relevant and necessary
      for the specific legitimate purpose of evaluation and ensures that the treatment
      is justified and proportionate to the social behaviour may thus ensure that
      the AI practice falls outside the scope of the prohibition in Article 5(1)(c)
      AI Act.\n\nExamples of legitimate scoring practices in line with Union and national
      law that are outside the scope of Article 5(1)(c) AI Act:\n\n- Financial credit
      scoring systems used by creditors or credit information agencies to assess a
      customer''s financial creditworthiness or outstanding debts, providing a credit
      score or determining their creditworthiness assessment, which are based on the
      customer''s income and expenses and other financial and economic circumstances,
      are out of scope of Article 5(1)(c) AI Act if they are relevant for the legitimate
      purpose of the credit scoring and if they comply with consumer protection laws
      126 specifying the type of data and the necessary safeguards to ensure the fair
      treatment of consumers in creditworthiness assessments.\n\n- Companies have
      a legitimate interest to evaluate customers for financial fraud and those practices
      are not affected by the prohibition, if the evaluation is based on relevant
      data such as transactional behaviour and metadata in the context of the services,
      past history and other factors from sources that are objectively relevant to
