      2020, EBA/GL/2020/06.\n\n- The collection and processing of data that is relevant
      and necessary for the intended legitimate purpose of the AI systems (e.g. health
      and schizophrenic data collected from various sources to diagnose patients)
      is out of scope of Article 5(1)(c) AI Act, in particular because it process
      relevant and necessary data and typically does not entail unjustified detrimental
