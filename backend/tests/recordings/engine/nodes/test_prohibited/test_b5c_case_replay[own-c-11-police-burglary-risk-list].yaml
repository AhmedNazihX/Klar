      online shopping platform which offer [\u2026]\n\n6. [guide:guide-prohibited:para:154]
      (154) The term ''evaluation'' also relates to the concept of ''profiling'',
      which is regulated by Union data protection legislation 109 and constitutes
      a specific form of evaluation. While no direct reference is made in Article
      5(1)(c) AI Act to that concept or that legislation, 110 they may also be relevant
      for the prohibition contained in that provision, as well as for other prohibitions
      in the AI Act, 111 when the evaluation occurs in an automated fashion by an
      AI system based on personal data. Profiling means the use of information about
      an individual (or group of individuals) and evaluating their characteristics
      or behaviour patterns in order to place them into a certain category or group,
      in particular to analyse and/or make predictions about, for example, their ability
      to perform a task; interests; or likely behaviour''. 112 Profiling of natural
      persons under EU data protection law, when conducted through AI systems, may
      therefore also be covered by Article 5(1)(c) AI Act.\n\nFor example, in the
      SCHUFA I judgment, the CJEU examined a creditworthiness scoring system used
      in Germany. 113 In that case, the ''score'' generated by the computer programme
      was a ''probability value'' concerning the ability of a person to meet payment
      commitments, which was qualified by the CJEU as ''profiling''. More specifically,
      the system established ''a prognosis on the probability of a future behaviour
      of a person (''score''), such as the repayment of a loan, based on certain characteristics
      of that person. The establishment of scores (''scoring'') is based on the assumption
      that, by assigning a person to a group of other persons with comparable characteristics
      who have behaved in a certain way, similar behaviour can be predicted. 114 According
      to the CJEU, this activity met the definition of ''profiling'' within the meaning
      of Article 4(4) GDPR. 115\n\n108 Article 29 Working Party, Guidelines on Automated
      individual decision making and Profiling for the purposes of Regulation 2016/679,
