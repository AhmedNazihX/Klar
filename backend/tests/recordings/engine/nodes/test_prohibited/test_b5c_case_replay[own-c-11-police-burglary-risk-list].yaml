- request:
    body: '{"input":["Instruct: Given a description of an AI system or a question
      about the EU AI Act, retrieve the article, Annex point or recital of the AI
      Act that governs it\nQuery:We''re the analysis unit of a regional police force
      in Flanders. Since spring 2026 we have used a tool from a Belgian software firm
      that gives every adult in our records a score for how likely they are to commit
      a burglary in the next six months. The score is worked out from age, family
      background, home neighbourhood, schooling, employment history and the answers
      to a personality questionnaire some of them filled in during earlier contacts
      with us. Officers visit the highest-scoring people at home and stop them more
      often, even when nothing links them to an actual burglary. We use the tool as
      delivered. Our unit also moved to a new building this year."],"model":"qwen/qwen3-embedding-8b","dimensions":1536,"encoding_format":"float","provider":{"allow_fallbacks":false,"data_collection":"deny","order":["nebius"],"zdr":true}}'
