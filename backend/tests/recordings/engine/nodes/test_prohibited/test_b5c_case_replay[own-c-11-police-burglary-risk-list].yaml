      proportionate as a consequence of the fraudulent behaviour.\n\n- Information
      collected through telematic devices that show that a driver is speeding or not
      maintaining safe driving practices used by an insurer that offers telematics-based
      tariffs in relation to a policyholder''s high-risk driving behaviour may be
      used to increase the premium of that policyholder due to the higher risk of
      an accident caused by that driving behaviour, provided the increase in the premium
      is proportionate to the risky behaviour of the driver.\n\n125 Recital 31 AI
      Act.\n\n126 See in particular Directive (EU) 2023/2225 of 18 October 2023 on
      credit agreements for consumers and repealing Directive 2008/48/EC and the European
      Banking Authority'' Guidelines on loan origination and monitoring from 29 May
      2020, EBA/GL/2020/06.\n\n- The collection and processing of data that is relevant
      and necessary for the intended legitimate purpose of the AI systems (e.g. health
