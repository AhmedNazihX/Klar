      used to increase the premium of that policyholder due to the higher risk of
      an accident caused by that driving behaviour, provided the increase in the premium
      is proportionate to the risky behaviour of the driver.\n\n125 Recital 31 AI
      Act.\n\n126 See in particular Directive (EU) 2023/2225 of 18 October 2023 on
      credit agreements for consumers and repealing Directive 2008/48/EC and the European
