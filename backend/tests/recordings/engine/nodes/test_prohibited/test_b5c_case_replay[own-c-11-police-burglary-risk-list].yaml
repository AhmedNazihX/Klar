      |\n| Article 5(1)(c) | Social scoring | AI systems that evaluate or classify
      natural persons or groups of persons based on social behaviour or personal or
      personality characteristics, with the |\n\n| | | social score leading to detrimental
      or unfavourable treatment when data comes from unrelated social contexts or
      such treatment is unjustified or disproportionate to the social behaviour |\n|---|---|---|\n|
      Article 5(1)(d) | Individual criminal offence risk assessment and prediction
      | AI systems that assess or predict the risk of people committing a criminal
      offence based solely on profiling or personality traits and characteristics;
      except to support a human assessment based on objective and verifiable facts
      directly linked to a criminal activity |\n| Article 5(1)(e) | Untargeted scraping
      to develop facial recognition databases | AI systems that create or expand facial
      recognition databases through untargeted scraping of facial images from the
      internet or closed-circuit television (''CCTV'') footage |\n| Article 5(1)(f)
      | Emotion recognition | AI systems that infer emotions at the workplace or in
      education institutions; except for medical or safety reasons |\n| Article 5(1)(g)
      | Biometric categorisation | AI systems that categorise people based on their
      biometric data to deduce or infer their race, political opinions, trade union
