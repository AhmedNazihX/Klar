interactions:
- request:
    body: '{"input":["Instruct: Given a description of an AI system or a question
      about the EU AI Act, retrieve the article, Annex point or recital of the AI
      Act that governs it\nQuery:We run a car-sharing service in three Dutch cities
      with about 1,200 cars and 60,000 members. Our own data team built a model that
      gives every member a driving score from the trip data our cars record: hard
      braking, speeding against the posted limit, damage found after a trip and late
      returns. Members with a low score pay a higher deposit, and a member whose score
      stays very low for three months is suspended from the service. Members see their
      score and the trips behind it in the app and can appeal to our support team.
      The score is not shared with anyone and is used for nothing else. Last spring
      we also added electric cargo bikes to the fleet."],"model":"qwen/qwen3-embedding-8b","dimensions":1536,"encoding_format":"float","provider":{"allow_fallbacks":false,"data_collection":"deny","order":["nebius"],"zdr":true}}'
