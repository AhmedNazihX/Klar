      as relevant and necessary for the specific legitimate purpose of evaluation
      and ensures that the treatment is justified and proportionate to the social
      behaviour may thus ensure that the AI practice falls outside the scope of the
      prohibition in Article 5(1)(c) AI Act.\n\nExamples of legitimate scoring practices
      in line with Union and national law that are outside the scope of Article 5(1)(c)
      AI Act:\n\n- Financial credit scoring systems used by creditors or credit information
      agencies to assess a customer''s financial creditworthiness or outstanding debts,
      providing a credit score or determining their creditworthiness assessment, which
      are based on the customer''s income and expenses and other financial and economic
      circumstances, are out of scope of Article 5(1)(c) AI Act if they are relevant
      for the legitimate purpose of the credit scoring and if they comply with consumer
      protection laws 126 specifying the type of data and the necessary safeguards
