      Hauptdienst verwendet werden und die Integration dieses Merkmals oder dieser
      Funktion dient nicht dazu, die Anwendbarkeit der Vorschriften der KI-Verordnung
      zu umgehen.\n\nBeispielsweise sind die folgenden Verwendungen von KI nach Artikel
      5 Absatz 1 Buchstabe g der KI-Verordnung zul\u00e4ssig:\n\n- Filter zur Kategorisierung
      von Gesichtsz\u00fcgen oder K\u00f6rpermerkmalen, die auf OnlineMarktpl\u00e4tzen
      verwendet werden, damit ein Verbraucher sehen kann, wie ein Produkt an seiner
      Person aussieht, k\u00f6nnten eine solche Nebenfunktion darstellen, da sie nur
      f\u00fcr den Hauptdienst verwendet werden k\u00f6nnen, der im Verkauf eines
      Produkts besteht.\n\n- Filter, die in soziale Netzwerke integriert sind und
      Gesichtsz\u00fcge oder K\u00f6rpermerkmale kategorisieren, um es den Nutzern
      zu erm\u00f6glichen, Bilder oder Videos hinzuzuf\u00fcgen oder zu ver\u00e4ndern,
      k\u00f6nnen ebenfalls als Nebenfunktion betrachtet werden, da ein solcher Filter
      nicht ohne den Hauptdienst sozialer Netzwerke verwendet werden kann, der in
      der Weitergabe von Online-Inhalten besteht.\n\nBeispiele f\u00fcr verbotene
      Verwendungen sind dagegen:\n\n- Ein KI-System, das Personen, die auf einer Plattform
