    body: '{"input":["Instruct: Given a description of an AI system or a question
      about the EU AI Act, retrieve the provisions of the AI Act that apply\nQuery:Wir
      sind ein Berliner Start-up mit 15 Leuten und bauen eine Personensuche. Unser
      Crawler sammelt rund um die Uhr alle \u00f6ffentlich sichtbaren Fotos aus sozialen
      Netzwerken, Nachrichtenseiten und Vereinswebsites ein, ohne Auswahl, wer darauf
      zu sehen ist; ein Modell erkennt die Gesichter und legt f\u00fcr jedes ein Suchprofil
      in unserer Datenbank an. Kunden laden ein Foto hoch und bekommen alle Seiten
      angezeigt, auf denen dieselbe Person vorkommt. Die Datenbank umfasst inzwischen
      gut 200 Millionen Gesichter und w\u00e4chst t\u00e4glich. Verkauft wird der
      Dienst seit 2025 im Abo, unter unserem Namen. Unser Logo hat eine Agentur aus
      Leipzig entworfen."],"model":"qwen/qwen3-embedding-8b","dimensions":1536,"encoding_format":"float","provider":{"allow_fallbacks":false,"data_collection":"deny","order":["nebius"],"zdr":true}}'
