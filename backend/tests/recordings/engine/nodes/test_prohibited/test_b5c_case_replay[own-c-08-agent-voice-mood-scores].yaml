    body: '{"input":["Instruct: Given a description of an AI system or a question
      about the EU AI Act, retrieve the provisions of the AI Act that apply\nQuery:Wir
      sind ein regionaler Energieversorger aus Dortmund; in unserem Kundenservice
      arbeiten rund 300 Besch\u00e4ftigte am Telefon. Seit Mai 2026 nutzen wir eine
      zugekaufte Software, die w\u00e4hrend der Gespr\u00e4che die Stimme unserer
      Mitarbeitenden auswertet und erkennt, ob sie gereizt, gestresst oder genervt
      sind. Die Teamleitungen bekommen jede Woche f\u00fcr jede Person einen \u201eStimmungswert\u201c,
      und der flie\u00dft in die Jahresgespr\u00e4che und in die Bonusberechnung ein.
      Die Software l\u00e4uft so, wie der Anbieter sie liefert, unter dessen Namen.
      Die Anrufer selbst werden nicht ausgewertet. Gleichzeitig haben wir die Telefonanlage
      erneuert."],"model":"qwen/qwen3-embedding-8b","dimensions":1536,"encoding_format":"float","provider":{"allow_fallbacks":false,"data_collection":"deny","order":["nebius"],"zdr":true}}'
