      diese offensichtlichen Ausdrucksformen oder Gesten jedoch verwendet, um Emotionen
      oder Absichten zu erkennen oder abzuleiten, so fallen sie unter das Verbot.\n\nBeispiele:\n\n-
      Die Beobachtung, dass eine Person l\u00e4chelt, ist keine Emotionserkennung.\n\n-
      Die Feststellung, ob eine Person krank ist, ist keine Emotionserkennung.\n\n-
