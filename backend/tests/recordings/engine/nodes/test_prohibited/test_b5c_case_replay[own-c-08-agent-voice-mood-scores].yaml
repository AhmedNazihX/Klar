      Berufspiloten oder -fahrern eingesetzt werden, um Unf\u00e4lle zu verhindern\",
      umfassen. Au\u00dferdem wird dort klargestellt, dass Emotionserkennungssysteme
      nicht \"die blo\u00dfe Erkennung offensichtlicher Ausdrucksformen, Gesten und
      Bewegungen\" einschlie\u00dfen, \"es sei denn, sie werden zum Erkennen oder
      Ableiten von Emotionen verwendet\", was so zu verstehen ist, dass auch Artikel
      5 Absatz 1 Buchstabe f der KI-Verordnung gilt. Bei diesen Ausdrucksformen kann
      es sich um einfache Gesichtsausdr\u00fccke wie ein Stirnrunzeln oder ein L\u00e4cheln
      oder um Gesten wie Hand-, Arm- oder Kopfbewegungen oder um die Stimmmerkmale
