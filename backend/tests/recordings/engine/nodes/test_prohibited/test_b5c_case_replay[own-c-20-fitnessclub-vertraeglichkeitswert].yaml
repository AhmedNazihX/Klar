      KI-Systeme ausschlie\u00dflich auf der Grundlage von Profiling oder der Bewertung
      von pers\u00f6nlichen Merkmalen und Eigenschaften verboten werden (siehe Abschnitt
      5).\n\n106 Erw\u00e4gungsgrund 31 der KI-Verordnung.\n\n107 Erw\u00e4gungsgrund
      31 der KI-Verordnung.\n\n4.2. Die wichtigsten Konzepte und Komponenten des Verbots
      der sozialen Bewertung\n\nIn Artikel 5 Absatz 1 Buchstabe c der KI-Verordnung
      wird Folgendes bestimmt:\n\nFolgende Praktiken im KI-Bereich sind verboten:\n\nc)
