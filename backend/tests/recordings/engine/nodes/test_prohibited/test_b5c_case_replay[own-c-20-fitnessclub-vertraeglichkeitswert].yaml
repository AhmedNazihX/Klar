    body: '{"input":["Instruct: Given a description of an AI system or a question
      about the EU AI Act, retrieve the article, Annex point or recital of the AI
      Act that governs it\nQuery:Wir betreiben eine Kette von 40 Sport- und Wellnessclubs
      in S\u00fcddeutschland mit rund 90.000 Mitgliedern. Seit Anfang 2026 pr\u00fcfen
      wir neue Mitgliedsantr\u00e4ge mit einer Software eines M\u00fcnchner Start-ups.
      Sie wertet neben den Angaben im Antrag auch aus, was die Person in den letzten
      Jahren \u00f6ffentlich in sozialen Netzwerken gepostet hat, welche Bewertungen
      sie auf Online-Portalen geschrieben hat, ihre Beitr\u00e4ge in Nachbarschaftsforen
      und gemeldete Verkehrsverst\u00f6\u00dfe, und berechnet daraus einen Wert f\u00fcr
      \u201esoziale Vertr\u00e4glichkeit\u201c. Wer unter einem festen Schwellenwert
      liegt, bekommt keine Mitgliedschaft. Den Wert \u00fcbernehmen wir so, wie der
      Anbieter ihn liefert. Gerade bauen wir au\u00dferdem in drei Clubs neue Saunabereiche."],"model":"qwen/qwen3-embedding-8b","dimensions":1536,"encoding_format":"float","provider":{"allow_fallbacks":false,"data_collection":"deny","order":["nebius"],"zdr":true}}'
