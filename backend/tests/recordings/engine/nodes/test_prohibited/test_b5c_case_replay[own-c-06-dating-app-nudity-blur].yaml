- request:
    body: '{"input":["Instruct: Given a description of an AI system or a question
      about the EU AI Act, retrieve the provisions of the AI Act that apply\nQuery:Wir
      betreiben eine Dating-App aus Hamburg mit rund 60 Mitarbeitenden. Seit Januar
      2027 l\u00e4uft in den Chats eine Funktion, die wir selbst entwickelt haben:
      Ein Bildmodell erkennt, wenn jemand ein Nacktfoto schickt, und legt \u00fcber
      die intimen Stellen eine starke Unsch\u00e4rfe, bevor das Bild beim Empf\u00e4nger
      ankommt. Der Empf\u00e4nger sieht einen Hinweis und kann selbst entscheiden,
      ob er das Original aufdeckt; sonst bleibt es verschwommen. Neue Inhalte erzeugt
      die Funktion nicht, sie verdeckt nur. \u00dcber die Nutzer entscheidet sie nichts,
      gesperrt wird niemand deswegen. Heute ist der 10. Januar 2027. Im Fr\u00fchjahr
      kommt au\u00dferdem ein neues App-Design."],"model":"qwen/qwen3-embedding-8b","dimensions":1536,"encoding_format":"float","provider":{"allow_fallbacks":false,"data_collection":"deny","order":["nebius"],"zdr":true}}'
