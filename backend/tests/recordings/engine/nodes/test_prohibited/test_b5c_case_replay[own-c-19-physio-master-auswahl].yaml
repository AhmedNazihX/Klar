    body: '{"input":["Instruct: Given a description of an AI system or a question
      about the EU AI Act, retrieve the article, Annex point or recital of the AI
      Act that governs it\nQuery:Wir sind eine private Hochschule f\u00fcr Gesundheitsberufe
      in Nordrhein-Westfalen mit rund 3.000 Studierenden. F\u00fcr unseren Masterstudiengang
      Physiotherapie mit 40 Pl\u00e4tzen nutzen wir ab dem Wintersemester 2028/29
      ein Auswahlmodul unseres Campus-Management-Anbieters. Es liest aus den hochgeladenen
      Unterlagen das Bachelorzeugnis, die Noten in den Kernf\u00e4chern, die nachgewiesenen
      Praxisstunden und das Motivationsschreiben und vergibt jeder Bewerbung einen
      Punktwert. Die Auswahlkommission l\u00e4sst von oben nach unten zu, bis die
      Pl\u00e4tze vergeben sind, und schaut sich nur die Grenzf\u00e4lle rund um Platz
      40 genauer an. Das Modul verwendet ausschlie\u00dflich, was die Bewerberinnen
      und Bewerber f\u00fcr diesen Studiengang einreichen. \u00dcber denselben Anbieter
      l\u00e4uft auch unsere Raumplanung."],"model":"qwen/qwen3-embedding-8b","dimensions":1536,"encoding_format":"float","provider":{"allow_fallbacks":false,"data_collection":"deny","order":["nebius"],"zdr":true}}'
