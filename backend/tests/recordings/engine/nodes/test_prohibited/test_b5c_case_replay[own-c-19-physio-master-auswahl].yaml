      Risikobewertungsinstrumente, um das Risiko zu bewerten, dass kleine Kinder und
      Jugendliche an \"k\u00fcnftigen Gewalttaten und Eigentumsdelikten\" beteiligt
      sein werden. Das System bewertet Kinder auf der Grundlage ihrer Beziehungen
      zu anderen Menschen und deren vermeintlichen Risikoniveaus, d. h. es wird eventuell
      davon ausgegangen, dass bei Kindern ein h\u00f6heres Risiko f\u00fcr die Begehung
      von Straftaten besteht, einfach weil sie mit einer anderen Person wie einem
      Geschwisterkind oder einem Freund verbunden sind, bei der eine hohe Risikobewertung
      vorliegt. Das Risikoniveau der Eltern kann sich ebenfalls auf das Risikoniveau
      eines Kindes auswirken. Die Risikobewertungen f\u00fchren dazu, dass die Polizei
