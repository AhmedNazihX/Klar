    body: '{"input":["Instruct: Given a description of an AI system or a question
      about the EU AI Act, retrieve the article, Annex point or recital of the AI
      Act that governs it\nQuery:We make presentation software in Utrecht, about 180
      staff. Since October 2026 our product has an image generator that creates illustrations
      and photo-style pictures from a text prompt; it runs on a general-purpose image
      model we license from a US company, with our own filters on top. Prompts that
      ask for nudity or sexual content are refused, every output passes a nudity classifier
      before it is shown, and uploaded photos of people can only be used for background
      or lighting changes. An outside red team spent three weeks trying and could
      not get intimate images of real people out of it without rebuilding the model.
      Users can report bad outputs, and we fix reported gaps within days. It is now
      January 2027."],"model":"qwen/qwen3-embedding-8b","dimensions":1536,"encoding_format":"float","provider":{"allow_fallbacks":false,"data_collection":"deny","order":["nebius"],"zdr":true}}'
