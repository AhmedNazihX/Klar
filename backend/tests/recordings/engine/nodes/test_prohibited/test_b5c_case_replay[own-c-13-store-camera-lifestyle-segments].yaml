      von Datenbanken zur Gesichtserkennung | kriminellen Aktivit\u00e4t stehen, zu
      untermauern KI-Systeme, die Datenbanken zur Gesichtserkennung durch das ungezielte
      Auslesen von Gesichtsbildern aus dem Internet oder von \u00dcberwachungsaufnahmen
      erstellen oder erweitern |\n| Artikel 5 Absatz 1 Buchstabe | Emotionserkennung
      | KI-Systeme, die Emotionen am Arbeitsplatz oder in Bildungseinrichtungen ableiten,
      au\u00dfer aus medizinischen Gr\u00fcnden oder Sicherheitsgr\u00fcnden |\n|
      f Artikel 5 Absatz 1 Buchstabe g | Biometrische Kategorisierung | KI-Systeme,
      mit denen nat\u00fcrliche Personen auf der Grundlage ihrer biometrischen Daten
      kategorisiert werden, um ihre Rasse, ihre politischen Einstellungen, ihre |\n\n|
      Artikel 5 Absatz 1 Buchstabe h | Biometrische Echtzeit- Fernidentifizierung
      (RBI) | Gewerkschaftszugeh\u00f6rigkeit, ihre religi\u00f6sen oder weltanschaulichen
      \u00dcberzeugungen, ihr Sexualleben oder ihre sexuelle Ausrichtung zu erschlie\u00dfen
      oder abzuleiten; mit Ausnahme der Kennzeichnung oder Filterung rechtm\u00e4\u00dfig
