      f\u00fchrt, wenn Daten aus nicht zusammenh\u00e4ngenden sozialen Kontexten stammen
      oder wenn eine solche Behandlung im Hinblick auf das soziale Verhalten |\n|
      Artikel 5 Absatz 1 Buchstabe d | Risikobewertung, um das Risiko, dass eine Person
