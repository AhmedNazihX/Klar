- request:
    body: '{"input":["Instruct: Given a description of an AI system or a question
      about the EU AI Act, retrieve the provisions of the AI Act that apply\nQuery:Wir
      sind ein Wiener Anbieter f\u00fcr Handelsanalysen mit 70 Besch\u00e4ftigten.
      Unser Produkt besteht aus Kameras \u00fcber den Werbebildschirmen in Modegesch\u00e4ften
      und einer Software, die wir selbst entwickelt haben. Sie wertet das Gesicht
      jeder Person aus, die vor dem Bildschirm stehen bleibt, und ordnet sie einem
      Segment zu, darunter \u201eLGBTQ-affin\u201c und \u201ereligi\u00f6s-konservativ\u201c;
      danach w\u00e4hlt der Bildschirm die passende Werbung aus. Gespeichert werden
      nur die Segmente, nicht die Bilder. Drei Modeketten in \u00d6sterreich und Tschechien
      setzen es seit Anfang 2026 ein, verkauft wird es unter unserem Namen. Unsere
      Weihnachtsfeier findet dieses Jahr im Prater statt."],"model":"qwen/qwen3-embedding-8b","dimensions":1536,"encoding_format":"float","provider":{"allow_fallbacks":false,"data_collection":"deny","order":["nebius"],"zdr":true}}'
