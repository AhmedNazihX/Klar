      KI-Systeme f\u00fcr die biometrische Echtzeit- Fernidentifizierung in \u00f6ffentlich
      zug\u00e4nglichen R\u00e4umen f\u00fcr die Zwecke der Strafverfolgung, au\u00dfer
      wenn dies im Hinblick auf die gezielte Suche nach bestimmten Opfern von Entf\u00fchrung,
      das Abwenden einer konkreten Gefahr einschlie\u00dflich der Gefahr eines Terroranschlags
      oder das Aufsp\u00fcren von Personen, die der Begehung bestimmter Straftaten
      verd\u00e4chtigt werden, erforderlich ist (weitere Verfahrensvorschriften, darunter
      f\u00fcr die Genehmigung, sind in Artikel 5 Abs\u00e4tze 2-7 der KI-Verordnung
      dargelegt). |\n|---|---|---|\n\n3. [guide:guide-prohibited:para:142] (142) Die
      KI-Verordnung erg\u00e4nzt ferner die Verordnung (EU) 2024/900 (Verordnung \u00fcber
      politische Werbung) 99 , die harmonisierte Vorschriften, einschlie\u00dflich
      Transparenz- und damit zusammenh\u00e4ngender Sorgfaltspflichten, f\u00fcr die
      Erbringung politischer Werbung und damit zusammenh\u00e4ngender Dienstleistungen
      sowie Vorschriften \u00fcber den Einsatz von Targeting- oder Anzeigenschaltungsverfahren
      im Zusammenhang mit politischer Online-Werbung enth\u00e4lt. Diese Verordnung
      verbietet das Profiling auf der Grundlage besonderer Kategorien personenbezogener
      Daten im Zusammenhang mit politischer Online-Werbung und das Targeting von Personen,
      die mindestens ein Jahr j\u00fcnger als das in den nationalen Vorschriften festgelegte
      Wahlalter sind. Dar\u00fcber hinaus k\u00f6nnen Targeting- oder Anzeigenschaltungsverfahren
      im Zusammenhang mit politischer Online-Werbung nur dann durchgef\u00fchrt werden,
      wenn sie auf personenbezogenen Daten beruhen, die bei den betroffenen Personen
      mit deren ausdr\u00fccklicher Einwilligung erhoben wurden. Au\u00dferdem gelten
      zus\u00e4tzliche Transparenzanforderungen, d. h. die Offenlegung politischer
      Anzeigen, die Beschreibung der Verwendung solcher Techniken und der wichtigsten
      Parameter sowie zus\u00e4tzliche Informationen \u00fcber die damit verbundene
      Logik einschlie\u00dflich Informationen \u00fcber die Verwendung von KISystemen.
      Eine gezielte politische Werbung auf der Grundlage einer im Einklang mit der
      genannten Verordnung 100 erfolgenden Verarbeitung personenbezogener Daten wird
      dazu beitragen, dass das Profiling von W\u00e4hlern sowie das Targeting und
      die Anzeigenschaltung politischer Werbung innerhalb der Grenzen rechtm\u00e4\u00dfiger
      \u00dcberzeugungsarbeit funktionieren.\n\n4. [guide:guide-prohibited:para:224]
      (224) Damit das Verbot nach Artikel 5 Absatz 1 Buchstabe e der KI-Verordnung
      gilt, m\u00fcssen mehrere kumulative Bedingungen erf\u00fcllt sein:\n\n(i) Die
      Praxis muss das \"Inverkehrbringen\", die \"Inbetriebnahme f\u00fcr diesen spezifischen
      Zweck\" oder die \"Verwendung\" eines KI-Systems darstellen;\n\n(ii) f\u00fcr
      die Zwecke der Erstellung oder Erweiterung von Datenbanken zur Gesichtserkennung;\n\n(iii)
      die Mittel zur Bef\u00fcllung der Datenbank sind KI-Instrumente f\u00fcr ungezieltes
      Auslesen und\n\n(iv) die Bildquellen sind entweder das Internet oder \u00dcberwachungsaufnahmen.\n\n5.
      [guide:guide-prohibited:para:272] (272) Aus biometrischen Informationen kann
      eine Vielzahl von Informationen, einschlie\u00dflich \"sensibler\" Informationen,
      extrahiert, erschlossen oder abgeleitet werden, um Personen zu kategorisieren,
      wobei dies auch ohne Wissen der betroffenen Personen erfolgen kann. Dies kann
      zu einer unfairen und diskriminierenden Behandlung f\u00fchren, z. B. wenn eine
      Dienstleistung verweigert wird, weil jemand als Angeh\u00f6riger einer bestimmten
      Rasse angesehen wird. KI-gest\u00fctzte Systeme zur biometrischen Kategorisierung,
      die dem Zweck der Zuordnung nat\u00fcrlicher Personen zu bestimmten Gruppen
      oder Kategorien dienen und die sich auf Aspekte wie sexuelle oder politische
      Ausrichtung oder Rasse beziehen, verletzen die Menschenw\u00fcrde und bergen
      erhebliche Risiken f\u00fcr andere Grundrechte wie das Recht auf Privatsph\u00e4re
      und das Recht auf Nichtdiskriminierung. Sie sind daher nach Artikel 5 Absatz
      1 Buchstabe g der KIVerordnung verboten.\n\n173 Erw\u00e4gungsgrund 30 der KI-Verordnung.\n\n8.2.
      Die wichtigsten Konzepte und Komponenten des Verbots\n\nIn Artikel 5 Absatz
      1 Buchstabe g der KI-Verordnung wird Folgendes bestimmt:\n\nFolgende Praktiken
      im KI-Bereich sind verboten:\n\ng) das Inverkehrbringen, die Inbetriebnahme
      f\u00fcr diesen spezifischen Zweck oder die Verwendung von Systemen zur biometrischen
      Kategorisierung, mit denen nat\u00fcrliche Personen individuell auf der Grundlage
