    body: '{"input":["Instruct: Given a description of an AI system or a question
      about the EU AI Act, retrieve the provisions of the AI Act that apply\nQuery:We''re
      a 40-person games studio in Krak\u00f3w. Our mobile pet game is made for children
      aged 7 to 12. Since its update in March 2026 a model of ours watches each child''s
      play (taps, pauses, failed levels) to spot the moment a child is frustrated
      or about to quit, and right then shows a countdown offer for gems while the
      child''s pet cries that it will be lonely without them. Spending by under-12
      players has tripled, and we get weekly complaints from parents whose children
      ran up several hundred euros on the family phone without understanding it was
      real money. The game is sold under our own name. We''re also porting it to tablets."],"model":"qwen/qwen3-embedding-8b","dimensions":1536,"encoding_format":"float","provider":{"allow_fallbacks":false,"data_collection":"deny","order":["nebius"],"zdr":true}}'
