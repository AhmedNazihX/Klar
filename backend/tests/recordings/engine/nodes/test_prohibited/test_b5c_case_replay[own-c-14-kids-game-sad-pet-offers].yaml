      (134) An essential condition for the prohibitions in Article 5(1)(a) and (b)
      AI Act to apply is that the AI-enabled manipulation and exploitation of vulnerabilities
      should cause or be reasonably likely to cause significant harm. All manipulative,
      deceptive and exploitative AI applications that are not reasonably likely to
      cause significant harms are in principle outside the scope of the prohibitions
      without prejudice to other Union law that still applies (see section 3.6. below).\n\nExamples
      of AI systems that are not likely to cause significant harm include:\n\n- An
      AI companionship system is designed in an anthropomorphic way and with affective
      computing to make the system more appealing and effectively makes users more
      engaged, but is not engaging in other manipulative or deceptive practices in
      a manner that is reasonably likely to cause them serious psychological, physical
      or other harms, unhealthy attachment and dependency.\n\n- A therapeutic chatbot
      uses subliminal techniques to steer users towards a healthier lifestyle and
      to quit bad habits, such as smoking. Even if the users who follow the chatbot''s
      advice and subliminal therapy experience some physical discomfort and psychological
      stress due to the effort made to quit smoking, the AI-enabled chatbot cannot
      be considered likely to cause significant harm. Such temporary discomfort is
      unavoidable and outweighed by the long-term benefits for users'' health. There
      are no hidden attempts to influence decision-making beyond promoting healthy
      habits.\n\n- An online music platform uses an emotion recognition system to
      infer users'' emotions and automatically recommends them songs in line with
      their moods, while avoiding excessive exposure to depressive songs. Since users
      are just listening to music and are not otherwise harmed or led to depression
      and anxiety, the system is not reasonably likely to cause significant harm.\n\n-
      AI-enabled manipulative and deceptive techniques used in security training and
      other learning simulations that mimic phishing attempts to educate users on
      cybersecurity threats. These systems may deploy purposefully manipulative techniques
      (e.g., exploiting cognitive biases) without users'' awareness that distort the
      behaviour, but this is done temporarily for beneficial training and awareness
      raising purposes and without causing significant harms.\n\n4. [guide:guide-prohibited:para:133]
      (133) Furthermore, recital 29 AI Act clarifies that common and legitimate commercial
      practices, such as advertising, should not be regarded ''in themselves'' or
      by their very nature as harmful manipulative, deceptive or exploitative AI-enabled
      practices.\n\nFor example,\n\n- Advertising techniques that use AI to personalise
      content based on user preferences are not inherently manipulative if they do
      not deploy subliminal, purposefully manipulative or deceptive techniques that
      subvert individual autonomy or exploit vulnerabilities in harmful ways as prohibited
      under Article 5(1)(a) and (b) AI Act. Compliance with the relevant obligations
      under the GDPR, consumer protection law and Regulation (EU) 2022/2065 (''the
      DSA'') help to mitigate such risks.\n\n- The development of AI models and classifiers
      to detect child sexual abuse online in accordance with applicable law are legitimate
      practices that are not exploitative of children''s vulnerabilities and are,
      on the contrary, essential to improve child safety online.\n\n- AI systems used
      for providing banking services, such as mortgages and loans, that use the age
      or the specific socio- economic situation of the client as an input, in compliance
      with Union legislation on financial service, consumer protection, data protection
      and non-discrimination, do not qualify as the exploitation of vulnerabilities
      within the meaning of Article 5(1)(b) AI Act when they are designed to protect
      and support people identified as vulnerable due to their age, disability or
      specific socio-economic circumstances and are beneficial for those groups, contributing
      also to fairer and more sustainable financial services for those groups.\n\n-
      AI systems that detect drowsiness and fatigue in drivers and alert them to rest
      in compliance with safety laws are beneficial and do not qualify as exploitation
      of vulnerabilities within the meaning of Article 5(1)(b) AI Act.\n\n5. [guide:guide-prohibited:para:8]
      (8) Article 5 AI Act prohibits the placing on the EU market, putting into service,
      or use of certain AI systems for manipulative, exploitative, social control
      or surveillance practices, which by their inherent nature violate fundamental
      rights and Union values. Recital 28 AI Act clarifies that such practices are
      particularly harmful and abusive and should be prohibited because they contradict
      the Union values of respect for human dignity, freedom, equality, democracy,
      and the rule of law, as well as fundamental rights enshrined in the Charter
      of Fundamental Right of the European Union ( '' the Charter''), including the
      right to non-discrimination (Article 21 Charter) and equality (Article 20),
      data protection (Article 8 Charter) and private and family life (Article 7 Charter),
      and the rights of the child (Article 24 Charter). The prohibitions in Article
      5 AI Act also aim to uphold the right to freedom of expression and information
      (Article 11 Charter), freedom of assembly and of association (Article 12 Charter),
      freedom of thought, conscience and religion (Article 10 Charter), the right
      to an effective remedy and fair trial (Article 47 Charter), and the presumption
      of innocence and the right of defence (Article 48 Charter).\n\n6. [guide:guide-prohibited:para:142]
      (142) The AI Act also complements Regulation (EU) 2024/900 (the Political advertising
      regulation) 99 which provides harmonised rules, including transparency and related
