      or about to quit, and right then shows a countdown offer for gems while the
      child''s pet cries that it will be lonely without them. Spending by under-12
      players has tripled, and we get weekly complaints from parents whose children
      ran up several hundred euros on the family phone without understanding it was
      real money. The game is sold under our own name. We''re also porting it to tablets.","role":"user"}],"max_tokens":6000,"model":"openai/gpt-6-luna-20260922","provider":{"allow_fallbacks":false,"data_collection":"deny","order":["azure/eu"],"zdr":true},"response_format":{"json_schema":{"name":"prohibited_answer","schema":{"$defs":{"Answer":{"enum":["yes","no","unknown"],"title":"Answer","type":"string"},"BiometricCategorisationAnswer":{"additionalProperties":false,"properties":{"biometric_categorisation":{"$ref":"#/$defs/Answer"},"sensitive_traits":{"$ref":"#/$defs/Answer"},"lawful_labelling":{"$ref":"#/$defs/Answer"},"settled_in_law":{"$ref":"#/$defs/Settled"},"open_question":{"anyOf":[{"$ref":"#/$defs/OpenQuestion"},{"type":"null"}]},"open_on":{"$ref":"#/$defs/BiometricCategorisationOpenOn"},"evidence":{"$ref":"#/$defs/EvidenceTag"},"fact":{"minLength":1,"title":"Fact","type":"string"},"fact_numbers":{"items":{"type":"integer"},"title":"Fact
