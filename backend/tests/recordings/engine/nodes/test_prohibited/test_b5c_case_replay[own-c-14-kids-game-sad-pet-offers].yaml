      psychological harms such as increased anxiety and dependency of the children
      on the service and longer-term harms to the child''s well-being.\n\nSuch deliberate
      addictive and exploitative design features of the AI-enabled services that can
      lead to combined significant harms, as described above, should be distinguished
      from other legitimate behaviour of the providers and deployers to pursue user
      engagement that respects individual autonomy and the safety of children and
      do not lead to significant harms which are outside the scope of Article 5(1)(b)
      AI Act (see section out of scope 5.3).\n\n5. [guide:guide-prohibited:para:8]
      (8) Article 5 AI Act prohibits the placing on the EU market, putting into service,
      or use of certain AI systems for manipulative, exploitative, social control
      or surveillance practices, which by their inherent nature violate fundamental
      rights and Union values. Recital 28 AI Act clarifies that such practices are
      particularly harmful and abusive and should be prohibited because they contradict
      the Union values of respect for human dignity, freedom, equality, democracy,
      and the rule of law, as well as fundamental rights enshrined in the Charter
      of Fundamental Right of the European Union ( '' the Charter''), including the
      right to non-discrimination (Article 21 Charter) and equality (Article 20),
      data protection (Article 8 Charter) and private and family life (Article 7 Charter),
      and the rights of the child (Article 24 Charter). The prohibitions in Article
      5 AI Act also aim to uphold the right to freedom of expression and information
      (Article 11 Charter), freedom of assembly and of association (Article 12 Charter),
      freedom of thought, conscience and religion (Article 10 Charter), the right
      to an effective remedy and fair trial (Article 47 Charter), and the presumption
      of innocence and the right of defence (Article 48 Charter).\n\n6. [guide:guide-prohibited:para:124]
      (124) By contrast, the primary focus of the prohibition in Article 5(1)(b) AI
      Act is the protection of particularly vulnerable persons due to their age, disability,
      or a specific social or economic situation, which are in principle more susceptible
      to AI exploitation due to inherent or situational factors and, therefore, require
      additional protection against exploitation. The key elements here are the characteristics
      of the affected vulnerable persons and the fact that their specific vulnerabilities
      are being exploited by the AI system.\n\nFor instance, if an AI system uses
      rapid image flashes to influence purchasing decisions, it may fall under Article
      5(1)(a) AI Act due to the subliminal nature of the manipulation. Conversely,
      an AI system that targets older persons with insurance offers by exploiting
      their reduced cognitive capacity may fall under Article 5(1)(b) AI Act.\n\nLanguage
