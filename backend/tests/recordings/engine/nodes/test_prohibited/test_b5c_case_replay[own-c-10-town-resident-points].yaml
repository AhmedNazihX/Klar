    body: '{"input":["Instruct: Given a description of an AI system or a question
      about the EU AI Act, retrieve the provisions of the AI Act that apply\nQuery:Wir
      sind die Stadtverwaltung einer Kleinstadt in Baden-W\u00fcrttemberg mit gut
      40.000 Einwohnern. Seit Anfang 2026 nutzen wir ein Punkteprogramm eines kommunalen
      Softwareanbieters. Es vergibt jedem Haushalt einen Punktestand, der laufend
      aus verschiedenen Quellen berechnet wird: p\u00fcnktlich bezahlte Geb\u00fchren,
      Fehlw\u00fcrfe in der M\u00fclltrennung laut Tonnensensoren, Strafzettel, ehrenamtliches
      Engagement. Wer wenig Punkte hat, rutscht auf der Warteliste f\u00fcr st\u00e4dtische
      Kitapl\u00e4tze nach hinten und bekommt Hallenzeiten im Sportzentrum erst als
      Letzter. Das Programm haben wir unver\u00e4ndert \u00fcbernommen. Daneben l\u00e4uft
      gerade die Digitalisierung unseres Bauamts."],"model":"qwen/qwen3-embedding-8b","dimensions":1536,"encoding_format":"float","provider":{"allow_fallbacks":false,"data_collection":"deny","order":["nebius"],"zdr":true}}'
