      durch Aktivit\u00e4ten in den sozialen Medien beeinflusst), w\u00e4hrend gleichzeitig
      \u00fcberm\u00e4\u00dfige Strafen f\u00fcr geringf\u00fcgige Verst\u00f6\u00dfe
      (z. B. soziale und finanzielle Nachteile bei relativ geringf\u00fcgigen Zuwiderhandlungen)
      verh\u00e4ngt werden.\n\nDiese inakzeptablen Praktiken der sozialen Bewertung
      lassen sich von rechtm\u00e4\u00dfigen Praktiken unterscheiden, bei denen Personen
      f\u00fcr besondere, legitime Zwecke, die diese Bedingungen nicht erf\u00fcllen
      und im Einklang mit Unionsrecht und nationalem Recht stehen, bewertet werden,
      insbesondere dann, wenn diese Rechtsvorschriften sicherstellen, dass eine Schlechterstellung
      oder Benachteiligung gerechtfertigt und verh\u00e4ltnism\u00e4\u00dfig ist und
      Daten aus entsprechenden sozialen Kontexten verwendet werden (siehe Abschnitt
      4.3 \"Au\u00dferhalb des Anwendungsbereichs\").\n\n6. [guide:guide-prohibited:para:154]
      (154) Der Begriff \"Bewertung\" bezieht sich auch auf das Konzept des Profiling,
      das durch die Datenschutz-Gesetzgebung der Union 109 geregelt wird und eine
      besondere Form der Evaluierung darstellt. In Artikel 5 Absatz 1 Buchstabe c
      der KI-Verordnung wird zwar nicht unmittelbar auf dieses Konzept oder diese
      Rechtsvorschriften 110 Bezug genommen, doch k\u00f6nnen sie auch f\u00fcr das
      in dieser Bestimmung enthaltene Verbot sowie f\u00fcr andere Verbote in der
      KI-Verordnung 111 ma\u00dfgeblich sein, wenn die Bewertung automatisch durch
      ein KI-System auf der Grundlage personenbezogener Daten erfolgt. Profiling bezeichnet
      die Nutzung von Informationen \u00fcber eine Einzelperson (oder eine Gruppe
      von Einzelpersonen) und die Bewertung ihrer Merkmale oder Verhaltensmuster,
      um sie in eine bestimmte Kategorie oder Gruppe einzuordnen, um beispielsweise
      ihre F\u00e4higkeit zur Erf\u00fcllung einer Aufgabe, ihre Interessen oder m\u00f6gliches
      Verhalten zu analysieren und/oder vorherzusagen 112 . Nach EU-Datenschutzrecht
      kann das Profiling nat\u00fcrlicher Personen, wenn es durch KISysteme durchgef\u00fchrt
      wird, daher auch unter Artikel 5 Absatz 1 Buchstabe c der KIVerordnung fallen.\n\n108
      Artikel-29-Datenschutzgruppe, Leitlinien zu automatisierten Entscheidungen im
      Einzelfall einschlie\u00dflich Profiling f\u00fcr die Zwecke der Verordnung
      (EU) 2016/679, WP251rev.01, 6.2.2018, S. 7.\n\n109 Siehe Artikel 4 Absatz 4
      und Artikel 22 DSGVO sowie Artikel 11 der Richtlinie zum Datenschutz bei der
      Strafverfolgung. Siehe auch Artikel-29-Datenschutzgruppe, Leitlinien zu automatisierten
      Entscheidungen im Einzelfall einschlie\u00dflich Profiling f\u00fcr die Zwecke
      der Verordnung (EU) 2016/679, WP251rev.01, 6.2.2018, S. 7.\n\n110 Artikel 3
      Nummer 52 der KI-Verordnung enth\u00e4lt eine Definition des Begriffs \"Profiling\",
      die auf die Begriffsbestimmung in Artikel 4 Nummer 4 DSGVO verweist.\n\nBeispielsweise
      pr\u00fcfte der EuGH in seinem Urteil SCHUFA I ein in Deutschland verwendetes
      Bewertungssystem zur Pr\u00fcfung der Kreditw\u00fcrdigkeit nach Punkten 113
      . In diesem Fall war die vom Computerprogramm generierte \"Punktzahl\" (Score)
      ein \"Wahrscheinlichkeitswert\" hinsichtlich der F\u00e4higkeit einer Person,
      Zahlungsverpflichtungen zu erf\u00fcllen; dies wurde vom EuGH als \"Profiling\"
      eingestuft. Konkret prognostizierte das System aus bestimmten Merkmalen einer
      Person \u2026 f\u00fcr diese die Wahrscheinlichkeit eines k\u00fcnftigen Verhaltens
      (\"Score-Wert\"), wie beispielsweise die R\u00fcckzahlung eines Kredits. Die
