- request:
    body: '{"input":["Instruct: Given a description of an AI system or a question
      about the EU AI Act, retrieve the provisions of the AI Act that apply\nQuery:We''re
      a national police force in an EU country whose police act allows live facial
      recognition in public places for only two purposes, finding abducted or missing
      persons and stopping an imminent terrorist attack, and requires an investigating
      judge to approve each use in advance. We''ve bought a system from a French vendor
      and will use it from 2028, unchanged. In a case such as a missing child, cameras
      at named stations compare passers-by against that child''s photo for at most
      48 hours, and officers check every match before acting. We''ve completed the
      fundamental rights impact assessment, registered the system in the EU database,
      and notify the data protection authority of each use. Our fleet is also moving
      to electric cars."],"model":"qwen/qwen3-embedding-8b","dimensions":1536,"encoding_format":"float","provider":{"allow_fallbacks":false,"data_collection":"deny","order":["nebius"],"zdr":true}}'
