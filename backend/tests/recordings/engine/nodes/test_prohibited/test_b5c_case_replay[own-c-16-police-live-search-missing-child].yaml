      cameras as such is not prohibited under the AI Act. Certain uses however, including
      the unspecified and indiscriminate identification of natural persons, is prohibited.\n\nSeveral
      burglaries occurred in a residential neighbourhood duri [\u2026]\n\n4. [guide:guide-prohibited:para:328]
      (328) In those scenarios, the Union legislature has balanced the security needs
      of society against the risk that real-time RBI systems pose to the fundamental
      rights of individuals subject to those systems. According to Recital 33 AI Act,
      the objectives for which the use of real-time RBI systems for law enforcement
      purposes in publicly accessible spaces is allowed must be strictly, exhaustively,
      and narrowly defined, and appear when there is a ''strict necessity'' to achieve
      ''a substantial public interest'' which ''outweighs the risks'' posed to fundamental
      rights. Any other use of real-time RBI systems in publicly accessible spaces
      for law enforcement purposes which is not listed in Article 5(1)(h)(i)-(iii)
      AI Act is prohibited.\n\nFor instance, the use of real-time RBI systems by the
      police to identify a shoplifter and compare their facial images against criminal
      databases is prohibited, as it does not fall under any of the objectives listed
      in Article 5(1)(h)(i)-(iii) AI Act.\n\n5. [guide:guide-prohibited:para:387]
      (387) In accordance with Article 5(3) AI Act, prior authorisation is needed
      for ''each use''. This implies that the decisive moment for obtaining such authorisation
      is not the moment prior to installing real-time RBI systems, but each concrete
      use thereof.\n\nFor example,\n\n- the police install biometric ready CCTV cameras
      at the main train station of a city (no authorisation under the AI Act is needed,
