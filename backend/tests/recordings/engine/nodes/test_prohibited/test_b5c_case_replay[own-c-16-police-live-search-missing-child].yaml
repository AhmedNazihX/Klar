      a FRIA must be prepared prior to the first use and an individual authorisation
      by a judicial or independent administrative authority is needed before each
      individual use of the system).\n\nThe police has concrete indications that a
      terrorist will arrive by train in the town (prior authorisation is needed for
      real-time identification).\n\n6. [guide:guide-prohibited:para:426] (426) RBI
      systems that fall outside the scope of the prohibition in Article 5(1)(h) AI
      Act include biometric verification/authentication systems and the retrospective
      use of (post) RBI systems in publicly accessible spaces for law enforcement
      purposes. For instance, police authorities might be authorised by national law
      to perform retrospective facial recognition to compare images of criminal suspects
      with recorded facial images in a criminal database. 237 Another use that falls
      outside the scope of the prohibition is the use of real-time RBI systems for
      law enforcement purposes in either a private (such as at somebody''s place)
      or an online space (such as the use of a chat room or online game to identify
