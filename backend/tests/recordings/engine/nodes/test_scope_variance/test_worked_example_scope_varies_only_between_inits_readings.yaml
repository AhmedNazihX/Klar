  response:
    body:
      string: '{"id": "gen-1791963301-E6DFHtnC3ws0NEj61rwo", "object": "chat.completion",
        "created": 1791963301, "model": "openai/gpt-6-luna", "provider": "Azure",
        "system_fingerprint": null, "service_tier": "default", "choices": [{"index":
        0, "logprobs": null, "finish_reason": "stop", "native_finish_reason": "completed",
