      include AI systems to the output of which natural persons are not directly exposed,
      such as tools used to organise, optimise or structure political campaigns from
      an administrative or logistical point of view.\n\nGuideline passages and examples
      found:\n[guide:guide-high-risk-annex-iii:ex:138] (ii. Promotion and termination
      of work-related contractual relationships \u203a b) Practical examples of AI
      systems falling outside the high-risk use case of point 4(b))\nAI system for
      corporate travel planning\nA company uses an AI application to optimise business
      travel arrangements, suggesting costeffective flights, hotels, and itineraries
      for employees required to attend meetings or conferences. The AI application''s
      suggestions do not prevent the employee from making alternative choices or even
      fully manually booking as long as it does not breach objective rules of company
