      and contractual compliance, supporting workers in their tasks rather than evaluating
      workers'' performance, the monitoring activity is incidental and falls outside
      the use case of point 4(b) of Annex III 59 .\n\n[guide:guide-high-risk-annex-iii:para:112]
      (2.7.2. Exception for profiling)\n(112) Where the personal data are not used
