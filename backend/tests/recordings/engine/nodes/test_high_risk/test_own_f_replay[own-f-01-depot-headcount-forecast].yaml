      (ii. Promotion and termination of work-related contractual relationships \u203a
      c) Practical examples for AI systems falling within the use case but exempted
      under the filter mechanism of Article 6(3))\nAI system compiling performance
      records for reporting\nA manufacturing company uses an AI system to automatically
