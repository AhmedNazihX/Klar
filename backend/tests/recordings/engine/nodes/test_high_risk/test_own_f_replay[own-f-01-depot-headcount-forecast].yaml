interactions:
- request:
    body: '{"input":["Instruct: Given a description of an AI system or a question
      about the EU AI Act, retrieve the article, Annex point or recital of the AI
      Act that governs it\nQuery:We are a parcel logistics company with nine depots
      in Poland and about 3,500 employees. Our planning team built a forecasting tool
      that estimates, per depot and per month, how many drivers and sorters we will
      need to hire over the next year. It works from parcel volume forecasts, planned
      depot openings, seasonal peaks and each depot''s overall staff turnover. The
      output is a headcount figure per depot and role, which our HR directors use
      to set recruitment budgets and decide which job fairs to attend. The tool only
      works with totals: it holds no data on individual employees or applicants and
      has nothing to do with job ads or applications. This year we also replaced the
      handheld scanners in all depots."],"model":"qwen/qwen3-embedding-8b","dimensions":1536,"encoding_format":"float","provider":{"allow_fallbacks":false,"data_collection":"deny","order":["nebius"],"zdr":true}}'
