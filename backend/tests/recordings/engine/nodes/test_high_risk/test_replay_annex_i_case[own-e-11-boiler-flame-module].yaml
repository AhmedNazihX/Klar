      or who has entered into the territory of a Member State;\n[annex:III:7:c] AI
      systems intended to be used by or on behalf of competent public authorities
      or by Union institutions, bodies, offices or agencies to assist competent public
      authorities for the examination of applications for asylum, visa or residence
      permits and for associated complaints with regard to the eligibility of the
      natural persons applying for a status, including related assessments of the
      reliability of evidence;\n[annex:III:7:d] AI systems intended to be used by
      or on behalf of competent public authorities, or by Union institutions, bodies,
      offices or agencies, in the context of migration, asylum or border control management,
      for the purpose of detecting, recognising or identifying natural persons, with
      the exception of the verification of travel documents.\n[annex:III:8:a] AI systems
      intended to be used by a judicial authority or on their behalf to assist a judicial
      authority in researching and interpreting facts and the law and in applying
      the law to a concrete set of facts, or to be used in a similar way in alternative
      dispute resolution;\n[annex:III:8:b] AI systems intended to be used for influencing
      the outcome of an election or referendum or the voting behaviour of natural
