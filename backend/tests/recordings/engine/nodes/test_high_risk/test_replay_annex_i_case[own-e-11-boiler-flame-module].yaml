- request:
    body: '{"input":["Instruct: Given a description of an AI system or a question
      about the EU AI Act, retrieve the provisions of the AI Act that apply\nQuery:We
      manufacture wall-hung gas condensing boilers in northern Italy, with about 900
      employees. From autumn 2028 every boiler will ship with a flame-monitoring module
      we buy from a Danish electronics supplier: a small neural network reads the
      ionisation signal and a flame camera and closes the gas valve if the flame becomes
      unstable or goes out. The module is sold only as part of our boilers, under
      our brand; the supplier''s name appears nowhere. Under the gas appliances regulation
      a notified body has to type-examine each boiler model, and the flame-monitoring
      module is included in that examination. We are also redesigning our installer
      app, which is unrelated."],"model":"qwen/qwen3-embedding-8b","dimensions":1536,"encoding_format":"float","provider":{"allow_fallbacks":false,"data_collection":"deny","order":["nebius"],"zdr":true}}'
