      include AI systems to the output of which natural persons are not directly exposed,
      such as tools used to organise, optimise or structure political campaigns from
      an administrative or logistical point of view.\n\nGuideline passages and examples
      found:\n[guide:guide-prohibited:para:16] (2.4. Personal scope: responsible actors)\n(16)
      According to Article 3(3) AI Act, providers are natural or legal persons, public
      authorities, agencies or other bodies, that develop AI systems or have them
      developed and place them on the Union market, or put them into service under
      their own name or trademark 11 (see section 2.3 above). Providers established
      or located outside the Union are subject to the provisions of the AI Act if
      they place those systems on the market or put them into service in the Union,
      12 or if the output of the AI system is used in the Union. 13 Providers must
      ensure their AI systems meet all relevant requirements before placing them on
      the market or putting them into service.\n\nFor example, a provider of a RBI
      system is the manufacturer of the system that markets the system in the Union
      under its trademark. The provider of such a system could also\n\n8 See Article
      3(12) and (13) AI Act.\n\n9\n\nSee for definitions of these terms also the Commission
      Notice - The ''Blue Guide'' on the implementation of EU product rules 2022,\n\n2022/C
      247/01, Section 2.8.\n\n10 Recital 28 AI Act.\n\n11 Article 3(3), (9) and (11)
      AI Act. In relation to high-risk AI systems, Article 25 AI Act envisages that
      1. Any distributor, importer, deployer or other third-party shall be considered
      to be a provider of a high-risk AI system for the purposes of this Regulation
      and shall be subject to the obligations of the provider under Article 16, in
      any of the following circumstances: (a) they put their name or trademark on
      a high-risk AI system already placed on the market or put into service, without
      prejudice to contractual arrangements stipulating that the obligations are otherwise
      allocated; (b) they make a substantial modification to a high-risk AI system
      that has already been placed on the market or has already been put into service
      in such a way that it remains a high-risk AI system pursuant to Article 6; (c)
      they modify the intended purpose of an AI system, including a general-purpose
      AI system, which has not been classified as high-risk and has already been placed
      on the market or put into service in such a way that the AI system concerned
      becomes a high-risk AI system in accordance with Article 6.\n\n12\n\nArticle
      2(1)(a) AI Act. be a public authority that develops the system in-house and
      puts it into service for its own use.\n\n13 Article 2(1)(c) AI Act.\n\n[guide:guide-high-risk-annex-i:para:50]
      (2.3. The product is required to undergo a third-party conformity assessment)\n(50)
      To be classified as high-risk, the product of which the AI system forms a safety
      component, or the AI system itself if it is the product, must undergo a third-party
      conformity assessment. This means that, for classification pursuant to Article
      6(1) AI Act, the system must be considered by the Union harmonisation legislation
      listed in Annex I AI Act as ''of being of complex design or present[ing] higher
      risks of non-compliance for instance'' 6 , in that it requires public interest
      protection through a conformity assessment module requiring third-party conformity
      assessment.\n\n4 Where the failure or malfunction of such an AI system could
