interactions:
- request:
    body: '{"input":["Instruct: Given a description of an AI system or a question
      about the EU AI Act, retrieve the article, Annex point or recital of the AI
      Act that governs it\nQuery:We operate the district heating network of a city
      in eastern Poland, serving about 45,000 flats and houses. Every month a tool
      we bought from a Warsaw analytics firm goes through our customers'' heat-meter
      readings, compares each home with similar ones and with the weather, and flags
      homes whose use is unusually high. Our customer team then phones those households
      and offers a free, voluntary energy-advice visit; nobody has to take it, and
      the tariff stays the same either way. The calls are made by our staff, and the
      tool writes no messages. It has no access to the heating plants, pumps or network
      control, which run on separate systems. We are also switching to paperless invoices
      this year."],"model":"qwen/qwen3-embedding-8b","dimensions":1536,"encoding_format":"float","provider":{"allow_fallbacks":false,"data_collection":"deny","order":["nebius"],"zdr":true}}'
