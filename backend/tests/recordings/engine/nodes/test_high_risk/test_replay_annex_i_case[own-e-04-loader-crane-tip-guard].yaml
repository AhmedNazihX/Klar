- request:
    body: '{"input":["Instruct: Given a description of an AI system or a question
      about the EU AI Act, retrieve the article, Annex point or recital of the AI
      Act that governs it\nQuery:Wir bauen im Sauerland mit rund 250 Leuten Ladekrane,
      die auf Lkw montiert werden. F\u00fcr die neue Baureihe ersetzen wir die klassische
      Lastmomentbegrenzung durch ein lernendes Modell: Ein neuronales Netz wertet
      Hydraulikdr\u00fccke, Auslegerwinkel, St\u00fctzenstellung und das Einsinken
      der Abst\u00fctzung aus, sch\u00e4tzt laufend, wie nah der Kran am Kippen oder
      an einer \u00dcberlastung des Auslegers ist, und sperrt jede Bewegung, die ihn
      dar\u00fcber hinausbringen w\u00fcrde. Das Modell lernt im Betrieb nicht weiter,
      es wird nur \u00fcber gepr\u00fcfte Updates von uns ausgetauscht. Weil keine
      harmonisierte Norm eine solche KI-gest\u00fctzte Lastbegrenzung abdeckt, muss
      nach der Maschinenverordnung eine benannte Stelle die Konformit\u00e4t bewerten;
      der Termin beim Pr\u00fcfer steht schon. Ausgeliefert wird die Baureihe ab Februar
      2027, \u00fcbrigens mit einer neuen Funkfernsteuerung in Signalorange."],"model":"qwen/qwen3-embedding-8b","dimensions":1536,"encoding_format":"float","provider":{"allow_fallbacks":false,"data_collection":"deny","order":["nebius"],"zdr":true}}'
