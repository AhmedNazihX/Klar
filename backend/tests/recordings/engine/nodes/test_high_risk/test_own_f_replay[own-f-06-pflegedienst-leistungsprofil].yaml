- request:
    body: '{"input":["Instruct: Given a description of an AI system or a question
      about the EU AI Act, retrieve the article, Annex point or recital of the AI
      Act that governs it\nQuery:Wir sind ein ambulanter Pflegedienst in Hamburg mit
      rund 180 Pflegekr\u00e4ften. Ab Januar 2028 wollen wir f\u00fcr die j\u00e4hrlichen
      Mitarbeitergespr\u00e4che ein neues Zusatzmodul unserer Tourenplanungssoftware
      nutzen. Es wertet f\u00fcr jede Pflegekraft die Daten des vergangenen Jahres
      aus \u2013 Einsatzdauer im Vergleich zur Planzeit, Versp\u00e4tungen, Beschwerden
      von Angeh\u00f6rigen, Krankheitstage \u2013 und erstellt daraus ein Leistungsprofil
      mit einer vorgeschlagenen Einstufung von A bis D. Laut Anbieter dient das nur
      der Vorbereitung: Die Pflegedienstleitung f\u00fchrt das Gespr\u00e4ch und entscheidet
      selbst \u00fcber die Jahrespr\u00e4mie und eine m\u00f6gliche H\u00f6hergruppierung.
      In der Testphase hat sie die Einstufung meistens \u00fcbernommen. Die Software
      erstellt au\u00dferdem die Abrechnungen mit den Pflegekassen."],"model":"qwen/qwen3-embedding-8b","dimensions":1536,"encoding_format":"float","provider":{"allow_fallbacks":false,"data_collection":"deny","order":["nebius"],"zdr":true}}'
