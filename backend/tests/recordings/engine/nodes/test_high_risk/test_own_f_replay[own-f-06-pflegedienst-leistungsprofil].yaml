      die bestimmungsgem\u00e4\u00df als Sicherheitsbauteile im Rahmen der Verwaltung
      und des Betriebs kritischer digitaler Infrastruktur, des Stra\u00dfenverkehrs
      oder der Wasser-, Gas-, W\u00e4rme- oder Stromversorgung verwendet werden sollen\n[annex:III:3:a]
      KI-Systeme, die bestimmungsgem\u00e4\u00df zur Feststellung des Zugangs oder
      der Zulassung oder zur Zuweisung nat\u00fcrlicher Personen zu Einrichtungen
      aller Ebenen der allgemeinen und beruflichen Bildung verwendet werden sollen;\n[annex:III:3:b]
      KI-Systeme, die bestimmungsgem\u00e4\u00df f\u00fcr die Bewertung von Lernergebnissen
      verwendet werden sollen, einschlie\u00dflich des Falles, dass diese Ergebnisse
      dazu dienen, den Lernprozess nat\u00fcrlicher Personen in Einrichtungen oder
      Programmen aller Ebenen der allgemeinen und beruflichen Bildung zu steuern;\n[annex:III:3:c]
      KI-Systeme, die bestimmungsgem\u00e4\u00df zum Zweck der Bewertung des angemessenen
      Bildungsniveaus, das eine Person im Rahmen von oder innerhalb von Einrichtungen
      aller Ebenen der allgemeinen und beruflichen Bildung erhalten wird oder zu denen
      sie Zugang erhalten wird, verwendet werden sollen;\n[annex:III:3:d] KI-Systeme,
      die bestimmungsgem\u00e4\u00df zur \u00dcberwachung und Erkennung von verbotenem
      Verhalten von Sch\u00fclern bei Pr\u00fcfungen im Rahmen von oder innerhalb
      von Einrichtungen aller Ebenen der allgemeinen und beruflichen Bildung verwendet
      werden sollen.\n[annex:III:4:a] KI-Systeme, die bestimmungsgem\u00e4\u00df f\u00fcr
      die Einstellung oder Auswahl nat\u00fcrlicher Personen verwendet werden sollen,
      insbesondere um gezielte Stellenanzeigen zu schalten, Bewerbungen zu sichten
      oder zu filtern und Bewerber zu bewerten;\n[annex:III:4:b] KI-Systeme, die bestimmungsgem\u00e4\u00df
      f\u00fcr Entscheidungen, die die Bedingungen von Arbeitsverh\u00e4ltnissen,
      Bef\u00f6rderungen und K\u00fcndigungen von Arbeitsvertragsverh\u00e4ltnissen
      beeinflussen, f\u00fcr die Zuweisung von Aufgaben aufgrund des individuellen
      Verhaltens oder pers\u00f6nlicher Merkmale oder Eigenschaften oder f\u00fcr
      die Beobachtung und Bewertung der Leistung und des Verhaltens von Personen in
      solchen Besch\u00e4ftigungsverh\u00e4ltnissen verwendet werden soll.\n[annex:III:5:a]
      KI-Systeme, die bestimmungsgem\u00e4\u00df von Beh\u00f6rden oder im Namen von
      Beh\u00f6rden verwendet werden sollen, um zu beurteilen, ob nat\u00fcrliche
      Personen Anspruch auf grundlegende \u00f6ffentliche Unterst\u00fctzungsleistungen
      und -dienste, einschlie\u00dflich Gesundheitsdiensten, haben und ob solche Leistungen
      und Dienste zu gew\u00e4hren, einzuschr\u00e4nken, zu widerrufen oder zur\u00fcckzufordern
      sind;\n[annex:III:5:b] KI-Systeme, die bestimmungsgem\u00e4\u00df f\u00fcr die
      Kreditw\u00fcrdigkeitspr\u00fcfung und Bonit\u00e4tsbewertung nat\u00fcrlicher
      Personen verwendet werden sollen, mit Ausnahme von KI-Systemen, die zur Aufdeckung
      von Finanzbetrug verwendet werden;\n[annex:III:5:c] KI-Systeme, die bestimmungsgem\u00e4\u00df
      f\u00fcr die Risikobewertung und Preisbildung in Bezug auf nat\u00fcrliche Personen
      im Fall von Lebens- und Krankenversicherungen verwendet werden sollen;\n[annex:III:5:d]
      KI-Systeme, die bestimmungsgem\u00e4\u00df zur Bewertung und Klassifizierung
      von Notrufen von nat\u00fcrlichen Personen oder f\u00fcr die Entsendung oder
      Priorisierung des Einsatzes von Not- und Rettungsdiensten, einschlie\u00dflich
      Polizei, Feuerwehr und medizinischer Nothilfe, sowie f\u00fcr Systeme f\u00fcr
      die Triage von Patienten bei der Notfallversorgung verwendet werden sollen.\n[annex:III:6:a]
      KI-Systeme, die bestimmungsgem\u00e4\u00df von Strafverfolgungsbeh\u00f6rden
      oder in deren Namen oder von Organen, Einrichtungen und sonstigen Stellen der
      Union zur Unterst\u00fctzung von Strafverfolgungsbeh\u00f6rden oder in deren
      Namen zur Bewertung des Risikos einer nat\u00fcrlichen Person, zum Opfer von
      Straftaten zu werden, verwendet werden sollen;\n[annex:III:6:b] KI-Systeme,
      die bestimmungsgem\u00e4\u00df von Strafverfolgungsbeh\u00f6rden oder in deren
      Namen oder von Organen, Einrichtungen und sonstigen Stellen der Union zur Unterst\u00fctzung
      von Strafverfolgungsbeh\u00f6rden als L\u00fcgendetektoren oder \u00e4hnliche
      Instrumente verwendet werden sollen;\n[annex:III:6:c] KI-Systeme, die bestimmungsgem\u00e4\u00df
      von Strafverfolgungsbeh\u00f6rden oder in deren Namen oder von Organen, Einrichtungen
      und sonstigen Stellen der Union zur Unterst\u00fctzung von Strafverfolgungsbeh\u00f6rden
      zur Bewertung der Verl\u00e4sslichkeit von Beweismitteln im Zuge der Ermittlung
      oder Verfolgung von Straftaten verwendet werden sollen;\n[annex:III:6:d] KI-Systeme,
      die bestimmungsgem\u00e4\u00df von Strafverfolgungsbeh\u00f6rden oder in deren
      Namen oder von Organen, Einrichtungen und sonstigen Stellen der Union zur Unterst\u00fctzung
      von Strafverfolgungsbeh\u00f6rden zur Bewertung des Risikos, dass eine nat\u00fcrliche
      Person eine Straftat begeht oder erneut begeht, nicht nur auf der Grundlage
      der Erstellung von Profilen nat\u00fcrlicher Personen gem\u00e4\u00df Artikel
      3 Absatz 4 der Richtlinie (EU) 2016/680 oder zur Bewertung pers\u00f6nlicher
      Merkmale und Eigenschaften oder vergangenen kriminellen Verhaltens von nat\u00fcrlichen
      Personen oder Gruppen verwendet werden sollen;\n[annex:III:6:e] KI-Systeme,
      die bestimmungsgem\u00e4\u00df von Strafverfolgungsbeh\u00f6rden oder in deren
      Namen oder von Organen, Einrichtungen und sonstigen Stellen der Union zur Unterst\u00fctzung
      von Strafverfolgungsbeh\u00f6rden zur Erstellung von Profilen nat\u00fcrlicher
      Personen gem\u00e4\u00df Artikel 3 Absatz 4 der Richtlinie (EU) 2016/680 im
      Zuge der Aufdeckung, Ermittlung oder Verfolgung von Straftaten verwendet werden
      sollen.\n[annex:III:7:a] KI-Systeme, die bestimmungsgem\u00e4\u00df von zust\u00e4ndigen
      Beh\u00f6rden oder in deren Namen oder Organen, Einrichtungen und sonstigen
      Stellen der Union als L\u00fcgendetektoren verwendet werden sollen oder \u00e4hnliche
      Instrumente;\n[annex:III:7:b] KI-Systeme, die bestimmungsgem\u00e4\u00df von
      zust\u00e4ndigen Beh\u00f6rden oder in deren Namen oder von Organen, Einrichtungen
      und sonstigen Stellen der Union zur Bewertung eines Risikos verwendet werden
      sollen, einschlie\u00dflich eines Sicherheitsrisikos, eines Risikos der irregul\u00e4ren
      Einwanderung oder eines Gesundheitsrisikos, das von einer nat\u00fcrlichen Person
      ausgeht, die in das Hoheitsgebiet eines Mitgliedstaats einzureisen beabsichtigt
      oder eingereist ist;\n[annex:III:7:c] KI-Systeme, die bestimmungsgem\u00e4\u00df
      von zust\u00e4ndigen Beh\u00f6rden oder in deren Namen oder von Organen, Einrichtungen
      und sonstigen Stellen der Union verwendet werden sollen, um zust\u00e4ndige
      Beh\u00f6rden bei der Pr\u00fcfung von Asyl- und Visumantr\u00e4gen sowie Aufenthaltstiteln
      und damit verbundenen Beschwerden im Hinblick auf die Feststellung der Berechtigung
      der den Antrag stellenden nat\u00fcrlichen Personen, einschlie\u00dflich damit
      zusammenh\u00e4ngender Bewertungen der Verl\u00e4sslichkeit von Beweismitteln,
      zu unterst\u00fctzen;\n[annex:III:7:d] KI-Systeme, die bestimmungsgem\u00e4\u00df
      von oder im Namen der zust\u00e4ndigen Beh\u00f6rden oder Organen, Einrichtungen
      und sonstigen Stellen der Union, im Zusammenhang mit Migration, Asyl oder Grenzkontrolle
      zum Zwecke der Aufdeckung, Anerkennung oder Identifizierung nat\u00fcrlicher
      Personen verwendet werden sollen, mit Ausnahme der \u00dcberpr\u00fcfung von
      Reisedokumenten.\n[annex:III:8:a] KI-Systeme, die bestimmungsgem\u00e4\u00df
      von einer oder im Namen einer Justizbeh\u00f6rde verwendet werden sollen, um
      eine Justizbeh\u00f6rde bei der Ermittlung und Auslegung von Sachverhalten und
      Rechtsvorschriften und bei der Anwendung des Rechts auf konkrete Sachverhalte
      zu unterst\u00fctzen, oder die auf \u00e4hnliche Weise f\u00fcr die alternative
      Streitbeilegung genutzt werden sollen;\n[annex:III:8:b] KI-Systeme, die bestimmungsgem\u00e4\u00df
      verwendet werden sollen, um das Ergebnis einer Wahl oder eines Referendums oder
      das Wahlverhalten nat\u00fcrlicher Personen bei der Aus\u00fcbung ihres Wahlrechts
      bei einer Wahl oder einem Referendum zu beeinflussen. Dazu geh\u00f6ren nicht
      KI-Systeme, deren Ausgaben nat\u00fcrliche Personen nicht direkt ausgesetzt
      sind, wie Instrumente zur Organisation, Optimierung oder Strukturierung politischer
      Kampagnen in administrativer oder logistischer Hinsicht.\n\nGuideline passages
      and examples found:\n[guide:guide-prohibited:para:166] (Szenario 1: Schlechterstellung
      oder Benachteiligung in sozialen Kontexten, die in keinem Zusammenhang miteinander
      stehen)\n(166) Im ersten in Artikel 5 Absatz 1 Buchstabe c Ziffer i der KI-Verordnung
      beschriebenen Szenario muss die aus der Bewertung resultierende Schlechterstellung
      oder Benachteiligung in sozialen Kontexten stattfinden, die in keinem Zusammenhang
      zu den Umst\u00e4nden stehen, unter denen die Daten urspr\u00fcnglich erzeugt
      oder erhoben wurden. Dies beinhaltet nicht nur, dass die Personen aufgrund der
      sozialen Bewertung vielleicht benachteiligt oder schlechter gestellt werden,
      sondern auch, dass die Daten \u00fcber ihr soziales Verhalten oder ihre bekannten,
      abgeleiteten oder vorhergesagten pers\u00f6nlichen Eigenschaften oder Pers\u00f6nlichkeitsmerkmale
      in sozialen Kontexten erzeugt oder erhoben wurden, die in keinem Zusammenhang
      mit dem Kontext stehen, in dem die Bewertung stattfindet. Die in diesen (nicht
      mit dem Kontext der Datenerhebung zusammenh\u00e4ngenden) Kontexten erhobenen
      oder erzeugten Daten m\u00fcssen anschlie\u00dfend vom KI-System f\u00fcr die
      Bewertung der Personen verwendet werden, ohne dass ein offensichtlicher Zusammenhang
      zu dem Zweck der Bewertung oder Einstufung besteht, oder sie m\u00fcssen in
      einer Weise verwendet werden, die zu einer allgemeinen \u00dcberwachung der
      Personen oder Gruppen von Personen f\u00fchrt. In den meisten F\u00e4llen geschieht
      dies gegen die berechtigten Erwartungen der Personen und unter Verletzung des
      Datenschutzrechts der Union und m\u00f6glicherweise anderer geltender Vorschriften,
      in denen die Arten von Daten und Quellen festgelegt sind, die als f\u00fcr die
      Bewertung oder Einstufung relevant und notwendig erachtet werden. Ob diese Bedingung
      erf\u00fcllt ist, ist mittels einer Einzelfallpr\u00fcfung unter Ber\u00fccksichtigung
      des Zwecks der Bewertung und der Zusammenh\u00e4nge, in denen die Daten erhoben
      und erzeugt wurden, zu ermitteln.\n\n121 Erw\u00e4gungsgrund 31 der KI-Verordnung.\n\nBeispiele
      f\u00fcr nach Artikel 5 Absatz 1 Buchstabe c Ziffer i der KI-Verordnung verbotene
      Schlechterstellungen oder Benachteiligungen in nicht miteinander zusammenh\u00e4ngenden
      sozialen Zusammenh\u00e4ngen:\n\n- Die nationalen Steuerbeh\u00f6rden setzen
      bei allen Steuererkl\u00e4rungen in einem Land ein KI-Prognoseinstrument ein,
      um Steuererkl\u00e4rungen f\u00fcr genauere Kontrollen auszuw\u00e4hlen. Um
      bestimmte Personen f\u00fcr Kontrollen auszuw\u00e4hlen, verwendet das KI-Tool
      relevante Variablen wie Jahreseinkommen, Verm\u00f6genswerte (Immobilien, Kraftfahrzeuge
      usw.) sowie Daten \u00fcber Familienangeh\u00f6rige von Beg\u00fcnstigten, aber
      auch Daten wie soziale Gewohnheiten der Steuerzahler oder Internetverbindungen,
      die damit nicht zusammenh\u00e4ngen.\n\n- Ein Sozialamt verwendet zur Sch\u00e4tzung
      der Betrugswahrscheinlichkeit bei Empf\u00e4ngern von Haushaltszulagen ein KI-System,
      das sich auf Merkmale st\u00fctzt, die in sozialen Kontexten ohne offensichtlichen
      Zusammenhang mit oder Relevanz f\u00fcr die Bewertung von Betrug erhoben oder
      abgeleitet werden, wie z. B. ein Ehepartner mit einer bestimmten Staatsangeh\u00f6rigkeit
      oder ethnischen Herkunft, der Besitz eines Internetanschlusses, das Verhalten
      auf sozialen Plattformen oder die Leistung am Arbeitsplatz usw. 122 Im Gegensatz
      dazu k\u00f6nnten Daten, die f\u00fcr die Zuweisung der Leistungen relevant
      sind und rechtm\u00e4\u00dfig erhoben wurden, zur Ermittlung des Betrugsrisikos
      herangezogen werden, da Beh\u00f6rden mit der \u00dcberpr\u00fcfung, ob Sozialleistungen
      korrekt zugewiesen werden, ein legitimes Ziel verfolgen.\n\n- Eine \u00f6ffentliche
      Arbeitsagentur nutzt ein KI-System, um Arbeitslose auf der Grundlage eines Interviews
      und einer KI-gest\u00fctzten Bewertung einzustufen und auf diese Weise festzustellen,
      ob eine Person staatliche Besch\u00e4ftigungsf\u00f6rderung erhalten sollte.
      Diese Bewertung beruht auf relevanten pers\u00f6nlichen Eigenschaften wie Alter
      und Bildung, aber auch auf Variablen, die aus Daten und Kontexten ohne erkennbaren
      Zusammenhang mit dem Zweck der Bewertung erhoben oder abgeleitet wurden, wie
      z. B. Familienstand, Gesundheitsdaten \u00fcber chronische Krankheiten, Sucht
      usw. 123\n\nDiese inakzeptablen Bewertungspraktiken lassen sich von rechtm\u00e4\u00dfigen
      Praktiken unterscheiden, bei denen im Einklang mit Unionsrecht und nationalem
      Recht Personen f\u00fcr einen besti [\u2026]\n\n[guide:guide-prohibited:para:154]
      (4.2.1. \"Soziale Bewertung\": Bewertung oder Einstufung auf der Grundlage des
      sozialen Verhaltens bzw. pers\u00f6nlicher Eigenschaften oder Pers\u00f6nlichkeitsmerkmale
      \u00fcber einen bestimmten Zeitraum \u203a a) Bewertung oder Einstufung nat\u00fcrlicher
      Personen oder Gruppen von Personen)\n(154) Der Begriff \"Bewertung\" bezieht
      sich auch auf das Konzept des Profiling, das durch die Datenschutz-Gesetzgebung
      der Union 109 geregelt wird und eine besondere Form der Evaluierung darstellt.
      In Artikel 5 Absatz 1 Buchstabe c der KI-Verordnung wird zwar nicht unmittelbar
      auf dieses Konzept oder diese Rechtsvorschriften 110 Bezug genommen, doch k\u00f6nnen
      sie auch f\u00fcr das in dieser Bestimmung enthaltene Verbot sowie f\u00fcr
      andere Verbote in der KI-Verordnung 111 ma\u00dfgeblich sein, wenn die Bewertung
      automatisch durch ein KI-System auf der Grundlage personenbezogener Daten erfolgt.
      Profiling bezeichnet die Nutzung von Informationen \u00fcber eine Einzelperson
      (oder eine Gruppe von Einzelpersonen) und die Bewertung ihrer Merkmale oder
      Verhaltensmuster, um sie in eine bestimmte Kategorie oder Gruppe einzuordnen,
      um beispielsweise ihre F\u00e4higkeit zur Erf\u00fcllung einer Aufgabe, ihre
      Interessen oder m\u00f6gliches Verhalten zu analysieren und/oder vorherzusagen
      112 . Nach EU-Datenschutzrecht kann das Profiling nat\u00fcrlicher Personen,
      wenn es durch KISysteme durchgef\u00fchrt wird, daher auch unter Artikel 5 Absatz
      1 Buchstabe c der KIVerordnung fallen.\n\n108 Artikel-29-Datenschutzgruppe,
      Leitlinien zu automatisierten Entscheidungen im Einzelfall einschlie\u00dflich
      Profiling f\u00fcr die Zwecke der Verordnung (EU) 2016/679, WP251rev.01, 6.2.2018,
      S. 7.\n\n109 Siehe Artikel 4 Absatz 4 und Artikel 22 DSGVO sowie Artikel 11
      der Richtlinie zum Datenschutz bei der Strafverfolgung. Siehe auch Artikel-29-Datenschutzgruppe,
      Leitlinien zu automatisierten Entscheidungen im Einzelfall einschlie\u00dflich
      Profiling f\u00fcr die Zwecke der Verordnung (EU) 2016/679, WP251rev.01, 6.2.2018,
      S. 7.\n\n110 Artikel 3 Nummer 52 der KI-Verordnung enth\u00e4lt eine Definition
      des Begriffs \"Profiling\", die auf die Begriffsbestimmung in Artikel 4 Nummer
      4 DSGVO verweist.\n\nBeispielsweise pr\u00fcfte der EuGH in seinem Urteil SCHUFA
      I ein in Deutschland verwendetes Bewertungssystem zur Pr\u00fcfung der Kreditw\u00fcrdigkeit
      nach Punkten 113 . In diesem Fall war die vom Computerprogramm generierte \"Punktzahl\"
      (Score) ein \"Wahrscheinlichkeitswert\" hinsichtlich der F\u00e4higkeit einer
      Person, Zahlungsverpflichtungen zu erf\u00fcllen; dies wurde vom EuGH als \"Profiling\"
      eingestuft. Konkret prognostizierte das System aus bestimmten Merkmalen einer
      Person \u2026 f\u00fcr diese die Wahrscheinlichkeit eines k\u00fcnftigen Verhaltens
      (\"Score-Wert\"), wie beispielsweise die R\u00fcckzahlung eines Kredits. Die
      Erstellung von Score-Werten (\"Scoring\") basiert auf der Annahme, dass durch
      die Zuordnung einer Person zu einer Gruppe anderer Personen mit vergleichbaren
      Merkmalen, die sich in einer bestimmten Weise verhalten haben, ein \u00e4hnliches
      Verhalten vorausgesagt werden kann 114 . Nach Auffassung des EuGH entsprach
      diese T\u00e4tigkeit der Definition des Begriffs \"Profiling\" im Sinne von
      Artikel 4 Absatz 4 DSGVO 115 . Diese Form des Profiling kann auch als Bewertung
      von Personen auf der Grundlage ihrer pers\u00f6nlichen Merkmale im Sinne von
      Artikel 5 Absatz 1 Buchstabe c der KI-Verordnung betrachtet werden, die dann
      verboten ist, wenn sie mit KI-Systemen durchgef\u00fchrt wird und die anderen
      Bedingungen f\u00fcr die Anwendung dieser Bestimmung erf\u00fcllt sind.\n\n[guide:guide-prohibited:para:177]
      (4.3. Au\u00dferhalb des Anwendungsbereichs)\n(177) Werden sektorspezifische
      Rechtsvorschriften der Union eingehalten, beispielsweise im Bereich der Bonit\u00e4tsbewertung,
      der Bek\u00e4mpfung von Geldw\u00e4sche usw., in denen festgelegt ist, welche
      Art von Daten f\u00fcr den spezifischen legitimen Zweck der Bewertung als relevant
      und erforderlich verwendet werden k\u00f6nnen, und mit denen sichergestellt
      wird, dass die Behandlung gerechtfertigt ist und in einem angemessenen Verh\u00e4ltnis
      zum sozialen Verhalten steht, kann somit sichergestellt werden, dass die betreffende
      KI-Praxis nicht in den Anwendungsbereich des Verbots nach Artikel 5 Absatz 1
      Buchstabe c der KI-Verordnung f\u00e4llt.\n\nBeispiele f\u00fcr rechtm\u00e4\u00dfige
      Bewertungspraktiken, die im Einklang mit Unionsrecht und nationalem Recht stehen
      und nicht in den Anwendungsbereich von Artikel 5 Absatz 1 Buchstabe c der KI-Verordnung
      fallen:\n\n- Nicht in den Anwendungsbereich von Artikel 5 Absatz 1 Buchstabe
      c der KIVerordnung fallen Systeme zur finanziellen Bonit\u00e4tsbewertung, die
      von Kreditgebern oder Wirtschaftsauskunfteien zur Bewertung der finanziellen
      Kreditw\u00fcrdigkeit oder ausstehender Verbindlichkeiten eines Kunden genutzt
      werden, um eine Einstufung der Bonit\u00e4t oder Feststellung seiner Kreditw\u00fcrdigkeit
      vorzunehmen, wobei sie sich auf die Einnahmen und Ausgaben des Kunden und andere
      finanzielle und wirtschaftliche Umst\u00e4nde st\u00fctzen, sofern diese f\u00fcr
      den rechtm\u00e4\u00dfigen Zweck der Bonit\u00e4tsbewertung relevant sind und
      im Einklang mit Verbraucherschutzgesetzen 126 stehen, in denen die Art der Daten
      und die erforderlichen Schutzvorkehrungen festgelegt sind, um die faire Behandlung
      von Verbrauchern bei Kreditw\u00fcrdigkeitspr\u00fcfungen zu gew\u00e4hrleisten.\n\n-
      Unternehmen haben ein berechtigtes Interesse daran, Kunden im Hinblick auf Finanzbetrug
      zu bewerten; diese Praktiken werden von dem Verbot nicht ber\u00fchrt, wenn
      die Bewertung auf relevanten Daten wie dem Transaktionsverhalten und Metadaten
      im Zusammenhang mit den Dienstleistungen, dem bisherigen Verhalten und anderen
      Faktoren beruht, die aus f\u00fcr die Ermittlung des Betrugsrisikos objektiv
      relevanten Quellen stammen und wenn die Schlechterstellung aufgrund dessen,
      dass sie eine Folge des betr\u00fcgerischen Verhaltens ist, gerechtfertigt und
      verh\u00e4ltnism\u00e4\u00dfig ist.\n\n- \u00dcber Telematikger\u00e4te erhobene
      Informationen, die zeigen, dass ein Fahrer zu schnell f\u00e4hrt oder keine
      sichere Fahrweise pflegt, und die von einem Versicherer, der telematikgest\u00fctzte
      Versicherungstarife f\u00fcr das hochriskante Fahrverhalten eines Versicherungsnehmers
      anbietet, genutzt werden, k\u00f6nnen zu einer Erh\u00f6hung der Versicherungspr\u00e4mien
      f\u00fcr den betreffenden Versicherungsnehmer genutzt und mit der durch dieses
      Fahrverhalten erh\u00f6hten Unfallgefahr begr\u00fcndet werden, sofern die Erh\u00f6hung
      der Versicherungspr\u00e4mie in einem angemessenen Verh\u00e4ltnis zum risikobehafteten
      Verhalten des Fahrers steht.\n\n- Die Erhebung und Verarbeitung von Daten, die
      f\u00fcr den rechtm\u00e4\u00dfigen Zweck von KISystemen relevant und erforderlich
      sind (z. B. gesundheits- und Schizophrenie bezogene Daten, die aus verschiedenen
      Quellen erhoben werden, um f\u00fcr Patienten Diagnosen zu erstellen), f\u00e4llt
      insbesondere deshalb nicht in den Anwendungsbereich von Artikel 5 Absatz 1 Buchstabe
      c der KI-Verordnung, weil sie relevante und notwendige Daten verarbeitet und
