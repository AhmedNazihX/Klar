    body: '{"input":["Instruct: Given a description of an AI system or a question
      about the EU AI Act, retrieve the article, Annex point or recital of the AI
      Act that governs it\nQuery:Wir sind ein Digital-Health-Unternehmen aus Hamburg
      mit 45 Besch\u00e4ftigten. Unsere App liest die Pulsdaten g\u00e4ngiger Smartwatches
      aus, und ein selbst trainiertes Modell sucht darin nach Mustern, die auf Vorhofflimmern
      hindeuten k\u00f6nnen. Findet es welche, erscheint der Hinweis, das \u00e4rztlich
      abkl\u00e4ren zu lassen. Ob wir die App als Medizinprodukt zertifizieren lassen
      oder als Fitness-Funktion ohne medizinische Zweckbestimmung anbieten, ist intern
      noch nicht entschieden; davon h\u00e4ngen Marketingtexte und Zulassungsweg ab.
      Der Marktstart ist f\u00fcr Herbst 2028 geplant, zun\u00e4chst in Deutschland.
      Au\u00dferdem arbeiten wir gerade an einer Funktion f\u00fcr Schlaftracking."],"model":"qwen/qwen3-embedding-8b","dimensions":1536,"encoding_format":"float","provider":{"allow_fallbacks":false,"data_collection":"deny","order":["nebius"],"zdr":true}}'
