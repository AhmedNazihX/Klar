      die bestimmungsgem\u00e4\u00df als Sicherheitsbauteile im Rahmen der Verwaltung
      und des Betriebs kritischer digitaler Infrastruktur, des Stra\u00dfenverkehrs
      oder der Wasser-, Gas-, W\u00e4rme- oder Stromversorgung verwendet werden sollen\n[annex:III:3:a]
      KI-Systeme, die bestimmungsgem\u00e4\u00df zur Feststellung des Zugangs oder
      der Zulassung oder zur Zuweisung nat\u00fcrlicher Personen zu Einrichtungen
      aller Ebenen der allgemeinen und beruflichen Bildung verwendet werden sollen;\n[annex:III:3:b]
      KI-Systeme, die bestimmungsgem\u00e4\u00df f\u00fcr die Bewertung von Lernergebnissen
      verwendet werden sollen, einschlie\u00dflich des Falles, dass diese Ergebnisse
      dazu dienen, den Lernprozess nat\u00fcrlicher Personen in Einrichtungen oder
      Programmen aller Ebenen der allgemeinen und beruflichen Bildung zu steuern;\n[annex:III:3:c]
      KI-Systeme, die bestimmungsgem\u00e4\u00df zum Zweck der Bewertung des angemessenen
      Bildungsniveaus, das eine Person im Rahmen von oder innerhalb von Einrichtungen
      aller Ebenen der allgemeinen und beruflichen Bildung erhalten wird oder zu denen
      sie Zugang erhalten wird, verwendet werden sollen;\n[annex:III:3:d] KI-Systeme,
      die bestimmungsgem\u00e4\u00df zur \u00dcberwachung und Erkennung von verbotenem
      Verhalten von Sch\u00fclern bei Pr\u00fcfungen im Rahmen von oder innerhalb
      von Einrichtungen aller Ebenen der allgemeinen und beruflichen Bildung verwendet
      werden sollen.\n[annex:III:4:a] KI-Systeme, die bestimmungsgem\u00e4\u00df f\u00fcr
      die Einstellung oder Auswahl nat\u00fcrlicher Personen verwendet werden sollen,
      insbesondere um gezielte Stellenanzeigen zu schalten, Bewerbungen zu sichten
      oder zu filtern und Bewerber zu bewerten;\n[annex:III:4:b] KI-Systeme, die bestimmungsgem\u00e4\u00df
      f\u00fcr Entscheidungen, die die Bedingungen von Arbeitsverh\u00e4ltnissen,
      Bef\u00f6rderungen und K\u00fcndigungen von Arbeitsvertragsverh\u00e4ltnissen
      beeinflussen, f\u00fcr die Zuweisung von Aufgaben aufgrund des individuellen
      Verhaltens oder pers\u00f6nlicher Merkmale oder Eigenschaften oder f\u00fcr
      die Beobachtung und Bewertung der Leistung und des Verhaltens von Personen in
      solchen Besch\u00e4ftigungsverh\u00e4ltnissen verwendet werden soll.\n[annex:III:5:a]
      KI-Systeme, die bestimmungsgem\u00e4\u00df von Beh\u00f6rden oder im Namen von
      Beh\u00f6rden verwendet werden sollen, um zu beurteilen, ob nat\u00fcrliche
      Personen Anspruch auf grundlegende \u00f6ffentliche Unterst\u00fctzungsleistungen
      und -dienste, einschlie\u00dflich Gesundheitsdiensten, haben und ob solche Leistungen
      und Dienste zu gew\u00e4hren, einzuschr\u00e4nken, zu widerrufen oder zur\u00fcckzufordern
      sind;\n[annex:III:5:b] KI-Systeme, die bestimmungsgem\u00e4\u00df f\u00fcr die
      Kreditw\u00fcrdigkeitspr\u00fcfung und Bonit\u00e4tsbewertung nat\u00fcrlicher
      Personen verwendet werden sollen, mit Ausnahme von KI-Systemen, die zur Aufdeckung
      von Finanzbetrug verwendet werden;\n[annex:III:5:c] KI-Systeme, die bestimmungsgem\u00e4\u00df
      f\u00fcr die Risikobewertung und Preisbildung in Bezug auf nat\u00fcrliche Personen
      im Fall von Lebens- und Krankenversicherungen verwendet werden sollen;\n[annex:III:5:d]
      KI-Systeme, die bestimmungsgem\u00e4\u00df zur Bewertung und Klassifizierung
      von Notrufen von nat\u00fcrlichen Personen oder f\u00fcr die Entsendung oder
      Priorisierung des Einsatzes von Not- und Rettungsdiensten, einschlie\u00dflich
      Polizei, Feuerwehr und medizinischer Nothilfe, sowie f\u00fcr Systeme f\u00fcr
      die Triage von Patienten bei der Notfallversorgung verwendet werden sollen.\n[annex:III:6:a]
      KI-Systeme, die bestimmungsgem\u00e4\u00df von Strafverfolgungsbeh\u00f6rden
      oder in deren Namen oder von Organen, Einrichtungen und sonstigen Stellen der
      Union zur Unterst\u00fctzung von Strafverfolgungsbeh\u00f6rden oder in deren
      Namen zur Bewertung des Risikos einer nat\u00fcrlichen Person, zum Opfer von
      Straftaten zu werden, verwendet werden sollen;\n[annex:III:6:b] KI-Systeme,
      die bestimmungsgem\u00e4\u00df von Strafverfolgungsbeh\u00f6rden oder in deren
      Namen oder von Organen, Einrichtungen und sonstigen Stellen der Union zur Unterst\u00fctzung
      von Strafverfolgungsbeh\u00f6rden als L\u00fcgendetektoren oder \u00e4hnliche
      Instrumente verwendet werden sollen;\n[annex:III:6:c] KI-Systeme, die bestimmungsgem\u00e4\u00df
      von Strafverfolgungsbeh\u00f6rden oder in deren Namen oder von Organen, Einrichtungen
      und sonstigen Stellen der Union zur Unterst\u00fctzung von Strafverfolgungsbeh\u00f6rden
      zur Bewertung der Verl\u00e4sslichkeit von Beweismitteln im Zuge der Ermittlung
      oder Verfolgung von Straftaten verwendet werden sollen;\n[annex:III:6:d] KI-Systeme,
      die bestimmungsgem\u00e4\u00df von Strafverfolgungsbeh\u00f6rden oder in deren
      Namen oder von Organen, Einrichtungen und sonstigen Stellen der Union zur Unterst\u00fctzung
      von Strafverfolgungsbeh\u00f6rden zur Bewertung des Risikos, dass eine nat\u00fcrliche
      Person eine Straftat begeht oder erneut begeht, nicht nur auf der Grundlage
      der Erstellung von Profilen nat\u00fcrlicher Personen gem\u00e4\u00df Artikel
      3 Absatz 4 der Richtlinie (EU) 2016/680 oder zur Bewertung pers\u00f6nlicher
      Merkmale und Eigenschaften oder vergangenen kriminellen Verhaltens von nat\u00fcrlichen
      Personen oder Gruppen verwendet werden sollen;\n[annex:III:6:e] KI-Systeme,
      die bestimmungsgem\u00e4\u00df von Strafverfolgungsbeh\u00f6rden oder in deren
      Namen oder von Organen, Einrichtungen und sonstigen Stellen der Union zur Unterst\u00fctzung
      von Strafverfolgungsbeh\u00f6rden zur Erstellung von Profilen nat\u00fcrlicher
      Personen gem\u00e4\u00df Artikel 3 Absatz 4 der Richtlinie (EU) 2016/680 im
      Zuge der Aufdeckung, Ermittlung oder Verfolgung von Straftaten verwendet werden
      sollen.\n[annex:III:7:a] KI-Systeme, die bestimmungsgem\u00e4\u00df von zust\u00e4ndigen
      Beh\u00f6rden oder in deren Namen oder Organen, Einrichtungen und sonstigen
      Stellen der Union als L\u00fcgendetektoren verwendet werden sollen oder \u00e4hnliche
      Instrumente;\n[annex:III:7:b] KI-Systeme, die bestimmungsgem\u00e4\u00df von
      zust\u00e4ndigen Beh\u00f6rden oder in deren Namen oder von Organen, Einrichtungen
      und sonstigen Stellen der Union zur Bewertung eines Risikos verwendet werden
      sollen, einschlie\u00dflich eines Sicherheitsrisikos, eines Risikos der irregul\u00e4ren
      Einwanderung oder eines Gesundheitsrisikos, das von einer nat\u00fcrlichen Person
      ausgeht, die in das Hoheitsgebiet eines Mitgliedstaats einzureisen beabsichtigt
      oder eingereist ist;\n[annex:III:7:c] KI-Systeme, die bestimmungsgem\u00e4\u00df
      von zust\u00e4ndigen Beh\u00f6rden oder in deren Namen oder von Organen, Einrichtungen
      und sonstigen Stellen der Union verwendet werden sollen, um zust\u00e4ndige
      Beh\u00f6rden bei der Pr\u00fcfung von Asyl- und Visumantr\u00e4gen sowie Aufenthaltstiteln
      und damit verbundenen Beschwerden im Hinblick auf die Feststellung der Berechtigung
      der den Antrag stellenden nat\u00fcrlichen Personen, einschlie\u00dflich damit
      zusammenh\u00e4ngender Bewertungen der Verl\u00e4sslichkeit von Beweismitteln,
      zu unterst\u00fctzen;\n[annex:III:7:d] KI-Systeme, die bestimmungsgem\u00e4\u00df
      von oder im Namen der zust\u00e4ndigen Beh\u00f6rden oder Organen, Einrichtungen
      und sonstigen Stellen der Union, im Zusammenhang mit Migration, Asyl oder Grenzkontrolle
      zum Zwecke der Aufdeckung, Anerkennung oder Identifizierung nat\u00fcrlicher
      Personen verwendet werden sollen, mit Ausnahme der \u00dcberpr\u00fcfung von
      Reisedokumenten.\n[annex:III:8:a] KI-Systeme, die bestimmungsgem\u00e4\u00df
      von einer oder im Namen einer Justizbeh\u00f6rde verwendet werden sollen, um
      eine Justizbeh\u00f6rde bei der Ermittlung und Auslegung von Sachverhalten und
      Rechtsvorschriften und bei der Anwendung des Rechts auf konkrete Sachverhalte
      zu unterst\u00fctzen, oder die auf \u00e4hnliche Weise f\u00fcr die alternative
      Streitbeilegung genutzt werden sollen;\n[annex:III:8:b] KI-Systeme, die bestimmungsgem\u00e4\u00df
      verwendet werden sollen, um das Ergebnis einer Wahl oder eines Referendums oder
      das Wahlverhalten nat\u00fcrlicher Personen bei der Aus\u00fcbung ihres Wahlrechts
      bei einer Wahl oder einem Referendum zu beeinflussen. Dazu geh\u00f6ren nicht
      KI-Systeme, deren Ausgaben nat\u00fcrliche Personen nicht direkt ausgesetzt
      sind, wie Instrumente zur Organisation, Optimierung oder Strukturierung politischer
      Kampagnen in administrativer oder logistischer Hinsicht.\n\nGuideline passages
      and examples found:\n[guide:guide-prohibited:para:47] (2.8. Zusammenspiel zwischen
      den Verboten und anderen Rechtsvorschriften der Union)\n(47) Nach Artikel 2
      Absatz 9 der KI-Verordnung gelten die Verbraucherschutzund -Sicherheitsvorschriften
      der EU auch weiterhin uneingeschr\u00e4nkt f\u00fcr KI-Systeme, die in den Anwendungsbereich
      der genannten Rechtsakte fallen.\n\nBeispiele:\n\n- Die von Gewerbetreibenden
      (einschlie\u00dflich nat\u00fcrlicher Personen, die in beruflicher Eigenschaft
      in Beziehungen zwischen Unternehmen und Verbrauchern t\u00e4tig sind) zur sozialen
      Bewertung ausge\u00fcbten Praktiken k\u00f6nnen vorbehaltlich einer Einzelfallpr\u00fcfung
      ebenfalls als \"unlauter\" und somit als Versto\u00df gegen das Verbraucherrecht
      (d. h. die Richtlinie 2005/29/EG) angesehen werden;\n\n- Die Verwendung eines
      KI-Systems zur Ableitung von Emotionen muss m\u00f6glicherweise auch der Verordnung
      (EU) 2017/745 (Verordnung \u00fcber Medizinprodukte) entsprechen, wenn das KI-System
      f\u00fcr Zwecke der medizinischen Diagnose oder Behandlung verwendet wird.\n\n[guide:guide-prohibited:para:257]
      (7.2.3. Ausnahmen aus medizinischen Gr\u00fcnden und Sicherheitsgr\u00fcnden)\n(257)
      Unter therapeutischen Zwecken ist insbesondere die Verwendung von Medizinprodukten
      mit CE-Zeichen zu verstehen. Dar\u00fcber hinaus umfasst diese Ausnahme nicht
      den Einsatz von Emotionserkennungssystemen zur Erkennung allgemeiner Aspekte
      des Wohlbefindens. Die allgemeine \u00dcberwachung des Stressniveaus am Arbeitsplatz
      ist unter Gesundheits- oder Sicherheitsaspekten nicht zul\u00e4ssig. So w\u00fcrde
      beispielsweise ein KI-System, das dazu bestimmt ist, Burnout oder Depressionen
      am Arbeitsplatz oder in Bildungseinrichtungen zu erkennen, nicht unter die Ausnahme
      fallen und weiterhin verboten bleiben.\n\n[guide:guide-prohibited:para:144]
      (3.6. Zusammenspiel mit anderen Rechtsvorschriften der Union)\n(144) Auch ber\u00fchren
      die Verbote in Artikel 5 Absatz 1 Buchstaben a und b der KIVerordnung nicht
      die EU-Produktsicherheitsvorschriften (z. B. f\u00fcr Medizinprodukte, Spielzeug,
      Maschinen), die eine entscheidende Rolle bei der Gew\u00e4hrleistung der Sicherheit
      von Produkten mit integrierten KI-Systemen spielen, sondern erg\u00e4nzen diese.
      Dies erfordert die Einhaltung der Ex-ante-Sicherheitsanforderungen f\u00fcr
      regulierte Produkte und deren proaktive \u00dcberwachung, um sicherzustellen,
      dass sie keine Sicherheitsrisiken darstellen, die zu physischen und psychischen
      Sch\u00e4den f\u00fchren k\u00f6nnen. Der Hersteller solcher Produkte mit eingebetteten
      KI-Systemen sollte daher diese Verbote in seinen Risikobewertungen und Sicherheits-
      und Schadensminderungsma\u00dfnahmen ber\u00fccksichtigen, soweit dies mit der
      Logik und dem Anwendungsbereich der einschl\u00e4gigen harmonisierten Rechtsvorschriften
      der Union zur Sicherheit vereinbar ist. Die Sicherheitsvorschriften der Union
      erg\u00e4nzen zudem die Verbote der KI-Verordnung und k\u00f6nnen auch eingreifen
      und Sicherheitsrisiken, die keine Gefahr erheblicher Sch\u00e4den darstellen,
      entgegenwirken. Insbesondere wirkt die Verordnung (EU) 2023/988 (Verordnung
      \u00fcber die allgemeine Produktsicherheit) 103 als Sicherheitsnetz, denn sie
      schreibt vor, dass alle Verbraucherprodukte, die nicht unter besondere Anforderungen
      anderer sektorspezifischer Produktsicherheitsvorschriften der Union fallen (einschlie\u00dflich
      Produkten mit eingebetteten KI-Systemen, die nicht gem\u00e4\u00df Artikel 6
      als Hochrisiko-Systeme eingestuft sind und den Anforderungen der KI-Verordnung
      unterliegen), unter normalen oder vern\u00fcnftigerweise vorhersehbaren Verwendungsbedingungen
      sicher sein m\u00fcssen, wobei insbesondere Risiken f\u00fcr die physische und
      psychische Gesundheit der Verbraucher zu ber\u00fccksichtigen sind.\n\n[guide:guide-prohibited:para:263]
      (7.2.3. Ausnahmen aus medizinischen Gr\u00fcnden und Sicherheitsgr\u00fcnden)\n(263)
      Emotionserkennungssysteme, die gem\u00e4\u00df Artikel 6 Absatz 2 und Anhang
      III Absatz 1 Buchstabe c der KI-Verordnung als Hochrisikosysteme eingestuft
      werden, m\u00fcssen die Hochrisikoanforderungen in Kapitel III Abschnitt 2 der
      KI-Verordnung und die Transparenzpflicht nach Artikel 50 Absatz 3 der KI-Verordnung
      erf\u00fcllen.\n\nBeispiele:\n\nEmotionserkennung kann aus medizinischen Gr\u00fcnden
      zur Unterst\u00fctzung von Arbeitnehmern oder Studierenden mit Autismus und
      zur Verbesserung der Barrierefreiheit f\u00fcr blinde oder geh\u00f6rlose Menschen
      eingesetzt werden 170 . Solche Verwendungen w\u00fcrden unter die Ausnahme aus
      medizinischen Gr\u00fcnden in Artikel 5 Absatz 1 Buchstabe f der KI-Verordnung
      fallen.\n\nDagegen gilt die Emotionserkennung zur Bewertung des Wohlbefindens,
      des Motivationsniveaus und der Arbeits- oder Lernzufriedenheit von Studierenden
      oder Arbeitnehmern nicht als \"Verwendung aus medizinischen Gr\u00fcnden\" und
      w\u00e4re verboten.\n\nEinem Arbeitgeber w\u00e4re es untersagt, am Arbeitsplatz
      KI-gest\u00fctzte Ger\u00e4te oder digitale Assistenten einzusetzen, um auf
      der Grundlage gemessener Stresswerte Angstzust\u00e4nde oder Langeweile von
      Arbeitnehmern zu messen, es sei denn, der erh\u00f6hte Stresswert bzw. die mangelnde
      Konzentration w\u00fcrden beispielsweise beim Einsatz gef\u00e4hrlicher Maschinen
      oder Umgang mit gef\u00e4hrlichen Chemikalien eine besondere Gefahr darstellen.
      Im letzteren Fall darf der Arbeitgeber die Daten nicht f\u00fcr andere Zwecke
      wie beispielsweise Beurteilung der Arbeitsleistung des Arbeitnehmers verwenden.\n\n[guide:guide-prohibited:para:48]
      (2.8. Zusammenspiel zwischen den Verboten und anderen Rechtsvorschriften der
      Union)\n(48) Dar\u00fcber hinaus gilt Die KI-Verordnung in Verbindung mit den
      einschl\u00e4gigen Verpflichtungen f\u00fcr Anbieter von Vermittlungsdiensten,
      die KI-Systeme oder -Modelle in ihre unter die Verordnung (EU) 2022/2065 (im
      Folgenden \"Gesetz \u00fcber digitale Dienste\") fallenden Dienste einbetten.
      Insbesondere geht aus Artikel 2 Absatz 5 der KIVerordnung hervor, dass die KI-Verordnung
      die Anwendung der Bestimmungen \u00fcber die Haftung solcher Anbieter gem\u00e4\u00df
      Kapitel II des Gesetzes \u00fcber digitale Dienste unber\u00fchrt l\u00e4sst.\n\n[guide:guide-prohibited:para:132]
      (3.5.1. Rechtm\u00e4\u00dfige \u00dcberzeugungsarbeit)\n(132) Insbesondere wird
      in Erw\u00e4gungsgrund 29 der KI-Verordnung klargestellt, dass die Verbote in
      Artikel 5 Absatz 1 Buchstaben a und b der KI-Verordnung rechtm\u00e4\u00dfige
      Praktiken im Zusammenhang mit medizinischen Behandlungen unter bestimmten Bedingungen
      unber\u00fchrt lassen.\n\nBeispielsweise k\u00f6nnen KI-gest\u00fctzte unterschwellige
      Techniken zur psychologischen Behandlung einer psychischen Erkrankung oder zur
      physischen Rehabilitation eingesetzt werden, wenn sie im Einklang mit den geltenden
      Rechtsvorschriften und medizinischen Standards durchgef\u00fchrt werden; dies
      schlie\u00dft die Einholung der ausdr\u00fccklichen Zustimmung der Einzelperson
      oder ihrer gesetzlichen Vertreter als Nutzungsvoraussetzung ein.\n\n[guide:guide-prohibited:para:16]
      (2.4. Pers\u00f6nlicher Anwendungsbereich: zust\u00e4ndige Akteure)\n(16) Nach
      Artikel 3 Nummer 3 der KI-Verordnung sind Anbieter nat\u00fcrliche oder juristische
      Personen, Beh\u00f6rden, Einrichtungen oder sonstige Stellen, die ein KI-System
      entwickeln oder entwickeln lassen und unter ihrem eigenen Namen oder ihrer Handelsmarke
      in der Union in Verkehr bringen bzw. unter ihrem eigenen Namen oder ihrer Handelsmarke
      in Betrieb nehmen 11 (siehe Abschnitt 2.3). Anbieter, die au\u00dferhalb der
      Union niedergelassen oder ans\u00e4ssig sind, unterliegen den Bestimmungen der
      KI-Verordnung, wenn sie solche Systeme in der Union in Verkehr bringen oder
      in Betrieb nehmen 12 oder wenn die vom KI-System hervorgebrachte Ausgabe in
      der Union verwendet wird 13 . Die Anbieter m\u00fcssen sicherstellen, dass ihre
      KI-Systeme alle einschl\u00e4gigen Anforderungen erf\u00fcllen, bevor sie sie
      in Verkehr bringen oder in Betrieb nehmen.\n\n8 Siehe Artikel 3 Nummern 12 und
      13 der KI-Verordnung.\n\n9 Zu den Definitionen dieser Begriffe siehe auch die
      Bekanntmachung der Kommission - Leitfaden f\u00fcr die Umsetzung der Produktvorschriften
      der EU 2022 (\"Blue Guide\"), 2022/C 247/01, Abschnitt 2.8.\n\n10 Erw\u00e4gungsgrund
      28 der KI-Verordnung.\n\n11 Artikel 3 Nummern 3, 9 und 11 der KI-Verordnung.
      In Bezug auf KI-Systeme mit hohem Risiko sieht Artikel 25 der KI-Verordnung
      Folgendes vor: 1. In den folgenden F\u00e4llen gelten H\u00e4ndler, Einf\u00fchrer,
      Betreiber oder sonstige Dritte als Anbieter eines HochrisikoKI-Systems f\u00fcr
      die Zwecke dieser Verordnung und unterliegen den Anbieterpflichten gem\u00e4\u00df
      Artikel 16: a) wenn sie ein bereits in Verkehr gebrachtes oder in Betrieb genommenes
      Hochrisiko-KI-System mit ihrem Namen oder ihrer Handelsmarke versehen, unbeschadet
      vertraglicher Vereinbarungen, die eine andere Aufteilung der Pflichten vorsehen;
      b) wenn sie eine wesentliche Ver\u00e4nderung eines Hochrisiko-KI-Systems, das
      bereits in Verkehr gebracht oder in Betrieb genommen wurde, so vornehmen, dass
      es weiterhin ein Hochrisiko-KI-System gem\u00e4\u00df Artikel 6 bleibt; c) wenn
      sie die Zweckbestimmung eines KI-Systems, einschlie\u00dflich eines KI-Systems
      mit allgemeinem Verwendungszweck, das nicht als hochriskant eingestuft wurde
      und bereits in Verkehr gebracht oder in Betrieb genommen wurde, so ver\u00e4ndern,
      dass das betreffende KI-System zu einem Hochrisiko-KI-System im Sinne von Artikel
      6 wird.\n\n12 Artikel 2 Absatz 1 Buchstabe a der KI-Verordnung.\n\nZum Beispiel
      ist ein Anbieter eines RBI-Systems der Hersteller des Systems, der das System
      in der Union unter seiner Marke vermarktet. Der Anbieter eines solchen Systems
      k\u00f6nnte auch eine Beh\u00f6rde sein, die das System intern entwickelt und
      f\u00fcr ihren eigenen Gebrauch in Betrieb nimmt.\n\n[guide:guide-prohibited:para:7]
      (MITTEILUNG DER KOMMISSION \u203a Leitlinien der Kommission zu verbotenen Praktiken
      der k\u00fcnstlichen Intelligenz gem\u00e4\u00df der Verordnung (EU) 2024/1689
      (KI-Verordnung) \u203a INHALT \u203a 1. HINTERGRUND UND ZIELE)\n(7) Die Anwendung
      von Artikel 5 der KI-Verordnung erfordert eine Einzelfallpr\u00fcfung, bei der
      die konkrete Situation in jedem einzelnen Fall geb\u00fchrend ber\u00fccksichtigt
      wird. Daher haben die in diesen Leitlinien aufgef\u00fchrten Beispiele lediglich
      Hinweischarakter und lassen die Notwendigkeit einer solchen Einzelfallpr\u00fcfung
      unber\u00fchrt.\n\nLanguage for facts and questions: de\n\nEarlier checks:\n-\n\nFacts:\n-\n\nDescription:\nWir
      sind ein Digital-Health-Unternehmen aus Hamburg mit 45 Besch\u00e4ftigten. Unsere
      App liest die Pulsdaten g\u00e4ngiger Smartwatches aus, und ein selbst trainiertes
      Modell sucht darin nach Mustern, die auf Vorhofflimmern hindeuten k\u00f6nnen.
      Findet es welche, erscheint der Hinweis, das \u00e4rztlich abkl\u00e4ren zu
      lassen. Ob wir die App als Medizinprodukt zertifizieren lassen oder als Fitness-Funktion
      ohne medizinische Zweckbestimmung anbieten, ist intern noch nicht entschieden;
