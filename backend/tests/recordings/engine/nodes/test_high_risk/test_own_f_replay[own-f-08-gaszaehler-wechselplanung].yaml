    body: '{"input":["Instruct: Given a description of an AI system or a question
      about the EU AI Act, retrieve the article, Annex point or recital of the AI
      Act that governs it\nQuery:Als Gasnetzbetreiber rund um Kiel versorgen wir gut
      60.000 Haushalte und Betriebe \u00fcber unsere Leitungen. F\u00fcr den vorgeschriebenen
      Turnuswechsel der Gasz\u00e4hler setzen wir seit diesem Jahr eine KI-gest\u00fctzte
      Planungssoftware ein. Sie schl\u00e4gt vor, welche Z\u00e4hler in welcher Woche
      getauscht werden, b\u00fcndelt die Termine nach Stra\u00dfenz\u00fcgen, ber\u00fccksichtigt
      Wunschtermine der Kunden und stellt die Tagestouren unserer Monteure zusammen.
      Auf die Netzsteuerung, die Druckregelanlagen oder die St\u00f6rungsannahme hat
      die Software keinen Zugriff; den Tausch selbst und die Dichtheitspr\u00fcfung
      erledigen die Monteure nach unseren Arbeitsanweisungen. Gekauft haben wir sie
      bei einem Softwarehaus aus L\u00fcbeck, das uns auch die Lagerverwaltung liefert."],"model":"qwen/qwen3-embedding-8b","dimensions":1536,"encoding_format":"float","provider":{"allow_fallbacks":false,"data_collection":"deny","order":["nebius"],"zdr":true}}'
