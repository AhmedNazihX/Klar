interactions:
- request:
    body: '{"input":["Instruct: Given a description of an AI system or a question
      about the EU AI Act, retrieve the article, Annex point or recital of the AI
      Act that governs it\nQuery:We are a consumer lender in Ireland with about 300
      employees, offering car loans and personal loans online. Applicants upload their
      payslips and three months of bank statements. A document-reading tool from a
      fintech supplier pulls out the net salary, the employer''s name, the rent and
      any existing loan repayments, and enters them into the matching fields of the
      application file. Our credit analysts then check each figure against the documents,
      correct anything wrong, and carry out the credit assessment on the completed
      file. The tool does not rate the applicant, does not suggest a decision and
      passes nothing else on. The same supplier also provides our e-signature service."],"model":"qwen/qwen3-embedding-8b","dimensions":1536,"encoding_format":"float","provider":{"allow_fallbacks":false,"data_collection":"deny","order":["nebius"],"zdr":true}}'
    headers:
      content-type:
      - application/json
    method: POST
    uri: https://openrouter.ai/api/v1/embeddings
