    body: '{"input":["Instruct: Given a description of an AI system or a question
      about the EU AI Act, retrieve the article, Annex point or recital of the AI
      Act that governs it\nQuery:Wir sind ein mittelst\u00e4ndischer Aufzughersteller
      aus Stuttgart mit etwa 700 Besch\u00e4ftigten. F\u00fcr unsere Wartungsvertr\u00e4ge
      haben wir selbst ein KI-Modul entwickelt, das die Betriebsdaten der Anlagen
      auswertet \u2013 Fahrten, T\u00fcrzyklen, Motorstr\u00f6me \u2013 und vorhersagt,
      wann ein Verschlei\u00dfteil voraussichtlich getauscht werden muss. Daraus plant
      es die Touren unserer Techniker und bestellt Ersatzteile vor. Auf die Steuerung
      und die Sicherheitseinrichtungen der Aufz\u00fcge hat das Modul keinen Zugriff,
      es liest nur Daten aus. Die vorgeschriebenen Pr\u00fcfungen durch die Pr\u00fcforganisation
      laufen unabh\u00e4ngig davon im gewohnten Rhythmus weiter, und f\u00e4llt das
      Modul aus, planen wir die Touren wie fr\u00fcher von Hand. Das Tool l\u00e4uft
      seit Anfang 2026; im selben Zug haben wir unser Kundenportal neu gestaltet."],"model":"qwen/qwen3-embedding-8b","dimensions":1536,"encoding_format":"float","provider":{"allow_fallbacks":false,"data_collection":"deny","order":["nebius"],"zdr":true}}'
