      Verordnung (EU) 2023/1230 \u00fcber Maschinen\n\nAnnex III points found:\n-\n\nGuideline
      passages and examples found:\n[guide:guide-prohibited:para:171] (4.2.3. Unabh\u00e4ngig
      davon, ob sie von juristischen oder nat\u00fcrlichen Personen bereitgestellt
      oder genutzt werden)\n(171) Im Falle von Kontrollen durch die zust\u00e4ndigen
      Markt\u00fcberwachungsbeh\u00f6rden obliegt es dem Anbieter und dem Betreiber
      des KI-Systems im Rahmen ihrer jeweiligen Zust\u00e4ndigkeiten nachzuweisen,
      dass die KI-Praxis rechtm\u00e4\u00dfig und gerechtfertigt ist, unter anderem
      mittels Gew\u00e4hrung von Transparenz bez\u00fcglich der Funktionsweise des
      KI-Systems und die Bereitstellung von Informationen \u00fcber die Arten von
      Daten und Datenquellen, wobei sicherzustellen ist, dass f\u00fcr die Zwecke
      der Bewertung oder Einstufung nur Daten verarbeitet werden, die im Zusammenhang
      mit dem sozialen Kontext stehen, in dem die Bewertung verwendet wird, dass das
      System wie vorgesehen funktioniert und dass jede daraus resultierende Schlechterstellung
      oder Benachteiligung gerechtfertigt ist und in einem angemessenen Verh\u00e4ltnis
      zum sozialen Verhalten steht. Die Einhaltung der geltenden Rechtsvorschriften
      sowie angemessene und verh\u00e4ltnism\u00e4\u00dfige Schutzvorkehrungen, die
      in das System integriert sind und w\u00e4hrend seines Betriebs angewendet werden,
      werden dazu beitragen, die Geltung des Verbots zu vermeiden und gleichzeitig
      die Verwendung von KI-Systemen f\u00fcr die Bewertung oder Einstufung von Personen
      f\u00fcr rechtm\u00e4\u00dfige und vorteilhafte Zwecke (z. B. zur Verbesserung
      der Effektivit\u00e4t von Verfahren, der Dienstqualit\u00e4t, der Sicherheit
      usw.) zu erm\u00f6glichen (siehe Abschnitt 4.3 \"Au\u00dferhalb des Anwendungsbereichs\").\n\n[guide:guide-prohibited:para:134]
      (3.5.2. Manipulative, t\u00e4uschende und ausbeuterische KI-Systeme, die voraussichtlich
      keinen erheblichen Schaden verursachen)\n(134) Eine wesentliche Bedingung f\u00fcr
      die Geltung der Verbote nach Artikel 5 Absatz 1 Buchstaben a und b der KI-Verordnung
      ist, dass die KI-gest\u00fctzte Manipulation und Ausnutzung von Vulnerabilit\u00e4ten
      erheblichen Schaden verursacht oder mit hinreichender Wahrscheinlichkeit verursachen
      wird. Alle manipulativen, t\u00e4uschenden und ausbeuterischen KI-Anwendungen,
      die mit hinreichender Wahrscheinlichkeit keine erheblichen Sch\u00e4den verursachen,
      fallen grunds\u00e4tzlich nicht in den Anwendungsbereich der Verbote, unbeschadet
      anderer, dar\u00fcber hinaus geltender Rechtsvorschriften der Union (siehe Abschnitt
      3.6).\n\nBeispiele f\u00fcr KI-Systeme, die voraussichtlich keinen erheblichen
      Schaden verursachen:\n\n- Ein KI-Begleitsystem (Companion-App) ist anthropomorph
      und mit Affective Computing (Emotions-KI) konzipiert, um das System ansprechender
      zu gestalten; es bindet Nutzer tats\u00e4chlich wirksamer, \u00fcbt aber keine
      manipulativen oder t\u00e4uschenden Praktiken in einer Weise aus, die ihnen
      mit hinreichender Wahrscheinlichkeit schwere psychische, physische oder sonstige
      Sch\u00e4den zuf\u00fcgt oder ungesunde Bindungen und Abh\u00e4ngigkeiten herbeif\u00fchrt.\n\n-
      Ein therapeutischer Chatbot nutzt unterschwellige Techniken, um die Nutzer zu
      einer ges\u00fcnderen Lebensweise zu bewegen und schlechte Angewohnheiten wie
      Rauchen aufzugeben. Selbst wenn die Nutzer, die den Rat des Chatbots und die
      unterschwellige Therapie befolgen, aufgrund der Bem\u00fchungen, das Rauchen
      aufzugeben, k\u00f6rperliche Beschwerden und psychische Belastungen durchleben,
      kann nicht davon ausgegangen werden, dass der KI-gest\u00fctzte Chatbot erhebliche
      Sch\u00e4den verursacht. Solche vor\u00fcbergehenden Beschwerden sind unvermeidlich
      und werden durch die langfristigen Vorteile f\u00fcr die Gesundheit der Nutzer
      aufgewogen. Es gibt keine versteckten Versuche, \u00fcber die F\u00f6rderung
      gesunder Gewohnheiten hinaus die Entscheidungsfindung zu beeinflussen.\n\n-
      Eine Online-Musikplattform nutzt ein Emotionserkennungssystem, um R\u00fcckschl\u00fcsse
      auf die Gef\u00fchle der Nutzer zu ziehen und ihnen automatisch Lieder zu empfehlen,
      die zu ihrer Stimmung passen, vermeiden aber gleichzeitig, sie zu stark mit
      depressiv stimmenden Liedern zu belasten. Da die Nutzer lediglich Musik h\u00f6ren
      und nicht anderweitig gesch\u00e4digt werden oder bei ihnen Depressionen und
      Angstzust\u00e4nde ausgel\u00f6st werden, ist mit hinreichender Wahrscheinlichkeit
      davon auszugehen, dass das System keine erheblichen Sch\u00e4den verursacht.\n\n-
      KI-gest\u00fctzte manipulative und betr\u00fcgerische Techniken, die in Sicherheitsschulungen
      und in anderen Lernsimulationen eingesetzt werden, und mit denen versucht wird,
      Nutzer \u00fcber Bedrohungen der Cybersicherheit aufzukl\u00e4ren. Diese Systeme
      k\u00f6nnen gezielt manipulative Techniken einsetzen (z. B. die Ausnutzung kognitiver
      Verzerrungen), ohne dass dies den Nutzern bewusst ist; sie ver\u00e4ndern das
      Verhalten, wobei dies jedoch vor\u00fcbergehend f\u00fcr sinnvolle Schulungs-
      und Sensibilisierungszwecke und ohne erhebliche Sch\u00e4den zu verursachen
      geschieht.\n\n[guide:guide-definition:para:4] (MITTEILUNG DER KOMMISSION \u203a
      Leitlinien der Kommission zur Definition eines Systems der k\u00fcnstlichen
      Intelligenz gem\u00e4\u00df der Verordnung (EU) 2024/1689 (KI-Verordnung) \u203a
      I. Zweck der Leitlinien)\n(4) Die Definition eines KI-Systems ist seit dem 2.
      Februar 2025 anwendbar 3 , zusammen mit anderen Bestimmungen der Kapitel I und
      II der KI-Verordnung, insbesondere Artikel 5 der KI-Verordnung \u00fcber verbotene
      Praktiken im KI-Bereich. Da die Definition eines KI-Systems f\u00fcr das Verst\u00e4ndnis
      des Anwendungsbereichs der KI-Verordnung, einschlie\u00dflich der verbotenen
      Praktiken, entscheidend ist, werden die vorliegenden Leitlinien parallel zu
      Leitlinien der Kommission zu verbotenen Praktiken im Bereich der k\u00fcnstlichen
      Intelligenz angenommen.\n\n[guide:guide-prohibited:para:12] (2.2. Rechtsgrundlage
      der Verbote)\n(12) Gem\u00e4\u00df Artikel 3 Nummer 9 der KI-Verordnung ist
      das Inverkehrbringen eines KISystems \"die erstmalige Bereitstellung eines KI-Systems
      \u2026 auf dem Unionsmarkt\". \"Bereitstellung auf dem Markt\" bezeichnet die
      \"entgeltliche oder unentgeltliche Abgabe\" des Systems \"zum Vertrieb oder
      zur Verwendung auf dem Unionsmarkt im Rahmen einer Gesch\u00e4ftst\u00e4tigkeit.\"
      6 Die Bereitstellung eines KI-Systems f\u00e4llt unabh\u00e4ngig von den Liefermitteln
      wie beispielsweise dem Zugang zum System und seinen Diensten \u00fcber eine
      Anwendungsprogrammierschnittstelle (API), \u00fcber eine Cloud, direkte Downloads,
      als physische Kopien oder eingebettet in physische Produkte unter diese Definition.\n\nSo
      wird beispielsweise ein au\u00dferhalb der Union von einem Anbieter aus einem
      Drittland entwickeltes RBI-System erstmals in der Union in Verkehr gebracht,
      wenn es in einem oder mehreren Mitgliedstaaten entgeltlich oder unentgeltlich
      angeboten wird. Ein solches Inverkehrbringen kann durch die Bereitstellung des
      Online-Zugangs zum System \u00fcber eine API oder eine andere Benutzerschnittstelle
      erfolgen.\n\n[guide:guide-prohibited:para:35] (2.5.4. Pers\u00f6nliche und nicht-berufliche
      T\u00e4tigkeit)\n(35) Der Ausschluss nach Artikel 2 Absatz 10 der KI-Verordnung
      gilt nur in Bezug auf die Pflichten der Betreiber bei der Verwendung des Systems
      f\u00fcr rein pers\u00f6nliche nichtberufliche T\u00e4tigkeiten. Das System
      als solches f\u00e4llt weiterhin in den Anwendungsbereich der KI-Verordnung
      in Bezug auf die Pflichten von Anbietern, die das System in Verkehr bringen
      oder in Betrieb nehmen, sowie die Pflichten anderer professioneller Betreiber
      und anderer verantwortlicher Akteure wie Einf\u00fchrer und H\u00e4ndler.\n\nBeispielsweise
      bleibt ein Emotionserkennungssystem, das dazu bestimmt ist, von nat\u00fcrlichen
      Personen f\u00fcr rein pers\u00f6nliche nicht berufliche T\u00e4tigkeiten verwendet
