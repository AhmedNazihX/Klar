      in ihren Anwendungsbereich.\n\n[guide:guide-definition:para:1] (MITTEILUNG DER
      KOMMISSION \u203a Leitlinien der Kommission zur Definition eines Systems der
      k\u00fcnstlichen Intelligenz gem\u00e4\u00df der Verordnung (EU) 2024/1689 (KI-Verordnung)
      \u203a I. Zweck der Leitlinien)\n(1) Die Verordnung (EU) 2024/1689 des Europ\u00e4ischen
      Parlaments und des Rates 1 (im Folgenden \"Verordnung \u00fcber k\u00fcnstliche
      Intelligenz\" oder \"KI-Verordnung\") trat am 1. August 2024 in Kraft. Mit der
