      KI-Modul entwickelt, das die Betriebsdaten der Anlagen auswertet \u2013 Fahrten,
      T\u00fcrzyklen, Motorstr\u00f6me \u2013 und vorhersagt, wann ein Verschlei\u00dfteil
      voraussichtlich getauscht werden muss. Daraus plant es die Touren unserer Techniker
