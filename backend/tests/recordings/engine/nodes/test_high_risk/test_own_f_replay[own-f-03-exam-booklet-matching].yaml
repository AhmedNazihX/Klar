interactions:
- request:
    body: '{"input":["Instruct: Given a description of an AI system or a question
      about the EU AI Act, retrieve the article, Annex point or recital of the AI
      Act that governs it\nQuery:We are a technical university in Austria with 14,000
      students. Written exams are taken on paper booklets with a printed QR code.
      Afterwards our examinations office scans all booklets, and a tool we bought
      from an e-assessment vendor reads the QR code and the handwritten student number
      on the cover, matches each booklet to the right student and course, and files
      the scan in the marker''s folder. When the code and the number don''t agree,
      it puts the booklet aside for a staff member to sort by hand. The tool never
      reads the answers and plays no part in marking: lecturers mark every booklet
      themselves. The vendor''s package also includes booking rooms for exams."],"model":"qwen/qwen3-embedding-8b","dimensions":1536,"encoding_format":"float","provider":{"allow_fallbacks":false,"data_collection":"deny","order":["nebius"],"zdr":true}}'
