      (a) Narrow procedural task)\n(92) This condition may therefore cover AI systems
      that are intended to categorise, change the format, structure or presentation
      of data, or change its metadata.\n\nFor example, an AI system performs a narrow
      procedural task when it sorts incoming applications for admission to school
