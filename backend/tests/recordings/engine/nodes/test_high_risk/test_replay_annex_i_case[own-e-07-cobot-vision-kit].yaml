      such as tools used to organise, optimise or structure political campaigns from
      an administrative or logistical point of view.\n\nGuideline passages and examples
      found:\n[guide:guide-prohibited:para:16] (2.4. Personal scope: responsible actors)\n(16)
      According to Article 3(3) AI Act, providers are natural or legal persons, public
      authorities, agencies or other bodies, that develop AI systems or have them
      developed and place them on the Union market, or put them into service under
      their own name or trademark 11 (see section 2.3 above). Providers established
