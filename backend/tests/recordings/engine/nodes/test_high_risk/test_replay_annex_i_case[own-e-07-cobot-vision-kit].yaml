    body: '{"input":["Instruct: Given a description of an AI system or a question
      about the EU AI Act, retrieve the provisions of the AI Act that apply\nQuery:We''re
      a 40-person robotics start-up in Eindhoven. We sell a vision kit that machine
      builders mount on collaborative robot arms: a camera and a small neural network
      watch the workspace and slow the arm down, or stop it, when a person comes within
      reach. The machine builders integrate the kit into their robot cells and sell
      those to factories. We train the model in-house and are still deciding how updates
      will reach customers. We haven''t talked to a notified body yet and haven''t
      worked out which conformity route the kit will take. First pilot deliveries
      are planned for spring 2027. Our founders met at a drone-racing hackathon."],"model":"qwen/qwen3-embedding-8b","dimensions":1536,"encoding_format":"float","provider":{"allow_fallbacks":false,"data_collection":"deny","order":["nebius"],"zdr":true}}'
