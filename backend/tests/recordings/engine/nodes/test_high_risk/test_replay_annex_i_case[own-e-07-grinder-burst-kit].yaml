interactions:
- request:
    body: '{"input":["Instruct: Given a description of an AI system or a question
      about the EU AI Act, retrieve the article, Annex point or recital of the AI
      Act that governs it\nQuery:We''re a 40-person industrial-sensing start-up in
      Eindhoven. We sell a retrofit kit that machine builders fit to high-speed grinding
      machines: vibration and acoustic sensors on the spindle feed a small neural
      network that spots the signature of a grinding wheel about to crack or a workpiece
      working loose, and then brakes the spindle and keeps the guard door locked until
      it has stopped. The machine builders integrate the kit into their grinders and
      sell those to factories. We train the model in-house and are still deciding
      how updates will reach customers. We haven''t talked to a notified body yet
      and haven''t worked out which conformity route the kit will take. First pilot
      deliveries are planned for spring 2027. We share our test hall with a university
      solar-car team."],"model":"qwen/qwen3-embedding-8b","dimensions":1536,"encoding_format":"float","provider":{"allow_fallbacks":false,"data_collection":"deny","order":["nebius"],"zdr":true}}'
