- request:
    body: '{"input":["Instruct: Given a description of an AI system or a question
      about the EU AI Act, retrieve the provisions of the AI Act that apply\nQuery:Wir
      sind ein Softwarehaus aus Leipzig mit 120 Besch\u00e4ftigten und entwickeln
      Klinik-IT. Unser Modul f\u00fcr Notaufnahmen wertet bei der Ankunft Vitalwerte,
      Symptome und Vorerkrankungen aus und schl\u00e4gt eine Dringlichkeitsstufe vor;
      die Pflegekraft an der Ersteinsch\u00e4tzung \u00fcbernimmt oder \u00e4ndert
      den Vorschlag, und danach richtet sich, wer zuerst behandelt wird. Das Modul
      soll als Medizinprodukt der Klasse IIa zertifiziert werden, das Audit der benannten
      Stelle ist f\u00fcr Fr\u00fchjahr 2028 geplant. Ab Herbst 2028 verkaufen wir
      es an Krankenh\u00e4user in Deutschland und der Schweiz. Nebenbei haben wir
      gerade unser Logo \u00fcberarbeitet."],"model":"qwen/qwen3-embedding-8b","dimensions":1536,"encoding_format":"float","provider":{"allow_fallbacks":false,"data_collection":"deny","order":["nebius"],"zdr":true}}'
