      Symptome und Vorerkrankungen aus und schl\u00e4gt eine Dringlichkeitsstufe vor;
      die Pflegekraft an der Ersteinsch\u00e4tzung \u00fcbernimmt oder \u00e4ndert
      den Vorschlag, und danach richtet sich, wer zuerst behandelt wird. Das Modul
      soll als Medizinprodukt der Klasse IIa zertifiziert werden, das Audit der benannten
      Stelle ist f\u00fcr Fr\u00fchjahr 2028 geplant. Ab Herbst 2028 verkaufen wir
