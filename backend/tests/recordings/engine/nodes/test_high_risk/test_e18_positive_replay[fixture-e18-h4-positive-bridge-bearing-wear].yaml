      An AI system therefore fulfils a ''safety function'' where its intended purpose,
      as determined by the provider, is to prevent or mitigate risks to health and
      safety of persons or property.\n\nSafety functions - indicative examples\n\nThe
      AI Act does not provide a list of safety components or safety functions. However,
      based on the definition of safety component in Article 3(14) AI Act and the
      clarifications provided in Recitals 47 and 48 AI Act, the concept of ''safety
      function'' may include, in particular, the following preventive or mitigation
      functionalities:\n\nPreventive functions:\n\n- monitoring and detection of situations
      which may lead to physical harm or damage to people or property (e.g. AI system
      detecting abnormal system behaviour);\n\n- monitoring and detection of a need
      for maintenance or inspections, where failure to perform such actions may lead
      to physical harm to people or property (e.g. an AI system detecting whether
      safety-related parts, or parts whose failure may lead to harm to people or property
      , are worn down and may need replacement or maintenance);\n\n- prevention of
      physical harm to people or property (e.g. an AI system preventing the system
      from starting up if abnormal behaviour is detected);\n\n- supervision of another
      system that performs a safety function (e.g. an AI system that supervises through
      sensors an operation in real time of a safety component that directly performs
      the safety function).\n\nMitigation functions:\n\n- control or limitation of
      physical harm to people or property (e.g. an AI system controlling specific
      behaviour or the functioning of a system and adjusting its function accordingly);\n\n-
      mitigation of consequences of possible physical harm to people or property (e.g.
      an AI system that triggers action, such as safe stop if dangerous conditions
      arise);\n\n- control of another system that performs a safety function.\n\nFunctions
      not considered safety functions:\n\nAll other AI system functions that are not
      intended by the provider to prevent and mitigate safety risks do not fall within
      the notion of ''safety function''. This includes functions related to performance
      optimisation, service efficiency, automation, comfort, convenience, or quality
      control operations of non-safety related aspects. By way of example, the following
      functions are not in themselves safety functions:\n\n- optimisation of product
      performance (e.g. efficiency or user preference optimisation) where failure
      would not directly lead to risks to health or safety of persons or property;\n\n-
      optimisation of service efficiency or service or optimisation of the functioning
      of a product (e.g. AI systems for billing controls or optimising customers claims
      processing);\n\n- quality control of non-safety related functions or services
      (e.g. AI systems for quality-ofservice monitoring).\n\n[guide:guide-high-risk-annex-iii:para:179]
      (3.2. Critical infrastructure)\n(179) However, even if certain AI systems may
      fall outside the scope of the critical infrastructure use case listed in point
