      include AI systems to the output of which natural persons are not directly exposed,
      such as tools used to organise, optimise or structure political campaigns from
      an administrative or logistical point of view.\n\nGuideline passages and examples
      found:\n[guide:guide-high-risk-annex-iii:para:184] (i. A safety component in
      critical infrastructure)\n(184) More specifically, an AI system should be classified
      as a safety component in critical infrastructure only if it performs one of
      the following safety functions 26 :\n\na. the AI system is intended to be used
      as a component in critical infrastructure to monitor and detect situations which
      may directly lead to physical harm to natural persons or physical damage to
