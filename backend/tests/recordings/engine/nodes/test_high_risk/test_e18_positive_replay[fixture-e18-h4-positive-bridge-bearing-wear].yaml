      the critical infrastructure to prevent physical harm to natural persons or physical
      damage to property by directly protecting the physical integrity of the critical
      infrastructure (e.g. an AI system preventing critical infrastructure operations
      to start if abnormal behaviour is detected);\n\nd. the AI system is intended
      to be used as a component in the critical infrastructure which is intended to
      control or limit possible physical harm to people or physical damage to property
      by directly protecting the physical integrity of the critical infrastructure
