interactions:
- request:
    body: '{"input":["Instruct: Given a description of an AI system or a question
      about the EU AI Act, retrieve the article, Annex point or recital of the AI
      Act that governs it\nQuery:We operate a motorway concession with four long river
      bridges. Since 2025 strain gauges, accelerometers and cameras on the bearings
      and expansion joints of each bridge have fed a model we bought from an engineering
      software house. The model estimates how far each bearing and joint has worn
      and spots fresh cracks in them. When it judges that a part needs checking, it
      books an inspection crew in our maintenance system and, through the traffic
      control system, closes the lane above that part until the crew has signed the
      inspection off."],"model":"qwen/qwen3-embedding-8b","dimensions":1536,"encoding_format":"float","provider":{"allow_fallbacks":false,"data_collection":"deny","order":["nebius"],"zdr":true}}'
