      to be used by or on behalf of law enforcement authorities or by Union institutions,
      bodies, offices or agencies in support of law enforcement authorities for the
      profiling of natural persons as referred to in Article 3(4) of Directive (EU)
      2016/680 in the course of the detection, investigation or prosecution of criminal
      offences.\n[annex:III:7:a] AI systems intended to be used by or on behalf of
      competent public authorities or by Union institutions, bodies, offices or agencies
      as polygraphs or similar tools;\n[annex:III:7:b] AI systems intended to be used
      by or on behalf of competent public authorities or by Union institutions, bodies,
      offices or agencies to assess a risk, including a security risk, a risk of irregular
      migration, or a health risk, posed by a natural person who intends to enter
      or who has entered into the territory of a Member State;\n[annex:III:7:c] AI
      systems intended to be used by or on behalf of competent public authorities
      or by Union institutions, bodies, offices or agencies to assist competent public
      authorities for the examination of applications for asylum, visa or residence
      permits and for associated complaints with regard to the eligibility of the
      natural persons applying for a status, including related assessments of the
      reliability of evidence;\n[annex:III:7:d] AI systems intended to be used by
      or on behalf of competent public authorities, or by Union institutions, bodies,
      offices or agencies, in the context of migration, asylum or border control management,
      for the purpose of detecting, recognising or identifying natural persons, with
      the exception of the verification of travel documents.\n[annex:III:8:a] AI systems
      intended to be used by a judicial authority or on their behalf to assist a judicial
      authority in researching and interpreting facts and the law and in applying
      the law to a concrete set of facts, or to be used in a similar way in alternative
      dispute resolution;\n[annex:III:8:b] AI systems intended to be used for influencing
      the outcome of an election or referendum or the voting behaviour of natural
      persons in the exercise of their vote in elections or referenda. This does not
      include AI systems to the output of which natural persons are not directly exposed,
      such as tools used to organise, optimise or structure political campaigns from
      an administrative or logistical point of view.\n\nGuideline passages and examples
      found:\n[guide:guide-high-risk-annex-iii:ex:112] (v. Evaluate candidates \u203a
      a) Practical examples of AI systems falling within the high-risk use case of
      point 4(a))\nAI system ranking self-employed service providers\nAn online platform
      designed to help consumers in finding a self-employed service provider to assist
      them with various tasks uses an AI-enabled job-matching tool that ranks service
      providers and determines which are presented to potential consumers.\nThis system
      falls within the use case of point 4(a) of Annex III since it directly and meaningfully
      affects selection of natural persons by filtering and ranking potential service
      providers. Because its output shapes access to future assignments and may have
      a decisive impact on the careers of self-employed persons, along with their
      livelihoods and rights, none of the exceptions in Article 6(3) apply.\n\n[guide:guide-art50:para:30]
      (3.1.1. AI systems intended to interact directly with natural persons)\n(30)
      Four elements must be present for a system to fall within the scope of Article
      50(1) AI Act: (i) the system must be an AI system, (ii) intended to interact,
      (iii) directly, (iv) with natural persons.\n\ni. An AI system: The system must
      fulfil the elements of the AI system definition ( 18 ), which excludes simple
      non-AI automated response mechanisms (e.g., traditional out-of-office emails,
      rule-based quick message answers).\n\nii. Intended to interact: The AI system
      must be intended to interact with natural persons. Interaction entails the capability
      of a bidirectional exchange of information or actions between natural persons
      and the AI system with a genuine conversational or responsive character. It
      can occur in various forms (e.g. auditory, visual and physical). Natural persons
      should be able to provide input (e.g., written text or other forms of content,
      voice, or physical actions) to the AI system (e.g. via technical communication
      means including online interfaces, phone or e-mail, or directly), while the
      AI system should be capable of responding with contextual output (including
      any type of content or actions) and vice-versa. The interaction may cover any
      type of output or format that can be perceived and understood by humans. It
      does not have to be initiated by a human; it may also cover AI content or actions
      eliciting a human response. The interaction may be a one-time exchange (e.g.
