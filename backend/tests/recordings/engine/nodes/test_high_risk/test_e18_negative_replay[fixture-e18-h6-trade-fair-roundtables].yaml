interactions:
- request:
    body: '{"input":["Instruct: Given a description of an AI system or a question
      about the EU AI Act, retrieve the article, Annex point or recital of the AI
      Act that governs it\nQuery:We organise a large trade fair for the packaging
      industry, with about 30,000 visitors over three days. When they register online,
      visitors fill in their industry, job role, company size and the topics they
      want to discuss. Since 2025 a matching tool we developed has grouped registered
      visitors into roundtables of eight to ten people with similar topics and roles,
      working only from those form entries, and suggests to each visitor which roundtable
      to join; visitors can pick another one."],"model":"qwen/qwen3-embedding-8b","dimensions":1536,"encoding_format":"float","provider":{"allow_fallbacks":false,"data_collection":"deny","order":["nebius"],"zdr":true}}'
