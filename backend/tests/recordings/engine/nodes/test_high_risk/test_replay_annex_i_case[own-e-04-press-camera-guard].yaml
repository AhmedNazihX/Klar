      (Anforderungen des Artikels 14 der KI-Verordnung an die menschliche Aufsicht)\n(407)
      Die Verwendung biometrischer Echtzeit-Fernidentifizierung, die zul\u00e4ssig
      ist, weil sie eines der in Artikel 5 Absatz 1 Buchstabe h aufgef\u00fchrten
