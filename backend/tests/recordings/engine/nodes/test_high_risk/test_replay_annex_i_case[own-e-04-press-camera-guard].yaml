      sie das System in Betrieb.\n\n[guide:guide-prohibited:para:359] (10. SCHUTZVORKEHRUNGEN
      UND BEDINGUNGEN F\u00dcR DIE AUSNAHMEN (ARTIKEL 5 ABS\u00c4TZE 2 BIS 7 DER KI-VERORDNUNG)
      \u203a 10.1. Gezielte individuelle Ma\u00dfnahmen und Schutzvorkehrungen (Artikel
      5 Absatz 2 der KI-Verordnung) \u203a In Artikel 5 Absatz 2 der KI-Verordnung
      wird Folgendes bestimmt:)\n(359) Zweitens ist vor der Verwendung des Systems
