      Der Hersteller solcher Produkte mit eingebetteten KI-Systemen sollte daher diese
      Verbote in seinen Risikobewertungen und Sicherheits- und Schadensminderungsma\u00dfnahmen
      ber\u00fccksichtigen, soweit dies mit der Logik und dem Anwendungsbereich der
      einschl\u00e4gigen harmonisierten Rechtsvorschriften der Union zur Sicherheit
      vereinbar ist. Die Sicherheitsvorschriften der Union erg\u00e4nzen zudem die
      Verbote der KI-Verordnung und k\u00f6nnen auch eingreifen und Sicherheitsrisiken,
      die keine Gefahr erheblicher Sch\u00e4den darstellen, entgegenwirken. Insbesondere
