    body: '{"input":["Instruct: Given a description of an AI system or a question
      about the EU AI Act, retrieve the provisions of the AI Act that apply\nQuery:Wir
      bauen in Ostwestfalen mit rund 250 Leuten hydraulische Pressen f\u00fcr die
      Blechbearbeitung. F\u00fcr die neue Baureihe ersetzen wir das klassische Lichtgitter
      durch eine Kamera\u00fcberwachung des Werkzeugraums: Ein neuronales Netz erkennt
      H\u00e4nde und Arme im Gefahrenbereich und l\u00f6st den Not-Halt aus, bevor
      der St\u00f6\u00dfel schlie\u00dft. Das Modell lernt im Betrieb nicht weiter,
      es wird nur \u00fcber gepr\u00fcfte Updates von uns ausgetauscht. Weil keine
      harmonisierte Norm eine solche kamerabasierte Personenerkennung abdeckt, muss
      nach der Maschinenverordnung eine benannte Stelle die Konformit\u00e4t bewerten;
      der Termin beim Pr\u00fcfer steht schon. Ausgeliefert wird die Baureihe ab Februar
      2027, \u00fcbrigens mit einem neuen, deutlich gr\u00f6\u00dferen Bedienpanel."],"model":"qwen/qwen3-embedding-8b","dimensions":1536,"encoding_format":"float","provider":{"allow_fallbacks":false,"data_collection":"deny","order":["nebius"],"zdr":true}}'
