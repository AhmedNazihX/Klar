      Richtlinie (EU) 2016/797 \u00fcber die Interoperabilit\u00e4t des Eisenbahnsystems
      in der Europ\u00e4ischen Union\n[annex:I:B:18] Verordnung (EU) 2018/858 \u00fcber
      die Genehmigung und die Markt\u00fcberwachung von Kraftfahrzeugen und Kraftfahrzeuganh\u00e4ngern\n[annex:I:B:19]
      Verordnung (EU) 2019/2144 \u00fcber die Typgenehmigung von Kraftfahrzeugen und
      Kraftfahrzeuganh\u00e4ngern\n[annex:I:B:20] Verordnung (EU) 2018/1139 zur Festlegung
      gemeinsamer Vorschriften f\u00fcr die Zivilluftfahrt und zur Errichtung einer
      Agentur der Europ\u00e4ischen Union f\u00fcr Flugsicherheit\n\nAnnex III:\n[annex:III:1:a]
      biometrische Fernidentifizierungssysteme. Dazu geh\u00f6ren nicht KI-Systeme,
