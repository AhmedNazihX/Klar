      Druckger\u00e4te\n[annex:I:A:8] Verordnung (EU) 2016/424 \u00fcber Seilbahnen\n[annex:I:A:9]
      Verordnung (EU) 2016/425 \u00fcber pers\u00f6nliche Schutzausr\u00fcstungen\n[annex:I:A:10]
      Verordnung (EU) 2016/426 \u00fcber Ger\u00e4te zur Verbrennung gasf\u00f6rmiger
