    body: '{"input":["Instruct: Given a description of an AI system or a question
      about the EU AI Act, retrieve the article, Annex point or recital of the AI
      Act that governs it\nQuery:Wir sind ein Audio-Start-up aus Berlin mit 35 Leuten.
      Unser smarter Lautsprecher \u201eKiez\u201c hat einen eigenen Sprachassistenten:
      Man fragt ihn nach Wetter, Abfahrtszeiten oder Rezepten, und er antwortet in
      ganzen S\u00e4tzen mit synthetischer Stimme. Das Sprachmodell haben wir auf
      Basis eines offenen Modells selbst feinabgestimmt. Beim Funkteil haben wir die
      harmonisierten Normen zur Frequenznutzung nicht vollst\u00e4ndig angewendet,
      deshalb hat eine benannte Stelle den Lautsprecher nach der Funkanlagenrichtlinie
      gepr\u00fcft \u2013 aber nur die Nutzung des Funkspektrums. Elektrische Sicherheit
      und Gesundheitsschutz haben wir selbst nach Normen erkl\u00e4rt. Sicherheitsfunktionen
      hat das Ger\u00e4t keine. Seit September 2026 verkaufen wir ihn in Deutschland
      und \u00d6sterreich, in Mattschwarz und Sandfarben."],"model":"qwen/qwen3-embedding-8b","dimensions":1536,"encoding_format":"float","provider":{"allow_fallbacks":false,"data_collection":"deny","order":["nebius"],"zdr":true}}'
