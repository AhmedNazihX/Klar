- request:
    body: '{"input":["Instruct: Given a description of an AI system or a question
      about the EU AI Act, retrieve the provisions of the AI Act that apply\nQuery:We
      are a family-owned maker of powered wheelchairs near Graz, about 110 people.
      Our new model has a camera-based assistant: a neural network spots kerbs, steps
      and obstacles and brakes the chair before it drives into them, which our users
      with limited hand control find reassuring. The wheelchair is a class I medical
      device, so, as the Medical Device Regulation allows for class I, we carried
      out the conformity assessment ourselves and issued our own declaration; no notified
      body was involved, and none is required for this model. It went on sale in Austria
      and Germany in May 2026. We also sponsor a local wheelchair basketball team."],"model":"qwen/qwen3-embedding-8b","dimensions":1536,"encoding_format":"float","provider":{"allow_fallbacks":false,"data_collection":"deny","order":["nebius"],"zdr":true}}'
