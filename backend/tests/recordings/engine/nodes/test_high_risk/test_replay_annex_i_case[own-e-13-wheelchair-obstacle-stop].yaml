      extent this fits with the logic and the scope of the relevant Union harmonised
      safety legislation. Union safety legislation is also complementary to the AI
      Act prohibitions and can also intervene and address safety risks that do not
      pose significant harm. In particular, Regulation (EU) 2023/988 (the General
      Product Safety Regulation) 103 acts as a safety net and requires all consumer
