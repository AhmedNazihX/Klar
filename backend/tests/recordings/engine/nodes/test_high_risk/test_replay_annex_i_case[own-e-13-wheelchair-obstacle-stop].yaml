      include AI systems to the output of which natural persons are not directly exposed,
      such as tools used to organise, optimise or structure political campaigns from
      an administrative or logistical point of view.\n\nGuideline passages and examples
      found:\n[guide:guide-prohibited:para:144] (3.6. Interplay with other Union law)\n(144)
      The prohibitions in Article 5(1)(a) and (b) AI Act are also without prejudice
      to and complement EU product safety legislation (e.g., for medical devices,
      toys, machinery), which plays a crucial role in ensuring the safety of products
      that integrate AI systems. This entails compliance with ex ante safety requirements
      for regulated products and their proactive monitoring to ensure that they do
      not pose safety risks leading to physical and mental harms. The manufacturer
      of those products embedding AI systems should therefore take into account these
