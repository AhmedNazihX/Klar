      include AI systems to the output of which natural persons are not directly exposed,
      such as tools used to organise, optimise or structure political campaigns from
      an administrative or logistical point of view.\n\nGuideline passages and examples
      found:\n[guide:guide-high-risk-annex-i:para:20] (1. The classification rationale)\n(20)
      In line with the AI Act''s risk-based approach, only AI systems that present
      significant risks to health, safety, or fundamental rights are classified as
      high-risk, as explained in Recitals 47 to 51 AI Act. Article 6(1) AI Act operationalises
      this approach for AI systems covered by Union harmonisation legislation, by
      linking high-risk classification to risk and the system''s safety relevance,
      as well as to the requirement of third-party conformity assessments.\n\n1 Commission
      notice The ''Blue Guide'' on the implementation of EU product rules 2022 (Text
      with EEA relevance) 2022/C 247/01, (OJ C 247, 29.6.2022, pp. 1-152).\n\n[guide:guide-high-risk-annex-i:para:59]
      (2.3. The product is required to undergo a third-party conformity assessment)\n(59)
      This classification logic for the purpose of the AI Act is expressly confirmed
      by the Union legislature in the Toys Safety Regulation, which explains in its
      Recital 15 that ''[i]n accordance with Regulation (EU) 2024/1689, toys with
      AI systems as safety components that require a thirdparty conformity assessment
      are classified as high-risk AI systems. The choice by the manufacturer of the
