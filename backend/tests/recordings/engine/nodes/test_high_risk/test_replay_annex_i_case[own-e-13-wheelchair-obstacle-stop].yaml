      (1. The classification rationale)\n(20) In line with the AI Act''s risk-based
      approach, only AI systems that present significant risks to health, safety,
      or fundamental rights are classified as high-risk, as explained in Recitals
      47 to 51 AI Act. Article 6(1) AI Act operationalises this approach for AI systems
      covered by Union harmonisation legislation, by linking high-risk classification
      to risk and the system''s safety relevance, as well as to the requirement of
      third-party conformity assessments.\n\n1 Commission notice The ''Blue Guide''
      on the implementation of EU product rules 2022 (Text with EEA relevance) 2022/C
      247/01, (OJ C 247, 29.6.2022, pp. 1-152).\n\n[guide:guide-high-risk-annex-iii:para:114]
      (2.7.3. Self-assessment by the provider, registration and monitoring of systems
      benefitting from the filter mechanism)\n(114) The consequence of applying the
      filter mechanism is that the AI system should not be classified as high-risk
      and therefore that neither the obligations for providers nor for deployers set
      out in Chapter III of the AI Act apply in relation to that system. However,
      Article 6(4) AI Act sets out specific obligations for providers of such AI systems,
      which are:\n\n6 Para. 154 of the Commission Guidelines on prohibited artificial
      intelligence practices established by Regulation (EU) 2024/1689 of the European
      Parliament and of the Council of 13 June 2024 laying down harmonised rules on
      artificial intelligence and amending Regulations (EC) No 300/2008, (EU) No 167/2013,
