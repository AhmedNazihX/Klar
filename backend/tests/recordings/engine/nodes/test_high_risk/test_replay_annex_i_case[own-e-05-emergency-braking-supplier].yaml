- request:
    body: '{"input":["Instruct: Given a description of an AI system or a question
      about the EU AI Act, retrieve the provisions of the AI Act that apply\nQuery:We
      are a Tier-1 automotive supplier headquartered in Lyon, with about 3,000 staff.
      We develop an automatic emergency braking function for passenger cars: a neural
      network fuses camera and radar data, detects pedestrians and cyclists, and brakes
      the car if the driver doesn''t react in time. We deliver it as a software and
      sensor package to two carmakers, who build it into new models. The braking function
      is part of each model''s EU vehicle type-approval, and the approval authority''s
      technical service tests it before the approval is granted. Series production
      starts in 2027. We also run a separate project on in-cabin air-quality sensors,
      which has nothing to do with this."],"model":"qwen/qwen3-embedding-8b","dimensions":1536,"encoding_format":"float","provider":{"allow_fallbacks":false,"data_collection":"deny","order":["nebius"],"zdr":true}}'
