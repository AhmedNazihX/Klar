      (also using the system for purely personal activities) or other persons using
      the system on their behalf. AI systems that operate in a closed physical environment
      (such as part of an industrial machinery set-up), backend machine-to-machine
      calls between AI systems (including AI agents) whose outputs are not intended
      to reach natural person, or virtual environments without any direct contact
      with natural persons are excluded from the scope of the obligation.\n\n[guide:guide-art50:para:31]
      (3.1.1. AI systems intended to interact directly with natural persons)\n(31)
      AI agents are covered by Article 50(1) AI Act if they are capable of interacting
      with the persons instructing them or with other natural persons in the execution
      of the tasks (e.g. making bookings, managing correspondence, negotiating or
      concluding contracts, executing purchases, etc). AI agents must be designed
      and developed in such a way that they disclose both their artificial nature
      and the person on whose behalf they are acting, considering the need for transparency
      of the origin and the delegation of authority and accountability for the consequences
      of their actions. This includes cases where AI agents are capable of interacting
      in complex multi-agent architectures with other AI agents that directly interact
      with the natural persons in the execution of the task. Nevertheless, it may
      not always be possible for the provider of the AI agent to identify in advance
      individual instances of direct interaction of an AI agent with other natural
      persons once the AI agent is deployed in different contexts. Where the provider
      cannot reliably determine whether the AI agent will directly interact with a
      natural person before placing the AI agent on the market or putting it into
      service, the agent should be designed at the architecture level, and instructed,
      to disclose itself as such in every situation where it is reasonably likely
      that the agent may interact with a natural person (including where a natural
      person may represent or act for a legal entity). Furthermore, AI agents should
      also disclose themselves, to the persons instructing them at key steps (e.g.
      at the point of authorisation, reporting, validation etc., including when the
      deployed AI agent receives, processes, or relies upon outputs generated by other
      AI systems rather than directly by a natural person) and at every new interaction.\n\nExamples
      of AI systems intended to interact directly with natural persons falling within
      scope of Article 50(1) AI Act:\n\n- AI-enabled voice assistants, chatbots/conversational
      agents in various contexts (e.g. public service, customer support, complaints
      management, e-commerce, finance, healthcare, education etc.),\n\n- AI hotline
      for incidents, fraud or other reporting, (humanoid) robots/cobots, AI companions;
      robotic companion pets; AI avatars (e.g. in virtual reality environments),\n\n-
      AI bots on social networks and media, coding agents and other AI agents capable
      of directly interacting with natural persons (including in complex multi-agent
      architectures).\n\n3.2.1Examples of AI systems not directly interacting with
      natural persons falling outside the scope of Article 50(1) AI Act:\n\n- AI-enabled
      traditional industrial robots that operate in a closed industrial setting and
      not intended to interact with humans (e.g. electronic assembly robots),\n\n-
      AI-enabled recommender systems, spam filters, automated translation or transcription
      tools,\n\n- AI-enabled search and retrieval of information without generating
      or modifying content,\n\n- AI-enabled text and code auto-completion techniques,
      authentication/biometric recognition systems, backend decision-support systems
      where the user only sees the AI output without possibility for direct interaction
      with the system;\n\n- AI-enabled predictive maintenance and optimisation systems
      in factories and industrial applications, AI-assisted product visualisation
