      (1. The classification rationale)\n(22) Article 6(1) AI Act applies irrespective
      of whether the AI system is embedded within the product or is placed on the
      market or put into service independently. An AI system supplied, for example,
      as a software update, an add-on, or a remote service may therefore be classified
      as high-risk pursuant to Article 6(1) AI Act, provided all the conditions of
      that provision are met.\n\nLanguage for facts and questions: en\n\nEarlier checks:\n-\n\nAnswers
      to earlier questions:\n-\n\nFacts:\n-\n\nDescription:\nWe''re a 60-person toy
