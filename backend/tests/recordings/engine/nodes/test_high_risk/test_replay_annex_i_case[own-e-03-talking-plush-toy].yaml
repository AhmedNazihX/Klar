      include AI systems to the output of which natural persons are not directly exposed,
      such as tools used to organise, optimise or structure political campaigns from
      an administrative or logistical point of view.\n\nGuideline passages and examples
      found:\n[guide:guide-high-risk-annex-i:para:59] (2.3. The product is required
      to undergo a third-party conformity assessment)\n(59) This classification logic
      for the purpose of the AI Act is expressly confirmed by the Union legislature
      in the Toys Safety Regulation, which explains in its Recital 15 that ''[i]n
      accordance with Regulation (EU) 2024/1689, toys with AI systems as safety components
      that require a thirdparty conformity assessment are classified as high-risk
      AI systems. The choice by the manufacturer of the conformity assessment procedures
      for such toys, if it is possible to opt out of a third-party conformity assessment
      where harmonised standards have been applied, should not affect the classification
      as a high-risk AI system in accordance with Article 6(1) of that Regulation.''
      On this basis, AI systems that are intended to be used as safety components
      or are themselves products covered by the Toys Safety Regulation, in accordance
      with Article 26(2) and Article 26(3) of that regulation, are classified as high-risk
      pursuant to Article 6(1) AI Act. Similarly, AI systems that are intended to
      be used as safety components of products or that are themselves products covered
      by Annex I of the Machinery Regulation, in accordance with Article 25(2) and
      Article 25(3) of that regulation, are classified as high-risk pursuant to Article
      6(1) AI Act.\n\n10 Commission notice The ''Blue Guide'' on the implementation
      of EU product rules 2022, Text with EEA relevance, (OJ C 247, 29.6.2022, pp.
      1-152), Section 5.1.9.\n\n11 For example, under Article 3(1) (a) of the Directive
      2014/53/EU of the European Parliament and of the Council of 16 April 2014 on
      the harmonisation of the laws of the Member States relating to the making available
      on the market of radio equipment and repealing Directive 1999/5/EC Text with
      EEA relevance (OJ L 153, 22.5.2014, pp. 62-106), for aspect of safety the manufacturer
      can use Module A without mandatory use of harmonised standards or mandatory
      involvement of a notified body.\n\n12 Regulation (EU) 2025/2509 of the European
      Parliament and of the Council of 26 November 2025 on the safety of toys and
      repealing Directive 2009/48/EC, Text with EEA relevanc, (PE/50/2025/INIT, OJ
      L, 2025/2509, 12.12.2025).\n\n13 Commission notice The ''Blue Guide'' on the
      implementation of EU product rules 2022, Text with EEA relevance, 2022/C 247/01,
      (OJ C 247, 29.6.2022, pp. 1-152), Section 5.1.1: ''Conformity assessment must
      not be confused with market surveillance, which consists of controls by the
      national market surveillance authorities after the product has been placed on
      the market. However, both techniques are complementary and equally necessary
      to ensure the protection of the public interests at stake and the smooth functioning
      of the internal market.''\n\n[guide:guide-high-risk-annex-i:para:23] (2. The
      main elements for classification as high-risk under Article 6(1) AI Act \u203a
      2.1. Introduction)\n(23) Annex I AI Act does not list individual products that
      should be classified as high-risk, but rather Union harmonisation legislation
      that regulates the safety aspects of certain products. Whether an AI system
      falls within the scope of Annex I AI Act as a regulated product itself, or as
      a safety component of a regulated product, therefore depends on whether the
      system, or the product of which the system constitutes a safety component, falls
      within the material scope of one of the legislative acts listed in that annex.
      Annex I AI Act includes, inter alia, Union harmonisation legislation covering
      products such as machinery, toys, lifts, equipment and protective systems intended
      for use in potentially explosive atmospheres, radio equipment, pressure equipment,
      recreational craft, cableway installations, appliances burning gaseous fuels,
      medical devices, in vitro diagnostic medical devices, and products in the automotive
      and aviation sectors. The fact that a product is intended for consumer or household
      use does not in itself exclude it from the scope of the AI Act.\n\n[guide:guide-art50:para:30]
      (3.1.1. AI systems intended to interact directly with natural persons)\n(30)
      Four elements must be present for a system to fall within the scope of Article
      50(1) AI Act: (i) the system must be an AI system, (ii) intended to interact,
      (iii) directly, (iv) with natural persons.\n\ni. An AI system: The system must
      fulfil the elements of the AI system definition ( 18 ), which excludes simple
      non-AI automated response mechanisms (e.g., traditional out-of-office emails,
      rule-based quick message answers).\n\nii. Intended to interact: The AI system
      must be intended to interact with natural persons. Interaction entails the capability
      of a bidirectional exchange of information or actions between natural persons
      and the AI system with a genuine conversational or responsive character. It
      can occur in various forms (e.g. auditory, visual and physical). Natural persons
      should be able to provide input (e.g., written text or other forms of content,
      voice, or physical actions) to the AI system (e.g. via technical communication
      means including online interfaces, phone or e-mail, or directly), while the
      AI system should be capable of responding with contextual output (including
      any type of content or actions) and vice-versa. The interaction may cover any
      type of output or format that can be perceived and understood by humans. It
      does not have to be initiated by a human; it may also cover AI content or actions
      eliciting a human response. The interaction may be a one-time exchange (e.g.
      single prompt followed with a single reply) or take place over a certain period
      time (multiturn). Systems that only passively collect data and are not capable
      of engaging in an exchange with natural persons (e.g. automated facial-recognition
      access controls) or just collect one-time feedback (e.g. spam filters), are
      not considered to interact with natural persons.\n\niii. Direct interaction:
      The interaction between the AI system and the natural persons must be direct.
      This typically involves real-time or near real-time interaction (including through
      capabilities of the system to write and send messages to natural persons or
      otherwise interact with the physical or virtual environment that can be perceived
      by natural persons). Direct interaction excludes indirect or mediated human
      interaction where a natural person is exposed to AI outputs without directly
      interacting with the system (for example, if customer service representatives
      use AI assistance tools to help them communicate with natural persons or if
      the AI output is not made available to the person by the AI system itself, but
      by another person disseminating the content). However, the mere possibility
      for humans to intervene or review the AI system''s outputs should not be used
      to circumvent the application of the disclosure requirement under Article 50(1)
      AI Act. Cases of products and services blending AI-generated responses with
      human-curated content fall within the scope of Article 50(1) AI Act and require
      disclosure for the specific outputs in the interaction that are AI-generated,
      unless those AI outputs have been properly reviewed and sent by humans as the
      main interlocutors with the natural persons.\n\n( 18 ) See Article 3(1) AI Act.
      For further guidance on the concept of AI system, see Commission Guidelines
      on the definition of an AI system, 29.7.2025, C(2025) 5053 final.\n\niv. With
      natural persons: Article 50(1) AI Act requires that the AI system interacts
