      at all levels;\n[annex:III:3:d] AI systems intended to be used for monitoring
      and detecting prohibited behaviour of students during tests in the context of
      or within educational and vocational training institutions at all levels.\n[annex:III:4:a]
      AI systems intended to be used for the recruitment or selection of natural persons,
      in particular to place targeted job advertisements, to analyse and filter job
      applications, and to evaluate candidates;\n[annex:III:4:b] AI systems intended
      to be used to make decisions affecting terms of work-related relationships,
