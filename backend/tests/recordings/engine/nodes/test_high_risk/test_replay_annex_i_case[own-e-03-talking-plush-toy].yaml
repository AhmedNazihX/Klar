    body: '{"input":["Instruct: Given a description of an AI system or a question
      about the EU AI Act, retrieve the provisions of the AI Act that apply\nQuery:We''re
      a 60-person toy company in Barcelona. Our new plush fox, Pip, has a microphone
      and a speaker and chats with children aged six and up: it answers questions,
      tells stories and plays word games. The conversation runs on a large language
      model we license from a US provider, with our own content filters and a fixed
      persona, and Pip connects to it over Wi-Fi. Pip doesn''t move and has no parts
      that heat up. For the CE marking we applied the harmonised standards for toy
      safety and for the radio part and did the conformity assessment ourselves; no
      notified body was involved. Pip goes on sale in Spain and France for Christmas
      2026, and a unicorn version is already planned."],"model":"qwen/qwen3-embedding-8b","dimensions":1536,"encoding_format":"float","provider":{"allow_fallbacks":false,"data_collection":"deny","order":["nebius"],"zdr":true}}'
