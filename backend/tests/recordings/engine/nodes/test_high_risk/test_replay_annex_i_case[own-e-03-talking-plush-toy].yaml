      and developed in such a way that they disclose both their artificial nature
      and the person on whose behalf they are acting, considering the need for transparency
      of the origin and the delegation of authority and accountability for the consequences
      of their actions. This includes cases where AI agents are capable of interacting
      in complex multi-agent architectures with other AI agents that directly interact
      with the natural persons in the execution of the task. Nevertheless, it may
      not always be possible for the provider of the AI agent to identify in advance
      individual instances of direct interaction of an AI agent with other natural
      persons once the AI agent is deployed in different contexts. Where the provider
      cannot reliably determine whether the AI agent will directly interact with a
      natural person before placing the AI agent on the market or putting it into
      service, the agent should be designed at the architecture level, and instructed,
      to disclose itself as such in every situation where it is reasonably likely
