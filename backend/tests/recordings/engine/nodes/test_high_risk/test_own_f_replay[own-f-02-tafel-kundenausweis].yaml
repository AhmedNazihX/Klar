    body: '{"input":["Instruct: Given a description of an AI system or a question
      about the EU AI Act, retrieve the article, Annex point or recital of the AI
      Act that governs it\nQuery:Wir sind ein gemeinn\u00fctziger Tafel-Verein in
      Dortmund mit 120 Ehrenamtlichen und versorgen jede Woche rund 2.000 Haushalte
      mit gespendeten Lebensmitteln. Seit dem Fr\u00fchjahr nutzen wir die Software
      eines kleinen Anbieters: Sie liest bei der Anmeldung die hochgeladenen Nachweise
      aus, etwa B\u00fcrgergeld-, Renten- oder Wohngeldbescheide, gleicht sie mit
      unseren Einkommensgrenzen ab und schl\u00e4gt vor, ob der Haushalt einen Kundenausweis
      bekommt und f\u00fcr wie viele Personen. Am Ende entscheidet unser Vorstand.
      Wir handeln dabei ganz auf eigene Rechnung: Die Stadt beauftragt uns nicht und
      zahlt uns nichts, und einen Anspruch auf unsere Lebensmittel gibt es nicht.
      Nebenbei plant die Software auch die Abholtouren bei den Superm\u00e4rkten."],"model":"qwen/qwen3-embedding-8b","dimensions":1536,"encoding_format":"float","provider":{"allow_fallbacks":false,"data_collection":"deny","order":["nebius"],"zdr":true}}'
