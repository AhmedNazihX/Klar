      and examples found:\n[guide:guide-prohibited:para:163] (b) Schlechterstellung
      oder Benachteiligung in nicht miteinander verbundenen sozialen Zusammenh\u00e4ngen
      und/oder ungerechtfertigte oder unverh\u00e4ltnism\u00e4\u00dfige Behandlung)\n(163)
      Die letzte Bedingung f\u00fcr die Geltung des Verbots nach Artikel 5 Absatz
      1 Buchstabe c der KI-Verordnung lautet, dass die Verwendung der sozialen Bewertung
      zu einer Schlechterstellung oder Benachteiligung f\u00fchren muss (oder f\u00fchren
      kann), entweder\n\ni. in sozialen Zusammenh\u00e4ngen, die in keinem Zusammenhang
      zu den Umst\u00e4nden stehen, unter denen die Daten urspr\u00fcnglich erzeugt
      oder erhoben wurden, oder\n\nii. die im Hinblick auf das soziale Verhalten oder
      dessen Tragweite ungerechtfertigt oder unverh\u00e4ltnism\u00e4\u00dfig ist.\n\n120
      Diese Auslegung steht im Einklang mit dem Urteil des EuGH in der Rechtssache
      SCHUFA I, in dem der EuGH im Zusammenhang mit der automatisierten Entscheidungsfindung
      entschieden hat, dass ein von einer anderen Stelle als derjenigen, die die endg\u00fcltige
      Entscheidung trifft, erstellter \"Score\" (Bewertung, die Profiling darstellt)
      eine automatisierte Entscheidung im Sinne von Artikel 22 DSGVO darstellen kann.
      Vgl. Urteil SCHUFA I, Rn. 42 bis 51 und 60 bis 62.\n\n[guide:guide-prohibited:para:166]
      (Szenario 1: Schlechterstellung oder Benachteiligung in sozialen Kontexten,
      die in keinem Zusammenhang miteinander stehen)\n(166) Im ersten in Artikel 5
      Absatz 1 Buchstabe c Ziffer i der KI-Verordnung beschriebenen Szenario muss
      die aus der Bewertung resultierende Schlechterstellung oder Benachteiligung
      in sozialen Kontexten stattfinden, die in keinem Zusammenhang zu den Umst\u00e4nden
      stehen, unter denen die Daten urspr\u00fcnglich erzeugt oder erhoben wurden.
      Dies beinhaltet nicht nur, dass die Personen aufgrund der sozialen Bewertung
      vielleicht benachteiligt oder schlechter gestellt werden, sondern auch, dass
      die Daten \u00fcber ihr soziales Verhalten oder ihre bekannten, abgeleiteten
      oder vorhergesagten pers\u00f6nlichen Eigenschaften oder Pers\u00f6nlichkeitsmerkmale
      in sozialen Kontexten erzeugt oder erhoben wurden, die in keinem Zusammenhang
      mit dem Kontext stehen, in dem die Bewertung stattfindet. Die in diesen (nicht
      mit dem Kontext der Datenerhebung zusammenh\u00e4ngenden) Kontexten erhobenen
      oder erzeugten Daten m\u00fcssen anschlie\u00dfend vom KI-System f\u00fcr die
      Bewertung der Personen verwendet werden, ohne dass ein offensichtlicher Zusammenhang
      zu dem Zweck der Bewertung oder Einstufung besteht, oder sie m\u00fcssen in
      einer Weise verwendet werden, die zu einer allgemeinen \u00dcberwachung der
      Personen oder Gruppen von Personen f\u00fchrt. In den meisten F\u00e4llen geschieht
      dies gegen die berechtigten Erwartungen der Personen und unter Verletzung des
      Datenschutzrechts der Union und m\u00f6glicherweise anderer geltender Vorschriften,
      in denen die Arten von Daten und Quellen festgelegt sind, die als f\u00fcr die
      Bewertung oder Einstufung relevant und notwendig erachtet werden. Ob diese Bedingung
      erf\u00fcllt ist, ist mittels einer Einzelfallpr\u00fcfung unter Ber\u00fccksichtigung
      des Zwecks der Bewertung und der Zusammenh\u00e4nge, in denen die Daten erhoben
      und erzeugt wurden, zu ermitteln.\n\n121 Erw\u00e4gungsgrund 31 der KI-Verordnung.\n\nBeispiele
      f\u00fcr nach Artikel 5 Absatz 1 Buchstabe c Ziffer i der KI-Verordnung verbotene
      Schlechterstellungen oder Benachteiligungen in nicht miteinander zusammenh\u00e4ngenden
      sozialen Zusammenh\u00e4ngen:\n\n- Die nationalen Steuerbeh\u00f6rden setzen
      bei allen Steuererkl\u00e4rungen in einem Land ein KI-Prognoseinstrument ein,
      um Steuererkl\u00e4rungen f\u00fcr genauere Kontrollen auszuw\u00e4hlen. Um
      bestimmte Personen f\u00fcr Kontrollen auszuw\u00e4hlen, verwendet das KI-Tool
      relevante Variablen wie Jahreseinkommen, Verm\u00f6genswerte (Immobilien, Kraftfahrzeuge
      usw.) sowie Daten \u00fcber Familienangeh\u00f6rige von Beg\u00fcnstigten, aber
      auch Daten wie soziale Gewohnheiten der Steuerzahler oder Internetverbindungen,
      die damit nicht zusammenh\u00e4ngen.\n\n- Ein Sozialamt verwendet zur Sch\u00e4tzung
      der Betrugswahrscheinlichkeit bei Empf\u00e4ngern von Haushaltszulagen ein KI-System,
      das sich auf Merkmale st\u00fctzt, die in sozialen Kontexten ohne offensichtlichen
      Zusammenhang mit oder Relevanz f\u00fcr die Bewertung von Betrug erhoben oder
      abgeleitet werden, wie z. B. ein Ehepartner mit einer bestimmten Staatsangeh\u00f6rigkeit
      oder ethnischen Herkunft, der Besitz eines Internetanschlusses, das Verhalten
      auf sozialen Plattformen oder die Leistung am Arbeitsplatz usw. 122 Im Gegensatz
      dazu k\u00f6nnten Daten, die f\u00fcr die Zuweisung der Leistungen relevant
      sind und rechtm\u00e4\u00dfig erhoben wurden, zur Ermittlung des Betrugsrisikos
      herangezogen werden, da Beh\u00f6rden mit der \u00dcberpr\u00fcfung, ob Sozialleistungen
      korrekt zugewiesen werden, ein legitimes Ziel verfolgen.\n\n- Eine \u00f6ffentliche
      Arbeitsagentur nutzt ein KI-System, um Arbeitslose auf der Grundlage eines Interviews
      und einer KI-gest\u00fctzten Bewertung einzustufen und auf diese Weise festzustellen,
      ob eine Person staatliche Besch\u00e4ftigungsf\u00f6rderung erhalten sollte.
      Diese Bewertung beruht auf relevanten pers\u00f6nlichen Eigenschaften wie Alter
      und Bildung, aber auch auf Variablen, die aus Daten und Kontexten ohne erkennbaren
      Zusammenhang mit dem Zweck der Bewertung erhoben oder abgeleitet wurden, wie
      z. B. Familienstand, Gesundheitsdaten \u00fcber chronische Krankheiten, Sucht
      usw. 123\n\nDiese inakzeptablen Bewertungspraktiken lassen sich von rechtm\u00e4\u00dfigen
      Praktiken unterscheiden, bei denen im Einklang mit Unionsrecht und nationalem
      Recht Personen f\u00fcr einen besti [\u2026]\n\n[guide:guide-prohibited:para:13]
      (2.2. Rechtsgrundlage der Verbote)\n(13) In Artikel 3 Nummer 11 der KI-Verordnung
      wird die Inbetriebnahme definiert als \"die Bereitstellung eines KI-Systems
      in der Union zum Erstgebrauch direkt an den Betreiber oder zum Eigengebrauch
      entsprechend seiner Zweckbestimmung\" und umfasst daher sowohl die Bereitstellung
      an Dritte zur Erstnutzung als auch die interne Entwicklung und den Einsatz.
      Die Zweckbestimmung des Systems ist \"die Verwendung, f\u00fcr die ein KI-System
      laut Anbieter bestimmt ist, einschlie\u00dflich der besonderen Umst\u00e4nde
      und Bedingungen f\u00fcr die Verwendung, entsprechend den vom Anbieter bereitgestellten
      Informationen in den Betriebsanleitungen, im Werbe- oder Verkaufsmaterial und
      in diesbez\u00fcglichen Erkl\u00e4rungen sowie in der technischen Dokumentation\"
      7 .\n\nZum Beispiel baut ein Anbieter ein RBI-System au\u00dferhalb der Union
      und stellt dieses System einer Strafverfolgungsbeh\u00f6rde oder einem in einem
      Mitgliedstaat niedergelassenen Privatunternehmen zur erstmaligen Nutzung zur
      Verf\u00fcgung, wodurch es in Betrieb genommen wird.\n\nEine Beh\u00f6rde entwickelt
      zum Beispiel intern ein Bewertungssystem und setzt es ein, um das Betrugsrisiko
      der Empf\u00e4nger von Haushaltszulagen vorauszusagen; somit nimmt sie das System
      in Betrieb.\n\n[guide:guide-prohibited:para:59] (3.1. Begr\u00fcndung und Ziele)\n(59)
      Der Grundgedanke dieser Verbote besteht darin, die Autonomie und das Wohlergehen
      des Einzelnen vor manipulativen, t\u00e4uschenden und ausbeuterischen KI-Praktiken
      zu sch\u00fctzen, die die Autonomie, Entscheidungsfindung und freie Auswahl
      eines Einzelnen untergraben und beeintr\u00e4chtigen k\u00f6nnen 52 . Die Verbote
      zielen darauf ab, das Recht auf Menschenw\u00fcrde (Artikel 1 der Charta) zu
      sch\u00fctzen, das auch die Grundlage aller Grundrechte bildet und die individuelle
      Autonomie als wesentlichen Aspekt umfasst. Die Verbote zielen insbesondere darauf
      ab, Manipulation und Ausbeutung durch KISysteme zu verhindern, die Einzelpersonen
      auf blo\u00dfe Instrumente zur Erreichung bestimmter Ziele beschr\u00e4nken,
      und um diejenigen zu sch\u00fctzen, die am schutzbed\u00fcrftigsten und anf\u00e4lligsten
      f\u00fcr sch\u00e4dliche Manipulation und Ausbeutung sind. Die Verbote von in
      erheblichem Ma\u00dfe sch\u00e4dlichen manipulativen, t\u00e4uschenden und ausbeuterischen
      KI-Praktiken stehen voll und ganz im Einklang mit den umfassenderen Zielen der
      KI-Verordnung, vertrauensw\u00fcrdige und auf den Menschen ausgerichtete KISysteme
      zu f\u00f6rdern, die sicher, transparent und fair sind, der Menschheit dienen
      und mit dem Vorrang menschlichen Handelns und den Werten der EU im Einklang
      stehen.\n\n50 Artikel 99 der KI-Verordnung.\n\n51 Artikel 100 der KI-Verordnung.\n\n3.2.
      Hauptbestandteile des Verbots nach Artikel 5 Absatz 1 Buchstabe a der KI-Verordnung
      - sch\u00e4dliche Manipulation\n\nIn Artikel 5 Absatz 1 Buchstabe a der KI-Verordnung
      wird Folgendes bestimmt:\n\n(1) Folgende Praktiken im KI-Bereich sind verboten:\n\na)
      das Inverkehrbringen, die Inbetriebnahme oder die Verwendung eines KI-Systems,
      das Techniken der unterschwelligen Beeinflussung au\u00dferhalb des Bewusstseins
      einer Person oder absichtlich manipulative oder t\u00e4uschende Techniken mit
      dem Ziel oder der Wirkung einsetzt, das Verhalten einer Person oder einer Gruppe
      von Personen wesentlich zu ver\u00e4ndern, indem ihre F\u00e4higkeit, eine fundierte
      Entscheidung zu treffen, deutlich beeintr\u00e4chtigt wird, wodurch sie veranlasst
      wird, eine Entscheidung zu treffen, die sie andernfalls nicht getroffen h\u00e4tte,
      und zwar in einer Weise, die dieser Person, einer anderen Person oder einer
      Gruppe von Personen erheblichen Schaden zuf\u00fcgt oder mit hinreichender Wahrscheinlichkeit
      zuf\u00fcgen wird.\n\n[guide:guide-prohibited:para:359] (10. SCHUTZVORKEHRUNGEN
      UND BEDINGUNGEN F\u00dcR DIE AUSNAHMEN (ARTIKEL 5 ABS\u00c4TZE 2 BIS 7 DER KI-VERORDNUNG)
      \u203a 10.1. Gezielte individuelle Ma\u00dfnahmen und Schutzvorkehrungen (Artikel
      5 Absatz 2 der KI-Verordnung) \u203a In Artikel 5 Absatz 2 der KI-Verordnung
      wird Folgendes bestimmt:)\n(359) Zweitens ist vor der Verwendung des Systems
      die Art der Situation, die zu einer m\u00f6glichen Verwendung f\u00fchrt, insbesondere
      die Schwere, die Wahrscheinlichkeit und das Ausma\u00df des Schadens, f\u00fcr
      die nat\u00fcrlichen Personen, die Gesellschaft und die Strafverfolgungszwecke
      verursacht w\u00fcrde, wenn das System nicht genutzt w\u00fcrde, gegen die Folgen
      abzuw\u00e4gen, die die Nutzung des Systems f\u00fcr die Rechte und Freiheiten
      der betroffenen Personen h\u00e4tte, insbesondere die Schwere, die Wahrscheinlichkeit
      und das Ausma\u00df dieser Folgen. Dabei sollte auch bewertet werden, ob den
      Strafverfolgungsbeh\u00f6rden oder den in ihrem Namen handelnden Stellen weniger
      stark eingreifende alternative L\u00f6sungen zur Verf\u00fcgung stehen.\n\nSo
      ist es den Strafverfolgungsbeh\u00f6rden beispielsweise untersagt, aus Gr\u00fcnden
      der allgemeinen Sicherheit, der Verbrechensverh\u00fctung und wegen Bedenken
      im Hinblick auf \u00dcberf\u00fcllung Echtzeit-Gesichtserkennungssysteme auf
      der Stra\u00dfe zu verwenden, da dies die st\u00e4ndige Beobachtung und \u00dcberwachung
      aller Personen umfassen w\u00fcrde, nicht zeitlich begrenzt ist und daher nicht
      die Kriterien f\u00fcr die Ausnahme von dem Verbot nach Artikel 5 Absatz 1 Buchstabe
      h der KI-Verordnung erf\u00fcllen w\u00fcrde.\n\n[guide:guide-prohibited:para:34]
      (2.5.4. Pers\u00f6nliche und nicht-berufliche T\u00e4tigkeit)\n(34) In Artikel
      2 Absatz 10 der KI-Verordnung wird bestimmt, dass die KI-Verordnung nicht f\u00fcr
