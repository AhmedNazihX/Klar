    body: '{"input":["Instruct: Given a description of an AI system or a question
      about the EU AI Act, retrieve the article, Annex point or recital of the AI
      Act that governs it\nQuery:Wir sind ein Maschinenbauunternehmen aus Oberfranken
      mit rund 2.300 Besch\u00e4ftigten. Nach jeder j\u00e4hrlichen Gehaltsrunde,
      wenn alle Erh\u00f6hungen von den F\u00fchrungskr\u00e4ften festgelegt und den
      Besch\u00e4ftigten mitgeteilt sind, l\u00e4sst unsere Personalabteilung ein
      Analysewerkzeug aus unserer HR-Suite \u00fcber die abgeschlossenen Entscheidungen
      laufen. Es sucht nach Auff\u00e4lligkeiten, etwa ob eine Abteilung bei gleicher
      Eingruppierung deutlich unter dem Schnitt liegt oder ob Teilzeitkr\u00e4fte
      systematisch weniger bekommen, und erstellt einen anonymisierten Bericht f\u00fcr
      Gesch\u00e4ftsleitung und Betriebsrat. An den einzelnen Erh\u00f6hungen \u00e4ndert
      das nichts; was auff\u00e4llt, flie\u00dft in die Leitlinien f\u00fcr die n\u00e4chste
      Runde, die wieder Menschen festlegen. Die HR-Suite nutzen wir au\u00dferdem
      f\u00fcr die Urlaubsplanung."],"model":"qwen/qwen3-embedding-8b","dimensions":1536,"encoding_format":"float","provider":{"allow_fallbacks":false,"data_collection":"deny","order":["nebius"],"zdr":true}}'
