      verwendet werden sollen, um das Ergebnis einer Wahl oder eines Referendums oder
      das Wahlverhalten nat\u00fcrlicher Personen bei der Aus\u00fcbung ihres Wahlrechts
      bei einer Wahl oder einem Referendum zu beeinflussen. Dazu geh\u00f6ren nicht
      KI-Systeme, deren Ausgaben nat\u00fcrliche Personen nicht direkt ausgesetzt
      sind, wie Instrumente zur Organisation, Optimierung oder Strukturierung politischer
      Kampagnen in administrativer oder logistischer Hinsicht.\n\nGuideline passages
      and examples found:\n[guide:guide-prohibited:para:166] (Szenario 1: Schlechterstellung
      oder Benachteiligung in sozialen Kontexten, die in keinem Zusammenhang miteinander
      stehen)\n(166) Im ersten in Artikel 5 Absatz 1 Buchstabe c Ziffer i der KI-Verordnung
      beschriebenen Szenario muss die aus der Bewertung resultierende Schlechterstellung
      oder Benachteiligung in sozialen Kontexten stattfinden, die in keinem Zusammenhang
      zu den Umst\u00e4nden stehen, unter denen die Daten urspr\u00fcnglich erzeugt
      oder erhoben wurden. Dies beinhaltet nicht nur, dass die Personen aufgrund der
      sozialen Bewertung vielleicht benachteiligt oder schlechter gestellt werden,
      sondern auch, dass die Daten \u00fcber ihr soziales Verhalten oder ihre bekannten,
      abgeleiteten oder vorhergesagten pers\u00f6nlichen Eigenschaften oder Pers\u00f6nlichkeitsmerkmale
      in sozialen Kontexten erzeugt oder erhoben wurden, die in keinem Zusammenhang
      mit dem Kontext stehen, in dem die Bewertung stattfindet. Die in diesen (nicht
      mit dem Kontext der Datenerhebung zusammenh\u00e4ngenden) Kontexten erhobenen
      oder erzeugten Daten m\u00fcssen anschlie\u00dfend vom KI-System f\u00fcr die
      Bewertung der Personen verwendet werden, ohne dass ein offensichtlicher Zusammenhang
      zu dem Zweck der Bewertung oder Einstufung besteht, oder sie m\u00fcssen in
      einer Weise verwendet werden, die zu einer allgemeinen \u00dcberwachung der
      Personen oder Gruppen von Personen f\u00fchrt. In den meisten F\u00e4llen geschieht
      dies gegen die berechtigten Erwartungen der Personen und unter Verletzung des
      Datenschutzrechts der Union und m\u00f6glicherweise anderer geltender Vorschriften,
      in denen die Arten von Daten und Quellen festgelegt sind, die als f\u00fcr die
      Bewertung oder Einstufung relevant und notwendig erachtet werden. Ob diese Bedingung
      erf\u00fcllt ist, ist mittels einer Einzelfallpr\u00fcfung unter Ber\u00fccksichtigung
      des Zwecks der Bewertung und der Zusammenh\u00e4nge, in denen die Daten erhoben
      und erzeugt wurden, zu ermitteln.\n\n121 Erw\u00e4gungsgrund 31 der KI-Verordnung.\n\nBeispiele
      f\u00fcr nach Artikel 5 Absatz 1 Buchstabe c Ziffer i der KI-Verordnung verbotene
      Schlechterstellungen oder Benachteiligungen in nicht miteinander zusammenh\u00e4ngenden
      sozialen Zusammenh\u00e4ngen:\n\n- Die nationalen Steuerbeh\u00f6rden setzen
      bei allen Steuererkl\u00e4rungen in einem Land ein KI-Prognoseinstrument ein,
      um Steuererkl\u00e4rungen f\u00fcr genauere Kontrollen auszuw\u00e4hlen. Um
      bestimmte Personen f\u00fcr Kontrollen auszuw\u00e4hlen, verwendet das KI-Tool
      relevante Variablen wie Jahreseinkommen, Verm\u00f6genswerte (Immobilien, Kraftfahrzeuge
      usw.) sowie Daten \u00fcber Familienangeh\u00f6rige von Beg\u00fcnstigten, aber
      auch Daten wie soziale Gewohnheiten der Steuerzahler oder Internetverbindungen,
      die damit nicht zusammenh\u00e4ngen.\n\n- Ein Sozialamt verwendet zur Sch\u00e4tzung
      der Betrugswahrscheinlichkeit bei Empf\u00e4ngern von Haushaltszulagen ein KI-System,
      das sich auf Merkmale st\u00fctzt, die in sozialen Kontexten ohne offensichtlichen
      Zusammenhang mit oder Relevanz f\u00fcr die Bewertung von Betrug erhoben oder
      abgeleitet werden, wie z. B. ein Ehepartner mit einer bestimmten Staatsangeh\u00f6rigkeit
      oder ethnischen Herkunft, der Besitz eines Internetanschlusses, das Verhalten
      auf sozialen Plattformen oder die Leistung am Arbeitsplatz usw. 122 Im Gegensatz
      dazu k\u00f6nnten Daten, die f\u00fcr die Zuweisung der Leistungen relevant
      sind und rechtm\u00e4\u00dfig erhoben wurden, zur Ermittlung des Betrugsrisikos
      herangezogen werden, da Beh\u00f6rden mit der \u00dcberpr\u00fcfung, ob Sozialleistungen
      korrekt zugewiesen werden, ein legitimes Ziel verfolgen.\n\n- Eine \u00f6ffentliche
      Arbeitsagentur nutzt ein KI-System, um Arbeitslose auf der Grundlage eines Interviews
      und einer KI-gest\u00fctzten Bewertung einzustufen und auf diese Weise festzustellen,
      ob eine Person staatliche Besch\u00e4ftigungsf\u00f6rderung erhalten sollte.
      Diese Bewertung beruht auf relevanten pers\u00f6nlichen Eigenschaften wie Alter
      und Bildung, aber auch auf Variablen, die aus Daten und Kontexten ohne erkennbaren
      Zusammenhang mit dem Zweck der Bewertung erhoben oder abgeleitet wurden, wie
      z. B. Familienstand, Gesundheitsdaten \u00fcber chronische Krankheiten, Sucht
      usw. 123\n\nDiese inakzeptablen Bewertungspraktiken lassen sich von rechtm\u00e4\u00dfigen
      Praktiken unterscheiden, bei denen im Einklang mit Unionsrecht und nationalem
      Recht Personen f\u00fcr einen besti [\u2026]\n\n[guide:guide-prohibited:para:7]
      (MITTEILUNG DER KOMMISSION \u203a Leitlinien der Kommission zu verbotenen Praktiken
      der k\u00fcnstlichen Intelligenz gem\u00e4\u00df der Verordnung (EU) 2024/1689
      (KI-Verordnung) \u203a INHALT \u203a 1. HINTERGRUND UND ZIELE)\n(7) Die Anwendung
      von Artikel 5 der KI-Verordnung erfordert eine Einzelfallpr\u00fcfung, bei der
      die konkrete Situation in jedem einzelnen Fall geb\u00fchrend ber\u00fccksichtigt
      wird. Daher haben die in diesen Leitlinien aufgef\u00fchrten Beispiele lediglich
      Hinweischarakter und lassen die Notwendigkeit einer solchen Einzelfallpr\u00fcfung
      unber\u00fchrt.\n\n[guide:guide-prohibited:para:177] (4.3. Au\u00dferhalb des
      Anwendungsbereichs)\n(177) Werden sektorspezifische Rechtsvorschriften der Union
      eingehalten, beispielsweise im Bereich der Bonit\u00e4tsbewertung, der Bek\u00e4mpfung
      von Geldw\u00e4sche usw., in denen festgelegt ist, welche Art von Daten f\u00fcr
      den spezifischen legitimen Zweck der Bewertung als relevant und erforderlich
      verwendet werden k\u00f6nnen, und mit denen sichergestellt wird, dass die Behandlung
      gerechtfertigt ist und in einem angemessenen Verh\u00e4ltnis zum sozialen Verhalten
      steht, kann somit sichergestellt werden, dass die betreffende KI-Praxis nicht
      in den Anwendungsbereich des Verbots nach Artikel 5 Absatz 1 Buchstabe c der
      KI-Verordnung f\u00e4llt.\n\nBeispiele f\u00fcr rechtm\u00e4\u00dfige Bewertungspraktiken,
      die im Einklang mit Unionsrecht und nationalem Recht stehen und nicht in den
      Anwendungsbereich von Artikel 5 Absatz 1 Buchstabe c der KI-Verordnung fallen:\n\n-
      Nicht in den Anwendungsbereich von Artikel 5 Absatz 1 Buchstabe c der KIVerordnung
      fallen Systeme zur finanziellen Bonit\u00e4tsbewertung, die von Kreditgebern
      oder Wirtschaftsauskunfteien zur Bewertung der finanziellen Kreditw\u00fcrdigkeit
      oder ausstehender Verbindlichkeiten eines Kunden genutzt werden, um eine Einstufung
      der Bonit\u00e4t oder Feststellung seiner Kreditw\u00fcrdigkeit vorzunehmen,
      wobei sie sich auf die Einnahmen und Ausgaben des Kunden und andere finanzielle
      und wirtschaftliche Umst\u00e4nde st\u00fctzen, sofern diese f\u00fcr den rechtm\u00e4\u00dfigen
      Zweck der Bonit\u00e4tsbewertung relevant sind und im Einklang mit Verbraucherschutzgesetzen
      126 stehen, in denen die Art der Daten und die erforderlichen Schutzvorkehrungen
      festgelegt sind, um die faire Behandlung von Verbrauchern bei Kreditw\u00fcrdigkeitspr\u00fcfungen
      zu gew\u00e4hrleisten.\n\n- Unternehmen haben ein berechtigtes Interesse daran,
      Kunden im Hinblick auf Finanzbetrug zu bewerten; diese Praktiken werden von
      dem Verbot nicht ber\u00fchrt, wenn die Bewertung auf relevanten Daten wie dem
      Transaktionsverhalten und Metadaten im Zusammenhang mit den Dienstleistungen,
      dem bisherigen Verhalten und anderen Faktoren beruht, die aus f\u00fcr die Ermittlung
      des Betrugsrisikos objektiv relevanten Quellen stammen und wenn die Schlechterstellung
      aufgrund dessen, dass sie eine Folge des betr\u00fcgerischen Verhaltens ist,
      gerechtfertigt und verh\u00e4ltnism\u00e4\u00dfig ist.\n\n- \u00dcber Telematikger\u00e4te
      erhobene Informationen, die zeigen, dass ein Fahrer zu schnell f\u00e4hrt oder
      keine sichere Fahrweise pflegt, und die von einem Versicherer, der telematikgest\u00fctzte
      Versicherungstarife f\u00fcr das hochriskante Fahrverhalten eines Versicherungsnehmers
      anbietet, genutzt werden, k\u00f6nnen zu einer Erh\u00f6hung der Versicherungspr\u00e4mien
      f\u00fcr den betreffenden Versicherungsnehmer genutzt und mit der durch dieses
      Fahrverhalten erh\u00f6hten Unfallgefahr begr\u00fcndet werden, sofern die Erh\u00f6hung
      der Versicherungspr\u00e4mie in einem angemessenen Verh\u00e4ltnis zum risikobehafteten
      Verhalten des Fahrers steht.\n\n- Die Erhebung und Verarbeitung von Daten, die
      f\u00fcr den rechtm\u00e4\u00dfigen Zweck von KISystemen relevant und erforderlich
      sind (z. B. gesundheits- und Schizophrenie bezogene Daten, die aus verschiedenen
      Quellen erhoben werden, um f\u00fcr Patienten Diagnosen zu erstellen), f\u00e4llt
      insbesondere deshalb nicht in den Anwendungsbereich von Artikel 5 Absatz 1 Buchstabe
      c der KI-Verordnung, weil sie relevante und notwendige Daten verarbeitet und
      in der Regel keine ungerechtfertigte Schlechterstellung oder Benachteiligung
      bestimmter nat\u00fcrlicher Personen mit sich bringt.\n\n126 Siehe insbesondere
      die Richtlinie (EU) 2023/2225 vom 18. Oktober 2023 \u00fcber Verbraucherkreditvertr\u00e4ge
      und zur Aufhebung der Richtlinie 2008/48/EG und die Leitlinien der Europ\u00e4ischen
      Bankenaufsichtsbeh\u00f6rde f\u00fcr die Kreditvergabe und \u00dcberwachung
      vom 29. Mai 2020, EBA/GL/2020/06.\n\n- Online-Plattformen, die aus Sicherheitsgr\u00fcnden
      ein Profiling der Nutzer ihrer Dienste vornehmen und sich dabei auf Daten st\u00fctzen,
      die f\u00fcr den Kontext und Zweck der Bewertung relevant sind, fallen nicht
      in den Anwendungsbereich von Artikel 5 Absatz 1 Buchstabe c der KI-Verordnung,
      sofern die Bewertung nicht zu einer Schlechterstellung f\u00fchrt, die in keinem
      ange [\u2026]\n\n[guide:guide-prohibited:para:254] (a) \"Arbeitsplatz\")\n(254)
      Der Begriff \"Arbeitsplatz\" sollte weit ausgelegt werden. Dieser Begriff bezieht
      sich auf jeden besonderen physischen oder virtuellen Raum, in dem nat\u00fcrliche
      Personen Aufgaben und Verantwortlichkeiten wahrnehmen, die ihnen von ihrem Arbeitgeber
      oder der Organisation, der sie angeschlossen sind, zugewiesen wurden, z. B.
      im Falle einer selbstst\u00e4ndigen Erwerbst\u00e4tigkeit. Dies schlie\u00dft
      s\u00e4mtliche Umgebungen ein, in denen die Arbeit ausgef\u00fchrt wird und
      die je nach Art der T\u00e4tigkeit stark variieren k\u00f6nnen, und zwar von
      B\u00fcror\u00e4umen, Fabriken und Lagern in Innenr\u00e4umen bis hin zu \u00f6ffentlich
      zug\u00e4nglichen R\u00e4umen wie Gesch\u00e4ften, Stadien oder Museen und zu
      Freigel\u00e4nden oder Kraftfahrzeugen sowie tempor\u00e4ren oder mobilen Arbeitsst\u00e4tten.
      Dies ist unabh\u00e4ngig vom Status als Arbeitnehmer, Auftragnehmer, Auszubildender,
      Freiwilliger usw. 161 Der Begriff \"Arbeitsplatz\" in Artikel 5 Absatz 1 Buchstabe
      f der KI-Verordnung sollte im Einklang mit anderen Bestimmungen der KI-Verordnung,
      die das Inverkehrbringen, die Inbetriebnahme oder die Verwendung von KI-Systemen
      in den Bereichen Besch\u00e4ftigung, Personalmanagement und Zugang zur Selbstst\u00e4ndigkeit
      betreffen, auch f\u00fcr Bewerber w\u00e4hrend des Auswahl- und Einstellungsverfahrens
      gelten, da ein Machtungleichgewicht besteht und die Emotionserkennung bereits
      in der Einstellungsphase in die Privatsph\u00e4re eingreifen kann.\n\nBeispiele:\n\n-
      Die Verwendung von Webcams und Stimmerkennungssystemen durch ein CallCenter
      zum Zweck der Nachverfolgung der Emotionen der Mitarbeiter, wie z. B. Wut, ist
      verboten 162 . Werden Emotionserkennungssysteme nur zu pers\u00f6nlichen Schulungszwecken
      eingesetzt, sind sie zul\u00e4ssig, sofern die Ergebnisse nicht Personen mit
      Personalverantwortung zur Verf\u00fcgung gestellt werden, sofern sich die Ergebnisse
      nicht auf die Bewertung, Bef\u00f6rderung usw. der geschulten Person auswirken
      k\u00f6nnen und sofern das Verbot nicht umgangen wird und die Verwendung des
      Emotionserkennungssystems keine Auswirkungen auf das Arbeitsverh\u00e4ltnis
      hat.\n\n- Die Verwendung von Stimmerkennungssystemen durch ein Call-Center zur
      Verfolgung von Emotionen ihrer Kunden wie Wut oder Ungeduld ist nach Artikel
