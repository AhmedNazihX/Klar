interactions:
- request:
    body: '{"input":["Instruct: Given a description of an AI system or a question
      about the EU AI Act, retrieve the article, Annex point or recital of the AI
      Act that governs it\nQuery:We are the municipal water utility of a city of about
      400,000 people. Since 2025 our planning department has used a forecasting tool,
      which we bought from a consultancy that sells it to several utilities, to estimate
      drinking-water demand in each supply district over the next 20 years from our
      consumption records, population projections and climate scenarios. The planners
      use the forecasts to draw up the long-term investment plan the city council
      approves every five years: which reservoirs, mains and treatment capacity to
      build, and when. The tool plays no part in running the network: pumps, valves,
      pressure and water quality are controlled and monitored around the clock from
      our control room with separate systems and alarms. A wrong forecast would bring
      an investment forward or push it back by a few years."],"model":"qwen/qwen3-embedding-8b","dimensions":1536,"encoding_format":"float","provider":{"allow_fallbacks":false,"data_collection":"deny","order":["nebius"],"zdr":true}}'
    headers:
