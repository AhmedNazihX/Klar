      the general activities of undertakings (undertakings collecting, disposing of
      or treating urban waste water, domestic waste water and industrial waste water).\n\n[guide:guide-high-risk-annex-iii:para:198]
      (3.2.4. The supply of water use case in critical infrastructure)\n(198) AI systems
