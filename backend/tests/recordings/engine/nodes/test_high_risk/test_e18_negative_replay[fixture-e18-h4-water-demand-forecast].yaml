      2017/745 on medical devices\n[annex:I:A:12] Regulation (EU) 2017/746 on in vitro
      diagnostic medical devices\n[annex:I:B:13] Regulation (EC) No 300/2008 on common
      rules in the field of civil aviation security\n[annex:I:B:14] Regulation (EU)
