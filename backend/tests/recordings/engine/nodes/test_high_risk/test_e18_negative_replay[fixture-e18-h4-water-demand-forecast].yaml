      market surveillance of motor vehicles and their trailers\n[annex:I:B:19] Regulation
      (EU) 2019/2144 on type-approval requirements for motor vehicles and their trailers\n[annex:I:B:20]
      Regulation (EU) 2018/1139 on common rules in the field of civil aviation and
      establishing a European Union Aviation Safety Agency\n[annex:I:B:21] Regulation
      (EU) 2023/1230 on machinery\n\nAnnex III:\n[annex:III:1:a] remote biometric
      identification systems. This shall not include AI systems intended to be used
      for biometric verification the sole purpose of which is to confirm that a specific
      natural person is the person he or she claims to be;\n[annex:III:1:b] AI systems
      intended to be used for biometric categorisation, according to sensitive or
      protected attributes or characteristics based on the inference of those attributes
      or characteristics;\n[annex:III:1:c] AI systems intended to be used for emotion
      recognition.\n[annex:III:2] Critical infrastructure: AI systems intended to
      be used as safety components in the management and operation of critical digital
      infrastructure, road traffic, or in the supply of water, gas, heating or electricity.\n[annex:III:3:a]
      AI systems intended to be used to determine access or admission or to assign
      natural persons to educational and vocational training institutions at all levels;\n[annex:III:3:b]
      AI systems intended to be used to evaluate learning outcomes, including when
      those outcomes are used to steer the learning process of natural persons in
