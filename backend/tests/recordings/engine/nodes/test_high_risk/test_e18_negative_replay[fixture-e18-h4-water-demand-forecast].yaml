      include AI systems to the output of which natural persons are not directly exposed,
      such as tools used to organise, optimise or structure political campaigns from
      an administrative or logistical point of view.\n\nGuideline passages and examples
      found:\n[guide:guide-high-risk-annex-iii:para:197] (3.2.4. The supply of water
      use case in critical infrastructure)\n(197) According to the approach presented
      in section 3.2.1.ii above, ''an AI system intended to be used in the management
      and operation of supply of water'' refers to an AI system intended to be used
      in an asset, a facility, equipment, a network, or an system or a part of an
