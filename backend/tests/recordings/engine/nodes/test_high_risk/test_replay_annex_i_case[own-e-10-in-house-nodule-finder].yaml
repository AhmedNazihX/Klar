- request:
    body: '{"input":["Instruct: Given a description of an AI system or a question
      about the EU AI Act, retrieve the provisions of the AI Act that apply\nQuery:Wir
      sind ein Universit\u00e4tsklinikum in S\u00fcddeutschland mit rund 8.000 Besch\u00e4ftigten.
      Unsere Radiologie hat zusammen mit der hauseigenen IT eine Software entwickelt,
      die in Thorax-CTs Lungenrundherde markiert und vermisst; die Radiologinnen und
      Radiologen sehen die Markierungen beim Befunden und entscheiden selbst. Die
      Software wird nur bei uns im Haus eingesetzt, nicht verkauft und an keine andere
      Klinik weitergegeben. Deshalb haben wir sie als Eigenherstellung nach der Medizinprodukteverordnung
      behandelt, ohne CE-Kennzeichnung und ohne benannte Stelle; ein vergleichbares
      Produkt auf dem Markt w\u00e4re mindestens Klasse IIa. Die Bilddaten stammen
      aus unseren eigenen Ger\u00e4ten. Derzeit validieren wir die Software intern;
      im klinischen Betrieb soll sie ab Herbst 2028 laufen, gleichzeitig mit dem Umzug
      der Radiologie in den Neubau."],"model":"qwen/qwen3-embedding-8b","dimensions":1536,"encoding_format":"float","provider":{"allow_fallbacks":false,"data_collection":"deny","order":["nebius"],"zdr":true}}'
