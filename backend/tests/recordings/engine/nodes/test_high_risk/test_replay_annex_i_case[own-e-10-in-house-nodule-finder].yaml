      oder Verfolgung von Straftaten verwendet werden sollen;\n[annex:III:6:d] KI-Systeme,
      die bestimmungsgem\u00e4\u00df von Strafverfolgungsbeh\u00f6rden oder in deren
      Namen oder von Organen, Einrichtungen und sonstigen Stellen der Union zur Unterst\u00fctzung
      von Strafverfolgungsbeh\u00f6rden zur Bewertung des Risikos, dass eine nat\u00fcrliche
      Person eine Straftat begeht oder erneut begeht, nicht nur auf der Grundlage
      der Erstellung von Profilen nat\u00fcrlicher Personen gem\u00e4\u00df Artikel
      3 Absatz 4 der Richtlinie (EU) 2016/680 oder zur Bewertung pers\u00f6nlicher
      Merkmale und Eigenschaften oder vergangenen kriminellen Verhaltens von nat\u00fcrlichen
      Personen oder Gruppen verwendet werden sollen;\n[annex:III:6:e] KI-Systeme,
      die bestimmungsgem\u00e4\u00df von Strafverfolgungsbeh\u00f6rden oder in deren
      Namen oder von Organen, Einrichtungen und sonstigen Stellen der Union zur Unterst\u00fctzung
      von Strafverfolgungsbeh\u00f6rden zur Erstellung von Profilen nat\u00fcrlicher
      Personen gem\u00e4\u00df Artikel 3 Absatz 4 der Richtlinie (EU) 2016/680 im
      Zuge der Aufdeckung, Ermittlung oder Verfolgung von Straftaten verwendet werden
      sollen.\n[annex:III:7:a] KI-Systeme, die bestimmungsgem\u00e4\u00df von zust\u00e4ndigen
      Beh\u00f6rden oder in deren Namen oder Organen, Einrichtungen und sonstigen
      Stellen der Union als L\u00fcgendetektoren verwendet werden sollen oder \u00e4hnliche
      Instrumente;\n[annex:III:7:b] KI-Systeme, die bestimmungsgem\u00e4\u00df von
      zust\u00e4ndigen Beh\u00f6rden oder in deren Namen oder von Organen, Einrichtungen
      und sonstigen Stellen der Union zur Bewertung eines Risikos verwendet werden
      sollen, einschlie\u00dflich eines Sicherheitsrisikos, eines Risikos der irregul\u00e4ren
      Einwanderung oder eines Gesundheitsrisikos, das von einer nat\u00fcrlichen Person
      ausgeht, die in das Hoheitsgebiet eines Mitgliedstaats einzureisen beabsichtigt
      oder eingereist ist;\n[annex:III:7:c] KI-Systeme, die bestimmungsgem\u00e4\u00df
      von zust\u00e4ndigen Beh\u00f6rden oder in deren Namen oder von Organen, Einrichtungen
      und sonstigen Stellen der Union verwendet werden sollen, um zust\u00e4ndige
      Beh\u00f6rden bei der Pr\u00fcfung von Asyl- und Visumantr\u00e4gen sowie Aufenthaltstiteln
      und damit verbundenen Beschwerden im Hinblick auf die Feststellung der Berechtigung
      der den Antrag stellenden nat\u00fcrlichen Personen, einschlie\u00dflich damit
      zusammenh\u00e4ngender Bewertungen der Verl\u00e4sslichkeit von Beweismitteln,
      zu unterst\u00fctzen;\n[annex:III:7:d] KI-Systeme, die bestimmungsgem\u00e4\u00df
      von oder im Namen der zust\u00e4ndigen Beh\u00f6rden oder Organen, Einrichtungen
      und sonstigen Stellen der Union, im Zusammenhang mit Migration, Asyl oder Grenzkontrolle
      zum Zwecke der Aufdeckung, Anerkennung oder Identifizierung nat\u00fcrlicher
      Personen verwendet werden sollen, mit Ausnahme der \u00dcberpr\u00fcfung von
      Reisedokumenten.\n[annex:III:8:a] KI-Systeme, die bestimmungsgem\u00e4\u00df
      von einer oder im Namen einer Justizbeh\u00f6rde verwendet werden sollen, um
      eine Justizbeh\u00f6rde bei der Ermittlung und Auslegung von Sachverhalten und
      Rechtsvorschriften und bei der Anwendung des Rechts auf konkrete Sachverhalte
      zu unterst\u00fctzen, oder die auf \u00e4hnliche Weise f\u00fcr die alternative
      Streitbeilegung genutzt werden sollen;\n[annex:III:8:b] KI-Systeme, die bestimmungsgem\u00e4\u00df
      verwendet werden sollen, um das Ergebnis einer Wahl oder eines Referendums oder
      das Wahlverhalten nat\u00fcrlicher Personen bei der Aus\u00fcbung ihres Wahlrechts
      bei einer Wahl oder einem Referendum zu beeinflussen. Dazu geh\u00f6ren nicht
      KI-Systeme, deren Ausgaben nat\u00fcrliche Personen nicht direkt ausgesetzt
      sind, wie Instrumente zur Organisation, Optimierung oder Strukturierung politischer
      Kampagnen in administrativer oder logistischer Hinsicht.\n\nGuideline passages
      and examples found:\n[guide:guide-prohibited:para:13] (2.2. Rechtsgrundlage
      der Verbote)\n(13) In Artikel 3 Nummer 11 der KI-Verordnung wird die Inbetriebnahme
      definiert als \"die Bereitstellung eines KI-Systems in der Union zum Erstgebrauch
      direkt an den Betreiber oder zum Eigengebrauch entsprechend seiner Zweckbestimmung\"
      und umfasst daher sowohl die Bereitstellung an Dritte zur Erstnutzung als auch
      die interne Entwicklung und den Einsatz. Die Zweckbestimmung des Systems ist
      \"die Verwendung, f\u00fcr die ein KI-System laut Anbieter bestimmt ist, einschlie\u00dflich
      der besonderen Umst\u00e4nde und Bedingungen f\u00fcr die Verwendung, entsprechend
      den vom Anbieter bereitgestellten Informationen in den Betriebsanleitungen,
      im Werbe- oder Verkaufsmaterial und in diesbez\u00fcglichen Erkl\u00e4rungen
      sowie in der technischen Dokumentation\" 7 .\n\nZum Beispiel baut ein Anbieter
      ein RBI-System au\u00dferhalb der Union und stellt dieses System einer Strafverfolgungsbeh\u00f6rde
      oder einem in einem Mitgliedstaat niedergelassenen Privatunternehmen zur erstmaligen
      Nutzung zur Verf\u00fcgung, wodurch es in Betrieb genommen wird.\n\nEine Beh\u00f6rde
      entwickelt zum Beispiel intern ein Bewertungssystem und setzt es ein, um das
      Betrugsrisiko der Empf\u00e4nger von Haushaltszulagen vorauszusagen; somit nimmt
      sie das System in Betrieb.\n\n[guide:guide-prohibited:para:263] (7.2.3. Ausnahmen
      aus medizinischen Gr\u00fcnden und Sicherheitsgr\u00fcnden)\n(263) Emotionserkennungssysteme,
      die gem\u00e4\u00df Artikel 6 Absatz 2 und Anhang III Absatz 1 Buchstabe c der
      KI-Verordnung als Hochrisikosysteme eingestuft werden, m\u00fcssen die Hochrisikoanforderungen
      in Kapitel III Abschnitt 2 der KI-Verordnung und die Transparenzpflicht nach
      Artikel 50 Absatz 3 der KI-Verordnung erf\u00fcllen.\n\nBeispiele:\n\nEmotionserkennung
      kann aus medizinischen Gr\u00fcnden zur Unterst\u00fctzung von Arbeitnehmern
      oder Studierenden mit Autismus und zur Verbesserung der Barrierefreiheit f\u00fcr
      blinde oder geh\u00f6rlose Menschen eingesetzt werden 170 . Solche Verwendungen
      w\u00fcrden unter die Ausnahme aus medizinischen Gr\u00fcnden in Artikel 5 Absatz
      1 Buchstabe f der KI-Verordnung fallen.\n\nDagegen gilt die Emotionserkennung
      zur Bewertung des Wohlbefindens, des Motivationsniveaus und der Arbeits- oder
      Lernzufriedenheit von Studierenden oder Arbeitnehmern nicht als \"Verwendung
      aus medizinischen Gr\u00fcnden\" und w\u00e4re verboten.\n\nEinem Arbeitgeber
      w\u00e4re es untersagt, am Arbeitsplatz KI-gest\u00fctzte Ger\u00e4te oder digitale
      Assistenten einzusetzen, um auf der Grundlage gemessener Stresswerte Angstzust\u00e4nde
      oder Langeweile von Arbeitnehmern zu messen, es sei denn, der erh\u00f6hte Stresswert
      bzw. die mangelnde Konzentration w\u00fcrden beispielsweise beim Einsatz gef\u00e4hrlicher
      Maschinen oder Umgang mit gef\u00e4hrlichen Chemikalien eine besondere Gefahr
      darstellen. Im letzteren Fall darf der Arbeitgeber die Daten nicht f\u00fcr
      andere Zwecke wie beispielsweise Beurteilung der Arbeitsleistung des Arbeitnehmers
      verwenden.\n\n[guide:guide-prohibited:para:35] (2.5.4. Pers\u00f6nliche und
      nicht-berufliche T\u00e4tigkeit)\n(35) Der Ausschluss nach Artikel 2 Absatz
      10 der KI-Verordnung gilt nur in Bezug auf die Pflichten der Betreiber bei der
      Verwendung des Systems f\u00fcr rein pers\u00f6nliche nichtberufliche T\u00e4tigkeiten.
      Das System als solches f\u00e4llt weiterhin in den Anwendungsbereich der KI-Verordnung
      in Bezug auf die Pflichten von Anbietern, die das System in Verkehr bringen
      oder in Betrieb nehmen, sowie die Pflichten anderer professioneller Betreiber
      und anderer verantwortlicher Akteure wie Einf\u00fchrer und H\u00e4ndler.\n\nBeispielsweise
      bleibt ein Emotionserkennungssystem, das dazu bestimmt ist, von nat\u00fcrlichen
      Personen f\u00fcr rein pers\u00f6nliche nicht berufliche T\u00e4tigkeiten verwendet
      zu werden, weiterhin ein Hochrisiko-KI-System im Sinne von Artikel 6 der KIVerordnung
      und muss in vollem Einklang mit der KI-Verordnung stehen. Gleichzeitig unterliegt
      der Betreiber, der es f\u00fcr rein pers\u00f6nliche, nicht berufliche Zwecke
      nutzt (z. B. eine autistische Person), nicht den spezifischen Verpflichtungen
      f\u00fcr Betreiber im Rahmen der KI-Verordnung, und die Nutzung fiele nicht
      in ihren Anwendungsbereich.\n\n[guide:guide-prohibited:para:34] (2.5.4. Pers\u00f6nliche
      und nicht-berufliche T\u00e4tigkeit)\n(34) In Artikel 2 Absatz 10 der KI-Verordnung
      wird bestimmt, dass die KI-Verordnung nicht f\u00fcr die Pflichten von Betreibern
      gilt, die nat\u00fcrliche Personen sind und die Systeme im Rahmen einer ausschlie\u00dflich
      pers\u00f6nlichen und nicht beruflichen T\u00e4tigkeit verwenden. Die Definition
      des Begriffs \"Betreiber\" schlie\u00dft ebenfalls Nutzer aus, die T\u00e4tigkeiten
      dieser Art aus\u00fcben (siehe Abschnitt 2.4). Jede T\u00e4tigkeit, durch die
      eine nat\u00fcrliche Person regelm\u00e4\u00dfig einen wirtschaftlichen Vorteil
      erlangt oder anderweitig einer professionellen, gesch\u00e4ftlichen, gewerblichen,
      beruflichen oder freiberuflichen T\u00e4tigkeit nachgeht, sollte als \"Berufst\u00e4tigkeit\"
      betrachtet werden. Die Angabe \"pers\u00f6nlich\" ist ein Qualifizierungskriterium
      von \"nichtberuflich\", das hei\u00dft, die betreffende Person sollte sowohl
      in einer pers\u00f6nlichen als auch einer nicht-beruflichen Eigenschaft handeln.
      Daher sollte der Ausschluss beispielsweise keine kriminellen Aktivit\u00e4ten
      umfassen, da diese nicht als rein pers\u00f6nliche T\u00e4tigkeiten betrachtet
      werden sollten.\n\nZum Beispiel w\u00fcrde eine Person, die zu Hause ein Gesichtserkennungssystem
      nutzt (z. B. als Zugangskontrolle und zur Sicherheits\u00fcberwachung des Hauseingangs)
      unter den Ausschluss des Artikels 2 Absatz 10 der KI-Verordnung fallen und somit
      nicht den Pflichten der Betreiber nach der KI-Verordnung unterliegen, und zwar
      auch dann nicht, wenn sie verpflichtet ist, die Aufnahmen (teilweise) an Strafverfolgungsbeh\u00f6rden
      zu \u00fcbermitteln.\n\n25 Erw\u00e4gungsgrund 25 der KI-Verordnung.\n\n26 Gem\u00e4\u00df
      Artikel 3 Nummer 57 der KI-Verordnung bezeichnet der Ausdruck \"Test unter Realbedingungen\"
      den befristeten Test eines KI-Systems auf seine Zweckbestimmung, der unter Realbedingungen
      au\u00dferhalb eines Labors oder einer anderweitig simulierten Umgebung erfolgt,
      um zuverl\u00e4ssige und belastbare Daten zu erheben und die Konformit\u00e4t
      des KI-Systems mit den Anforderungen dieser Verordnung zu bewerten und zu \u00fcberpr\u00fcfen.
      Die KI-Verordnung enth\u00e4lt eine Sonderregelung f\u00fcr solche Tests unter
      Realbedingungen, die nicht als Inverkehrbringen oder Inbetriebnahme des KI-Systems
      im Sinne dieser Verordnung gelten, sofern alle in den Artikeln 57 oder 60 festgelegten
      Bedingungen erf\u00fcllt sind, einschlie\u00dflich der Einholung einer freien
      und in Kenntnis der Sachlage erteilten Einwilligung der an den Tests beteiligten
      Personen usw.; siehe Artikel 60 der KI-Verordnung.\n\n27 Die KI-Verordnung enth\u00e4lt
      detaillierte, spezifische Verpflichtungen f\u00fcr KI-Reallabore und Tests unter
      Realbedingungen. Siehe Artikel 57 ff der KI-Verordnung.\n\n28 Erw\u00e4gungsgrund
      25 der KI-Verordnung.\n\nDagegen m\u00fcsste eine nat\u00fcrliche Person, die
      ein KI-System f\u00fcr berufliche T\u00e4tigkeiten wie die von Freiberuflern,
      Journalisten, \u00c4rzten usw. nutzt, die Verpflichtungen f\u00fcr Betreiber
      von Gesichtserkennungssystemen nach der KI-Verordnung erf\u00fcllen. Jede Nutzung
      durch nat\u00fcrliche Personen, die im Namen oder Auftrag eines in beruflicher
      Funktion handelnden Betreibers handeln, f\u00e4llt ebenfalls in den Anwendungsbereich
      der KI-Verordnung.\n\nDar\u00fcber hinaus k\u00f6nnen kriminelle Handlungen
      auch dann nicht als rein pers\u00f6nliche Aktivit\u00e4ten angesehen werden,
      wenn kein wirtschaftlicher Vorteil angestrebt oder erzielt wird. F\u00fcr andere
      rechtswidrige Handlungen wie Verst\u00f6\u00dfe gegen das Verbraucher- oder
      Datenschutzrecht sowie nationales Verwaltungsrecht gilt der Ausschluss in der
      KI-Verordnung, aber die anderen einschl\u00e4gigen Rechtsrahmen gelten weiterhin.\n\n[guide:guide-prohibited:para:16]
      (2.4. Pers\u00f6nlicher Anwendungsbereich: zust\u00e4ndige Akteure)\n(16) Nach
      Artikel 3 Nummer 3 der KI-Verordnung sind Anbieter nat\u00fcrliche oder juristische
      Personen, Beh\u00f6rden, Einrichtungen oder sonstige Stellen, die ein KI-System
      entwickeln oder entwickeln lassen und unter ihrem eigenen Namen oder ihrer Handelsmarke
      in der Union in Verkehr bringen bzw. unter ihrem eigenen Namen oder ihrer Handelsmarke
      in Betrieb nehmen 11 (siehe Abschnitt 2.3). Anbieter, die au\u00dferhalb der
      Union niedergelassen oder ans\u00e4ssig sind, unterliegen den Bestimmungen der
      KI-Verordnung, wenn sie solche Systeme in der Union in Verkehr bringen oder
      in Betrieb nehmen 12 oder wenn die vom KI-System hervorgebrachte Ausgabe in
      der Union verwendet wird 13 . Die Anbieter m\u00fcssen sicherstellen, dass ihre
      KI-Systeme alle einschl\u00e4gigen Anforderungen erf\u00fcllen, bevor sie sie
      in Verkehr bringen oder in Betrieb nehmen.\n\n8 Siehe Artikel 3 Nummern 12 und
      13 der KI-Verordnung.\n\n9 Zu den Definitionen dieser Begriffe siehe auch die
      Bekanntmachung der Kommission - Leitfaden f\u00fcr die Umsetzung der Produktvorschriften
      der EU 2022 (\"Blue Guide\"), 2022/C 247/01, Abschnitt 2.8.\n\n10 Erw\u00e4gungsgrund
      28 der KI-Verordnung.\n\n11 Artikel 3 Nummern 3, 9 und 11 der KI-Verordnung.
      In Bezug auf KI-Systeme mit hohem Risiko sieht Artikel 25 der KI-Verordnung
      Folgendes vor: 1. In den folgenden F\u00e4llen gelten H\u00e4ndler, Einf\u00fchrer,
      Betreiber oder sonstige Dritte als Anbieter eines HochrisikoKI-Systems f\u00fcr
      die Zwecke dieser Verordnung und unterliegen den Anbieterpflichten gem\u00e4\u00df
      Artikel 16: a) wenn sie ein bereits in Verkehr gebrachtes oder in Betrieb genommenes
      Hochrisiko-KI-System mit ihrem Namen oder ihrer Handelsmarke versehen, unbeschadet
      vertraglicher Vereinbarungen, die eine andere Aufteilung der Pflichten vorsehen;
      b) wenn sie eine wesentliche Ver\u00e4nderung eines Hochrisiko-KI-Systems, das
      bereits in Verkehr gebracht oder in Betrieb genommen wurde, so vornehmen, dass
      es weiterhin ein Hochrisiko-KI-System gem\u00e4\u00df Artikel 6 bleibt; c) wenn
      sie die Zweckbestimmung eines KI-Systems, einschlie\u00dflich eines KI-Systems
      mit allgemeinem Verwendungszweck, das nicht als hochriskant eingestuft wurde
      und bereits in Verkehr gebracht oder in Betrieb genommen wurde, so ver\u00e4ndern,
      dass das betreffende KI-System zu einem Hochrisiko-KI-System im Sinne von Artikel
      6 wird.\n\n12 Artikel 2 Absatz 1 Buchstabe a der KI-Verordnung.\n\nZum Beispiel
      ist ein Anbieter eines RBI-Systems der Hersteller des Systems, der das System
      in der Union unter seiner Marke vermarktet. Der Anbieter eines solchen Systems
      k\u00f6nnte auch eine Beh\u00f6rde sein, die das System intern entwickelt und
      f\u00fcr ihren eigenen Gebrauch in Betrieb nimmt.\n\n[guide:guide-prohibited:para:36]
      (2.5.5. KI-Systeme, die im Rahmen freier und quelloffener Lizenzen freigegeben
      werden)\n(36) Nach Artikel 2 Absatz 12 der KI-Verordnung gilt diese Verordnung
      nicht f\u00fcr KISysteme, die im Rahmen freier und quelloffener Lizenzen 29
      freigegeben werden, es sei denn, sie werden als Hochrisiko-KI-Systeme oder als
      KI-Systeme, die unter Artikel 5 (verbotene Praktiken im KI-Bereich) oder Artikel
      50 der KI-Verordnung (Transparenzpflichten f\u00fcr bestimmte KI-Systeme) fallen,
      in Verkehr gebracht oder in Betrieb genommen. Dies bedeutet, dass Anbieter von
      KI-Systemen nicht in den Genuss dieses Ausschlusses kommen k\u00f6nnen, wenn
      das von ihnen in Verkehr gebrachte oder in Betrieb genommene KI-System eine
      verbotene Praxis gem\u00e4\u00df Artikel 5 der KIVerordnung darstellt.\n\n29
      In Erw\u00e4gungsgrund 102 der KI-Verordnung hei\u00dft es, dass die Freigabe
      von Software und Daten im Rahmen einer kostenlosen und quelloffenen Lizenz \"ihre
      offene Weitergabe erlaubt und die Nutzer [diese] kostenlos abrufen, nutzen,
      ver\u00e4ndern und weiter verteilen k\u00f6nnen, auch in ver\u00e4nderter Form\".\n\n[guide:guide-prohibited:para:32]
      (2.5.3. Forschung und Entwicklung)\n(32) Der Ausschluss in Artikel 2 Absatz
      8 der KI-Verordnung ber\u00fchrt jedoch nicht die Verpflichtung zur Einhaltung
      der KI-Verordnung, wenn ein KI-System infolge einer solchen Forschungs- und
      Entwicklungst\u00e4tigkeit in Verkehr gebracht oder in Betrieb genommen wird
      25 . Tests unter realen Bedingungen im Sinne der KI-Verordnung 26 fallen ebenfalls
      nicht unter diesen Ausschluss.\n\nZum Beispiel rekrutiert eine Gemeinde, die
      w\u00e4hrend des Karnevals eine Gesichtserkennungssoftware mithilfe eines RBI-Systems
      auf den Stra\u00dfen testen m\u00f6chte, Freiwillige, die vom System unter Realbedingungen
      identifiziert werden sollen. Da Tests unter Realbedingungen nicht unter den
      Ausschluss nach Artikel 2 Absatz 8 der KI-Verordnung fallen, m\u00fcssen die
      geplanten Tests in vollem Umfang den Anforderungen der KI-Verordnung an RBI-Systeme
      entsprechen, es sei denn, das System wird in einem KI-Reallabor oder im Einklang
      mit der Sonderregelung f\u00fcr Tests unter Realbedingungen au\u00dferhalb des
      Reallabors gem\u00e4\u00df den Artikeln 60 und 61 der KIVerordnung getestet
      27 .\n\n[guide:guide-definition:para:1] (MITTEILUNG DER KOMMISSION \u203a Leitlinien
      der Kommission zur Definition eines Systems der k\u00fcnstlichen Intelligenz
      gem\u00e4\u00df der Verordnung (EU) 2024/1689 (KI-Verordnung) \u203a I. Zweck
      der Leitlinien)\n(1) Die Verordnung (EU) 2024/1689 des Europ\u00e4ischen Parlaments
      und des Rates 1 (im Folgenden \"Verordnung \u00fcber k\u00fcnstliche Intelligenz\"
      oder \"KI-Verordnung\") trat am 1. August 2024 in Kraft. Mit der Verordnung
      \u00fcber k\u00fcnstliche Intelligenz sind harmonisierte Vorschriften f\u00fcr
      die Entwicklung, das Inverkehrbringen, die Inbetriebnahme und die Verwendung
      k\u00fcnstlicher Intelligenz (im Folgenden \"KI\") in der Union festgelegt worden
      2 . Ziel ist es, die Innovation und die Einf\u00fchrung von KI bei gleichzeitiger
      Gew\u00e4hrleistung eines hohen Ma\u00dfes an Schutz der Gesundheit, der Sicherheit
      und der Grundrechte, einschlie\u00dflich Demokratie und Rechtsstaatlichkeit,
      in der Union zu f\u00f6rdern.\n\nLanguage for facts and questions: de\n\nEarlier
      checks:\n-\n\nFacts:\n-\n\nDescription:\nWir sind ein Universit\u00e4tsklinikum
      in S\u00fcddeutschland mit rund 8.000 Besch\u00e4ftigten. Unsere Radiologie
      hat zusammen mit der hauseigenen IT eine Software entwickelt, die in Thorax-CTs
      Lungenrundherde markiert und vermisst; die Radiologinnen und Radiologen sehen
      die Markierungen beim Befunden und entscheiden selbst. Die Software wird nur
      bei uns im Haus eingesetzt, nicht verkauft und an keine andere Klinik weitergegeben.
      Deshalb haben wir sie als Eigenherstellung nach der Medizinprodukteverordnung
      behandelt, ohne CE-Kennzeichnung und ohne benannte Stelle; ein vergleichbares
      Produkt auf dem Markt w\u00e4re mindestens Klasse IIa. Die Bilddaten stammen
      aus unseren eigenen Ger\u00e4ten. Derzeit validieren wir die Software intern;
