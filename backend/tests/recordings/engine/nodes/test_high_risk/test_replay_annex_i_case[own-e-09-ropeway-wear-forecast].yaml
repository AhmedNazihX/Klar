      authorities as polygraphs or similar tools;\n[annex:III:6:c] AI systems intended
      to be used by or on behalf of law enforcement authorities, or by Union institutions,
      bodies, offices or agencies, in support of law enforcement authorities to evaluate
      the reliability of evidence in the course of the investigation or prosecution
      of criminal offences;\n[annex:III:6:d] AI systems intended to be used by law
      enforcement authorities or on their behalf or by Union institutions, bodies,
      offices or agencies in support of law enforcement authorities for assessing
      the risk of a natural person offending or re-offending not solely on the basis
      of the profiling of natural persons as referred to in Article 3(4) of Directive
      (EU) 2016/680, or to assess personality traits and characteristics or past criminal
      behaviour of natural persons or groups;\n[annex:III:6:e] AI systems intended
      to be used by or on behalf of law enforcement authorities or by Union institutions,
      bodies, offices or agencies in support of law enforcement authorities for the
      profiling of natural persons as referred to in Article 3(4) of Directive (EU)
      2016/680 in the course of the detection, investigation or prosecution of criminal
      offences.\n[annex:III:7:a] AI systems intended to be used by or on behalf of
      competent public authorities or by Union institutions, bodies, offices or agencies
      as polygraphs or similar tools;\n[annex:III:7:b] AI systems intended to be used
      by or on behalf of competent public authorities or by Union institutions, bodies,
      offices or agencies to assess a risk, including a security risk, a risk of irregular
      migration, or a health risk, posed by a natural person who intends to enter
      or who has entered into the territory of a Member State;\n[annex:III:7:c] AI
      systems intended to be used by or on behalf of competent public authorities
      or by Union institutions, bodies, offices or agencies to assist competent public
      authorities for the examination of applications for asylum, visa or residence
      permits and for associated complaints with regard to the eligibility of the
      natural persons applying for a status, including related assessments of the
      reliability of evidence;\n[annex:III:7:d] AI systems intended to be used by
      or on behalf of competent public authorities, or by Union institutions, bodies,
      offices or agencies, in the context of migration, asylum or border control management,
      for the purpose of detecting, recognising or identifying natural persons, with
      the exception of the verification of travel documents.\n[annex:III:8:a] AI systems
      intended to be used by a judicial authority or on their behalf to assist a judicial
      authority in researching and interpreting facts and the law and in applying
      the law to a concrete set of facts, or to be used in a similar way in alternative
      dispute resolution;\n[annex:III:8:b] AI systems intended to be used for influencing
      the outcome of an election or referendum or the voting behaviour of natural
      persons in the exercise of their vote in elections or referenda. This does not
      include AI systems to the output of which natural persons are not directly exposed,
      such as tools used to organise, optimise or structure political campaigns from
      an administrative or logistical point of view.\n\nGuideline passages and examples
      found:\n[guide:guide-high-risk-annex-i:para:30] (2.2.1. AI systems that are
      themselves products covered by Union harmonisation legislation)\n(30) An AI
      system is the product itself where it is independently placed on the market,
      has its own intended purpose, and is directly regulated by the Union harmonisation
      legislation listed in Annex I AI Act. Such systems can include stand-alone AI
      systems, or AI systems that are embedded in other products. For example, under
      Regulation (EU) 2023/1230 (the Machinery Regulation) 2 , the definition of machinery-related
      products explicitly includes certain software, which may therefore itself be
      a regulated product under that Regulation and therefore be classified as high-risk
      pursuant to Article 6(1) AI Act, provided it is required to undergo a third-party
      conformity assessment.\n\n[guide:guide-high-risk-annex-i:para:23] (2. The main
      elements for classification as high-risk under Article 6(1) AI Act \u203a 2.1.
      Introduction)\n(23) Annex I AI Act does not list individual products that should
      be classified as high-risk, but rather Union harmonisation legislation that
      regulates the safety aspects of certain products. Whether an AI system falls
      within the scope of Annex I AI Act as a regulated product itself, or as a safety
      component of a regulated product, therefore depends on whether the system, or
      the product of which the system constitutes a safety component, falls within
      the material scope of one of the legislative acts listed in that annex. Annex
      I AI Act includes, inter alia, Union harmonisation legislation covering products
      such as machinery, toys, lifts, equipment and protective systems intended for
      use in potentially explosive atmospheres, radio equipment, pressure equipment,
      recreational craft, cableway installations, appliances burning gaseous fuels,
      medical devices, in vitro diagnostic medical devices, and products in the automotive
      and aviation sectors. The fact that a product is intended for consumer or household
      use does not in itself exclude it from the scope of the AI Act.\n\n[guide:guide-high-risk-annex-i:para:22]
      (1. The classification rationale)\n(22) Article 6(1) AI Act applies irrespective
      of whether the AI system is embedded within the product or is placed on the
      market or put into service independently. An AI system supplied, for example,
      as a software update, an add-on, or a remote service may therefore be classified
      as high-risk pursuant to Article 6(1) AI Act, provided all the conditions of
      that provision are met.\n\n[guide:guide-high-risk-annex-i:para:20] (1. The classification
      rationale)\n(20) In line with the AI Act''s risk-based approach, only AI systems
      that present significant risks to health, safety, or fundamental rights are
      classified as high-risk, as explained in Recitals 47 to 51 AI Act. Article 6(1)
      AI Act operationalises this approach for AI systems covered by Union harmonisation
      legislation, by linking high-risk classification to risk and the system''s safety
      relevance, as well as to the requirement of third-party conformity assessments.\n\n1
      Commission notice The ''Blue Guide'' on the implementation of EU product rules
      2022 (Text with EEA relevance) 2022/C 247/01, (OJ C 247, 29.6.2022, pp. 1-152).\n\n[guide:guide-prohibited:para:144]
      (3.6. Interplay with other Union law)\n(144) The prohibitions in Article 5(1)(a)
      and (b) AI Act are also without prejudice to and complement EU product safety
      legislation (e.g., for medical devices, toys, machinery), which plays a crucial
      role in ensuring the safety of products that integrate AI systems. This entails
      compliance with ex ante safety requirements for regulated products and their
      proactive monitoring to ensure that they do not pose safety risks leading to
      physical and mental harms. The manufacturer of those products embedding AI systems
      should therefore take into account these prohibitions in their risk assessments
