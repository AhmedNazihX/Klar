- request:
    body: '{"input":["Instruct: Given a description of an AI system or a question
      about the EU AI Act, retrieve the provisions of the AI Act that apply\nQuery:We
      are a 30-person software firm in Innsbruck working for ski resorts. Our product
      analyses vibration, rope-tension and weather data from chairlifts and gondolas
      and predicts wear on rollers, grips and bearings. We sell it for maintenance
      planning, and that explicitly includes deciding when a scheduled component inspection
      can safely be moved back; the first resorts that have signed up plan to use
      it exactly that way. The tool has no connection to the lifts'' controls or brakes.
      The lifts and their safety components were certified by notified bodies under
      the cableway rules; our software was not part of that assessment. The launch
      is planned for the 2028/29 season, and we have just added French and Italian."],"model":"qwen/qwen3-embedding-8b","dimensions":1536,"encoding_format":"float","provider":{"allow_fallbacks":false,"data_collection":"deny","order":["nebius"],"zdr":true}}'
