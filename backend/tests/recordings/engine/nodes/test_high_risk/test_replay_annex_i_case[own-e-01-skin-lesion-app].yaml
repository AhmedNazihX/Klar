      Act therefore does not replace, limit or affect obligations arising under other
      provisions of the AI Act ( 14 ). At the same time, AI systems can also fall
      within the scope of Article 50 AI Act without being classified as high-risk
      pursuant to Article 6 AI Act. Literacy requirements under Article 4 AI Act also
      apply to both providers and deployers of AI systems within the scope of Article
      50 AI Act.\n\n[guide:guide-art50:para:11] (2.3. Responsible actors under Article
      50 AI Act)\n(11) Providers must ensure their interactive or generative AI systems
      have transparency embedded into the system''s design and operation and ensure
      all relevant transparency obligations in Articles 50(1), (2) and (5) AI Act
      are met at the latest when those systems are placed on the market or put into
      service. All natural persons interacting with the AI system or exposed to its
      outputs in scope must be effectively and consistently informed throughout the
      lifecycle of the AI system, as placed on the market or put into service by that
      provider (irrespective of who the deployers or other users of the system are).\n\nFor
      example, a company provides a generative or interactive AI application (e.g.
      a chatbot, image generator, AI agent) on the Union market under its own name
      or trademark to consumers, professional users or other legal entities who may
      directly use the AI system for interaction or content generation (including
      by integrating the system into their existing processes and using it accordingly
      without the need for modifications or additional components). The company is
      a provider responsible for compliance with the transparency obligations in Article
      50(1) and/or (2) AI Act, regardless of whether the AI system is provided for
      free or for payment and regardless of whether the provider is established or
      located in the Union or in a third country.\n\nAnother example of a provider
      is a company or another organisation (e.g. a public authority) that has developed
      an interactive AI system (e.g. chatbot) in-house and puts it into service in
      the Union for its own use and under its name or trademark.\n\n( 3 ) Articles
      2(1)(a), 3(3), (9) and (11) AI Act. For further guidance on the concepts of
