interactions:
- request:
    body: '{"input":["Instruct: Given a description of an AI system or a question
      about the EU AI Act, retrieve the article, Annex point or recital of the AI
      Act that governs it\nQuery:We are a 25-person medical software company in Rotterdam.
      Our app, DermaSight, lets GPs photograph a skin lesion through a clip-on phone
      lens; a model we trained ourselves on licensed image archives estimates how
      likely the lesion is to be melanoma and recommends whether to refer the patient
      to a dermatologist. The GP makes the final call. The app is going through certification
      as a class IIa medical device under the Medical Device Regulation with our notified
      body in Germany, and we plan to launch in autumn 2028. We will sell subscriptions
      to practices in the Netherlands, Belgium and Germany. The next release adds
      the dark mode our users keep asking for."],"model":"qwen/qwen3-embedding-8b","dimensions":1536,"encoding_format":"float","provider":{"allow_fallbacks":false,"data_collection":"deny","order":["nebius"],"zdr":true}}'
