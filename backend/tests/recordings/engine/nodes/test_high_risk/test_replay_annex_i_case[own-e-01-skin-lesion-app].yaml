      an administrative or logistical point of view.\n\nGuideline passages and examples
      found:\n[guide:guide-art50:para:25] (2.5. Interplay with the prohibited practices,
      the requirements for high-risk AI systems and AI literacy)\n(25) Recital 137
      AI Act clarifies that compliance with the transparency obligations under Article
      50 AI Act for a particular AI system cannot be interpreted as indicating that
      the use of that AI system or its output is lawful under the AI Act. In particular,
