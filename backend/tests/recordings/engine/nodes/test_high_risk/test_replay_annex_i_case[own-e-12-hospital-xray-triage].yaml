    body: '{"input":["Instruct: Given a description of an AI system or a question
      about the EU AI Act, retrieve the provisions of the AI Act that apply\nQuery:Wir
      betreiben drei Krankenh\u00e4user in Niedersachsen mit zusammen 2.500 Besch\u00e4ftigten,
      in privater Tr\u00e4gerschaft. Ab Herbst 2028 will unsere Radiologie eine KI-Software
      eines M\u00fcnchner Herstellers einsetzen, die R\u00f6ntgenbilder der Lunge
      vorab auswertet, Auff\u00e4lligkeiten markiert und dringliche F\u00e4lle in
      der Arbeitsliste nach oben schiebt. Die Software ist als Medizinprodukt der
      Klasse IIa CE-gekennzeichnet, der Hersteller hat sie \u00fcber eine benannte
      Stelle zertifizieren lassen. Wir f\u00fchren sie so ein, wie sie geliefert wird,
      und ver\u00e4ndern nichts daran; die Befundung bleibt bei den \u00c4rztinnen
      und \u00c4rzten. Die Bilder kommen aus unseren eigenen R\u00f6ntgenger\u00e4ten.
      Parallel stellen wir gerade auf ein neues Dienstplansystem um."],"model":"qwen/qwen3-embedding-8b","dimensions":1536,"encoding_format":"float","provider":{"allow_fallbacks":false,"data_collection":"deny","order":["nebius"],"zdr":true}}'
