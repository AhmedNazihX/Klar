    body: '{"input":["Instruct: Given a description of an AI system or a question
      about the EU AI Act, retrieve the article, Annex point or recital of the AI
      Act that governs it\nQuery:Wir sind ein Musik-Start-up aus K\u00f6ln mit zw\u00f6lf
      Leuten. Unsere App \u201eStimmlage\u201c gibt es seit 2025 in den App-Stores;
      sie l\u00e4uft auf den Smartphones und Tablets der Nutzerinnen und Nutzer, Ger\u00e4te
      bauen oder verkaufen wir nicht. Wer im Chor singt, \u00fcbt mit der App seine
      Stimme: Ein von uns trainiertes Modell h\u00f6rt \u00fcber das Mikrofon zu,
      erkennt die gesungenen T\u00f6ne und zeigt an, wo man zu hoch oder zu tief liegt.
      Danach w\u00e4hlt die App die n\u00e4chste \u00dcbung aus unserer Sammlung,
      die unsere Gesangslehrerinnen eingesungen haben. Zum \u00dcben kann man Bluetooth-Kopfh\u00f6rer
      verbinden. Die App ist kostenlos, eine Premium-Version kostet 4 Euro im Monat."],"model":"qwen/qwen3-embedding-8b","dimensions":1536,"encoding_format":"float","provider":{"allow_fallbacks":false,"data_collection":"deny","order":["nebius"],"zdr":true}}'
