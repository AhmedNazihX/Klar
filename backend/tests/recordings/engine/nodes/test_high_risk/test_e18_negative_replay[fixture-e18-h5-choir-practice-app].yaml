      verwendet werden sollen.\n[annex:III:2] Kritische Infrastruktur: KI-Systeme,
      die bestimmungsgem\u00e4\u00df als Sicherheitsbauteile im Rahmen der Verwaltung
      und des Betriebs kritischer digitaler Infrastruktur, des Stra\u00dfenverkehrs
      oder der Wasser-, Gas-, W\u00e4rme- oder Stromversorgung verwendet werden sollen\n[annex:III:3:a]
      KI-Systeme, die bestimmungsgem\u00e4\u00df zur Feststellung des Zugangs oder
      der Zulassung oder zur Zuweisung nat\u00fcrlicher Personen zu Einrichtungen
      aller Ebenen der allgemeinen und beruflichen Bildung verwendet werden sollen;\n[annex:III:3:b]
      KI-Systeme, die bestimmungsgem\u00e4\u00df f\u00fcr die Bewertung von Lernergebnissen
      verwendet werden sollen, einschlie\u00dflich des Falles, dass diese Ergebnisse
      dazu dienen, den Lernprozess nat\u00fcrlicher Personen in Einrichtungen oder
      Programmen aller Ebenen der allgemeinen und beruflichen Bildung zu steuern;\n[annex:III:3:c]
      KI-Systeme, die bestimmungsgem\u00e4\u00df zum Zweck der Bewertung des angemessenen
      Bildungsniveaus, das eine Person im Rahmen von oder innerhalb von Einrichtungen
      aller Ebenen der allgemeinen und beruflichen Bildung erhalten wird oder zu denen
      sie Zugang erhalten wird, verwendet werden sollen;\n[annex:III:3:d] KI-Systeme,
      die bestimmungsgem\u00e4\u00df zur \u00dcberwachung und Erkennung von verbotenem
      Verhalten von Sch\u00fclern bei Pr\u00fcfungen im Rahmen von oder innerhalb
      von Einrichtungen aller Ebenen der allgemeinen und beruflichen Bildung verwendet
      werden sollen.\n[annex:III:4:a] KI-Systeme, die bestimmungsgem\u00e4\u00df f\u00fcr
      die Einstellung oder Auswahl nat\u00fcrlicher Personen verwendet werden sollen,
      insbesondere um gezielte Stellenanzeigen zu schalten, Bewerbungen zu sichten
      oder zu filtern und Bewerber zu bewerten;\n[annex:III:4:b] KI-Systeme, die bestimmungsgem\u00e4\u00df
      f\u00fcr Entscheidungen, die die Bedingungen von Arbeitsverh\u00e4ltnissen,
      Bef\u00f6rderungen und K\u00fcndigungen von Arbeitsvertragsverh\u00e4ltnissen
      beeinflussen, f\u00fcr die Zuweisung von Aufgaben aufgrund des individuellen
      Verhaltens oder pers\u00f6nlicher Merkmale oder Eigenschaften oder f\u00fcr
      die Beobachtung und Bewertung der Leistung und des Verhaltens von Personen in
      solchen Besch\u00e4ftigungsverh\u00e4ltnissen verwendet werden soll.\n[annex:III:5:a]
      KI-Systeme, die bestimmungsgem\u00e4\u00df von Beh\u00f6rden oder im Namen von
      Beh\u00f6rden verwendet werden sollen, um zu beurteilen, ob nat\u00fcrliche
      Personen Anspruch auf grundlegende \u00f6ffentliche Unterst\u00fctzungsleistungen
      und -dienste, einschlie\u00dflich Gesundheitsdiensten, haben und ob solche Leistungen
      und Dienste zu gew\u00e4hren, einzuschr\u00e4nken, zu widerrufen oder zur\u00fcckzufordern
      sind;\n[annex:III:5:b] KI-Systeme, die bestimmungsgem\u00e4\u00df f\u00fcr die
      Kreditw\u00fcrdigkeitspr\u00fcfung und Bonit\u00e4tsbewertung nat\u00fcrlicher
      Personen verwendet werden sollen, mit Ausnahme von KI-Systemen, die zur Aufdeckung
      von Finanzbetrug verwendet werden;\n[annex:III:5:c] KI-Systeme, die bestimmungsgem\u00e4\u00df
      f\u00fcr die Risikobewertung und Preisbildung in Bezug auf nat\u00fcrliche Personen
      im Fall von Lebens- und Krankenversicherungen verwendet werden sollen;\n[annex:III:5:d]
      KI-Systeme, die bestimmungsgem\u00e4\u00df zur Bewertung und Klassifizierung
      von Notrufen von nat\u00fcrlichen Personen oder f\u00fcr die Entsendung oder
      Priorisierung des Einsatzes von Not- und Rettungsdiensten, einschlie\u00dflich
      Polizei, Feuerwehr und medizinischer Nothilfe, sowie f\u00fcr Systeme f\u00fcr
      die Triage von Patienten bei der Notfallversorgung verwendet werden sollen.\n[annex:III:6:a]
      KI-Systeme, die bestimmungsgem\u00e4\u00df von Strafverfolgungsbeh\u00f6rden
      oder in deren Namen oder von Organen, Einrichtungen und sonstigen Stellen der
      Union zur Unterst\u00fctzung von Strafverfolgungsbeh\u00f6rden oder in deren
      Namen zur Bewertung des Risikos einer nat\u00fcrlichen Person, zum Opfer von
      Straftaten zu werden, verwendet werden sollen;\n[annex:III:6:b] KI-Systeme,
      die bestimmungsgem\u00e4\u00df von Strafverfolgungsbeh\u00f6rden oder in deren
      Namen oder von Organen, Einrichtungen und sonstigen Stellen der Union zur Unterst\u00fctzung
      von Strafverfolgungsbeh\u00f6rden als L\u00fcgendetektoren oder \u00e4hnliche
      Instrumente verwendet werden sollen;\n[annex:III:6:c] KI-Systeme, die bestimmungsgem\u00e4\u00df
      von Strafverfolgungsbeh\u00f6rden oder in deren Namen oder von Organen, Einrichtungen
      und sonstigen Stellen der Union zur Unterst\u00fctzung von Strafverfolgungsbeh\u00f6rden
      zur Bewertung der Verl\u00e4sslichkeit von Beweismitteln im Zuge der Ermittlung
      oder Verfolgung von Straftaten verwendet werden sollen;\n[annex:III:6:d] KI-Systeme,
      die bestimmungsgem\u00e4\u00df von Strafverfolgungsbeh\u00f6rden oder in deren
      Namen oder von Organen, Einrichtungen und sonstigen Stellen der Union zur Unterst\u00fctzung
      von Strafverfolgungsbeh\u00f6rden zur Bewertung des Risikos, dass eine nat\u00fcrliche
      Person eine Straftat begeht oder erneut begeht, nicht nur auf der Grundlage
      der Erstellung von Profilen nat\u00fcrlicher Personen gem\u00e4\u00df Artikel
      3 Absatz 4 der Richtlinie (EU) 2016/680 oder zur Bewertung pers\u00f6nlicher
      Merkmale und Eigenschaften oder vergangenen kriminellen Verhaltens von nat\u00fcrlichen
      Personen oder Gruppen verwendet werden sollen;\n[annex:III:6:e] KI-Systeme,
      die bestimmungsgem\u00e4\u00df von Strafverfolgungsbeh\u00f6rden oder in deren
      Namen oder von Organen, Einrichtungen und sonstigen Stellen der Union zur Unterst\u00fctzung
      von Strafverfolgungsbeh\u00f6rden zur Erstellung von Profilen nat\u00fcrlicher
      Personen gem\u00e4\u00df Artikel 3 Absatz 4 der Richtlinie (EU) 2016/680 im
      Zuge der Aufdeckung, Ermittlung oder Verfolgung von Straftaten verwendet werden
      sollen.\n[annex:III:7:a] KI-Systeme, die bestimmungsgem\u00e4\u00df von zust\u00e4ndigen
      Beh\u00f6rden oder in deren Namen oder Organen, Einrichtungen und sonstigen
      Stellen der Union als L\u00fcgendetektoren verwendet werden sollen oder \u00e4hnliche
      Instrumente;\n[annex:III:7:b] KI-Systeme, die bestimmungsgem\u00e4\u00df von
      zust\u00e4ndigen Beh\u00f6rden oder in deren Namen oder von Organen, Einrichtungen
      und sonstigen Stellen der Union zur Bewertung eines Risikos verwendet werden
      sollen, einschlie\u00dflich eines Sicherheitsrisikos, eines Risikos der irregul\u00e4ren
      Einwanderung oder eines Gesundheitsrisikos, das von einer nat\u00fcrlichen Person
      ausgeht, die in das Hoheitsgebiet eines Mitgliedstaats einzureisen beabsichtigt
      oder eingereist ist;\n[annex:III:7:c] KI-Systeme, die bestimmungsgem\u00e4\u00df
      von zust\u00e4ndigen Beh\u00f6rden oder in deren Namen oder von Organen, Einrichtungen
      und sonstigen Stellen der Union verwendet werden sollen, um zust\u00e4ndige
      Beh\u00f6rden bei der Pr\u00fcfung von Asyl- und Visumantr\u00e4gen sowie Aufenthaltstiteln
      und damit verbundenen Beschwerden im Hinblick auf die Feststellung der Berechtigung
      der den Antrag stellenden nat\u00fcrlichen Personen, einschlie\u00dflich damit
      zusammenh\u00e4ngender Bewertungen der Verl\u00e4sslichkeit von Beweismitteln,
      zu unterst\u00fctzen;\n[annex:III:7:d] KI-Systeme, die bestimmungsgem\u00e4\u00df
      von oder im Namen der zust\u00e4ndigen Beh\u00f6rden oder Organen, Einrichtungen
      und sonstigen Stellen der Union, im Zusammenhang mit Migration, Asyl oder Grenzkontrolle
      zum Zwecke der Aufdeckung, Anerkennung oder Identifizierung nat\u00fcrlicher
      Personen verwendet werden sollen, mit Ausnahme der \u00dcberpr\u00fcfung von
      Reisedokumenten.\n[annex:III:8:a] KI-Systeme, die bestimmungsgem\u00e4\u00df
      von einer oder im Namen einer Justizbeh\u00f6rde verwendet werden sollen, um
      eine Justizbeh\u00f6rde bei der Ermittlung und Auslegung von Sachverhalten und
      Rechtsvorschriften und bei der Anwendung des Rechts auf konkrete Sachverhalte
      zu unterst\u00fctzen, oder die auf \u00e4hnliche Weise f\u00fcr die alternative
      Streitbeilegung genutzt werden sollen;\n[annex:III:8:b] KI-Systeme, die bestimmungsgem\u00e4\u00df
      verwendet werden sollen, um das Ergebnis einer Wahl oder eines Referendums oder
      das Wahlverhalten nat\u00fcrlicher Personen bei der Aus\u00fcbung ihres Wahlrechts
      bei einer Wahl oder einem Referendum zu beeinflussen. Dazu geh\u00f6ren nicht
      KI-Systeme, deren Ausgaben nat\u00fcrliche Personen nicht direkt ausgesetzt
      sind, wie Instrumente zur Organisation, Optimierung oder Strukturierung politischer
      Kampagnen in administrativer oder logistischer Hinsicht.\n\nGuideline passages
      and examples found:\n[guide:guide-prohibited:para:134] (3.5.2. Manipulative,
      t\u00e4uschende und ausbeuterische KI-Systeme, die voraussichtlich keinen erheblichen
      Schaden verursachen)\n(134) Eine wesentliche Bedingung f\u00fcr die Geltung
      der Verbote nach Artikel 5 Absatz 1 Buchstaben a und b der KI-Verordnung ist,
      dass die KI-gest\u00fctzte Manipulation und Ausnutzung von Vulnerabilit\u00e4ten
      erheblichen Schaden verursacht oder mit hinreichender Wahrscheinlichkeit verursachen
      wird. Alle manipulativen, t\u00e4uschenden und ausbeuterischen KI-Anwendungen,
      die mit hinreichender Wahrscheinlichkeit keine erheblichen Sch\u00e4den verursachen,
      fallen grunds\u00e4tzlich nicht in den Anwendungsbereich der Verbote, unbeschadet
      anderer, dar\u00fcber hinaus geltender Rechtsvorschriften der Union (siehe Abschnitt
      3.6).\n\nBeispiele f\u00fcr KI-Systeme, die voraussichtlich keinen erheblichen
      Schaden verursachen:\n\n- Ein KI-Begleitsystem (Companion-App) ist anthropomorph
      und mit Affective Computing (Emotions-KI) konzipiert, um das System ansprechender
      zu gestalten; es bindet Nutzer tats\u00e4chlich wirksamer, \u00fcbt aber keine
      manipulativen oder t\u00e4uschenden Praktiken in einer Weise aus, die ihnen
      mit hinreichender Wahrscheinlichkeit schwere psychische, physische oder sonstige
      Sch\u00e4den zuf\u00fcgt oder ungesunde Bindungen und Abh\u00e4ngigkeiten herbeif\u00fchrt.\n\n-
      Ein therapeutischer Chatbot nutzt unterschwellige Techniken, um die Nutzer zu
      einer ges\u00fcnderen Lebensweise zu bewegen und schlechte Angewohnheiten wie
      Rauchen aufzugeben. Selbst wenn die Nutzer, die den Rat des Chatbots und die
      unterschwellige Therapie befolgen, aufgrund der Bem\u00fchungen, das Rauchen
      aufzugeben, k\u00f6rperliche Beschwerden und psychische Belastungen durchleben,
      kann nicht davon ausgegangen werden, dass der KI-gest\u00fctzte Chatbot erhebliche
      Sch\u00e4den verursacht. Solche vor\u00fcbergehenden Beschwerden sind unvermeidlich
      und werden durch die langfristigen Vorteile f\u00fcr die Gesundheit der Nutzer
      aufgewogen. Es gibt keine versteckten Versuche, \u00fcber die F\u00f6rderung
      gesunder Gewohnheiten hinaus die Entscheidungsfindung zu beeinflussen.\n\n-
      Eine Online-Musikplattform nutzt ein Emotionserkennungssystem, um R\u00fcckschl\u00fcsse
      auf die Gef\u00fchle der Nutzer zu ziehen und ihnen automatisch Lieder zu empfehlen,
      die zu ihrer Stimmung passen, vermeiden aber gleichzeitig, sie zu stark mit
      depressiv stimmenden Liedern zu belasten. Da die Nutzer lediglich Musik h\u00f6ren
      und nicht anderweitig gesch\u00e4digt werden oder bei ihnen Depressionen und
      Angstzust\u00e4nde ausgel\u00f6st werden, ist mit hinreichender Wahrscheinlichkeit
      davon auszugehen, dass das System keine erheblichen Sch\u00e4den verursacht.\n\n-
      KI-gest\u00fctzte manipulative und betr\u00fcgerische Techniken, die in Sicherheitsschulungen
      und in anderen Lernsimulationen eingesetzt werden, und mit denen versucht wird,
      Nutzer \u00fcber Bedrohungen der Cybersicherheit aufzukl\u00e4ren. Diese Systeme
      k\u00f6nnen gezielt manipulative Techniken einsetzen (z. B. die Ausnutzung kognitiver
      Verzerrungen), ohne dass dies den Nutzern bewusst ist; sie ver\u00e4ndern das
      Verhalten, wobei dies jedoch vor\u00fcbergehend f\u00fcr sinnvolle Schulungs-
      und Sensibilisierungszwecke und ohne erhebliche Sch\u00e4den zu verursachen
      geschieht.\n\n[guide:guide-prohibited:para:13] (2.2. Rechtsgrundlage der Verbote)\n(13)
      In Artikel 3 Nummer 11 der KI-Verordnung wird die Inbetriebnahme definiert als
      \"die Bereitstellung eines KI-Systems in der Union zum Erstgebrauch direkt an
      den Betreiber oder zum Eigengebrauch entsprechend seiner Zweckbestimmung\" und
      umfasst daher sowohl die Bereitstellung an Dritte zur Erstnutzung als auch die
      interne Entwicklung und den Einsatz. Die Zweckbestimmung des Systems ist \"die
      Verwendung, f\u00fcr die ein KI-System laut Anbieter bestimmt ist, einschlie\u00dflich
      der besonderen Umst\u00e4nde und Bedingungen f\u00fcr die Verwendung, entsprechend
      den vom Anbieter bereitgestellten Informationen in den Betriebsanleitungen,
      im Werbe- oder Verkaufsmaterial und in diesbez\u00fcglichen Erkl\u00e4rungen
      sowie in der technischen Dokumentation\" 7 .\n\nZum Beispiel baut ein Anbieter
      ein RBI-System au\u00dferhalb der Union und stellt dieses System einer Strafverfolgungsbeh\u00f6rde
      oder einem in einem Mitgliedstaat niedergelassenen Privatunternehmen zur erstmaligen
      Nutzung zur Verf\u00fcgung, wodurch es in Betrieb genommen wird.\n\nEine Beh\u00f6rde
      entwickelt zum Beispiel intern ein Bewertungssystem und setzt es ein, um das
      Betrugsrisiko der Empf\u00e4nger von Haushaltszulagen vorauszusagen; somit nimmt
      sie das System in Betrieb.\n\n[guide:guide-definition:para:64] (III. Schlussbemerkungen)\n(64)
      Die KI-Verordnung gilt auch f\u00fcr KI-Modelle mit allgemeinem Verwendungszweck,
      die in Kapitel V der KI-Verordnung geregelt sind. Die Analyse der Unterschiede
      zwischen KI-Systemen und KI-Modellen mit allgemeinem Verwendungszweck liegt
      au\u00dferhalb des Gegenstands dieser Leitlinien.\n\n[guide:guide-prohibited:para:40]
      (2.7. Anwendung der Verbote auf KI-Systeme mit allgemeinem Verwendungszweck
      und Systeme mit Zweckbestimmung)\n(40) Von den Betreibern wird folglich erwartet,
      dass sie kein KI-System in einer nach Artikel 5 der KI-Verordnung verbotenen
      Weise verwenden und auch keine von den Anbietern des Systems errichteten \"Sicherheitsleitplanken\"
      umgehen. Sch\u00e4den entstehen zwar h\u00e4ufig aus der Art und Weise, wie
      KI-Systeme in der Praxis eingesetzt werden, trotzdem sind Anbieter auch daf\u00fcr
      verantwortlich, KI-Systeme, einschlie\u00dflich KI-Systemen mit allgemeinem
      Verwendungszweck, die sich nach vern\u00fcnftigem Ermessen in einer nach Artikel
      5 der KI-Verordnung verbotenen Weise verhalten oder direkt in einer solchen
      Weise verwendet werden, nicht in Verkehr zu bringen oder in Betrieb zu nehmen
      35 . In diesem Zusammenhang wird von Anbietern auch erwartet, dass sie wirksame
      und \u00fcberpr\u00fcfbare Ma\u00dfnahmen ergreifen, um Schutzmechanismen einzubauen
      und solche sch\u00e4dlichen Verhaltensweisen und Fehlanwendungen zu verhindern
      und einzud\u00e4mmen, soweit sie vern\u00fcnftigerweise vorhersehbar sind und
      die Ma\u00dfnahmen dem jeweiligen KI-System und den Umst\u00e4nden des Einzelfalls
      entsprechend durchf\u00fchrbar und verh\u00e4ltnism\u00e4\u00dfig sind. Von
      Anbietern wird auch erwartet, dass sie in ihren vertraglichen Beziehungen zu
      Betreibern (d. h. in den Nutzungsbedingungen des KI-Systems) die Verwendung
      ihres KI-Systems f\u00fcr verbotene Praktiken ausschlie\u00dfen und in den Betriebsanleitungen
      f\u00fcr Betreiber und in Bezug auf die erforderliche menschliche Aufsicht angemessene
      Informationen bereitstellen.\n\nBeispielsweise kann ein KI-System mit allgemeinem
      Verwendungszweck, das als Chatbot verwendet wird, manipulative und irref\u00fchrende
      Techniken einsetzen, von denen anzunehmen ist, dass sie erheblichen Schaden
      verursachen. Um verbotenes Verhalten des KI-Systems zu verhindern und Verwendungen
      zu unterbinden, bei denen nach vern\u00fcnftigem Ermessen davon auszugehen ist,
      dass sie nach Artikel 5 Absatz 1 Buchstabe a der KI-Verordnung manipulieren,
      t\u00e4uschen und erhebliche Sch\u00e4den verursachen, wird von Anbietern erwartet,
      dass sie vor dem Inverkehrbringen des KISystems (Artikel 5 Absatz 1 Buchstabe
      a der KI-Verordnung) geeignete, verh\u00e4ltnism\u00e4\u00dfige Ma\u00dfnahmen
      ergreifen (z. B. eine angemessene sichere und ethische Konzeption, die Integration
      technischer und anderer Schutzmechanismen, Nutzungsbeschr\u00e4nkungen, Transparenz
      und Nutzerkontrolle, geeignete Informationen in der Betriebsanleitung), um sicherzustellen,
      dass der Chatbot Nutzern oder anderen Personen bzw. Personengruppen keinen erheblichen
      Schaden zuf\u00fcgt (siehe auch Abschnitt 3.2.3 Buchstabe c).\n\n33 In Artikel
      3 Nummer 12 der KI-Verordnung definiert als die Verwendung, f\u00fcr die ein
      KI-System laut Anbieter bestimmt ist, einschlie\u00dflich der besonderen Umst\u00e4nde
      und Bedingungen f\u00fcr die Verwendung, entsprechend den vom Anbieter bereitgestellten
      Informationen in den Betriebsanleitungen, im Werbe- oder Verkaufsmaterial und
      in diesbez\u00fcglichen Erkl\u00e4rungen sowie in der technischen Dokumentation.\n\n34
      Siehe Artikel 3 Nummer 66 der KI-Verordnung.\n\n35 Dies ergibt sich insbesondere
      aus dem Verweis auf das \"Inverkehrbringen\" oder die \"Inbetriebnahme\" in
      allen in Artikel 5 der KIVerordnung aufgef\u00fchrten Verboten, mit Ausnahme
      des Verbots biometrischer Echtzeit-Fernidentifizierungssysteme in Artikel 5
      Absatz 1 Buchstabe h, das nur f\u00fcr die Verwendung gilt.\n\n[guide:guide-prohibited:para:36]
      (2.5.5. KI-Systeme, die im Rahmen freier und quelloffener Lizenzen freigegeben
      werden)\n(36) Nach Artikel 2 Absatz 12 der KI-Verordnung gilt diese Verordnung
      nicht f\u00fcr KISysteme, die im Rahmen freier und quelloffener Lizenzen 29
      freigegeben werden, es sei denn, sie werden als Hochrisiko-KI-Systeme oder als
      KI-Systeme, die unter Artikel 5 (verbotene Praktiken im KI-Bereich) oder Artikel
      50 der KI-Verordnung (Transparenzpflichten f\u00fcr bestimmte KI-Systeme) fallen,
      in Verkehr gebracht oder in Betrieb genommen. Dies bedeutet, dass Anbieter von
      KI-Systemen nicht in den Genuss dieses Ausschlusses kommen k\u00f6nnen, wenn
      das von ihnen in Verkehr gebrachte oder in Betrieb genommene KI-System eine
      verbotene Praxis gem\u00e4\u00df Artikel 5 der KIVerordnung darstellt.\n\n29
      In Erw\u00e4gungsgrund 102 der KI-Verordnung hei\u00dft es, dass die Freigabe
      von Software und Daten im Rahmen einer kostenlosen und quelloffenen Lizenz \"ihre
      offene Weitergabe erlaubt und die Nutzer [diese] kostenlos abrufen, nutzen,
      ver\u00e4ndern und weiter verteilen k\u00f6nnen, auch in ver\u00e4nderter Form\".\n\n[guide:guide-definition:para:4]
      (MITTEILUNG DER KOMMISSION \u203a Leitlinien der Kommission zur Definition eines
      Systems der k\u00fcnstlichen Intelligenz gem\u00e4\u00df der Verordnung (EU)
      2024/1689 (KI-Verordnung) \u203a I. Zweck der Leitlinien)\n(4) Die Definition
      eines KI-Systems ist seit dem 2. Februar 2025 anwendbar 3 , zusammen mit anderen
      Bestimmungen der Kapitel I und II der KI-Verordnung, insbesondere Artikel 5
      der KI-Verordnung \u00fcber verbotene Praktiken im KI-Bereich. Da die Definition
      eines KI-Systems f\u00fcr das Verst\u00e4ndnis des Anwendungsbereichs der KI-Verordnung,
      einschlie\u00dflich der verbotenen Praktiken, entscheidend ist, werden die vorliegenden
      Leitlinien parallel zu Leitlinien der Kommission zu verbotenen Praktiken im
      Bereich der k\u00fcnstlichen Intelligenz angenommen.\n\n[guide:guide-prohibited:para:2]
      (MITTEILUNG DER KOMMISSION \u203a Leitlinien der Kommission zu verbotenen Praktiken
      der k\u00fcnstlichen Intelligenz gem\u00e4\u00df der Verordnung (EU) 2024/1689
      (KI-Verordnung) \u203a INHALT \u203a 1. HINTERGRUND UND ZIELE)\n(2) Die KI-Verordnung
      folgt einem risikobasierten Ansatz, bei dem KI-Systeme in vier verschiedene
      Risikokategorien eingeteilt werden:\n\n(i) Unannehmbares Risiko: KI-Systeme,
      die unannehmbare Risiken f\u00fcr die Grundrechte und die Werte der Union darstellen,
      sind nach Artikel 5 der KIVerordnung verboten.\n\n(ii) Hohes Risiko: KI-Systeme,
      die ein hohes Risiko f\u00fcr Gesundheit, Sicherheit und Grundrechte darstellen,
      unterliegen einer Reihe von Anforderungen und Pflichten. Diese Systeme werden
      nach Artikel 6 der KI-Verordnung in Verbindung mit den Anh\u00e4ngen I und III
      der KI-Verordnung als \"hochriskant\" eingestuft.\n\n(iii) Transparenzrisiko:
