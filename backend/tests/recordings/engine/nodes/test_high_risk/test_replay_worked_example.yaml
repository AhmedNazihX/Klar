      such as tools used to organise, optimise or structure political campaigns from
      an administrative or logistical point of view.\n\nGuideline passages and examples
      found:\n[guide:guide-high-risk-annex-iii:para:254] (v. Evaluate candidates)\n(254)
      The terms ''to evaluate candidates'' used in point 4(a) of Annex III must also
      be understood broadly. Evaluation refers to any assessment of a candidate''s
      (including self-employed) suitability, merit or potential, whether through scoring,
      ranking, predictive modelling, or qualitative judgements derived from data inputs.
      The provision does not require that the evaluation carried out by the AI system
      directly determines the hiring outcome. It suffices that it appreciably influences
      the decision-making process, for example by laying out shortlists, prioritising
      certain applicants or scoring assessments within the context of the recruitment
      or selection process that may result in advantages for certain candidates. AI
      tools that merely present factual information without involving evaluative weight
