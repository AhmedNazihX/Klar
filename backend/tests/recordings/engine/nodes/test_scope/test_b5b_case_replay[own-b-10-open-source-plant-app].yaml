        \"inferred\",\n    \"fact\": \"The app is available for public use, not solely
        for scientific research and development.\",\n    \"fact_numbers\": []\n  },\n  \"pre_market_development\":
        {\n    \"answer\": \"no\",\n    \"evidence\": \"inferred\",\n    \"fact\":
