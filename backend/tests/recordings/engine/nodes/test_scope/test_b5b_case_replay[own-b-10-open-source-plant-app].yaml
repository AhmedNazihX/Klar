- request:
    body: '{"input":["Instruct: Given a description of an AI system or a question
      about the EU AI Act, retrieve the provisions of the AI Act that apply\nQuery:Is
      this an AI system under the AI system definition? We''re a volunteer association
      of gardeners and hobby programmers in Ghent, about 40 active members and no
      employees. We trained an image model that looks at a photo of a tomato, pepper
      or cucumber leaf and says which of twelve common diseases it probably has, if
      any. The model weights, the training code and a simple phone app are on GitHub
      under the Apache 2.0 licence; anyone can download, change and redistribute them.
      We don''t charge for anything, offer no paid support, show no ads and don''t
      collect the photos people take. Last year about 8,000 people installed the app.
      Our members also run seed-swap afternoons in the city library."],"model":"qwen/qwen3-embedding-8b","dimensions":1536,"encoding_format":"float","provider":{"allow_fallbacks":false,"data_collection":"deny","order":["nebius"],"zdr":true}}'
