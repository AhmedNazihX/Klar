0289946,0.056931596249341965,-0.015628281980752945,0.006093169562518597,0.003069841070100665,-0.07255987823009491,0.00325589207932353,0.006325732916593552,-0.04874535650014877,-0.005162914749234915,-0.029023952782154083,-0.007814140990376472,-0.0173027403652668,0.004488479811698198,-0.038698602467775345,-0.009069984778761864,-0.032000768929719925,0.015535255894064903,-0.021860988810658455,0.016093408688902855,0.016000384464859962,-0.013860797509551048,-0.03404732793569565,0.04465223476290703,0.042605672031641006,0.03944280743598938,0.00005014655107515864,0.024186626076698303,0.024186626076698303,-0.03218681737780571,0.0014360809000208974,0.014418950304389,0.021023759618401527,0.016930637881159782,0.011860749684274197,-0.010604905895888805,0.010604905895888805],\"index\":0}],\"model\":\"Qwen/Qwen3-Embedding-8B\",\"usage\":{\"prompt_tokens\":185,\"total_tokens\":185,\"cost\":0.00000185,\"is_byok\":false,\"cost_details\":{\"upstream_inference_cost\":0.00000185,\"upstream_inference_prompt_cost\":0.00000185,\"upstream_inference_completions_cost\":0}},\"provider\":\"Nebius\"}"
