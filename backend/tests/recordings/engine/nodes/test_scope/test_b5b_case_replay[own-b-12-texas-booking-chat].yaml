    body: '{"input":["Instruct: Given a description of an AI system or a question
      about the EU AI Act, retrieve the article, Annex point or recital of the AI
      Act that governs it\nQuery:Is this an AI system under the AI system definition?
      We''re a plumbing and air-conditioning company in San Antonio, Texas, with about
      60 technicians. Last year we added an AI chat assistant to our website, bought
      as a subscription from a Californian startup. Customers type what''s wrong,
      the assistant asks follow-up questions, gives a price range and books a technician.
      We only serve homes and businesses in the San Antonio area, the site is English
      and Spanish only, we don''t ship anything abroad, and nothing the assistant
      produces is sent to or used by anyone outside the United States. Neither we
      nor the startup have any office or customers in Europe. Our vans got a new paint
      job in the spring."],"model":"qwen/qwen3-embedding-8b","dimensions":1536,"encoding_format":"float","provider":{"allow_fallbacks":false,"data_collection":"deny","order":["nebius"],"zdr":true}}'
