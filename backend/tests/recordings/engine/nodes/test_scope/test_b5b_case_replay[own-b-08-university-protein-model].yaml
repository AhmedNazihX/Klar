    body: '{"input":["Instruct: Given a description of an AI system or a question
      about the EU AI Act, retrieve the article, Annex point or recital of the AI
      Act that governs it\nQuery:Is this an AI system under the AI system definition?
      We''re a structural biology group of about 25 people at a university in Leuven.
      Over the past two years our PhD students trained a deep-learning model that
      predicts how strongly candidate molecules bind to a family of bacterial enzymes.
      We built it only for our own research: the predictions tell us which molecules
      are worth making in the wet lab, and the results go into our papers. The model
      runs on the university''s computing cluster, only our group has access, and
      we don''t license it, sell it or offer it to hospitals, companies or anyone
      else. The work is funded by a public research grant that ends in 2028. We also
      host a summer school every July."],"model":"qwen/qwen3-embedding-8b","dimensions":1536,"encoding_format":"float","provider":{"allow_fallbacks":false,"data_collection":"deny","order":["nebius"],"zdr":true}}'
