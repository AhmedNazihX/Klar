      high accuracy in and low rate of failures. In contrast, the intended purpose
      is externally oriented and includes the context in which the system is designed
      to be deployed and how it must be operated. Indeed, according to Article 3(12)
      AI Act, the intended purpose of an AI system refers to the ''use for which an
      AI system is intended by the provider''. For example, in the case of a corporate
      virtual AI assistant system, the intended purpose might be to assist a certain
      department of a company to carry out certain tasks. This might require that
