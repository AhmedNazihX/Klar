- request:
    body: '{"input":["Instruct: Given a description of an AI system or a question
      about the EU AI Act, retrieve the provisions of the AI Act that apply\nQuery:Is
      this an AI system under the AI system definition? Ich bin Realschullehrer in
      Kassel und lege seit ein paar Jahren privat Geld f\u00fcr meine Rente an. Daf\u00fcr
      nutze ich eine App, f\u00fcr die ich monatlich 9 Euro zahle: Sie lernt aus Kursverl\u00e4ufen
      und Nachrichten und schichtet mein Depot mit ETFs und ein paar Einzelaktien
      selbstst\u00e4ndig um, meist zwei- bis dreimal im Monat. Ich lege nur fest,
      wie viel Risiko ich eingehen will und wie viel ich monatlich einzahle. Es geht
      ausschlie\u00dflich um mein eigenes Geld; beruflich habe ich mit Finanzen nichts
      zu tun und ich berate auch niemanden. Die App kommt von einem Anbieter aus Amsterdam.
      Meine Frau nutzt dieselbe App f\u00fcr ihr eigenes Depot."],"model":"qwen/qwen3-embedding-8b","dimensions":1536,"encoding_format":"float","provider":{"allow_fallbacks":false,"data_collection":"deny","order":["nebius"],"zdr":true}}'
