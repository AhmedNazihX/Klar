- request:
    body: '{"input":["Instruct: Given a description of an AI system or a question
      about the EU AI Act, retrieve the provisions of the AI Act that apply\nQuery:Is
      this an AI system under the AI system definition? Wir sind eine Spedition aus
      Bielefeld mit rund 400 Besch\u00e4ftigten und suchen st\u00e4ndig Berufskraftfahrer.
      Bewerbungen laufen \u00fcber ein Bewerbermanagement-System, das wir als Cloud-Abo
      nutzen. Unsere Personalreferentin legt pro Stelle feste Pflichtkriterien an,
      zum Beispiel F\u00fchrerscheinklasse CE, Fahrerkarte vorhanden, Deutschkenntnisse
      mindestens B1 und Wohnort im Umkreis von 80 Kilometern. Das System blendet alle
      Bewerbungen aus, bei denen im Formular eines dieser H\u00e4kchen fehlt, und
      sortiert den Rest nach Eingangsdatum. Laut Produktbeschreibung des Anbieters
      steckt dahinter kein trainiertes Modell, es gibt keine Punktwerte und keine
      Rangfolge; es werden nur genau die Filter angewendet, die wir eintragen. Die
      ausgeblendeten Bewerbungen schaut sich die Referentin trotzdem einmal pro Woche
      an. Nebenbei verschickt das Tool auch die Terminbest\u00e4tigungen f\u00fcr
      Vorstellungsgespr\u00e4che."],"model":"qwen/qwen3-embedding-8b","dimensions":1536,"encoding_format":"float","provider":{"allow_fallbacks":false,"data_collection":"deny","order":["nebius"],"zdr":true}}'
