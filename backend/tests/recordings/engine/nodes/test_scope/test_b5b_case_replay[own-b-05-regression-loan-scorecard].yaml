- request:
    body: '{"input":["Instruct: Given a description of an AI system or a question
      about the EU AI Act, retrieve the article, Annex point or recital of the AI
      Act that governs it\nQuery:Is this an AI system under the AI system definition?
      We''re a regional savings bank in Upper Austria with 34 branches. Our risk team
      is rebuilding the scorecard we use for consumer loans and car finance, to go
      live in spring 2028. Like the old one, it''s a logistic regression, a method
      banks have used for decades: the team fits it on fifteen years of our own loan
      files, and it turns an applicant''s income, existing debts, account history
      and job tenure into a probability of default. Applications below a cut-off score
      are declined automatically; the rest go to a loan officer. The model is refitted
      once a year and otherwise stays fixed. No outside vendor is involved. The same
      project also moves our branch appointment booking online."],"model":"qwen/qwen3-embedding-8b","dimensions":1536,"encoding_format":"float","provider":{"allow_fallbacks":false,"data_collection":"deny","order":["nebius"],"zdr":true}}'
