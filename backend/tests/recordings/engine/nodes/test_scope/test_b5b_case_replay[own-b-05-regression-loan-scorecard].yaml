      string: '{"id": "gen-1791816478-mAR4vcQFL0ynjtVZnwqC", "object": "chat.completion",
        "created": 1791816478, "model": "openai/gpt-6-luna", "provider": "Azure",
        "system_fingerprint": null, "service_tier": "default", "choices": [{"index":
        0, "logprobs": null, "finish_reason": "stop", "native_finish_reason": "completed",
        "message": {"role": "assistant", "content": "{\n  \"ai_system\": {\n    \"answer\":
        \"yes\",\n    \"evidence\": \"inferred\",\n    \"fact\": \"The fitted logistic-regression
        scorecard infers a probability of default from applicant data; it is not being
        used to improve or approximate an optimisation method.\",\n    \"fact_numbers\":
        [],\n    \"guidance_numbers\": [3, 4]\n  },\n  \"guidance_excludes_technique\":
        {\n    \"answer\": \"no\",\n    \"evidence\": \"inferred\",\n    \"fact\":
        \"The guideline passage places logistic-regression methods outside the definition
        when used for optimisation, not for predicting loan default.\",\n    \"fact_numbers\":
