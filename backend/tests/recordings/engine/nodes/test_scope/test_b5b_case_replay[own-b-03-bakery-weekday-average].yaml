      string: "{\"id\": \"gen-1791816442-TXnG4f8nYUPrCLz0eTcX\", \"object\": \"chat.completion\",
        \"created\": 1791816442, \"model\": \"openai/gpt-6-luna\", \"provider\": \"Azure\",
        \"system_fingerprint\": null, \"service_tier\": \"default\", \"choices\":
        [{\"index\": 0, \"logprobs\": null, \"finish_reason\": \"stop\", \"native_finish_reason\":
        \"completed\", \"message\": {\"role\": \"assistant\", \"content\": \"{\\n
        \ \\\"ai_system\\\": {\\n    \\\"answer\\\": \\\"no\\\",\\n    \\\"evidence\\\":
        \\\"inferred\\\",\\n    \\\"fact\\\": \\\"The system applies a fixed averaging
        calculation and a manually entered percentage to generate order suggestions.\\\",\\n
        \   \\\"fact_numbers\\\": [],\\n    \\\"guidance_numbers\\\": [1, 3]\\n  },\\n
        \ \\\"guidance_excludes_technique\\\": {\\n    \\\"answer\\\": \\\"yes\\\",\\n
        \   \\\"evidence\\\": \\\"inferred\\\",\\n    \\\"fact\\\": \\\"The system
