- request:
    body: '{"input":["Instruct: Given a description of an AI system or a question
      about the EU AI Act, retrieve the article, Annex point or recital of the AI
      Act that governs it\nQuery:Is this an AI system under the AI system definition?
      We''re a family bakery with 12 shops around Graz and about 110 staff. Every
      afternoon the shop managers get an order suggestion for the next morning''s
      bake from our till system. The calculation is simple: for each product it takes
      the number sold on the same weekday over the last four weeks and uses the average.
      Before public holidays the manager can add a fixed percentage by hand. The till
      vendor calls it \"smart ordering\", but that''s all it does, and the managers
      can overwrite any number before the order goes to the bakehouse. It has cut
      our leftover bread by about a fifth. Next spring we''re adding a gluten-free
      line to three shops."],"model":"qwen/qwen3-embedding-8b","dimensions":1536,"encoding_format":"float","provider":{"allow_fallbacks":false,"data_collection":"deny","order":["nebius"],"zdr":true}}'
