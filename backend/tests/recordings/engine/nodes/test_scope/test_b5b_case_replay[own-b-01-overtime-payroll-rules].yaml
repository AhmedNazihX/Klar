- request:
    body: '{"input":["Instruct: Given a description of an AI system or a question
      about the EU AI Act, retrieve the article, Annex point or recital of the AI
      Act that governs it\nQuery:Is this an AI system under the AI system definition?
      We''re a contract cleaning company in Rotterdam with around 900 cleaners working
      in offices, hospitals and schools. Our payroll runs on a package we bought from
      a Dutch software firm in 2019. Each month it takes the hours from the time clocks
      and works out every employee''s pay: the collective agreement''s night and Sunday
      supplements, overtime above 38 hours a week, travel allowances and holiday pay.
      Our payroll team typed all of these rules into the system when we set it up
      and changes them by hand when the agreement is renegotiated. The software doesn''t
      learn anything from past payslips; it applies the rules exactly as entered,
      and our payroll officer checks every run before payment. We''re also moving
      our holiday requests into the same package next year."],"model":"qwen/qwen3-embedding-8b","dimensions":1536,"encoding_format":"float","provider":{"allow_fallbacks":false,"data_collection":"deny","order":["nebius"],"zdr":true}}'
