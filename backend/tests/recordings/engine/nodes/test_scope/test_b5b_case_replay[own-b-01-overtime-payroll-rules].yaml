      string: '{"id": "gen-1791816408-4MRdKiVjhirysqu0OHa0", "object": "chat.completion",
        "created": 1791816408, "model": "openai/gpt-6-luna", "provider": "Azure",
        "system_fingerprint": null, "service_tier": "default", "choices": [{"index":
        0, "logprobs": null, "finish_reason": "stop", "native_finish_reason": "completed",
        "message": {"role": "assistant", "content": "{\n  \"ai_system\": {\n    \"answer\":
        \"no\",\n    \"evidence\": \"stated\",\n    \"fact\": \"The payroll software
        applies human-entered rules and does not learn or infer how to generate its
        outputs.\",\n    \"fact_numbers\": [],\n    \"guidance_numbers\": [1, 3, 4]\n  },\n  \"guidance_excludes_technique\":
        {\n    \"answer\": \"yes\",\n    \"evidence\": \"stated\",\n    \"fact\":
        \"The guidelines place fixed, human-programmed rules without learning or reasoning
