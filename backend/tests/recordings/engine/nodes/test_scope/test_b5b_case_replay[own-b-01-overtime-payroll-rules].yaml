      Numbers","type":"array"}},"required":["answer","evidence","fact","fact_numbers"],"title":"KeyFact","type":"object"}},"additionalProperties":false,"description":"The
      model''s whole answer; also the JSON schema it must fill. Each Art. 2 field
      is named\nafter its `ScopeQuestion.id`.","properties":{"ai_system":{"$ref":"#/$defs/DefinitionFact"},"guidance_excludes_technique":{"$ref":"#/$defs/GuidanceFact"},"eu_link":{"$ref":"#/$defs/KeyFact"},"military_only":{"$ref":"#/$defs/KeyFact"},"research_only":{"$ref":"#/$defs/KeyFact"},"pre_market_development":{"$ref":"#/$defs/KeyFact"},"personal_use":{"$ref":"#/$defs/KeyFact"},"open_source":{"$ref":"#/$defs/KeyFact"},"open_source_exception":{"$ref":"#/$defs/KeyFact"}},"required":["ai_system","guidance_excludes_technique","eu_link","military_only","research_only","pre_market_development","personal_use","open_source","open_source_exception"],"title":"ScopeAnswer","type":"object"}},"type":"json_schema"},"stream":false,"temperature":0.0}'
