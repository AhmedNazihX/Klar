        \"No exclusive military, defence or national-security use is indicated.\",\n    \"fact_numbers\":
        []\n  },\n  \"research_only\": {\n    \"answer\": \"no\",\n    \"evidence\":
        \"assumed\",\n    \"fact\": \"No sole scientific research and development
