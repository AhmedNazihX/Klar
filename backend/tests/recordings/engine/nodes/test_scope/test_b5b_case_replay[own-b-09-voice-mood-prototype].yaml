    body: '{"input":["Instruct: Given a description of an AI system or a question
      about the EU AI Act, retrieve the provisions of the AI Act that apply\nQuery:Is
      this an AI system under the AI system definition? Wir sind ein Start-up aus
      M\u00fcnchen mit elf Leuten und entwickeln gerade eine Software f\u00fcr Callcenter:
      Sie soll an der Stimme erkennen, ob ein anrufender Kunde ver\u00e4rgert, unsicher
      oder zufrieden ist, und das dem Mitarbeiter am Bildschirm anzeigen. Im Moment
      gibt es nur einen Prototyp. Trainiert und getestet wird er bei uns im B\u00fcro,
      mit gekauften Sprachaufnahmen von Schauspielern und mit k\u00fcnstlich erzeugten
      Stimmen. Echte Anrufe hat er noch nie geh\u00f6rt, wir haben noch keinen Pilotkunden,
      und verkauft oder irgendwo in Betrieb genommen ist er auch nicht. Den Marktstart
      planen wir fr\u00fchestens Anfang 2028, vorher suchen wir noch eine Finanzierungsrunde.
      Unser B\u00fcro teilen wir uns \u00fcbrigens mit einer Agentur f\u00fcr H\u00f6rb\u00fccher."],"model":"qwen/qwen3-embedding-8b","dimensions":1536,"encoding_format":"float","provider":{"allow_fallbacks":false,"data_collection":"deny","order":["nebius"],"zdr":true}}'
