152805000544,0.05195505917072296,0.0071678743697702885,0.03752309828996658,0.028671497479081154,-0.08582206070423126,0.021263089030981064,0.002718019299209118,-0.03136546164751053,0.009621307253837585,0.014143322594463825,0.016837287694215775,0.008611069992184639,0.0049549732357263565,-0.07196737825870514,-0.03829280287027359,-0.04021706432104111,0.010775864124298096,0.001262796577066183,-0.035406410694122314,0.00904402881860733,-0.011401249095797539,-0.030018480494618416,0.02184036746621132,0.047914110124111176,0.054649028927087784,-0.006398169323801994,0.04714440554380417,0.021455515176057816,-0.030788185074925423,-0.014528174884617329,0.007456513587385416,-0.011786101385951042,-0.000661464873701334,0.014528174884617329,-0.015105453319847584,-0.006734915543347597],"index":0}],"model":"Qwen/Qwen3-Embedding-8B","usage":{"prompt_tokens":236,"total_tokens":236,"cost":0.00000236,"is_byok":false,"cost_details":{"upstream_inference_cost":0.00000236,"upstream_inference_prompt_cost":0.00000236,"upstream_inference_completions_cost":0}},"provider":"Nebius"}'
