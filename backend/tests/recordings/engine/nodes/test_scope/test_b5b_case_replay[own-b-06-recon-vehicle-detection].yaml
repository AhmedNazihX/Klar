    body: '{"input":["Instruct: Given a description of an AI system or a question
      about the EU AI Act, retrieve the article, Annex point or recital of the AI
      Act that governs it\nQuery:Is this an AI system under the AI system definition?
      We''re a defence electronics firm in Toulouse with about 1,300 employees. One
      of our product lines is software that goes through footage from reconnaissance
      drones and marks armoured vehicles, artillery and field positions for the analysts
      in a command post. It was trained on years of annotated military imagery. We
      sell it only to the armed forces of EU and NATO member states under defence
      procurement contracts; it''s export-controlled, and there is no civilian or
      police version, nor any plan for one. The analysts confirm every marking before
      anything is passed on. Our company also makes radar components for civil aviation,
      which have nothing to do with this software."],"model":"qwen/qwen3-embedding-8b","dimensions":1536,"encoding_format":"float","provider":{"allow_fallbacks":false,"data_collection":"deny","order":["nebius"],"zdr":true}}'
