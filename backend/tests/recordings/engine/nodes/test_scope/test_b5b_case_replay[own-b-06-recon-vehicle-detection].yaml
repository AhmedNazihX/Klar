      a fact came from; used instead of a numeric confidence score.","enum":["stated","inferred","assumed"],"title":"EvidenceTag","type":"string"},"GuidanceFact":{"additionalProperties":false,"description":"Whether
      a guideline passage the model read names the system''s technique among those\noutside
