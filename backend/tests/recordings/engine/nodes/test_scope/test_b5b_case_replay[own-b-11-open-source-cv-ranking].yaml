- request:
    body: '{"input":["Instruct: Given a description of an AI system or a question
      about the EU AI Act, retrieve the provisions of the AI Act that apply\nQuery:Is
      this an AI system under the AI system definition? Wir sind ein Logistikdienstleister
      aus Duisburg mit etwa 1.100 Besch\u00e4ftigten und stellen jedes Jahr mehrere
      hundert Lagerkr\u00e4fte und Disponenten ein. Unsere IT hat ein frei verf\u00fcgbares
      Open-Source-Modell heruntergeladen, das Lebensl\u00e4ufe mit Stellenanzeigen
      vergleicht, und baut es gerade in unser Karriereportal ein. Jede Bewerbung soll
      so eine Passungsquote bekommen, und die Personalabteilung soll pro Stelle nur
      die 20 Bewerbungen mit der h\u00f6chsten Quote sehen. Alle anderen sollen automatisch
      eine Absage erhalten. Der Start ist f\u00fcr Anfang 2028 geplant; das Tool soll
      nur bei uns laufen, unter unserem Namen, und wir werden es nicht weiterverkaufen.
      Weil das Modell Open Source ist, geht unsere IT davon aus, dass die KI-Verordnung
      daf\u00fcr nicht gilt. Nebenbei nutzen wir das Portal auch f\u00fcr unser Azubi-Marketing."],"model":"qwen/qwen3-embedding-8b","dimensions":1536,"encoding_format":"float","provider":{"allow_fallbacks":false,"data_collection":"deny","order":["nebius"],"zdr":true}}'
