    body: '{"input":["Instruct: Given a description of an AI system or a question
      about the EU AI Act, retrieve the article, Annex point or recital of the AI
      Act that governs it\nQuery:Is this an AI system under the AI system definition?
      Wir sind ein Geodaten-Unternehmen aus Bremen mit 70 Mitarbeitenden. Unsere Software
      wertet Satellitenbilder aus: Ein neuronales Netz, das wir mit zehntausenden
      markierten Aufnahmen trainiert haben, erkennt Fahrzeuge, frisch angelegte Wege
      und Ver\u00e4nderungen an der Vegetation. Urspr\u00fcnglich haben wir sie f\u00fcr
      die Bundeswehr entwickelt, die damit Truppenbewegungen verfolgt. Seit diesem
      Sommer verkaufen wir dieselbe Software auch an Landesforstverwaltungen und Naturschutzverb\u00e4nde
      in mehreren EU-L\u00e4ndern, die damit illegale Rodungen und unerlaubte Waldwege
      aufsp\u00fcren. Beide Kundengruppen bekommen dasselbe Programm unter unserem
      Namen, nur mit anderen Kartenvorlagen. Personen erkennt die Software nicht,
      daf\u00fcr ist die Aufl\u00f6sung viel zu grob. N\u00e4chstes Jahr ziehen wir
      in ein gr\u00f6\u00dferes B\u00fcro in der \u00dcberseestadt."],"model":"qwen/qwen3-embedding-8b","dimensions":1536,"encoding_format":"float","provider":{"allow_fallbacks":false,"data_collection":"deny","order":["nebius"],"zdr":true}}'
