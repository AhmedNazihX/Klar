      in the context of or within educational and vocational training institutions
      at all levels;\n[annex:III:3:d] AI systems intended to be used for monitoring
      and detecting prohibited behaviour of students during tests in the context of
      or within educational and vocational training institutions at all levels.\n[annex:III:4:a]
      AI systems intended to be used for the recruitment or selection of natural persons,
      in particular to place targeted job advertisements, to analyse and filter job
      applications, and to evaluate candidates;\n[annex:III:4:b] AI systems intended
      to be used to make decisions affecting terms of work-related relationships,
      the promotion or termination of work-related contractual relationships, to allocate
      tasks based on individual behaviour or personal traits or characteristics or
      to monitor and evaluate the performance and behaviour of persons in such relationships.\n[annex:III:5:a]
      AI systems intended to be used by public authorities or on behalf of public
      authorities to evaluate the eligibility of natural persons for essential public
      assistance benefits and services, including healthcare services, as well as
      to grant, reduce, revoke, or reclaim such benefits and services;\n[annex:III:5:b]
      AI systems intended to be used to evaluate the creditworthiness of natural persons
      or establish their credit score, with the exception of AI systems used for the
      purpose of detecting financial fraud;\n[annex:III:5:c] AI systems intended to
      be used for risk assessment and pricing in relation to natural persons in the
      case of life and health insurance;\n[annex:III:5:d] AI systems intended to evaluate
      and classify emergency calls by natural persons or to be used to dispatch, or
      to establish priority in the dispatching of, emergency first response services,
      including by police, firefighters and medical aid, as well as of emergency healthcare
      patient triage systems.\n[annex:III:6:a] AI systems intended to be used by or
      on behalf of law enforcement authorities, or by Union institutions, bodies,
      offices or agencies in support of law enforcement authorities or on their behalf
      to assess the risk of a natural person becoming the victim of criminal offences;\n[annex:III:6:b]
      AI systems intended to be used by or on behalf of law enforcement authorities
      or by Union institutions, bodies, offices or agencies in support of law enforcement
      authorities as polygraphs or similar tools;\n[annex:III:6:c] AI systems intended
      to be used by or on behalf of law enforcement authorities, or by Union institutions,
      bodies, offices or agencies, in support of law enforcement authorities to evaluate
      the reliability of evidence in the course of the investigation or prosecution
      of criminal offences;\n[annex:III:6:d] AI systems intended to be used by law
      enforcement authorities or on their behalf or by Union institutions, bodies,
      offices or agencies in support of law enforcement authorities for assessing
      the risk of a natural person offending or re-offending not solely on the basis
      of the profiling of natural persons as referred to in Article 3(4) of Directive
      (EU) 2016/680, or to assess personality traits and characteristics or past criminal
      behaviour of natural persons or groups;\n[annex:III:6:e] AI systems intended
      to be used by or on behalf of law enforcement authorities or by Union institutions,
      bodies, offices or agencies in support of law enforcement authorities for the
      profiling of natural persons as referred to in Article 3(4) of Directive (EU)
      2016/680 in the course of the detection, investigation or prosecution of criminal
      offences.\n[annex:III:7:a] AI systems intended to be used by or on behalf of
      competent public authorities or by Union institutions, bodies, offices or agencies
      as polygraphs or similar tools;\n[annex:III:7:b] AI systems intended to be used
      by or on behalf of competent public authorities or by Union institutions, bodies,
      offices or agencies to assess a risk, including a security risk, a risk of irregular
      migration, or a health risk, posed by a natural person who intends to enter
      or who has entered into the territory of a Member State;\n[annex:III:7:c] AI
      systems intended to be used by or on behalf of competent public authorities
      or by Union institutions, bodies, offices or agencies to assist competent public
      authorities for the examination of applications for asylum, visa or residence
      permits and for associated complaints with regard to the eligibility of the
      natural persons applying for a status, including related assessments of the
      reliability of evidence;\n[annex:III:7:d] AI systems intended to be used by
      or on behalf of competent public authorities, or by Union institutions, bodies,
      offices or agencies, in the context of migration, asylum or border control management,
      for the purpose of detecting, recognising or identifying natural persons, with
      the exception of the verification of travel documents.\n[annex:III:8:a] AI systems
      intended to be used by a judicial authority or on their behalf to assist a judicial
      authority in researching and interpreting facts and the law and in applying
      the law to a concrete set of facts, or to be used in a similar way in alternative
      dispute resolution;\n[annex:III:8:b] AI systems intended to be used for influencing
      the outcome of an election or referendum or the voting behaviour of natural
      persons in the exercise of their vote in elections or referenda. This does not
      include AI systems to the output of which natural persons are not directly exposed,
      such as tools used to organise, optimise or structure political campaigns from
      an administrative or logistical point of view.\n\nGuideline passages and examples
      found:\n[guide:guide-high-risk-annex-iii:para:254] (v. Evaluate candidates)\n(254)
      The terms ''to evaluate candidates'' used in point 4(a) of Annex III must also
      be understood broadly. Evaluation refers to any assessment of a candidate''s
      (including self-employed) suitability, merit or potential, whether through scoring,
      ranking, predictive modelling, or qualitative judgements derived from data inputs.
      The provision does not require that the evaluation carried out by the AI system
      directly determines the hiring outcome. It suffices that it appreciably influences
      the decision-making process, for example by laying out shortlists, prioritising
      certain applicants or scoring assessments within the context of the recruitment
      or selection process that may result in advantages for certain candidates. AI
      tools that merely present factual information without involving evaluative weight
      (such as software displaying unaltered employment history) may fall outside
      scope if they do not generate assessments of suitability.\n\n46 Oral responses
      could be evaluated, for example, through an AI system capable of processing
      video- and audio and interacting with the applicant through an avatar.\n\n[guide:guide-high-risk-annex-iii:para:253]
      (iv. Analyse and filter job applications)\n(253) The terms ''to analyse and
      filter job applications'' used in point 4(a) of Annex III should be understood
      broadly and not as limiting the use case to AI systems that always perform both
      functions simultaneously. A functional interpretation is required: where an
      AI system merely analyses applications in a descriptive sense (such as converting
      file formats or classifying degrees into standard categories without applying
      evaluative weight), it may be considered to perform a preparatory task within
      the meaning of Article 6(3)(d) AI Act. In contrast, AI systems that analyse
      job applications with an effect that may result in a restriction of the applicant
      in accessing certain job opportunities, for example by producing suitability
      scores, assessing compatibility of a candidate''s profile or experience with
      the selection criteria or job description, or producing competence profiles
      that condition shortlisting, fall within scope of the high-risk use case listed
      in point 4(a) of Annex III. In this case, ''analysis\" and ''filtering\" form
      part of a continuum: analysis that influences access to later stages operates
      de facto as filtering, and therefore falls within the scope of Annex III, point
      4(a).\n\n45 This would be the case if the requirements stem from a genuine and
      determining occupational requirement whose absence may make it impossible for
      the candidate to perform the functions stated in the job description, and not
      when it is about a preferred characteristic, or a specific profile that while
      desirable does not have a direct and objective link to the required qualifications/skills.
      In assessing the mentioned non-discriminatory, objective and reasonable criteria,
      it is important to consider the EU non-discrimination acquis, including Article
      4 of Directives 2000/78/EC and 2000/43/EC and Article 14(2) of Directive 2006/54/EC
      of the European Parliament and of the Council of 5 July 2006 on the implementation
      of the principle of equal opportunities and equal treatment of men and women
      in matters of employment and occupation (recast), OJ L 204, 26.7.2006, pp. 23-36.\n\n[guide:guide-high-risk-annex-iii:ex:112]
      (v. Evaluate candidates \u203a a) Practical examples of AI systems falling within
      the high-risk use case of point 4(a))\nAI system ranking self-employed service
      providers\nAn online platform designed to help consumers in finding a self-employed
      service provider to assist them with various tasks uses an AI-enabled job-matching
      tool that ranks service providers and determines which are presented to potential
      consumers.\nThis system falls within the use case of point 4(a) of Annex III
      since it directly and meaningfully affects selection of natural persons by filtering
      and ranking potential service providers. Because its output shapes access to
      future assignments and may have a decisive impact on the careers of self-employed
      persons, along with their livelihoods and rights, none of the exceptions in
      Article 6(3) apply.\n\n[guide:guide-high-risk-annex-iii:para:245] (3.4.2. Point
      4(a): AI systems intended to be used for the recruitment or selection of natural
      persons)\n(245) For an AI system to be classified as high-risk pursuant to point
      4(a) of Annex III, the activity for which it is intended to be used should relate
      to or impact the substance of the recruitment process: covering preparatory
      steps (special advertising, prospecting, pre-application screening) and the
      selection process (shortlisting, grading, ranking, or testing of candidates).
      The notions of ''recruitment\" and ''selection\" require a functional interpretation,
      since they are partly overlapping but not identical.\n\n[guide:guide-high-risk-annex-iii:ex:118]
      (v. Evaluate candidates \u203a a) Practical examples of AI systems falling within
      the high-risk use case of point 4(a))\nAI system intended to be used to perform
      background checks on job applicants during recruitment\nThe system aggregates
      and analyses multiple types of data. Standard inputs include official records,
      such as education and professional certifications, employment history, social
      network history, and credit or financial data, where legally permissible. The
      system also incorporates open-source and online information. Employers or recruiters
      receive outputs in the form of composite risk scores, categories such as ''low,\"
      ''medium,\" or ''high risk,\" or specific alerts highlighting potential issues
      (e.g., unexplained employment gaps, flagged financial liabilities, or controversial
      online activity).\nThese outputs can be used as filters in high-volume hiring,
      where candidates flagged as ''high risk\" may be deprioritized or excluded before
      a caseworker reviews their file. While human review is formally part of the
      process, in practice the system''s output heavily influences which candidates
      advance in the recruitment process, hence materially influencing the outcome
      of the recruitment process. Since the system materially influences career prospects
      and is used in the scope of recruitment, it falls within the use case of point
      4(a) of Annex III. Since the system performs profiling, it cannot benefit from
      the exceptions in Article 6(3) AI Act.\n\n[guide:guide-high-risk-annex-iii:ex:122]
      (v. Evaluate candidates \u203a b) Practical examples of AI system falling outside
      the high-risk use case of point 4(a))\nAI system intended to be used for employee
      onboarding support\nThe system provides personalized information about company
      policies, training schedules, and answers common questions during their onboarding
      process. Since the system supports internal HR operations after hiring and does
      not influence the recruitment or selection of natural persons or affect in any
      manner their access to work, the system does not fall within the use case of
      point 4(a) of Annex III. The system may fall within the use case of point 4(b)
      of Annex III, if it affects the terms of the work-related relationship or feeds
      into performance evaluations or monitors workers.\n\n[guide:guide-prohibited:para:173]
      (4.3. Out of scope)\n(173) The prohibition in Article 5(1)(c) AI Act only applies
      to the scoring of natural persons or groups of persons, thus excluding in principle
      scoring of legal entities where the evaluation is not based on personal or personality
      characteristics or social behaviour of individuals, even if in some cases individuals
      may be indirectly impacted by the score (e.g., all citizens in a municipality
      in case of allocation of budget). However, if legal entities have been evaluated
      based on an overall score that aggregates the evaluation or classification of
      a group of natural persons based on their social behaviour or personal or personality
      characteristics and this score directly affects those persons (e.g. all employees
      in a company, students in a specific school whose behaviour has been evaluated),
      the practice may fall within the scope of Article 5(1)(c) AI Act if all other
      conditions are fulfilled. This will depend on a case-by-case assessment.\n\n[guide:guide-prohibited:para:13]
      (2.3. Material scope: practices related to the ''placing on the market'', ''putting
      into service'' or ''use'' of an AI system)\n(13) Article 3(11) AI Act defines
      putting into service as ''the supply of an AI system for first use to the deployer
      or for own use in the Union for its intended purpose'', therefore covering both
      supply for first use to third parties, as well as in-house development and deployment.
      The intended purpose of the system is the ''use for which an AI system is intended
      by the provider, including the specific context and conditions of use, as specified
      in the information supplied by the provider in the instructions of use, promotional
      or sales materials and statements, as well as in the technical documentation.''
      7\n\nFor example, a provider builds a RBI system outside the Union and supplies
      that system to a law enforcement authority or to a private company established
      in a Member State to be used for the first time, thereby putting it into service.\n\nFor
      example, a public authority develops a scoring system in-house and deploys it
      to predict the risk of fraud of household allowance beneficiaries, thereby putting
      it into service.\n\nsecurity and justice (AFSJ) annexed to the TEU and TFEU,
      Ireland may decide not to apply the rules concerning the prohibition of real-time
      use of RBIs in public spaces for a law enforcement purpose as well as the procedural
      rules linked to that article (Article 5(2) to (6) AI Act) (see Recital 40).
      Denmark benefits from opt-out agreements when applying Protocol No. 22 to the
      TEU and TFEU and may decide not to fully apply the prohibitions based on Article
      16 of the TFEU (see Recital 41).\n\n5 See for definitions of these terms also
      the Commission Notice - The ''Blue Guide'' on the implementation of EU product
      rules 2022, 2022/C 247/01, Section 2.\n\n6 Article 3(10) AI Act.\n\n7 Article
      3(12) AI Act.\n\nLanguage for facts and questions: en\n\nEarlier checks:\n-
      scope: Working assumption: in scope, pending an answer to: How does the system
      produce its outputs: is it trained on data or does it otherwise infer them,
      or does it only apply rules or calculations that people defined?\n- prohibited:
      No prohibited practice under Art. 5 matches. Considered Art. 5(1)(c): The tool
      scores and ranks job applicants, but the description does not say whether it
      evaluates them over time or bases scores on their social behaviour or personal
      traits.\n\nFacts:\n1. [stated] The tool reads job applications, scores them,
      and presents HR with a ranked shortlist.\n2. [inferred] The outputs concern
      job applicants.\n3. [stated] The company bought the tool from a vendor and says
