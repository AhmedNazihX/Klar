      placed_before is \"no\", answer the other two \"no\" with evidence \"assumed\".
      Otherwise, when\nthe description doesn''t settle one of them, answer it \"unknown\":
      never assume it away.\n\nFacts:\n1. [stated] The tool scores job applications
      and shows HR a ranked shortlist of applicants.\n2. [stated] The company bought
      the tool from a vendor.\n3. [stated] The company says it did not change the
      tool.\n\nDescription:\nWe''re a 40-person logistics company. We use a tool that
      reads incoming job applications, scores them, and shows HR a ranked shortlist.
      We bought it from a vendor and didn''t change it.","role":"user"}],"max_tokens":4000,"model":"openai/gpt-6-luna-20260922","provider":{"allow_fallbacks":false,"data_collection":"deny","order":["azure/eu"],"zdr":true},"response_format":{"json_schema":{"name":"role_answer","schema":{"$defs":{"Answer":{"enum":["yes","no","unknown"],"title":"Answer","type":"string"},"ConditionAnswer":{"additionalProperties":false,"properties":{"id":{"title":"Id","type":"string"},"answer":{"$ref":"#/$defs/Answer"}},"required":["id","answer"],"title":"ConditionAnswer","type":"object"},"EvidenceTag":{"description":"Where
