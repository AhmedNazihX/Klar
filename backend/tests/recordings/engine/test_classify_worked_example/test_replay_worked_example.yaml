      any direct contact with natural persons are excluded from the scope of the obligation.\n\n8.
      [guide:guide-art50:para:24] (24) By contrast, providers of free and open-source
      AI components that cover software, data, models, tools, services or processes
      for customisation and integration into an AI system and that do not constitute
