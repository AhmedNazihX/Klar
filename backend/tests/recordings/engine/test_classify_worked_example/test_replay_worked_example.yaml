      to support screening applicants for jobs.\n4. [inferred] The tool appears to
      evaluate individual applicants using information in their applications.\n\nDescription:\nWe''re
      a 40-person logistics company. We use a tool that reads incoming job applications,
      scores them, and shows HR a ranked shortlist. We bought it from a vendor and
