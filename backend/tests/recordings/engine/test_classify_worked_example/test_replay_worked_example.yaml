      in paragraph 27 below, insofar as this is proportionate and feasible.\n\nLanguage
      for facts and questions: en\n\nFacts:\n1. [stated] The tool scores job applications
      and gives HR a ranked shortlist of applicants.\n2. [stated] The company bought
