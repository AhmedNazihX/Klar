      shows HR a ranked shortlist. We bought it from a vendor and didn''t change it.","role":"user"}],"max_tokens":3000,"model":"openai/gpt-6-luna-20260922","provider":{"allow_fallbacks":false,"data_collection":"deny","order":["azure/eu"],"zdr":true},"response_format":{"json_schema":{"name":"scope_answer","schema":{"$defs":{"Answer":{"enum":["yes","no","unknown"],"title":"Answer","type":"string"},"Definition":{"description":"The
