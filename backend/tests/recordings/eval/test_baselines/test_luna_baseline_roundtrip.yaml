- request:
    body: '{"messages":[{"content":"You classify an AI system under the EU AI Act
      (Regulation (EU) 2024/1689, as amended by the Digital Omnibus), using only the
      description you are given. Nothing will be looked up for you.\n\nCheck in this
      order and stop at the first class that applies:\n1. Scope: is it an AI system
      (Art. 3(1)) within the Act''s scope (Art. 2)? If not: out_of_scope.\n2. Prohibited
      practices (Art. 5): prohibited.\n3. High-risk (Art. 6 with Annex I or Annex
      III, including the Art. 6(3) exception): high_risk.\n4. Transparency duties
      (Art. 50): limited_risk.\n5. Otherwise: minimal_risk.\n\nAnswer with JSON matching
      the schema:\n- risk_class: the class.\n- status: \"decided\" when the description
      settles the class; \"needs_more_information\" when a fact that is missing would
      change it (give missing_fact: an id in snake_case and the question to ask);
      \"legally_ambiguous\" when the law itself doesn''t settle it (give open_question:
      the question and exactly two readings, stricter first). When uncertain, risk_class
      is the stricter reading. out_of_scope is always \"decided\".\n- role: provider,
      deployer, importer or distributor, for the company describing the system.\n-
      annex_point: for high_risk under Annex III or Annex I, the point, for example
      \"annex:III:4:a\"; otherwise null.\n- transparency_duties: the Art. 50 paragraphs
      that apply, for example [\"art:50:1\"]; at least one for limited_risk.\n- reason:
      one or two sentences, in the language asked for.\n","role":"system"},{"content":"Language
      for reason and questions: en\n\nDescription:\nWe are a 40-person staffing agency.
      We bought a tool that reads applicants'' CVs and ranks them for each vacancy;
      recruiters only interview the top ten.","role":"user"}],"max_tokens":4000,"model":"openai/gpt-6-luna-20260922","provider":{"allow_fallbacks":false,"data_collection":"deny","order":["azure/eu"],"zdr":true},"response_format":{"json_schema":{"name":"baseline_answer","schema":{"$defs":{"FollowUpQuestion":{"additionalProperties":false,"description":"A
      key-fact question. Its `id` keys the user''s answer when the engine runs again.","properties":{"id":{"description":"Stable
      slug, for example `human_review`.","pattern":"^[a-z][a-z0-9_]{0,63}$","title":"Id","type":"string"},"text":{"minLength":1,"title":"Text","type":"string"},"about":{"anyOf":[{"type":"string"},{"type":"null"}],"default":null,"description":"What
      the answer settles, for example a step or provision_id.","title":"About"}},"required":["id","text","about"],"title":"FollowUpQuestion","type":"object"},"OpenQuestion":{"additionalProperties":false,"description":"A
      question the law and guidance don''t settle, with both possible readings.","properties":{"question":{"minLength":1,"title":"Question","type":"string"},"readings":{"description":"The
      two possible readings, stricter first.","items":{"type":"string"},"maxItems":2,"minItems":2,"title":"Readings","type":"array"}},"required":["question","readings"],"title":"OpenQuestion","type":"object"},"RiskClass":{"description":"The
      headline class. Every result carries exactly one.","enum":["out_of_scope","prohibited","high_risk","limited_risk","minimal_risk"],"title":"RiskClass","type":"string"},"Role":{"description":"The
      operator role the obligations follow from (Art. 3, 16, 23-26).","enum":["provider","deployer","importer","distributor"],"title":"Role","type":"string"},"Status":{"description":"Whether
      a step or result is settled. The two uncertain values are not risk classes.","enum":["decided","needs_more_information","legally_ambiguous"],"title":"Status","type":"string"}},"additionalProperties":false,"description":"A
      baseline''s whole answer; also the JSON schema the Luna baseline must fill.\n\nEnum
      fields carry no description: strict structured output rejects keywords next
      to a\n`$ref`. `LUNA_INSTRUCTIONS` explains every field instead.","properties":{"risk_class":{"$ref":"#/$defs/RiskClass"},"status":{"$ref":"#/$defs/Status"},"role":{"$ref":"#/$defs/Role"},"annex_point":{"anyOf":[{"type":"string"},{"type":"null"}],"description":"For
      a high_risk system, the Annex point, for example annex:III:4:a.","title":"Annex
      Point"},"transparency_duties":{"description":"The Art. 50 paragraphs that apply,
      for example art:50:1.","items":{"type":"string"},"title":"Transparency Duties","type":"array"},"reason":{"description":"One
      or two sentences.","minLength":1,"title":"Reason","type":"string"},"missing_fact":{"anyOf":[{"$ref":"#/$defs/FollowUpQuestion"},{"type":"null"}],"description":"Required
      when status is needs_more_information: the question to ask."},"open_question":{"anyOf":[{"$ref":"#/$defs/OpenQuestion"},{"type":"null"}],"description":"Required
      when status is legally_ambiguous: the question and both readings."}},"required":["risk_class","status","role","annex_point","transparency_duties","reason","missing_fact","open_question"],"title":"BaselineAnswer","type":"object"}},"type":"json_schema"},"stream":false,"temperature":0.0}'
