interactions:
- request:
    body: '{"messages":[{"content":[{"text":"You check the labels of a benchmark of
      AI system descriptions. Classify the system described under the EU AI Act (Regulation
      (EU) 2024/1689) as amended by the Digital Omnibus, the text quoted below. Rely
      on that text and the description only; nothing else will be looked up.\n\nCheck
      in this order and stop at the first class that applies:\n1. Scope: is it an
      AI system (Art. 3(1)) within the Act''s scope (Art. 2)? If not: out_of_scope.\n2.
      Prohibited practices (Art. 5): prohibited. A point of Art. 5 that applies only
      from a later date (Art. 113) doesn''t apply before that date.\n3. High-risk
      (Art. 6 with Annex I or Annex III, including the Art. 6(3) exception and its
      profiling rule): high_risk.\n4. Transparency duties (Art. 50): limited_risk.\n5.
      Otherwise: minimal_risk.\n\nAnswer with JSON matching the schema:\n- risk_class:
      the class.\n- status: \"decided\" when the description settles the class. \"needs_more_information\"
      when a fact the description leaves out would change the class; risk_class is
      then the stricter reading, or null when the description is too thin to say what
      the system does at all. \"legally_ambiguous\" when the facts are clear but the
      law itself doesn''t settle the class; risk_class is then the stricter reading.
      out_of_scope is always \"decided\".\n- role: the role of the company describing
      the system: provider, deployer, importer or distributor (Art. 3(3), 3(4), 3(6),
      3(7), Art. 25); null only when the class is out_of_scope or the description
      gives no basis at all.\n- annex_point: for high_risk, the point it falls under,
      written like \"annex:III:4:a\" (Annex III, point 4(a)), \"annex:III:2\" or \"annex:I:A:11\"
      (Annex I, Section A, point 11); otherwise null.\n- reason: two or three sentences
      in English naming the provisions that decide the class.\n\nJudge the system
      on the date given with the description. Further answers from the company, when
      given, are part of the description.\n\n## The AI Act (consolidated text)\n\n###
      Article 2 \u2014 Scope\n1. This Regulation applies to:\n(a) providers placing
      on the market or putting into service AI systems or placing on the market general-purpose
      AI models in the Union, irrespective of whether those providers are established
      or located within the Union or in a third country;\n(b) deployers of AI systems
      that have their place of establishment or are located within the Union;\n(c)
      providers and deployers of AI systems that have their place of establishment
      or are located in a third country, where the output produced by the AI system
      is used in the Union;\n(d) importers and distributors of AI systems;\n(e) product
      manufacturers placing on the market or putting into service an AI system together
      with their product and under their own name or trademark;\n(f) authorised representatives
      of providers, which are not established in the Union;\n(g) affected persons
      that are located in the Union.\n2. For AI systems classified as high-risk AI
      systems in accordance with Article 6(1) related to products covered by the Union
      harmonisation legislation listed in Section B of Annex I, only Article 6(1),
      Article 60a and Articles 102 to 112 shall apply. Articles 57, 58 and 59 shall
      apply only in so far as the requirements for high-risk AI systems under this
      Regulation have been integrated in that Union harmonisation legislation.\n3.
      This Regulation does not apply to areas outside the scope of Union law, and
      shall not, in any event, affect the competences of the Member States concerning
      national security, regardless of the type of entity entrusted by the Member
      States with carrying out tasks in relation to those competences.\nThis Regulation
      does not apply to AI systems where and in so far they are placed on the market,
      put into service, or used with or without modification exclusively for military,
      defence or national security purposes, regardless of the type of entity carrying
      out those activities.\nThis Regulation does not apply to AI systems which are
      not placed on the market or put into service in the Union, where the output
      is used in the Union exclusively for military, defence or national security
      purposes, regardless of the type of entity carrying out those activities.\n4.
      This Regulation applies neither to public authorities in a third country nor
      to international organisations falling within the scope of this Regulation pursuant
      to paragraph 1, where those authorities or organisations use AI systems in the
      framework of international cooperation or agreements for law enforcement and
      judicial cooperation with the Union or with one or more Member States, provided
      that such a third country or international organisation provides adequate safeguards
      with respect to the protection of fundamental rights and freedoms of individuals.\n5.
      This Regulation shall not affect the application of the provisions on the liability
      of providers of intermediary services as set out in Chapter II of Regulation
      (EU) 2022/2065.\n6. This Regulation does not apply to AI systems or AI models,
      including their output, specifically developed and put into service for the
      sole purpose of scientific research and development.\n7. Union law on the protection
      of personal data, privacy and the confidentiality of communications applies
      to personal data processed in connection with the rights and obligations laid
      down in this Regulation. Without prejudice to Articles 4a and 59 of this Regulation,
      this Regulation shall not affect Regulation (EU) 2016/679 or (EU) 2018/1725,
      or Directive 2002/58/EC or (EU) 2016/680.\n8. This Regulation does not apply
      to any research, testing or development activity regarding AI systems or AI
      models prior to their being placed on the market or put into service. Such activities
      shall be conducted in accordance with applicable Union law. Testing in real
      world conditions shall not be covered by that exclusion.\n9. This Regulation
      is without prejudice to the rules laid down by other Union legal acts related
      to consumer protection and product safety.\n10. This Regulation does not apply
      to obligations of deployers who are natural persons using AI systems in the
      course of a purely personal non-professional activity.\n11. This Regulation
      does not preclude the Union or Member States from maintaining or introducing
      laws, regulations or administrative provisions which are more favourable to
      workers in terms of protecting their rights in respect of the use of AI systems
      by employers, or from encouraging or allowing the application of collective
      agreements which are more favourable to workers.\n12. This Regulation does not
      apply to AI systems released under free and open-source licences, unless they
      are placed on the market or put into service as high-risk AI systems or as an
      AI system that falls under Article 5 or 50.\n13. For high-risk AI systems referred
      to in Article 6(1), the application of specific requirements or obligations
      laid down in Articles 9 to 15 and 17 to 25 may be limited, where and to the
      extent that:\n(a) Union harmonisation legislation listed in Section A of Annex
      I lays down requirements or obligations providing an equivalent or higher level
      of protection of health, safety or fundamental rights as the requirement or
      obligation concerned; and\n(b) such limitation does not reduce the overall level
      of protection provided for by this Regulation.\nBy 2 August 2027, the Commission
      shall adopt delegated acts in accordance with Article 97 in order to supplement
      this Regulation by specifying the high-risk AI systems concerned, the requirements
      or obligations that may be limited, the conditions under which such limitation
      applies, and the scope of the limitation.\n\n### Art. 3(1) (Article 3 \u2014
      Definitions)\n\u2018AI system\u2019 means a machine-based system that is designed
      to operate with varying levels of autonomy and that may exhibit adaptiveness
      after deployment, and that, for explicit or implicit objectives, infers, from
      the input it receives, how to generate outputs such as predictions, content,
      recommendations, or decisions that can influence physical or virtual environments;\n\n###
      Art. 3(3) (Article 3 \u2014 Definitions)\n\u2018provider\u2019 means a natural
      or legal person, public authority, agency or other body that develops an AI
      system or a general-purpose AI model or that has an AI system or a general-purpose
      AI model developed and places it on the market or puts the AI system into service
      under its own name or trademark, whether for payment or free of charge;\n\n###
      Art. 3(4) (Article 3 \u2014 Definitions)\n\u2018deployer\u2019 means a natural
      or legal person, public authority, agency or other body using an AI system under
      its authority except where the AI system is used in the course of a personal
      non-professional activity;\n\n### Art. 3(6) (Article 3 \u2014 Definitions)\n\u2018importer\u2019
      means a natural or legal person located or established in the Union that places
      on the market an AI system that bears the name or trademark of a natural or
      legal person established in a third country;\n\n### Art. 3(7) (Article 3 \u2014
      Definitions)\n\u2018distributor\u2019 means a natural or legal person in the
      supply chain, other than the provider or the importer, that makes an AI system
      available on the Union market;\n\n### Article 5 \u2014 Prohibited AI practices\n1.
      The following AI practices shall be prohibited:\n(a) the placing on the market,
      the putting into service or the use of an AI system that deploys subliminal
      techniques beyond a person\u2019s consciousness or purposefully manipulative
      or deceptive techniques, with the objective, or the effect of materially distorting
      the behaviour of a person or a group of persons by appreciably impairing their
      ability to make an informed decision, thereby causing them to take a decision
      that they would not have otherwise taken in a manner that causes or is reasonably
      likely to cause that person, another person or group of persons significant
      harm;\n(b) the placing on the market, the putting into service or the use of
      an AI system that exploits any of the vulnerabilities of a natural person or
      a specific group of persons due to their age, disability or a specific social
      or economic situation, with the objective, or the effect, of materially distorting
      the behaviour of that person or a person belonging to that group in a manner
      that causes or is reasonably likely to cause that person or another person significant
      harm;\n(ba) the placing on the market, the putting into service or the use of
      an AI system that generates or manipulates realistic images, videos, audio or
      similar material of an identifiable natural person\u2019s intimate parts, or
      of an identifiable natural person engaged in sexually explicit activities, without
      that person\u2019s freely-given, specific, informed, unambiguous and explicit
      consent for that generation or manipulation;\n(bb) the placing on the market,
      the putting into service or the use of an AI system that generates or manipulates
      material or performance within the meaning of Article 2, points (c) and (e),
      of Directive 2011/93/EU, except where a \u2018without right\u2019 defence applies
      under national law;\n(c) the placing on the market, the putting into service
      or the use of AI systems for the evaluation or classification of natural persons
      or groups of persons over a certain period of time based on their social behaviour
      or known, inferred or predicted personal or personality characteristics, with
      the social score leading to either or both of the following:\n(i) detrimental
      or unfavourable treatment of certain natural persons or groups of persons in
      social contexts that are unrelated to the contexts in which the data was originally
      generated or collected;\n(ii) detrimental or unfavourable treatment of certain
      natural persons or groups of persons that is unjustified or disproportionate
      to their social behaviour or its gravity;\n(d) the placing on the market, the
      putting into service for this specific purpose, or the use of an AI system for
      making risk assessments of natural persons in order to assess or predict the
      risk of a natural person committing a criminal offence, based solely on the
      profiling of a natural person or on assessing their personality traits and characteristics;
      this prohibition shall not apply to AI systems used to support the human assessment
      of the involvement of a person in a criminal activity, which is already based
      on objective and verifiable facts directly linked to a criminal activity;\n(e)
      the placing on the market, the putting into service for this specific purpose,
      or the use of AI systems that create or expand facial recognition databases
      through the untargeted scraping of facial images from the internet or CCTV footage;\n(f)
      the placing on the market, the putting into service for this specific purpose,
      or the use of AI systems to infer emotions of a natural person in the areas
      of workplace and education institutions, except where the use of the AI system
      is intended to be put in place or into the market for medical or safety reasons;\n(g)
      the placing on the market, the putting into service for this specific purpose,
      or the use of biometric categorisation systems that categorise individually
      natural persons based on their biometric data to deduce or infer their race,
      political opinions, trade union membership, religious or philosophical beliefs,
      sex life or sexual orientation; this prohibition does not cover any labelling
      or filtering of lawfully acquired biometric datasets, such as images, based
      on biometric data or categorizing of biometric data in the area of law enforcement;\n(h)
      the use of \u2018real-time\u2019 remote biometric identification systems in
      publicly accessible spaces for the purposes of law enforcement, unless and in
      so far as such use is strictly necessary for one of the following objectives:\n(i)
      the targeted search for specific victims of abduction, trafficking in human
      beings or sexual exploitation of human beings, as well as the search for missing
      persons;\n(ii) the prevention of a specific, substantial and imminent threat
      to the life or physical safety of natural persons or a genuine and present or
      genuine and foreseeable threat of a terrorist attack;\n(iii) the localisation
      or identification of a person suspected of having committed a criminal offence,
      for the purpose of conducting a criminal investigation or prosecution or executing
      a criminal penalty for offences referred to in Annex II and punishable in the
      Member State concerned by a custodial sentence or a detention order for a maximum
      period of at least four years.\nPoint (h) of the first subparagraph is without
      prejudice to Article 9 of Regulation (EU) 2016/679 for the processing of biometric
      data for purposes other than law enforcement.\n1a. For the purposes of paragraph
      1, first subparagraph, points (ba) and (bb):\n(a) the placing on the market
      or putting into service of an AI system that generates or manipulates the material
      or performance referred to in paragraph 1, first subparagraph, point (ba) or
      (bb) is only prohibited where:\n(i) that generation or manipulation is the intended
      purpose of the AI system; or\n(ii) the system\u2019s design, training, architecture,
      capabilities or user-facing functionalities make that generation or manipulation
      a reasonably foreseeable and reproducible outcome, without requiring significant
      technical modification, and the system does not have reasonable and adequate
      technical safety measures and other safeguards to reliably prevent that generation
      or manipulation, taking into account reasonably foreseeable misuse, and to correct
      observed or reported misuse;\n(b) the use of an AI system that generates or
      manipulates the material or performance referred to in paragraph 1, first subparagraph,
      points (ba) and (bb) is only prohibited where the deployer uses the system for
      the purpose of generating or manipulating such material or performance.\n1b.
      For the purposes of paragraph 1, first subparagraph, point (ba), an AI system
      that manipulates material in a way that does not increase the exposure of any
      depicted intimate parts or alter the nature of any depicted sexually explicit
      activities shall not constitute manipulation.\n2. The use of \u2018real-time\u2019
      remote biometric identification systems in publicly accessible spaces for the
      purposes of law enforcement for any of the objectives referred to in paragraph
      1, first subparagraph, point (h), shall be deployed for the purposes set out
      in that point only to confirm the identity of the specifically targeted individual,
      and it shall take into account the following elements:\n(a) the nature of the
      situation giving rise to the possible use, in particular the seriousness, probability
      and scale of the harm that would be caused if the system were not used;\n(b)
      the consequences of the use of the system for the rights and freedoms of all
      persons concerned, in particular the seriousness, probability and scale of those
      consequences.\nIn addition, the use of \u2018real-time\u2019 remote biometric
      identification systems in publicly accessible spaces for the purposes of law
      enforcement for any of the objectives referred to in paragraph 1, first subparagraph,
      point (h), of this Article shall comply with necessary and proportionate safeguards
      and conditions in relation to the use in accordance with the national law authorising
      the use thereof, in particular as regards the temporal, geographic and personal
      limitations. The use of the \u2018real-time\u2019 remote biometric identification
      system in publicly accessible spaces shall be authorised only if the law enforcement
      authority has completed a fundamental rights impact assessment as provided for
      in Article 27 and has registered the system in the EU database according to
      Article 49. However, in duly justified cases of urgency, the use of such systems
      may be commenced without the registration in the EU database, provided that
      such registration is completed without undue delay.\n3. For the purposes of
      paragraph 1, first subparagraph, point (h) and paragraph 2, each use for the
      purposes of law enforcement of a \u2018real-time\u2019 remote biometric identification
      system in publicly accessible spaces shall be subject to a prior authorisation
      granted by a judicial authority or an independent administrative authority whose
      decision is binding of the Member State in which the use is to take place, issued
      upon a reasoned request and in accordance with the detailed rules of national
      law referred to in paragraph 5. However, in a duly justified situation of urgency,
      the use of such system may be commenced without an authorisation provided that
      such authorisation is requested without undue delay, at the latest within 24
      hours. If such authorisation is rejected, the use shall be stopped with immediate
      effect and all the data, as well as the results and outputs of that use shall
      be immediately discarded and deleted.\nThe competent judicial authority or an
      independent administrative authority whose decision is binding shall grant the
      authorisation only where it is satisfied, on the basis of objective evidence
      or clear indications presented to it, that the use of the \u2018real-time\u2019
      remote biometric identification system concerned is necessary for, and proportionate
      to, achieving one of the objectives specified in paragraph 1, first subparagraph,
      point (h), as identified in the request and, in particular, remains limited
      to what is strictly necessary concerning the period of time as well as the geographic
      and personal scope. In deciding on the request, that authority shall take into
      account the elements referred to in paragraph 2. No decision that produces an
      adverse legal effect on a person may be taken based solely on the output of
      the \u2018real-time\u2019 remote biometric identification system.\n4. Without
      prejudice to paragraph 3, each use of a \u2018real-time\u2019 remote biometric
      identification system in publicly accessible spaces for law enforcement purposes
      shall be notified to the relevant market surveillance authority and the national
      data protection authority in accordance with the national rules referred to
      in paragraph 5. The notification shall, as a minimum, contain the information
      specified under paragraph 6 and shall not include sensitive operational data.\n5.
      A Member State may decide to provide for the possibility to fully or partially
      authorise the use of \u2018real-time\u2019 remote biometric identification systems
      in publicly accessible spaces for the purposes of law enforcement within the
      limits and under the conditions listed in paragraph 1, first subparagraph, point
      (h), and paragraphs 2 and 3. Member States concerned shall lay down in their
      national law the necessary detailed rules for the request, issuance and exercise
      of, as well as supervision and reporting relating to, the authorisations referred
      to in paragraph 3. Those rules shall also specify in respect of which of the
      objectives listed in paragraph 1, first subparagraph, point (h), including which
      of the criminal offences referred to in point (h)(iii) thereof, the competent
      authorities may be authorised to use those systems for the purposes of law enforcement.
      Member States shall notify those rules to the Commission at the latest 30 days
      following the adoption thereof. Member States may introduce, in accordance with
      Union law, more restrictive laws on the use of remote biometric identification
      systems.\n6. National market surveillance authorities and the national data
      protection authorities of Member States that have been notified of the use of
      \u2018real-time\u2019 remote biometric identification systems in publicly accessible
      spaces for law enforcement purposes pursuant to paragraph 4 shall submit to
      the Commission annual reports on such use. For that purpose, the Commission
      shall provide Member States and national market surveillance and data protection
      authorities with a template, including information on the number of the decisions
      taken by competent judicial authorities or an independent administrative authority
      whose decision is binding upon requests for authorisations in accordance with
      paragraph 3 and their result.\n7. The Commission shall publish annual reports
      on the use of real-time remote biometric identification systems in publicly
      accessible spaces for law enforcement purposes, based on aggregated data in
      Member States on the basis of the annual reports referred to in paragraph 6.
      Those annual reports shall not include sensitive operational data of the related
      law enforcement activities.\n8. This Article shall not affect the prohibitions
      that apply where an AI practice infringes other Union law.\n\n### Article 6
      \u2014 Classification rules for high-risk AI systems\n1. Irrespective of whether
      an AI system is placed on the market or put into service independently of the
      products referred to in points (a) and (b), that AI system shall be considered
      to be high-risk where both of the following conditions are fulfilled:\n(a) the
      AI system is intended to be used as a safety component of a product, or the
      AI system is itself a product, covered by the Union harmonisation legislation
      listed in Annex I;\n(b) the product whose safety component pursuant to point
      (a) is the AI system, or the AI system itself as a product, is required to undergo
      a third-party conformity assessment, with a view to the placing on the market
      or the putting into service of that product pursuant to the Union harmonisation
      legislation listed in Annex I.\n1a. For the purposes of this Regulation, including
      paragraph 1 of this Article, AI systems that are solely used for non-safety
      related aspects of user assistance, performance optimisation, service efficiency,
      automation or convenience or quality control shall not qualify as safety components.\n1b.
      Notwithstanding paragraph 1a, AI systems the failure or malfunctioning of which
      would endanger health and safety shall qualify as safety components.\n1c. A
      product that is required to undergo a third-party conformity assessment solely
      due to risks other than risks to health and safety, in particular risks relating
      to the distribution of radio spectrum or electromagnetic interference that do
      not affect health and safety, shall not be considered as fulfilling the condition
      in paragraph 1, point (b).\n2. In addition to the high-risk AI systems referred
      to in paragraph 1, AI systems referred to in Annex III shall be considered to
      be high-risk.\n3. By derogation from paragraph 2, an AI system referred to in
      Annex III shall not be considered to be high-risk where it does not pose a significant
      risk of harm to the health, safety or fundamental rights of natural persons,
      including by not materially influencing the outcome of decision making.\nThe
      first subparagraph shall apply where any of the following conditions is fulfilled:\n(a)
      the AI system is intended to perform a narrow procedural task;\n(b) the AI system
      is intended to improve the result of a previously completed human activity;\n(c)
      the AI system is intended to detect decision-making patterns or deviations from
      prior decision-making patterns and is not meant to replace or influence the
      previously completed human assessment, without proper human review; or\n(d)
      the AI system is intended to perform a preparatory task to an assessment relevant
      for the purposes of the use cases listed in Annex III.\nNotwithstanding the
      first subparagraph, an AI system referred to in Annex III shall always be considered
      to be high-risk where the AI system performs profiling of natural persons.\n4.
      A provider who considers that an AI system referred to in Annex III is not high-risk
      shall document its assessment before that system is placed on the market or
      put into service. Such provider shall be subject to the registration obligation
      set out in Article 49(2). Upon request of national competent authorities, the
      provider shall provide the documentation of the assessment.\n5. The Commission
      shall, after consulting the European Artificial Intelligence Board (the \u2018Board\u2019),
      and no later than 2 February 2026, provide guidelines specifying the practical
      implementation of this Article in line with Article 96 together with a comprehensive
      list of practical examples of use cases of AI systems that are high-risk and
      not high-risk.\n6. The Commission is empowered to adopt delegated acts in accordance
      with Article 97 in order to amend paragraph 3, second subparagraph, of this
      Article by adding new conditions to those laid down therein, or by modifying
      them, where there is concrete and reliable evidence of the existence of AI systems
      that fall under the scope of Annex III, but do not pose a significant risk of
      harm to the health, safety or fundamental rights of natural persons.\n7. The
      Commission shall adopt delegated acts in accordance with Article 97 in order
      to amend paragraph 3, second subparagraph, of this Article by deleting any of
      the conditions laid down therein, where there is concrete and reliable evidence
      that this is necessary to maintain the level of protection of health, safety
      and fundamental rights provided for by this Regulation.\n8. Any amendment to
      the conditions laid down in paragraph 3, second subparagraph, adopted in accordance
      with paragraphs 6 and 7 of this Article shall not decrease the overall level
      of protection of health, safety and fundamental rights provided for by this
      Regulation and shall ensure consistency with the delegated acts adopted pursuant
      to Article 7(1), and take account of market and technological developments.\n\n###
      Article 25 \u2014 Responsibilities along the AI value chain\n1. Any distributor,
      importer, deployer or other third-party shall be considered to be a provider
      of a high-risk AI system for the purposes of this Regulation and shall be subject
      to the obligations of the provider under Article 16, in any of the following
      circumstances:\n(a) they put their name or trademark on a high-risk AI system
      already placed on the market or put into service, without prejudice to contractual
      arrangements stipulating that the obligations are otherwise allocated;\n(b)
      they make a substantial modification to a high-risk AI system that has already
      been placed on the market or has already been put into service in such a way
      that it remains a high-risk AI system pursuant to Article 6;\n(c) they modify
      the intended purpose of an AI system, including a general-purpose AI system,
      which has not been classified as high-risk and has already been placed on the
      market or put into service in such a way that the AI system concerned becomes
      a high-risk AI system in accordance with Article 6.\n2. Where the circumstances
      referred to in paragraph 1 occur, the provider that initially placed the AI
      system on the market or put it into service shall no longer be considered to
      be a provider of that specific AI system for the purposes of this Regulation.\nThat
      initial provider shall closely cooperate with new providers and shall make available
      the necessary information and provide the reasonably expected technical access
      and other assistance that are required for the fulfilment of the obligations
      set out in this Regulation, in particular with regard to compliance with the
      conformity assessment of high-risk AI systems.\nIn particular, the obligation
      laid down in the second subparagraph shall include, where relevant for the purposes
      specified therein, the following:\n(a) making available of technical documentation
      sufficient to assess compliance with the requirements laid down in Article 16;\n(b)
      informing the new providers about known limitations and failure modes; and\n(c)
      providing the new providers with targeted technical access, including for testing
      and validation.\nThis paragraph shall not apply in cases where the initial provider
      has clearly specified that its AI system is not to be changed into a high-risk
      AI system and therefore does not fall under the obligation to cooperate with
      the new providers and hand over the documentation.\n3. In the case of high-risk
      AI systems that are safety components of products covered by the Union harmonisation
      legislation listed in Section A of Annex I, the product manufacturer shall be
      considered to be the provider of the high-risk AI system, and shall be subject
      to the obligations under Article 16 under either of the following circumstances:\n(a)
      the high-risk AI system is placed on the market together with the product under
      the name or trademark of the product manufacturer;\n(b) the high-risk AI system
      is put into service under the name or trademark of the product manufacturer
      after the product has been placed on the market.\n4. The provider of a high-risk
      AI system and the third party that supplies an AI system, AI model, tools, services,
      components, or processes that are used or integrated in a high-risk AI system
      shall, by written agreement, specify the necessary information, capabilities,
      technical access and other assistance based on the generally acknowledged state
      of the art, in order to enable the provider of the high-risk AI system to fully
      comply with the obligations set out in this Regulation. This paragraph shall
      not apply to third parties making accessible to the public tools, services,
      processes, or components, other than general-purpose AI models, under a free
      and open-source licence.\nThe AI Office may develop and recommend voluntary
      model terms for contracts between providers of high-risk AI systems and third
      parties that supply tools, services, components or processes that are used for
      or integrated into high-risk AI systems. When developing those voluntary model
      terms, the AI Office shall take into account possible contractual requirements
      applicable in specific sectors or business cases. The voluntary model terms
      shall be published and be available free of charge in an easily usable electronic
      format.\n5. Paragraphs 2 and 3 are without prejudice to the need to observe
      and protect intellectual property rights, confidential business information
      and trade secrets in accordance with Union and national law.\n\n### Article
      50 \u2014 Transparency obligations for providers and deployers of certain AI
      systems\n1. Providers shall ensure that AI systems intended to interact directly
      with natural persons are designed and developed in such a way that the natural
      persons concerned are informed that they are interacting with an AI system,
      unless this is obvious from the point of view of a natural person who is reasonably
      well-informed, observant and circumspect, taking into account the circumstances
      and the context of use. This obligation shall not apply to AI systems authorised
      by law to detect, prevent, investigate or prosecute criminal offences, subject
      to appropriate safeguards for the rights and freedoms of third parties, unless
      those systems are available for the public to report a criminal offence.\n2.
      Providers of AI systems, including general-purpose AI systems, generating synthetic
      audio, image, video or text content, shall ensure that the outputs of the AI
      system are marked in a machine-readable format and detectable as artificially
      generated or manipulated. Providers shall ensure their technical solutions are
      effective, interoperable, robust and reliable as far as this is technically
      feasible, taking into account the specificities and limitations of various types
      of content, the costs of implementation and the generally acknowledged state
      of the art, as may be reflected in relevant technical standards. This obligation
      shall not apply to the extent the AI systems perform an assistive function for
      standard editing or do not substantially alter the input data provided by the
      deployer or the semantics thereof, or where authorised by law to detect, prevent,
      investigate or prosecute criminal offences.\n3. Deployers of an emotion recognition
      system or a biometric categorisation system shall inform the natural persons
      exposed thereto of the operation of the system, and shall process the personal
      data in accordance with Regulations (EU) 2016/679 and (EU) 2018/1725 and Directive
      (EU) 2016/680, as applicable. This obligation shall not apply to AI systems
      used for biometric categorisation and emotion recognition, which are permitted
      by law to detect, prevent or investigate criminal offences, subject to appropriate
