- request:
    body: '{"messages":[{"content":"You answer questions about the EU AI Act and the
      European Commission''s guidance on it, for people at small companies who are
      not lawyers. You answer only from the numbered sources the user gives you, never
      from memory.\n\nSet `kind`:\n- \"compliance\" when the question asks for a verdict
      on the asker''s own compliance: whether their own company, tool or practice
      complies with, or is lawful under, the AI Act or any other law (\"Are we compliant?\",
      \"Is our tool legal?\", \"Am I allowed to keep using our chatbot as it is?\").
      Klar never says whether anyone complies, so don''t answer it. A question about
      what the AI Act allows, bans or requires in general is not a compliance question:
      answer it from the sources with their provisions (\"May an employer use emotion
      recognition at work?\", \"Is social scoring banned?\", \"Do deployers have to
      tell people?\").\n- \"outside_corpus\" when the sources don''t answer the question:
      it is about another EU or national law, or not about the AI Act at all, or the
      sources only touch its topic.\n- \"answered\" otherwise.\n\nWhen you answer:\n-
      Lead with the direct answer in plain words, then the detail that matters. At
      most 150 words, in English. Plain text, no Markdown; separate paragraphs with
      a blank line.\n- Never put source numbers in the text (\"[1]\", \"(2, 3)\",
      \"Source 4\"): they go in `cited` only. Name a provision as the Act does (\"Article
      26(1)\", \"Annex III\") when it helps.\n- In German, use the Act''s official
      German terms: \"KI-Verordnung\" (never \"AI Act\"), \"KI-System\", \"Anbieter\",
      \"Betreiber\", \"Hochrisiko-KI-System\".\n- Say only what the sources say. Don''t
      add conditions, dates, exceptions or examples they don''t contain, and don''t
      quote more than a short phrase.\n- Put the numbers of the sources your answer
      rests on in `cited`, most important first. Cite only sources that support what
      you say, and at least one.\n- Never tell the user that they are or aren''t compliant.\n\nWhen
      `kind` isn''t \"answered\", leave `answer` empty and `cited` empty.","role":"system"},{"content":"Sources:\n[1]
      [guide:guide-prohibited:para:49] Commission Guidelines on prohibited AI practices\n2.8.
      Interplay between the prohibitions and other Union law\n(49) In addition, the
      prohibitions in the AI Act are without prejudice to any liability that the provider
      or deployer might incur for the harm caused according to applicable Union or
      national liability laws. 43\n\n41 See also Article 29 Data Protection Working
      Party, Guidelines on Automated individual decision-making and Profiling for
      the purposes of Regulation 2016/679, WP251rev.01, 6.2.2018, and endorsed by
      the EDPB.\n\n42 Recital 38 AI Act.\n\n43 The conditions for liability (related
      to damage, liable person, fault or burden of proof, etc) will be determined
      by the applicable law, such as Directive (EU) 2024/2853 of the European Parliament
      and of the Council of 23 October 2024 on liability for defective products, (Text
      with EEA relevance), OJ L, 2024/2853, 18.11.2024 or the applicable national
      liability laws (see also Proposal for a Directive of the European Parliament
      and of the Council on adapting non-contractual civil liability rules to artificial
      intelligence (AI Liability Directive) COM/2022/496 final).\n\n[2] [recital:9]
      Regulation (EU) 2024/1689 (AI Act)\nHarmonised rules applicable to the placing
      on the market, the putting into service and the use of high-risk AI systems
      should be laid down consistently with Regulation (EC) No 765/2008 of the European
      Parliament and of the Council, Decision No 768/2008/EC of the European Parliament
      and of the Council and Regulation (EU) 2019/1020 of the European Parliament
      and of the Council (New Legislative Framework). The harmonised rules laid down
      in this Regulation should apply across sectors and, in line with the New Legislative
      Framework, should be without prejudice to existing Union law, in particular
      on data protection, consumer protection, fundamental rights, employment, and
      protection of workers, and product safety, to which this Regulation is complementary.
      As a consequence, all rights and remedies provided for by such Union law to
      consumers, and other persons on whom AI systems may have a negative impact,
      including as regards the compensation of possible damages pursuant to Council
      Directive 85/374/EEC remain unaffected and fully applicable. Furthermore, in
      the context of employment and protection of workers, this Regulation should
      therefore not affect Union law on social policy and national labour law, in
      compliance with Union law, concerning employment and working conditions, including
      health and safety at work and the relationship between employers and workers.
      This Regulation should also not affect the exercise of fundamental rights as
      recognised in the Member States and at Union level, including the right or freedom
      to strike or to take other action covered by the specific industrial relations
      systems in Member States as well as the right to negotiate, to conclude and
      enforce collective agreements or to take collective action in accordance with
      national law. This Regulation should not affect the provisions aiming to improve
      working conditions in platform work laid down in a Directive of the European
      Parliament and of the Council on improving working conditions in platform work.
      Moreover, this Regulation aims to strengthen the effectiveness of such existing
      rights and remedies by establishing specific requirements and obligations, including
      in respect of the transparency, technical documentation and record-keeping of
      AI systems. Furthermore, the obligations placed on various operators involved
      in the AI value chain under this Regulation should apply without prejudice to
      national law, in compliance with Union law, having the effect of limiting the
      use of certain AI systems where such law falls outside the scope of this Regulation
      or pursues legitimate public interest objectives other than those pursued by
      this Regulation. For example, national labour law and law on the protection
      of minors, namely persons below the age of 18, taking into account the UNCRC
      General Comment No 25 (2021) on children\u2019s rights in relation to the digital
      environment, insofar as they are not specific to AI systems and pursue other
      legitimate public interest objectives, should not be affected by this Regulation.\n\n[3]
      [guide:guide-art50:para:131] Commission Guidelines on the transparency obligations
      under Article 50\n6.2.1. Text published with the purpose of informing the public
      on matters of public interest\n(131) For the purpose of clarifying the scope
      of Article 50(4), second subparagraph, AI Act, three elements are examined below:
      (i) published text (ii) with the purpose of informing the public (iii) on matters
      of public interest.\n\ni. Published text: The AI-generated or manipulated text
      should be published. This means that the text should be accessible by an indeterminate,
      fairly large number of unrelated, potential readers simultaneously and/or successively,
      whether or not against payment (e.g. subscriptions) ( 38 ). By contrast, text
      is not considered published if access is restricted to specific individuals
      belonging to a closed, private group (e.g. a small, closed group on an instant
      messaging app, or if the group is too small or insignificant). Examples of text
      not considered published include e.g. private, interpersonal correspondence
      (for professional purposes), or organisation-internal texts or communications
      (e.g. publications on internal corporate networks).\n\n( 37 ) For more detailed
      clarification, see the joint Commission and EDPB guidelines on the interplay
      between the AI Act and EU data protection law (under preparation).\n\n( 38 )
