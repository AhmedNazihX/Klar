- request:
    body: '{"messages":[{"content":"You answer questions about the EU AI Act and the
      European Commission''s guidance on it, for people at small companies who are
      not lawyers. You answer only from the numbered sources the user gives you, never
      from memory.\n\nSet `kind`:\n- \"compliance\" when the question asks for a verdict
      on the asker''s own compliance: whether their own company, tool or practice
      complies with, or is lawful under, the AI Act or any other law (\"Are we compliant?\",
      \"Is our tool legal?\", \"Am I allowed to keep using our chatbot as it is?\").
      Klar never says whether anyone complies, so don''t answer it. A question about
      what the AI Act allows, bans or requires in general is not a compliance question:
      answer it from the sources with their provisions (\"May an employer use emotion
      recognition at work?\", \"Is social scoring banned?\", \"Do deployers have to
      tell people?\").\n- \"outside_corpus\" when the sources don''t answer the question:
      it is about another EU or national law, or not about the AI Act at all, or the
      sources only touch its topic.\n- \"answered\" otherwise.\n\nWhen you answer:\n-
      Lead with the direct answer in plain words, then the detail that matters. At
      most 150 words, in English. Plain text, no Markdown; separate paragraphs with
      a blank line.\n- Never put source numbers in the text (\"[1]\", \"(2, 3)\",
      \"Source 4\"): they go in `cited` only. Name a provision as the Act does (\"Article
      26(1)\", \"Annex III\") when it helps.\n- In German, use the Act''s official
      German terms: \"KI-Verordnung\" (never \"AI Act\"), \"KI-System\", \"Anbieter\",
      \"Betreiber\", \"Hochrisiko-KI-System\".\n- Say only what the sources say. Don''t
      add conditions, dates, exceptions or examples they don''t contain, and don''t
      quote more than a short phrase.\n- Put the numbers of the sources your answer
      rests on in `cited`, most important first. Cite only sources that support what
      you say, and at least one.\n- Never tell the user that they are or aren''t compliant.\n\nWhen
      `kind` isn''t \"answered\", leave `answer` empty and `cited` empty.","role":"system"},{"content":"Sources:\n[1]
      [guide:guide-prohibited:para:140] Commission Guidelines on prohibited AI practices\n3.6.
      Interplay with other Union law\n(140) The DSA also sets out obligations for
      providers of online platforms to ensure transparency in advertising (Articles
      26 and 38 for very large online platforms or very large search engines), on
      the use of recommender systems (Article 27) and on the protection of minors
      (Article 28 DSA). Moreover, if an online platform or search engine is classified
      as a very large online platform or very large search engine, the provider of
      that designated service has additional obligations to assess and mitigate systemic
      risks stemming from the design or functioning of its service and its related
      systems, including algorithmic systems (Articles 34 and 35 DSA). When conducting
      risks assessments, providers of very large online platforms and of very large
      online search engines should consider how their recommender systems, advertising,
      content moderation and any other relevant algorithmic systems influence such
      systemic risks. Such risk assessments should also analyse how systemic risks
      are influenced by, among other things, the intentional manipulation and automated
      exploitation of the service (c.f. Article 34(2) DSA and recital 83 DSA). Nevertheless,
      the scope of Article 5(1)(a) or (b) AI Act covers a broad variety of other scenarios
      (e.g. chatbots, AI-enabled services and products) that may be offered or used
      by other actors than providers of intermediary services.\n\n[2] [recital:118]
      Regulation (EU) 2024/1689 (AI Act)\nThis Regulation regulates AI systems and
      AI models by imposing certain requirements and obligations for relevant market
      actors that are placing them on the market, putting into service or use in the
      Union, thereby complementing obligations for providers of intermediary services
      that embed such systems or models into their services regulated by Regulation
      (EU) 2022/2065. To the extent that such systems or models are embedded into
      designated very large online platforms or very large online search engines,
      they are subject to the risk-management framework provided for in Regulation
      (EU) 2022/2065. Consequently, the corresponding obligations of this Regulation
      should be presumed to be fulfilled, unless significant systemic risks not covered
      by Regulation (EU) 2022/2065 emerge and are identified in such models. Within
      this framework, providers of very large online platforms and very large online
      search engines are obliged to assess potential systemic risks stemming from
      the design, functioning and use of their services, including how the design
      of algorithmic systems used in the service may contribute to such risks, as
      well as systemic risks stemming from potential misuses. Those providers are
      also obliged to take appropriate mitigating measures in observance of fundamental
      rights.\n\n[3] [art:75:1:b] AI Act, consolidated text as of 27 July 2026\nArticle
      75 \u2014 Market surveillance and control of AI systems and mutual assistance\nAI
      systems that constitute or that are integrated into a very large online platform
      or very large online search engine designated in accordance with Regulation
      (EU) 2022/2065.\n\n[4] [art:55:1] AI Act, consolidated text as of 27 July 2026\nArticle
      55 \u2014 Obligations of providers of general-purpose AI models with systemic
      risk\nIn addition to the obligations listed in Articles 53 and 54, providers
      of general-purpose AI models with systemic risk shall:\n(a) perform model evaluation
      in accordance with standardised protocols and tools reflecting the state of
      the art, including conducting and documenting adversarial testing of the model
      with a view to identifying and mitigating systemic risks;\n(b) assess and mitigate
      possible systemic risks at Union level, including their sources, that may stem
      from the development, the placing on the market, or the use of general-purpose
      AI models with systemic risk;\n(c) keep track of, document, and report, without
      undue delay, to the AI Office and, as appropriate, to national competent authorities,
      relevant information about serious incidents and possible corrective measures
      to address them;\n(d) ensure an adequate level of cybersecurity protection for
      the general-purpose AI model with systemic risk and the physical infrastructure
      of the model.\n\n[5] [guide:guide-prohibited:para:139] Commission Guidelines
      on prohibited AI practices\n3.6. Interplay with other Union law\n(139) The prohibitions
      in Article 5(1)(a) and (b) AI Act are also complementary to Regulation (EU)
      2022/2065 (the Digital Services Act (''DSA'') which regulates online intermediary
      services, such as online platforms and search engines, and ensures transparency
      and accountability in the provision of those services. Notably, Article 25(1)
      DSA prohibits dark patterns within the user interface to ensure that providers
      of online platforms do not mislead or coerce users into actions that may not
      align with their genuine intentions. Such dark patterns should be understood
      to constitute an example of manipulative or deceptive techniques within the
      meaning of Article 5(1)(a) AI Act, when they are likely to cause significant
      harms.\n\n95 Particularly relevant in this respect is the Judgment of the Court
      (Grand Chamber) of 4 July 2023, Case C-252/21 Meta Platforms Inc and Others
      v Bundeskartellamt. Although the CJEU finds, inter alia, that the processing
      of off-service users'' personal data for direct marketing purposes by a large
      social network platform may be regarded as carried out for a legitimate interest
      of the controller, this cannot be done without consent from a user as a legal
      basis due to the interests and fundamental rights of such a user, which under
      the circumstances of that case, in particular the extensive processing, override
      the interest of that operator in such personalised advertising through which
      social platforms finance their activities (see the Meta Platforms judgment,
      paragraphs 115 to 118).\n\n96 E.g. Council Directive 2000/43/EC of 29 June 2000
      implementing the principle of equal treatment between persons irrespective of
      racial or ethnic origin OJ L 180, 19.7.2000, p. 22-26; Council Directive 2000/78/EC
      of 27 November 2000 establishing a general framework for equal treatment in
      employment and occupation OJ L 303, 2.12.2000, p. 16-22; Directive 2006/54/EC
      of the European Parliament and of the Council of 5 July 2006 on the implementation
      of the principle of equal opportunities and equal treatment of men and women
      in matters of employment and occupation (recast), OJ L 204, 26.7.2006, p. 23-36;
      Council Directive 2004/113/EC of 13 December 2004 implementing the principle
      of equal treatment between men and women in the access to and supply of goods
      and services, OJ L 373, 21.12.2004, p. 37-43.\n\nQuestion: How often does a
      very large online platform have to carry out its systemic risk assessment under
      the Digital Services Act?","role":"user"}],"max_tokens":3000,"model":"openai/gpt-6-luna-20260922","provider":{"allow_fallbacks":false,"data_collection":"deny","order":["azure/eu"],"zdr":true},"response_format":{"json_schema":{"name":"qa_answer","schema":{"additionalProperties":false,"description":"What
      the model fills in: the kind, the answer and the numbers of the sources it cites.","properties":{"kind":{"enum":["answered","outside_corpus","compliance"],"title":"Kind","type":"string"},"answer":{"title":"Answer","type":"string"},"cited":{"items":{"type":"integer"},"title":"Cited","type":"array"}},"required":["kind","answer","cited"],"title":"ModelReply","type":"object"}},"type":"json_schema"},"stream":false,"temperature":0.0}'
