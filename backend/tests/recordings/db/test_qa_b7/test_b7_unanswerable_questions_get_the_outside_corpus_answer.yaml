      37-40; C-527/15, Stichting Brein,\n\nii. Informing the public: The AI-generated
      or manipulated published text should aim to inform the public. This entails
      that the text should intend to communicate knowledge, opinions or facts. By
      contrast, short texts which do not materially communicate knowledge, opinions
      or facts, cannot be deemed to inform the public.\n\niii. On matters of public
      interest: The text should inform the public ''on matters of public interest''.
      In general, such matters should be understood to cover those relevant to society
      at large, whether at a local, national, Union or international level, and meriting
      public debate or scrutiny. In that regard, texts should be considered to address
      public interest matters if they cover topics on politics and democratic processes,
      public administration and services, the administration of justice and law enforcement,
      the protection of fundamental rights, public security, public health, environmental
      protection, consumer safety, and any economic, financial, political, scientific,
      or cultural development that may be relevant subject of public debate. Matters
      that may be considered to be of public interest can evolve over time and across
      contexts.\n\nExamples of text published with the purpose of informing the public
      on matters of public interest under Article 50(4) AI Act Act which must be labelled
      as artificially generated or manipulated unless subject to human review/editorial
      control (see Section 6.2.3.):\n\n- AI-generated summary of a human-authored
      article on a newspaper''s website discussing a recent decision by a town council.\n\n-
      AI-manipulated parts of a lifestyle-website article comparing the effects of
      various diets on a particular disease in middle-aged women.\n\n- AI-manipulated
      corporate reports published on a listed company''s website containing investor
      information.\n\n- AI-generated message on a meteorological institute''s social
      media profile warning citizens about stormy weather and related precautionary
      measures.\n\nExamples of text which is not published with the purpose of informing
      the public on matters of public interest falling outside the scope of Article
      50(4) AI Act:\n\n- AI-generated fantasy novels.\n\n- AI-manipulated text that
      is part of a company''s advertisement or product descriptions (not including
      any claims related to e.g. health, consumer safety or sustainability).\n\n-
      News summary generated by a chatbot that is only available to the user that
