      Kampagnen in administrativer oder logistischer Hinsicht.\n\nGuideline passages
      and examples found:\n[guide:guide-prohibited:para:173] (4.3. Au\u00dferhalb
      des Anwendungsbereichs)\n(173) Das Verbot in Artikel 5 Absatz 1 Buchstabe c
      der KI-Verordnung gilt nur f\u00fcr die Bewertung nat\u00fcrlicher Personen
      oder Gruppen nat\u00fcrlicher Personen und schlie\u00dft somit grunds\u00e4tzlich
      die Bewertung juristischer Personen aus, bei der die Bewertung nicht auf pers\u00f6nlichen
      Eigenschaften, Pers\u00f6nlichkeitsmerkmalen oder dem sozialem Verhalten von
      Einzelpersonen beruht, auch wenn in einigen F\u00e4llen Einzelpersonen indirekt
      von der Bewertung betroffen sein k\u00f6nnen (z. B. alle B\u00fcrger in einer
      Gemeinde bei der Zuweisung von Haushaltsmitteln). Wurden jedoch juristische
      Personen auf der Grundlage einer Gesamtbewertung evaluiert, in der die Bewertung
      oder Einstufung einer Gruppe nat\u00fcrlicher Personen nach ihrem sozialen Verhalten,
      ihren pers\u00f6nlichen Eigenschaften oder Pers\u00f6nlichkeitsmerkmalen zusammengefasst
      wird, und wirkt sich diese Bewertung unmittelbar auf diese Personen aus (z.
      B. alle Besch\u00e4ftigten in einem Unternehmen, Sch\u00fcler in einer bestimmten
      Schule, deren Verhalten bewertet wurde), so kann die betreffende Praxis in den
      Anwendungsbereich von Artikel 5 Absatz 1 Buchstabe c der KI-Verordnung fallen,
      wenn alle anderen Bedingungen erf\u00fcllt sind. Dies h\u00e4ngt von einer Einzelfallpr\u00fcfung
      ab.\n\n[guide:guide-prohibited:para:254] (a) \"Arbeitsplatz\")\n(254) Der Begriff
      \"Arbeitsplatz\" sollte weit ausgelegt werden. Dieser Begriff bezieht sich auf
      jeden besonderen physischen oder virtuellen Raum, in dem nat\u00fcrliche Personen
      Aufgaben und Verantwortlichkeiten wahrnehmen, die ihnen von ihrem Arbeitgeber
      oder der Organisation, der sie angeschlossen sind, zugewiesen wurden, z. B.
      im Falle einer selbstst\u00e4ndigen Erwerbst\u00e4tigkeit. Dies schlie\u00dft
      s\u00e4mtliche Umgebungen ein, in denen die Arbeit ausgef\u00fchrt wird und
      die je nach Art der T\u00e4tigkeit stark variieren k\u00f6nnen, und zwar von
      B\u00fcror\u00e4umen, Fabriken und Lagern in Innenr\u00e4umen bis hin zu \u00f6ffentlich
      zug\u00e4nglichen R\u00e4umen wie Gesch\u00e4ften, Stadien oder Museen und zu
      Freigel\u00e4nden oder Kraftfahrzeugen sowie tempor\u00e4ren oder mobilen Arbeitsst\u00e4tten.
      Dies ist unabh\u00e4ngig vom Status als Arbeitnehmer, Auftragnehmer, Auszubildender,
      Freiwilliger usw. 161 Der Begriff \"Arbeitsplatz\" in Artikel 5 Absatz 1 Buchstabe
      f der KI-Verordnung sollte im Einklang mit anderen Bestimmungen der KI-Verordnung,
      die das Inverkehrbringen, die Inbetriebnahme oder die Verwendung von KI-Systemen
      in den Bereichen Besch\u00e4ftigung, Personalmanagement und Zugang zur Selbstst\u00e4ndigkeit
      betreffen, auch f\u00fcr Bewerber w\u00e4hrend des Auswahl- und Einstellungsverfahrens
      gelten, da ein Machtungleichgewicht besteht und die Emotionserkennung bereits
      in der Einstellungsphase in die Privatsph\u00e4re eingreifen kann.\n\nBeispiele:\n\n-
      Die Verwendung von Webcams und Stimmerkennungssystemen durch ein CallCenter
      zum Zweck der Nachverfolgung der Emotionen der Mitarbeiter, wie z. B. Wut, ist
      verboten 162 . Werden Emotionserkennungssysteme nur zu pers\u00f6nlichen Schulungszwecken
      eingesetzt, sind sie zul\u00e4ssig, sofern die Ergebnisse nicht Personen mit
      Personalverantwortung zur Verf\u00fcgung gestellt werden, sofern sich die Ergebnisse
      nicht auf die Bewertung, Bef\u00f6rderung usw. der geschulten Person auswirken
      k\u00f6nnen und sofern das Verbot nicht umgangen wird und die Verwendung des
      Emotionserkennungssystems keine Auswirkungen auf das Arbeitsverh\u00e4ltnis
      hat.\n\n- Die Verwendung von Stimmerkennungssystemen durch ein Call-Center zur
      Verfolgung von Emotionen ihrer Kunden wie Wut oder Ungeduld ist nach Artikel
      5\n\n161 Siehe auch die Erw\u00e4gungsgr\u00fcnde in Bezug auf Hochrisiko-KI-Systeme
      am Arbeitsplatz, wie Erw\u00e4gungsgrund 56, in dem eine weite Auslegung angewendet
      wird. Siehe auch die Liste der Hochrisiko-KI-Systeme in Anhang III, in der unter
      Nummer 4 auf die Selbstst\u00e4ndigkeit Bezug genommen wird. Die Selbstst\u00e4ndigkeit
      wird auch durch das EU-Antidiskriminierungsrecht weitgehend abgedeckt.\n\n162
      Beispiel aus Boyd et al., 2023, Automated Emotion Recognition in the Workplace:
      How Proposed Technologies Reveal Potential Futures of Work.\n\nAbsatz 1 Buchstabe
      f der KI-Verordnung nicht verboten (z. B. um die Besch\u00e4ftigten im Umgang
      mit bestimmten w\u00fctenden Kunden zu unterst\u00fctzen).\n\n- KI-Systeme,
      die den emotionalen Ton in hybriden Arbeitsteams \u00fcberwachen, indem sie
      Emotionen aus Stimm- und Bildaufnahmen hybrider Videokonferenzen erkennen und
      ableiten, was in Regel der F\u00f6rderung des sozialen Bewusstseins, des Managements
      emotionaler Dynamik und der Konfliktverh\u00fctung dienen w\u00fcrde, sind verboten.\n\n-
      Die Verwendung von KI-Systemen zur Emotionserkennung w\u00e4hrend des Einstellungsverfahrens
      ist verboten.\n\n- Die Verwendung von KI-Systemen zur Emotionserkennung w\u00e4hrend
      der Probezeit ist verboten.\n\n- Die Verwendung von Kameras durch einen Supermarkt
      zur Verfolgung von Emotionen (beispielsweise Gl\u00fcck) seiner Mitarbeiter
      ist verboten.\n\n- Die Verwendung von Kameras durch einen Supermarkt oder eine
      Bank, mit deren Hilfe verd\u00e4chtige Kunden entdeckt werden sollen, damit
      beispielsweise Schl\u00fcsse gezogen werden k\u00f6nnen, ob jemand im Begriff
      ist, einen Raub zu begehen, ist nach Artikel 5 Absatz 1 Buchstabe f der KI-Verordnung
      nicht verboten, wenn sichergestellt ist, dass keine Mitarbeiter nachverfolgt
      werden und es ausreichende Schutzvorkehrungen gibt.\n\nb) \"Bildungseinrichtungen\"\n\n[guide:guide-prohibited:para:177]
      (4.3. Au\u00dferhalb des Anwendungsbereichs)\n(177) Werden sektorspezifische
      Rechtsvorschriften der Union eingehalten, beispielsweise im Bereich der Bonit\u00e4tsbewertung,
      der Bek\u00e4mpfung von Geldw\u00e4sche usw., in denen festgelegt ist, welche
      Art von Daten f\u00fcr den spezifischen legitimen Zweck der Bewertung als relevant
      und erforderlich verwendet werden k\u00f6nnen, und mit denen sichergestellt
      wird, dass die Behandlung gerechtfertigt ist und in einem angemessenen Verh\u00e4ltnis
      zum sozialen Verhalten steht, kann somit sichergestellt werden, dass die betreffende
      KI-Praxis nicht in den Anwendungsbereich des Verbots nach Artikel 5 Absatz 1
      Buchstabe c der KI-Verordnung f\u00e4llt.\n\nBeispiele f\u00fcr rechtm\u00e4\u00dfige
      Bewertungspraktiken, die im Einklang mit Unionsrecht und nationalem Recht stehen
      und nicht in den Anwendungsbereich von Artikel 5 Absatz 1 Buchstabe c der KI-Verordnung
      fallen:\n\n- Nicht in den Anwendungsbereich von Artikel 5 Absatz 1 Buchstabe
      c der KIVerordnung fallen Systeme zur finanziellen Bonit\u00e4tsbewertung, die
      von Kreditgebern oder Wirtschaftsauskunfteien zur Bewertung der finanziellen
      Kreditw\u00fcrdigkeit oder ausstehender Verbindlichkeiten eines Kunden genutzt
      werden, um eine Einstufung der Bonit\u00e4t oder Feststellung seiner Kreditw\u00fcrdigkeit
      vorzunehmen, wobei sie sich auf die Einnahmen und Ausgaben des Kunden und andere
      finanzielle und wirtschaftliche Umst\u00e4nde st\u00fctzen, sofern diese f\u00fcr
      den rechtm\u00e4\u00dfigen Zweck der Bonit\u00e4tsbewertung relevant sind und
      im Einklang mit Verbraucherschutzgesetzen 126 stehen, in denen die Art der Daten
      und die erforderlichen Schutzvorkehrungen festgelegt sind, um die faire Behandlung
      von Verbrauchern bei Kreditw\u00fcrdigkeitspr\u00fcfungen zu gew\u00e4hrleisten.\n\n-
      Unternehmen haben ein berechtigtes Interesse daran, Kunden im Hinblick auf Finanzbetrug
