      in accessing certain job opportunities, for example by producing suitability
      scores, assessing compatibility of a candidate''s profile or experience with
      the selection criteria or job description, or producing competence profiles
      that condition shortlisting, fall within scope of the high-risk use case listed
      in point 4(a) of Annex III. In this case, ''analysis\" and ''filtering\" form
      part of a continuum: analysis that influences access to later stages operates
      de facto as filtering, and therefore falls within the scope of Annex III, point
      4(a).\n\n45 This would be the case if the requirements stem from a genuine and
