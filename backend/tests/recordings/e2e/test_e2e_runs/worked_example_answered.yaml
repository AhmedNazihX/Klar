      at the point of authorisation, reporting, validation etc., including when the
      deployed AI agent receives, processes, or relies upon outputs generated by other
      AI systems rather than directly by a natural person) and at every new interaction.\n\nExamples
      of AI systems intended to interact directly with natural persons falling within
      scope of Article 50(1) AI Act:\n\n- AI-enabled voice assistants, chatbots/conversational
      agents in various contexts (e.g. public service, customer support, complaints
