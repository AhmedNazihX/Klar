      AI Act. Cases of products and services blending AI-generated responses with
      human-curated content fall within the scope of Article 50(1) AI Act and require
      disclosure for the specific outputs in the interaction that are AI-generated,
      unless those AI outputs have been properly reviewed and sent by humans as the
      main interlocutors with the natural persons.\n\n( 18 ) See Article 3(1) AI Act.
      For further guidance on the concept of AI system, see Commission Guidelines
      on the definition of an AI system, 29.7.2025, C(2025) 5053 final.\n\niv. With
      natural persons: Article 50(1) AI Act requires that the AI system interacts
      with natural persons. Those persons may be professional deployers, other users
      (also using the system for purely personal activities) or other persons using
      the system on their behalf. AI systems that operate in a closed physical environment
      (such as part of an industrial machinery set-up), backend machine-to-machine
      calls between AI systems (including AI agents) whose outputs are not intended
      to reach natural person, or virtual environments without any direct contact
      with natural persons are excluded from the scope of the obligation.\n\n7. [guide:guide-art50:para:51]
      (51) The DSA also includes transparency requirements for online platforms''
      recommender systems, including a requirement to explain the main ranking parameters.
      These obligations are complementary to the transparency obligations laid down
      in Article 50(1) AI Act, since they have a different scope and purpose and concern
      systems that, in principle, do not interact directly with users within the meaning
      of Article 50(1) AI Act.\n\n8. [guide:guide-art50:para:31] (31) AI agents are
      covered by Article 50(1) AI Act if they are capable of interacting with the
      persons instructing them or with other natural persons in the execution of the
      tasks (e.g. making bookings, managing correspondence, negotiating or concluding
      contracts, executing purchases, etc). AI agents must be designed and developed
      in such a way that they disclose both their artificial nature and the person
      on whose behalf they are acting, considering the need for transparency of the
      origin and the delegation of authority and accountability for the consequences
      of their actions. This includes cases where AI agents are capable of interacting
