      It is trained on data: the vendor''s model learned from past applications how
      to score and rank new ones.\n- eu_link: Is the tool used in or placed on the
      market in the EU, or are its outputs used there? Yes."],"model":"qwen/qwen3-embedding-8b","dimensions":1536,"encoding_format":"float","provider":{"allow_fallbacks":false,"data_collection":"deny","order":["nebius"],"zdr":true}}'
