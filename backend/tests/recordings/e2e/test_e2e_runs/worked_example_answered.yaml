      (EU) 2019/2144 on type-approval requirements for motor vehicles and their trailers\n[annex:I:B:20]
      Regulation (EU) 2018/1139 on common rules in the field of civil aviation and
      establishing a European Union Aviation Safety Agency\n[annex:I:B:21] Regulation
      (EU) 2023/1230 on machinery\n\nAnnex III:\n[annex:III:1:a] remote biometric
      identification systems. This shall not include AI systems intended to be used
      for biometric verification the sole purpose of which is to confirm that a specific
      natural person is the person he or she claims to be;\n[annex:III:1:b] AI systems
      intended to be used for biometric categorisation, according to sensitive or
