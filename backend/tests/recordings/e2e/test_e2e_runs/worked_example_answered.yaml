      answer for a high-risk system: the role facts and the Art. 111(2) facts.","properties":{"role":{"$ref":"#/$defs/RoleFact"},"builds_on_gpai":{"$ref":"#/$defs/KeyFact"},"own_brand":{"$ref":"#/$defs/KeyFact"},"substantial_modification":{"$ref":"#/$defs/ModificationFact"},"changed_purpose":{"$ref":"#/$defs/KeyFact"},"conditions":{"items":{"$ref":"#/$defs/ConditionAnswer"},"title":"Conditions","type":"array"},"legacy":{"$ref":"#/$defs/LegacyAnswer"}},"required":["role","builds_on_gpai","own_brand","substantial_modification","changed_purpose","conditions","legacy"],"title":"HighRiskRoleAnswer","type":"object"}},"type":"json_schema"},"stream":false,"temperature":0.0}'
