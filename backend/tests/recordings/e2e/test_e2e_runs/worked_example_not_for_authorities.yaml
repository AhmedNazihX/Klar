      so the Art. 6(3) exemption cannot apply. Compared with the guideline examples
      guide:guide-high-risk-annex-iii:ex:112.\n- transparency: No transparency duty
      under Art. 50 applies.\n\nConditions:\nc1: The provider is established outside
      the Union.\nc2: The system is listed in Annex III point 1, 6 or 7 and is used
