      25(1)(c)): the company uses a system, including a general-purpose AI\n  system,
      that was not high-risk for the purpose its provider intended, for a purpose
      the provider\n  did not intend, and that new purpose is what makes it high-risk
      (for example using a general\n  chat assistant to rank job applicants).\n- conditions:
      one answer per listed condition, by its id: does the condition hold for this
      system\n  and this company?\n\nFor every key fact:\n- answer: \"yes\", \"no\"
      or \"unknown\" (substantial_modification may also be \"contested\").\n- evidence:
      \"stated\" when the description says it, \"inferred\" when it follows from what
      the\n  description says, \"assumed\" when the description is silent and you
      take the usual default.\n- fact: the answer as one short fact, in the language
      asked for (for example \"The company bought\n  the tool and did not change it\").\n-
      fact_numbers: the numbers of the listed facts the answer rests on; empty when
      none do.\n\nWhen the description is silent about a switch and nothing hints
      at it, answer \"no\" with evidence\n\"assumed\": a company that buys a tool
      is normally a deployer that did not rebrand, modify or\nrepurpose it. Answer
      \"unknown\" only when the description hints at the fact but doesn''t settle
      it\n(for example \"we adapted the vendor''s model\" without saying how). For
      a condition, answer\n\"unknown\" when the description doesn''t settle it.\n","role":"system"},{"content":"Language
      for facts: en\n\nRisk class so far: high_risk (annex_iii route)\n\nEarlier checks:\n-
      scope: Working assumption: in scope, pending an answer to: How does the system
      produce its outputs: is it trained on data or does it otherwise infer them,
      or does it only apply rules or calculations that people defined?\n- prohibited:
      No prohibited practice under Art. 5 matches. Considered Art. 5(1)(c): The tool
      scores and ranks applicants using application information, but the description
      does not specify whether it scores them over time based on social behaviour
      or personal or personality characteristics.\n- high_risk: High-risk: the system
