      be used as safety components in the management and operation of critical digital
      infrastructure, road traffic, or in the supply of water, gas, heating or electricity.\n[annex:III:3:a]
      AI systems intended to be used to determine access or admission or to assign
      natural persons to educational and vocational training institutions at all levels;\n[annex:III:3:b]
      AI systems intended to be used to evaluate learning outcomes, including when
      those outcomes are used to steer the learning process of natural persons in
      educational and vocational training institutions at all levels;\n[annex:III:3:c]
      AI systems intended to be used for the purpose of assessing the appropriate
      level of education that an individual will receive or will be able to access,
      in the context of or within educational and vocational training institutions
      at all levels;\n[annex:III:3:d] AI systems intended to be used for monitoring
      and detecting prohibited behaviour of students during tests in the context of
      or within educational and vocational training institutions at all levels.\n[annex:III:4:a]
      AI systems intended to be used for the recruitment or selection of natural persons,
      in particular to place targeted job advertisements, to analyse and filter job
      applications, and to evaluate candidates;\n[annex:III:4:b] AI systems intended
      to be used to make decisions affecting terms of work-related relationships,
      the promotion or termination of work-related contractual relationships, to allocate
      tasks based on individual behaviour or personal traits or characteristics or
      to monitor and evaluate the performance and behaviour of persons in such relationships.\n[annex:III:5:a]
      AI systems intended to be used by public authorities or on behalf of public
      authorities to evaluate the eligibility of natural persons for essential public
      assistance benefits and services, including healthcare services, as well as
      to grant, reduce, revoke, or reclaim such benefits and services;\n[annex:III:5:b]
      AI systems intended to be used to evaluate the creditworthiness of natural persons
      or establish their credit score, with the exception of AI systems used for the
      purpose of detecting financial fraud;\n[annex:III:5:c] AI systems intended to
      be used for risk assessment and pricing in relation to natural persons in the
      case of life and health insurance;\n[annex:III:5:d] AI systems intended to evaluate
      and classify emergency calls by natural persons or to be used to dispatch, or
      to establish priority in the dispatching of, emergency first response services,
      including by police, firefighters and medical aid, as well as of emergency healthcare
      patient triage systems.\n[annex:III:6:a] AI systems intended to be used by or
      on behalf of law enforcement authorities, or by Union institutions, bodies,
