      scores them, and shows HR a ranked shortlist. We bought it from a vendor and
      didn''t change it.\n\nAnswers to follow-up questions:\n- eu_link: Is the tool
      placed on the market or used in the EU, or are its outputs used there? Yes.\n-
      for_public_authority: Is the system meant for use by public authorities? No.","role":"user"}],"max_tokens":4000,"model":"openai/gpt-6-luna-20260922","provider":{"allow_fallbacks":false,"data_collection":"deny","order":["azure/eu"],"zdr":true},"response_format":{"json_schema":{"name":"role_answer","schema":{"$defs":{"Answer":{"enum":["yes","no","unknown"],"title":"Answer","type":"string"},"ConditionAnswer":{"additionalProperties":false,"properties":{"id":{"title":"Id","type":"string"},"answer":{"$ref":"#/$defs/Answer"}},"required":["id","answer"],"title":"ConditionAnswer","type":"object"},"EvidenceTag":{"description":"Where
