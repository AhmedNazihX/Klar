      public services (except for Annex III point 2), or the system is used for creditworthiness
      or credit scoring, or for risk assessment and pricing in life and health insurance
      (Annex III points 5(b) and (c)).\nc10: Decisions taken on the basis of the system''s
      output produce legal effects on people or similarly significantly affect them
      (not for Annex III point 2, critical infrastructure).\n\nLaunch and design:\nThe
      system is high-risk, and its high-risk rules apply from 2 December 2027. Also
      answer, under\n\"legacy\", three key facts for Art. 111(2) (systems already
      on the market or in use before that\ndate), in the same form as the others:\n\n-
      placed_before: the system is already on the market or in use today. That date
      is still ahead,\n  so a system the description shows already on the market or
      in use is \"yes\". A system still\n  being built, or one whose launch is only
      planned, is \"no\", even if the launch is planned before\n  that date. When
      the description doesn''t say, answer \"unknown\".\n- significant_design_change:
      a significant change to the system''s design or intended purpose is\n  planned
