      to assess the risk of a natural person becoming the victim of criminal offences;\n[annex:III:6:b]
      AI systems intended to be used by or on behalf of law enforcement authorities
      or by Union institutions, bodies, offices or agencies in support of law enforcement
      authorities as polygraphs or similar tools;\n[annex:III:6:c] AI systems intended
      to be used by or on behalf of law enforcement authorities, or by Union institutions,
