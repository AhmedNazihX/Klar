      Is the tool placed on the market or used in the EU, or are its outputs used
      there? Yes.\n- for_public_authority: Is the system meant for use by public authorities?
      No."],"model":"qwen/qwen3-embedding-8b","dimensions":1536,"encoding_format":"float","provider":{"allow_fallbacks":false,"data_collection":"deny","order":["nebius"],"zdr":true}}'
