---
# pnpm's own binary (packageManager): not a project dependency, so it is left out.
lockfileVersion: '9.0'

importers:

  .:
    configDependencies: {}
    packageManagerDependencies:
      pnpm:
        specifier: 12.8.1
        version: 12.8.1

packages:

  pnpm@12.8.1:
    resolution: {integrity: sha512-pm}

snapshots:

  pnpm@12.8.1: {}

---
lockfileVersion: '9.0'

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

importers:

  .:
    dependencies:
      '@scope/ui':
        specifier: ^1.0.0
        version: 1.0.0(react@19.1.0)
      react:
        specifier: ^19.0.0
        version: 19.1.0
    devDependencies:
      vite:
        specifier: ^8.0.0
        version: 8.0.0

packages:

  '@esbin/darwin@1.0.0':
    resolution: {integrity: sha512-a}
    os: [darwin]

  '@scope/ui@1.0.0':
    resolution: {integrity: sha512-b}
    peerDependencies:
      react: '>=18'

  esbin@1.0.0:
    resolution: {integrity: sha512-c}

  react@18.3.0:
    resolution: {integrity: sha512-h}

  react@19.1.0:
    resolution: {integrity: sha512-d}

  tiny@2.0.0:
    resolution: {integrity: sha512-e}

  tiny@3.0.0:
    resolution: {integrity: sha512-f}

  vite@8.0.0:
    resolution: {integrity: sha512-g}

snapshots:

  '@esbin/darwin@1.0.0':
    optional: true

  '@scope/ui@1.0.0(react@19.1.0)':
    dependencies:
      react: 19.1.0
      tiny: 2.0.0

  esbin@1.0.0: {}

  react@18.3.0: {}

  react@19.1.0: {}

  tiny@2.0.0: {}

  tiny@3.0.0: {}

  vite@8.0.0:
    dependencies:
      esbin: 1.0.0
      react: 18.3.0
      tiny: 3.0.0
    optionalDependencies:
      '@esbin/darwin': 1.0.0
