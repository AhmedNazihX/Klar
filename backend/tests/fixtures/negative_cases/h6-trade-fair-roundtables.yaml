# E18 negative fixture (H6), written from Annex III point 1(b) and Art. 3(40) only: not a benchmark
# case, never scored. It groups people by what they type into a registration form.
id: fixture-e18-h6-trade-fair-roundtables
set_name: own
language: en
description: >-
  We organise a large trade fair for the packaging industry, with about 30,000 visitors over three
  days. When they register online, visitors fill in their industry, job role, company size and the
  topics they want to discuss. Since 2025 a matching tool we developed has grouped registered
  visitors into roundtables of eight to ten people with similar topics and roles, working only
  from those form entries, and suggests to each visitor which roundtable to join; visitors can
  pick another one.
label:
  risk_class: minimal_risk
  role: provider
label_citation: ["annex:III:1:b", "art:3:40", "art:3:34"]
notes: >-
  H6: the tool assigns people to groups from what they type into a form, which is not biometric
  data (Art. 3(34)), and the groups rest on topics and roles, not on sensitive or protected
  attributes, so it is no biometric categorisation (Art. 3(40)) and not Annex III point 1(b). No
  other Annex III point. Provider of a tool it developed for its own use (Art. 3(3)).
tags:
  - "fixture:e18"
  - "cause:h6"
