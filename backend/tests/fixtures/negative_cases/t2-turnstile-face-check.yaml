# E18 negative fixture (T2), written from Art. 3(36), 3(40) and 50(3) only: not a benchmark case,
# never scored. The system confirms who a member is; it assigns nobody to a category.
id: fixture-e18-t2-turnstile-face-check
set_name: own
language: de
description: >-
  Wir sind ein Hersteller von Zutrittssystemen aus Leipzig mit 60 Beschäftigten. Unser System
  „Eintritt“ verkaufen wir seit 2025 an Fitnessstudio-Ketten in Deutschland. Am Eingang hält das
  Mitglied seine Mitgliedskarte an das Lesegerät; eine Kamera nimmt dabei sein Gesicht auf, und ein
  von uns trainiertes Modell prüft, ob es zu dem Foto passt, das bei der Anmeldung für genau diese
  Karte hinterlegt wurde. Passt es, öffnet sich das Drehkreuz, sonst wird das Personal am Tresen
  gerufen. So verhindern die Studios, dass Karten weitergegeben werden. Das System ordnet niemanden
  einer Gruppe zu, schätzt weder Alter noch Geschlecht noch Stimmung und speichert die Aufnahmen
  nicht.
label:
  risk_class: minimal_risk
  role: provider
label_citation: ["art:3:36", "art:3:40", "art:50:3", "annex:III:1:a"]
as_of: 2026-10-01
notes: >-
  T2: a one-to-one check of a face against the photo stored for the card is biometric
  verification (Art. 3(36)); it establishes who the member is and assigns nobody to a category
  (Art. 3(40)), and infers no emotions (Art. 3(39)), so no Art. 50(3) duty. Verification whose sole
  purpose is to confirm a person is who they claim to be is outside Annex III point 1(a). Provider
  under its own name (Art. 3(3)).
tags:
