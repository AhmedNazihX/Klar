# E18 positive counterpart to the H4 fixture, written from Annex III point 2, Art. 3(14) and guide
# para 184 only: not a benchmark case, never scored. Its own output detects a dangerous condition
# in a gas network and acts on it, so it stays high-risk under the H4 rule.
id: fixture-e18-h4-positive-gas-station-shutoff
set_name: own
language: en
description: >-
  We run the regional gas distribution grid for about 250,000 households. Since 2025 each of our
  120 pressure regulating stations has had a module we bought from an industrial software vendor.
  It reads the station's pressure, flow, temperature and acoustic sensors every second, and a
  trained model recognises the signatures of a pipe rupture or an uncontrolled rise in outlet
  pressure. When it recognises one, the module closes the station's shut-off valve by itself and
  alerts the control room, which then sends a crew.
label:
  risk_class: high_risk
  role: deployer
label_citation: ["annex:III:2", "art:3:14", "art:6:2", "guide:guide-high-risk-annex-iii:para:184"]
notes: >-
  H4, positive side: the module is a component in the management and operation of the gas supply
  whose own output recognises a dangerous condition and stops the operation to prevent physical
  harm and damage, which guide para 184 lists among the safety functions that make it, in Art.
  3(14)'s sense, a safety component; so Annex III point 2 applies (Art. 6(2)). It profiles nobody
  and decides the outcome itself, so no Art. 6(3) condition. Deployer of a bought module (Art.
  3(4)).
tags:
  - "fixture:e18"
  - "cause:h4-positive"
