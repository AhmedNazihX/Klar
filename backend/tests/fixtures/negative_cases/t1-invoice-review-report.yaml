# E18 negative fixture (T1), written from Art. 50(1) and 50(2)'s conditions only: not a benchmark
# case, never scored. Its output is a table of flagged items with extracted data and masked
# copies: an analysis in structured form, and edits that don't substantially alter the input.
id: fixture-e18-t1-invoice-review-report
set_name: own
language: en
description: >-
  Our Ghent-based software firm has 40 staff. Our product checks incoming supplier invoices for
  the accounts payable teams of mid-sized firms. A clerk uploads a batch of invoices as PDF files;
  a model we trained reads each invoice, compares it with the purchase order and the supplier's
  master data, and returns a review report: a table of the invoices it flagged, each with a reason
  code and a short pointer such as "amount differs from order 4711 by EUR 120" or "VAT number does
  not match the supplier". For the archive it also returns a copy of each invoice with the bank
  account numbers blacked out. The clerk works through the table and decides what to do with each
  flagged invoice. We have sold it to about 300 companies in the EU since 2024.
label:
  risk_class: minimal_risk
  role: provider
label_citation: ["art:50:2", "art:50:1", "art:3:3", "guide:guide-art50:para:65", "guide:guide-art50:para:92"]
as_of: 2026-10-01
notes: >-
  T1: the table of flagged invoices, with reason codes and one-line pointers, states the system's
  analysis of its input as extracted and structured data, not a summary or prose it writes (guide
  para 65), so it is not synthetic text under Art. 50(2). The copies with the account numbers
  blacked out are obscured parts of the input, an edit that leaves the input data substantially
  unchanged (Art. 50(2) exception; guide para 92 lists obscuring and blurring), so no marking
  duty. The clerk uploads files and reads a table; nobody converses with the system, so no Art. 50(1)
  duty either. No Annex III use. Provider under its own name (Art. 3(3)).
tags:
