id: annex-match-38-entrance-exam-ranking
set_name: annex_match
language: en
description: >-
  Our company in Prague, about 70 people, runs entrance exams for universities and private colleges
  in Central Europe. Applicants sit our online aptitude test at home; our software proctors them
  through the webcam and flags anyone it thinks is cheating, and those attempts are voided. A model
  then combines the test score with school grades and ranks applicants, and the partner institutions
  admit candidates from the top of our list down to their quota. We built the whole system ourselves
  and sell it per applicant. We also publish practice books for the tests.
label:
  risk_class: high_risk
  role: provider
  annex_point: ["annex:III:3:a", "annex:III:3:d"]
label_citation: ["annex:III:3:a", "annex:III:3:d", "art:6:2", "art:3:3"]
notes: >-
  Awaiting user approval (X0 draft). Points: ranking applicants for admission is 3(a); detecting
  cheating during the test is 3(d). Either point counts. It evaluates individual people (profiling),
  so Art. 6(3) cannot lift it out of high-risk. Role: builds and sells it.
