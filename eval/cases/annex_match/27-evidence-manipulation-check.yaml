id: annex-match-27-evidence-manipulation-check
set_name: annex_match
language: en
description: >-
  We're a forensic software company in Leiden with 50 staff. Our tool VerifEye is sold to police
  forces and public prosecutors: investigators load photos, videos or audio recordings seized or
  submitted in a criminal case, and our model estimates whether the file has been manipulated or
  generated, giving a reliability score with a heat map of suspicious areas. Prosecutors use the
  report when deciding whether a piece of evidence can be relied on. We train the model ourselves
  and sell perpetual licences with yearly updates. We also run training courses on digital
  forensics.
label:
  risk_class: high_risk
  role: provider
