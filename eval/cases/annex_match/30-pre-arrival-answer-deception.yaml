id: annex-match-30-pre-arrival-answer-deception
set_name: annex_match
language: en
description: >-
  We're a 30-person language-technology company in Tallinn. We sell a screening module to border
  authorities that ask visitors from outside the EU to fill in an online questionnaire before they
  travel: purpose of the trip, where they will stay, who pays. The module reads the written
  answers and, much like a polygraph does with body signals, uses a model trained on our own data
  to flag answers whose wording, hedging and inconsistencies suggest the traveller is not telling
  the truth. Border officers see the flags when the traveller arrives. We develop the software and
  sell it under our own brand. Our team also maintains an open-source spell checker for Estonian.
label:
  risk_class: high_risk
  role: provider
  annex_point: ["annex:III:7:a"]
label_citation: ["annex:III:7:a", "art:6:2", "art:3:3"]
notes: >-
  Draft label, awaiting review (X0b). Point: a lie detector intended for border authorities is a
  polygraph or similar tool, Annex III 7(a); the point names the purpose, not the signal, so a
  tool reading written answers counts. DOUBT (minor): its flags feed the border check, so 7(b)
  (risk assessment of people entering) could be argued; 7(a) is the specific point. Role: develops
  it and places it on the market under its own brand.
tags:
  - "annex_iii_area:7"
