id: annex-match-45-self-learning-pallet-robot
set_name: annex_match
language: en
description: >-
  Our company in Turin, with 90 staff, builds autonomous mobile robots that move pallets around
  factories and warehouses. Each robot's safety controller uses a neural network that detects people
  and forklifts in its path and decides when to slow down or stop. The model keeps learning on each
  site from near-misses so that the robots adapt to local traffic, and that learning also changes
  how the safety function behaves. We sell the robots under our own name in the EU and have the
  machinery assessed by a notified body. Our robots are painted orange so people notice them.
label:
  risk_class: high_risk
  role: provider
  annex_point: ["annex:I:B:21"]
label_citation: ["annex:I:B:21", "art:6:1:a", "art:6:1:b", "art:2:2", "art:3:3"]
notes: >-
  Label approved 2026-10-06 (checked by the orchestrator under the user's standing delegation for
  clear labels). Point: a self-evolving machine-learning safety function puts the machine on the
  Machinery Regulation's list needing third-party assessment (Annex I Section B point 21), so Art.
  6(1) is met; Section B, so Art. 2(2) limits the Act to Art. 6(1) and the listed articles. Role:
  manufacturer.
tags:
  - "annex_i_section:b"
