id: annex-match-39-handel-hr-suite
set_name: annex_match
language: de
description: >-
  Wir sind eine Einzelhandelskette mit 3.500 Beschäftigten in Österreich und Süddeutschland. Seit
  diesem Jahr nutzen wir eine HR-Suite eines Walldorfer Anbieters durchgängig: Im Bewerbungsprozess
  sortiert ein KI-Modell die Bewerbungen und schlägt vor, wen wir zum Gespräch einladen. Für die
  bestehende Belegschaft wertet dieselbe Suite Verkaufszahlen, Kundenfeedback und Fehlzeiten aus und
  erstellt jährlich eine Rangliste, auf deren Grundlage die Regionalleitung über Beförderungen zur
  Filialleitung entscheidet. Wir verwenden die Standardmodule. Außerdem führen wir gerade ein neues
  Kassensystem ein.
label:
  risk_class: high_risk
  role: deployer
  annex_point: ["annex:III:4:a", "annex:III:4:b"]
label_citation: ["annex:III:4:a", "annex:III:4:b", "art:6:2", "art:3:4"]
notes: >-
  Awaiting user approval (X0 draft). Points: sorting applications is 4(a); ranking staff for
  promotion is 4(b). Either point counts. It evaluates individual people (profiling), so Art. 6(3)
  cannot lift it out of high-risk. Role: uses the standard modules.
tags:
  - "annex_iii_area:4"
  - "multi_point"
