id: annex-match-05-water-network-guard
set_name: annex_match
language: en
description: >-
  We're a 30-person industrial software firm in Ghent. Our system HydroGuard runs in the control
  rooms of municipal water utilities: it reads sensors across the treatment plant and pipe network,
  uses models we train in-house to predict contamination and pressure drops, and automatically
  adjusts chlorine dosing and closes valves to isolate a section when it detects a risk to
  drinking-water safety. Operators can override it, but at night it acts on its own. We sell the
  system to utilities in Belgium and the Netherlands with an annual support contract. We also offer
  a separate billing dashboard that has no AI in it.
label:
  risk_class: high_risk
  role: provider
  annex_point: ["annex:III:2"]
label_citation: ["annex:III:2", "art:6:2", "art:3:14", "art:3:3"]
notes: >-
  Awaiting user approval (X0 draft). Point: it performs a safety function in the supply of drinking
  water (Art. 3(14) safety component), so Annex III 2. Role: develops it and sells it under its own
  name.
tags:
