id: annex-match-36-schlichtung-vorschlag
set_name: annex_match
language: de
description: >-
  Wir sind ein Legal-Tech-Start-up aus Frankfurt mit 18 Mitarbeitenden. Unsere Plattform wird von
  zwei anerkannten Verbraucherschlichtungsstellen genutzt, etwa bei Streit über Flugverspätungen
  oder mangelhafte Handwerksleistungen. Beide Seiten laden ihre Unterlagen hoch, unser Modell ordnet
  den Sachverhalt, prüft ihn anhand von Gesetzen und bisherigen Schlichtungssprüchen und formuliert
  einen Schlichtungsvorschlag mit Begründung, den die Schlichterin prüft und verschickt. Das Modell
  haben wir selbst auf öffentlich verfügbaren Entscheidungen feinabgestimmt. Nächsten Monat ziehen
  wir in ein größeres Büro.
label:
  risk_class: high_risk
  role: provider
  annex_point: ["annex:III:8:a"]
label_citation: ["annex:III:8:a", "art:6:2", "art:3:3"]
notes: >-
  Label approved 2026-10-06 (checked by the orchestrator under the user's standing delegation for
  clear labels). Point: used in alternative dispute resolution in the same way as for a judicial
  authority, 8(a). Role: develops the platform and offers it under its own name.
