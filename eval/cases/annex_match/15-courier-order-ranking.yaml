id: annex-match-15-courier-order-ranking
set_name: annex_match
language: en
description: >-
  We operate a food-delivery app in Poland and the Czech Republic with about 9,000 couriers on the
  platform. Our in-house dispatch engine, a machine-learning model, assigns each order to a courier
  based on location but also on each courier's acceptance rate, delivery speed and customer ratings,
  so high scorers get the better-paid peak-hour orders. Couriers whose score stays in the bottom
  tier for a month are automatically suspended from the app until they speak to our support team. We
  built the engine ourselves and use it only on our own platform. We recently added vegan
  restaurants as a separate category.
label:
  risk_class: high_risk
  role: provider
  annex_point: ["annex:III:4:b"]
label_citation: ["annex:III:4:b", "art:6:2", "art:3:3"]
notes: >-
  Label approved 2026-10-06 (checked by the orchestrator under the user's standing delegation for
  clear labels). Point: it allocates tasks based on individual behaviour and suspends couriers,
  which affects the work relationship. It evaluates individual people (profiling), so Art. 6(3)
  cannot lift it out of high-risk. DOUBT (minor): couriers may be self-employed; Annex III 4 covers
  work-related relationships, read to include platform work. Role: develops it and puts it into
  service under its own name (Art. 3(3)); it is also the deployer.
tags:
