id: annex-match-47-train-obstacle-braking
set_name: annex_match
language: en
description: >-
  We're a rail technology supplier in Graz with 400 employees. Our obstacle-detection unit is
  mounted on the front of regional trains: cameras and lidar feed a neural network that recognises
  people, vehicles or fallen trees on the track ahead and, if the driver does not react, triggers
  the emergency brake. The unit is assessed by a notified body as part of the train's authorisation
  under the EU rail interoperability rules. We develop the software in-house and supply
  rolling-stock manufacturers in Austria, Germany and Switzerland. We also sponsor a model-railway
  museum.
label:
  risk_class: high_risk
  role: provider
  annex_point: ["annex:I:B:17"]
label_citation: ["annex:I:B:17", "art:6:1:a", "art:6:1:b", "art:2:2", "art:3:3"]
notes: >-
  Label approved 2026-10-06 (checked by the orchestrator under the user's standing delegation for
  clear labels). Point: a safety component of rolling stock under the Rail Interoperability
  Directive (Annex I Section B point 17), assessed by a notified body. Role: develops and supplies
  it.
