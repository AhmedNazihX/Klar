id: annex-match-15-parcel-hub-shift-scores
set_name: annex_match
language: en
description: >-
  We run three parcel-sorting hubs in Belgium with about 1,100 employees. Our data team built a
  model that gives every employee a weekly productivity score from scanner data: parcels handled per
  hour, mis-sorts and idle time. The model uses that score to allocate next week's shifts and to
  decide who gets the faster sorting lines and who is moved to loading, and employees on fixed-term
  contracts who stay in the bottom fifth for two months are flagged to HR for non-renewal. We built
  it ourselves and use it only in our own hubs. Our canteen started serving breakfast this autumn.
label:
  risk_class: high_risk
  role: provider
  annex_point: ["annex:III:4:b"]
label_citation: ["annex:III:4:b", "art:6:2", "art:3:3"]
notes: >-
  Draft label, awaiting review (X0 fix). Point: it allocates tasks based on individual behaviour,
  monitors and evaluates employees' performance and feeds decisions on renewing contracts. It
  evaluates individual people (profiling), so Art. 6(3) cannot lift it out of high-risk. Role:
  develops it and puts it into service under its own name (Art. 3(3)); it is also the deployer.
tags:
  - "annex_iii_area:4"
