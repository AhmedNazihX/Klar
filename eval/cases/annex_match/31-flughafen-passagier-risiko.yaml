id: annex-match-31-flughafen-passagier-risiko
set_name: annex_match
language: de
description: >-
  Wir sind die Grenzpolizei eines EU-Mitgliedstaats an einem großen Flughafen. Seit Anfang des
  Jahres nutzen wir eine Software eines europäischen IT-Dienstleisters, deren lernendes Modell die
  Passagierdaten aller ankommenden Flüge aus Drittstaaten vor der Landung auswertet: Reiseroute,
  Buchungsverhalten, Zahlungsart, frühere Einreisen. Es gibt jedem Reisenden einen Risikowert dafür,
  dass er unerlaubt im Land bleiben will oder ein Sicherheitsrisiko darstellt; wer hoch eingestuft
  ist, wird bei der Einreise gezielt zur zweiten Kontrolle gebeten. Wir nutzen die Software mit den
  Einstellungen des Anbieters. Im Terminal wurden gerade neue Kontrollkabinen eingebaut.
label:
  risk_class: high_risk
  role: deployer
  annex_point: ["annex:III:7:b"]
label_citation: ["annex:III:7:b", "art:6:2", "art:3:4"]
notes: >-
  Label approved 2026-10-06 (checked by the orchestrator under the user's standing delegation for
  clear labels). Point: assesses the security risk and risk of irregular migration posed by people
  entering the territory, 7(b). DOUBT (minor): border police are also law enforcement, so 6(e) could
  be argued; 7(b) is the specific point. Role: uses the provider's settings.
tags:
  - "annex_iii_area:7"
