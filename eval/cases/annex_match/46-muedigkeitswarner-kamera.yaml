id: annex-match-46-muedigkeitswarner-kamera
set_name: annex_match
language: de
description: >-
  Wir sind ein Automobilzulieferer aus Niederbayern mit 1.500 Beschäftigten. Für mehrere
  Pkw-Hersteller liefern wir ein Kamerasystem für das Armaturenbrett: Ein neuronales Netz erkennt
  anhand von Lidschlag, Kopfhaltung und Blickrichtung, ob die Person am Steuer müde oder abgelenkt
  ist, und warnt dann mit Ton und Vibration im Lenkrad. Das System wird im Rahmen der Typgenehmigung
  nach der EU-Verordnung über die allgemeine Fahrzeugsicherheit von der Genehmigungsbehörde geprüft.
  Hardware und Modell entwickeln wir selbst. Unser Werk bekommt nächstes Jahr eine
  Photovoltaikanlage.
label:
  risk_class: high_risk
  role: provider
  annex_point: ["annex:I:B:19", "annex:I:B:18"]
label_citation: ["annex:I:B:19", "annex:I:B:18", "art:6:1:a", "art:6:1:b", "art:2:2", "art:3:3"]
notes: >-
  Label approved 2026-10-06 (checked by the orchestrator under the user's standing delegation for
  clear labels). Points: a driver drowsiness and attention warning is a safety system type-approved
  under the General Safety Regulation (Annex I Section B point 19) within the vehicle type-approval
  framework (point 18). Either point counts. Fatigue is a physical state, not an emotion, so 1(c)
  does not apply. Role: develops and supplies it.
tags:
  - "annex_i_section:b"
  - "multi_point"
