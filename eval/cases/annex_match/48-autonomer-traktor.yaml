id: annex-match-48-autonomer-traktor
set_name: annex_match
language: de
description: >-
  Wir sind ein Landtechnikhersteller aus dem Emsland mit 600 Beschäftigten. Unser neuer Traktor kann
  auf dem Feld ohne Fahrer arbeiten: Kameras und ein neuronales Netz erkennen Menschen, Rehe oder
  Hindernisse im Weg und stoppen die Maschine. Für den Traktor beantragen wir die EU-Typgenehmigung
  für land- und forstwirtschaftliche Fahrzeuge, bei der die Genehmigungsbehörde auch diese Funktion
  prüft. Wir verkaufen über unser Händlernetz in Deutschland, den Niederlanden und Polen. Die Kabine
  hat jetzt auch eine Kühlbox für die Brotzeit.
label:
  risk_class: high_risk
  role: provider
  annex_point: ["annex:I:B:15", "annex:I:B:21"]
label_citation: ["annex:I:B:15", "annex:I:B:21", "art:6:1:a", "art:6:1:b", "art:2:2", "art:3:3"]
notes: >-
  Label approved 2026-10-06 (checked by the orchestrator under the user's standing delegation for
  clear labels). Points: a safety component of an agricultural vehicle type-approved under
  Regulation 167/2013 (Annex I Section B point 15). The Machinery Regulation (point 21) excludes
  tractors only 'as regards the risks covered by' Regulation 167/2013, and driverless operation is
  arguably not such a risk, so point 21 is accepted too. Either point counts; the class (high_risk)
  is unaffected. Role: manufacturer.
tags:
  - "annex_i_section:b"
  - "multi_point"
