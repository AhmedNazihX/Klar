id: annex-match-32-asyl-sprachanalyse
set_name: annex_match
language: de
description: >-
  Wir sind die Asylbehörde eines EU-Mitgliedstaats. Wenn Antragstellende keine Ausweisdokumente
  haben, nehmen wir eine kurze Sprachprobe auf. Eine KI-Software, die ein Dienstleister für uns
  betreibt, analysiert Aussprache und Wortwahl und schätzt, aus welcher Region die Person sprachlich
  stammt. Weicht das Ergebnis von der angegebenen Herkunft ab, wird das im Bescheid als Zweifel an
  der Glaubwürdigkeit gewertet. Außerdem fasst die Software die Anhörungsprotokolle zusammen und
  markiert Widersprüche. Wir haben sie nur an unsere Aktenverwaltung angebunden. Im Sommer haben wir
  zudem unsere Warteräume neu gestaltet.
label:
  risk_class: high_risk
  role: deployer
  annex_point: ["annex:III:7:c"]
label_citation: ["annex:III:7:c", "art:6:2", "art:3:4"]
notes: >-
  Awaiting user approval (X0 draft). Point: assists the examination of asylum applications,
  including assessing the reliability of evidence, 7(c). Role: the authority uses the service under
  its authority.
tags:
  - "annex_iii_area:7"
