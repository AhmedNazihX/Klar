id: annex-match-23-leitstelle-notrufe
set_name: annex_match
language: de
description: >-
  Wir sind die Integrierte Leitstelle eines Landkreises in Bayern und nehmen Notrufe für
  Rettungsdienst und Feuerwehr an. Seit Herbst läuft bei jedem Notruf eine KI-Software eines
  österreichischen Herstellers mit: Sie wertet das Gespräch live aus, schätzt die Dringlichkeit ein,
  schlägt ein Einsatzstichwort vor und legt fest, in welcher Reihenfolge wartende Einsätze
  disponiert werden. Die Disponenten können abweichen, folgen dem Vorschlag aber meistens. Wir
  nutzen die Standardkonfiguration. Unser neues Leitstellengebäude wird nächstes Jahr bezogen.
label:
  risk_class: high_risk
  role: deployer
  annex_point: ["annex:III:5:d"]
label_citation: ["annex:III:5:d", "art:6:2", "art:3:4"]
notes: >-
  Label approved 2026-10-06 (checked by the orchestrator under the user's standing delegation for
  clear labels). Point: it classifies emergency calls and sets the priority of dispatching. Role:
  uses the manufacturer's software in its standard configuration.
tags:
  - "annex_iii_area:5"
