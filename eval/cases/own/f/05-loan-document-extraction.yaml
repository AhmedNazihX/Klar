id: own-f-05-loan-document-extraction
set_name: own
language: en
description: >-
  We are a consumer lender in Ireland with about 300 employees, offering car loans and personal
  loans online. Applicants upload their payslips and three months of bank statements. A
  document-reading tool from a fintech supplier pulls out the net salary, the employer's name, the
  rent and any existing loan repayments, and enters them into the matching fields of the
  application file. Our credit analysts then check each figure against the documents, correct
  anything wrong, and carry out the credit assessment on the completed file. The tool does not
  rate the applicant, does not suggest a decision and passes nothing else on. The same supplier
  also provides our e-signature service.
label:
  risk_class: minimal_risk
  role: deployer
label_citation:
  - "art:6:3"
  - "art:6:3:d"
  - "recital:53"
  - "annex:III:5:b"
  - "art:3:4"
business_function: finance
notes: >-
  APPROVAL PENDING (the orchestrator records the approval line). Class: the tool feeds the creditworthiness assessment of natural
  persons (Annex III 5(b)), but only as a preparatory task, extracting figures into the file that
  analysts verify before they assess (Art. 6(3)(d); recital 53 names file handling and linking
  data as such tasks). It evaluates no personal aspect of the applicant, so it is not profiling
  and the last subparagraph of Art. 6(3) does not apply. Not high-risk; no Art. 50 duty:
  minimal_risk. Role: bought and used under its authority (Art. 3(4)): deployer. The lender's own
  assessment method, if it is an AI system, is a separate system and not this case. Trap: any AI
  in a loan process reads like 5(b). Doubt: whether extraction errors could still materially
  influence the outcome; read as no, because analysts check every figure.
tags:
  - "category:f"
  - "trap:art_6_3_exemption"
  - "obligation:art:4:1"
