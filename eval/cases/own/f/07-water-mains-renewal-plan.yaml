id: own-f-07-water-mains-renewal-plan
set_name: own
language: en
description: >-
  We are a regional water utility in Flanders supplying about 400,000 households through 9,000 km
  of mains. Our asset team uses a machine-learning tool from an engineering consultancy that ranks
  pipe sections by how likely they are to burst in the next ten years, based on pipe age, material,
  soil type and past repairs. We use the ranking to draw up our five-year pipe replacement
  programme and its budget, which our engineers review and the board approves. The tool has no
  connection to pumps, valves or the control room and does not watch the network as it runs;
  leaks and pressure are handled by our separate control systems. We also use the same consultancy
  for our hydraulic models.
label:
  risk_class: minimal_risk
  role: deployer
label_citation:
