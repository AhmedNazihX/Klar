business_function: operations
notes: >-
  APPROVAL PENDING (the orchestrator records the approval line). Class: water supply is critical infrastructure, but Annex III 2
  covers only AI systems used as safety components in its management and operation (Art. 3(14)):
  this tool supports long-term investment planning, controls nothing, and its failure would not
  directly endanger people or the network, because operation and leak handling run on separate
  systems (recital 55). It is supportive and planning-oriented, not a direct protective function
  (guidelines para. 181), and predictive maintenance planning is not a safety component where
  other safeguards keep the network safe (examples ex:065, ex:068). So Art. 6(2) does not apply;
  no Art. 50 duty: minimal_risk. Role: bought and used under its authority (Art. 3(4)): deployer.
  Trap: an AI tool at a water utility reads like 2. Doubt: para. 184(b) makes a safety component
  of "a component in the critical infrastructure to monitor and detect the need to schedule
  maintenance" whose omission may directly lead to harm; read as not met, because this desk tool
  is not a component of the network, does not watch it as it runs, and only shapes a multi-year
  replacement plan that engineers review and the board approves, while leaks and pressure are
  handled by separate control systems.
