id: own-f-01-depot-headcount-forecast
set_name: own
language: en
description: >-
  We are a parcel logistics company with nine depots in Poland and about 3,500 employees. Our
  planning team built a forecasting tool that estimates, per depot and per month, how many
  drivers and sorters we will need to hire over the next year. It works from parcel volume
  forecasts, planned depot openings, seasonal peaks and each depot's overall staff turnover. The
  output is a headcount figure per depot and role, which our HR directors use to set recruitment
  budgets and decide which job fairs to attend. The tool only works with totals: it holds no data
  on individual employees or applicants and has nothing to do with job ads or applications. This
  year we also replaced the handheld scanners in all depots.
label:
  risk_class: minimal_risk
  role: provider
label_citation:
  - "annex:III:4:a"
  - "annex:III:4:b"
  - "art:6:2"
  - "art:3:3"
business_function: hr
notes: >-
  APPROVAL PENDING (the orchestrator records the approval line). Class: the tool sits in the employment area but does none of the
  uses Annex III 4 lists: it does not recruit or select natural persons, place job ads, filter
  applications or evaluate candidates (4(a)), and makes no decision about, allocates no task to,
  and does not monitor or evaluate any worker (4(b)); it only forecasts aggregate headcount. So
  Art. 6(2) does not apply; no Art. 50 duty: minimal_risk. Role: built in-house and put into
  service for its own use (Art. 3(3)), also the deployer. Trap: an HR planning tool reads like a
  recruitment system.
tags:
