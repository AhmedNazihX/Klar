id: own-e-07-grinder-burst-kit
set_name: own
language: en
description: >-
  We're a 40-person industrial-sensing start-up in Eindhoven. We sell a retrofit kit that machine
  builders fit to high-speed grinding machines: vibration and acoustic sensors on the spindle feed
  a small neural network that spots the signature of a grinding wheel about to crack or a
  workpiece working loose, and then brakes the spindle and keeps the guard door locked until it
  has stopped. The machine builders integrate the kit into their grinders and sell those to
  factories. We train the model in-house and are still deciding how updates will reach customers.
  We haven't talked to a notified body yet and haven't worked out which conformity route the kit
  will take. First pilot deliveries are planned for spring 2027. We share our test hall with a
  university solar-car team.
label:
  risk_class: high_risk
  status: needs_more_information
  role: provider
  annex_point: ["annex:I:B:21"]
label_citation: ["art:6:1:a", "art:6:1:b", "art:3:14", "annex:I:B:21", "art:2:2"]
business_function: product_safety
notes: >-
  Label approved by user 2026-09-30. Description rewritten in B10c (2026-10-09), label unchanged:
  the earlier vision kit that slowed or stopped a robot arm when a person came within reach
  mirrored a held-out Commission example. Missing fact: whether the kit must undergo a third-party
  conformity assessment under the Machinery Regulation (Annex I Section B point 21). That depends
  on facts the description leaves open, such as whether the model keeps learning in the field and
  whether harmonised standards cover it. The kit is clearly a safety component (it brakes the
  spindle and keeps the guard locked to protect operators from wheel fragments or a flying
  workpiece, Art. 3(14)), so Art. 6(1)(a) is met and only (b) is open. Working assumption:
  high_risk (stricter reading). Section B, so Art. 2(2) limits the AI Act to Art. 6(1), 60a and
  102 to 112, and no obligation is tagged. The engine should name the Machinery Regulation and ask
  whether the model keeps learning after delivery and whether harmonised standards cover it.
