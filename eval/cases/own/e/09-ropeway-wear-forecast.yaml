id: own-e-09-ropeway-wear-forecast
set_name: own
language: en
description: >-
  We are a 30-person software firm in Innsbruck working for ski resorts. Our product analyses
  vibration, rope-tension and weather data from chairlifts and gondolas and predicts wear on
  rollers, grips and bearings. We sell it for maintenance planning, and that explicitly includes
  deciding when a scheduled component inspection can safely be moved back; several resorts now
  push inspections back by weeks when the tool rates a part as healthy. The tool has no connection
  to the lifts' controls or brakes. The lifts and their safety components were certified by
  notified bodies under the cableway rules; our software was not part of that assessment. We
  launched in the 2025/26 season and have just added French and Italian.
label:
  risk_class: high_risk
  status: legally_ambiguous
  role: provider
label_citation: ["art:6:1a", "art:6:1b", "art:6:1:b", "art:3:14", "annex:I:A:8"]
notes: >-
  Draft, pending user approval. Open question 1: is the tool a safety component? Reading A: it is
  a maintenance planning aid for service efficiency, so Art. 6(1a) excludes it. Reading B: its
  intended purpose includes deciding when safety inspections may be postponed, so a wrong
  "healthy" rating would endanger health and safety, and Art. 6(1b) makes it a safety component.
  Open question 2 (if B): must it undergo a third-party conformity assessment under the cableway
  regulation (Annex I Section A point 8), given it was never part of the certification and is sold
  separately? Art. 6(1) applies "irrespective of whether" it is placed on the market
  independently, but whether the cableway regulation requires a notified body for such software is
  not settled by the facts or the AI Act. Readings: minimal_risk, or high_risk. Working
  assumption: high_risk, with provider duties on the Annex I route.
