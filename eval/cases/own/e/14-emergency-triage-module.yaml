id: own-e-14-emergency-triage-module
set_name: own
language: de
description: >-
  Wir sind ein Softwarehaus aus Leipzig mit 120 Beschäftigten und entwickeln Klinik-IT. Unser
  Modul für Notaufnahmen wertet bei der Ankunft Vitalwerte, Symptome und Vorerkrankungen aus und
  schlägt eine Dringlichkeitsstufe vor; die Pflegekraft an der Ersteinschätzung übernimmt oder
  ändert den Vorschlag, und danach richtet sich, wer zuerst behandelt wird. Das Modul ist als
  Medizinprodukt der Klasse IIa zertifiziert, das Audit der benannten Stelle war im Juni 2026. Wir
  verkaufen es an Krankenhäuser in Deutschland und der Schweiz. Nebenbei haben wir gerade unser
  Logo überarbeitet.
label:
  risk_class: high_risk
  role: provider
  annex_point: "annex:III:5:d"
label_citation: ["art:6:1:a", "art:6:1:b", "annex:I:A:11", "art:6:2", "annex:III:5:d", "art:6:3", "art:43:3"]
notes: >-
  Draft, pending user approval. Class: high_risk on two routes. Annex I: certified class IIa
  medical device software with a notified body (Section A point 11), so Art. 6(1) is met. Annex
  III: emergency healthcare patient triage is point 5(d); the module evaluates each patient's
  health data to set priority, which is profiling, so no Art. 6(3) exemption. The conformity
  assessment follows the MDR procedure (Art. 43(3), last subparagraph). annex_point is set to the
  Annex III point, because the schema cannot hold the Annex I id and the Annex III point is also
  correct. Role: provider under its own name. Provider duties including Art. 16(i) (registration,
  Annex III). Doubts: (1) which date applies, 2 December 2027 (Annex III) or 2 August 2028 (Annex
  I), is read as the earlier one; (2) Art. 111(2), since it was certified in 2026, is not
  modelled.
