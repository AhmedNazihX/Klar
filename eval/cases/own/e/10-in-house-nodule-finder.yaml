id: own-e-10-in-house-nodule-finder
set_name: own
language: de
description: >-
  Wir sind ein Universitätsklinikum in Süddeutschland mit rund 8.000 Beschäftigten. Unsere
  Radiologie hat zusammen mit der hauseigenen IT eine Software entwickelt, die in Thorax-CTs
  Lungenrundherde markiert und vermisst; die Radiologinnen und Radiologen sehen die Markierungen
  beim Befunden und entscheiden selbst. Die Software wird nur bei uns im Haus eingesetzt, nicht
  verkauft und an keine andere Klinik weitergegeben. Deshalb haben wir sie als Eigenherstellung
  nach der Medizinprodukteverordnung behandelt, ohne CE-Kennzeichnung und ohne benannte Stelle;
  ein vergleichbares Produkt auf dem Markt wäre mindestens Klasse IIa. Die Bilddaten stammen aus
  unseren eigenen Geräten. Eingeführt haben wir die Software im Frühjahr 2026, gleichzeitig mit
  dem Umzug der Radiologie in den Neubau.
label:
  risk_class: high_risk
  status: legally_ambiguous
  role: provider
label_citation: ["art:6:1:a", "art:6:1:b", "annex:I:A:11", "art:3:3", "art:3:11"]
notes: >-
  Draft, pending user approval. Open question: does Art. 6(1)(b) look at the product as actually
  handled, or at the device class? Reading A: the MDR's in-house exemption means this software is
  not required to undergo any third-party conformity assessment, so Art. 6(1)(b) is not met and it
  is not high-risk via Annex I (minimal_risk). Reading B: a device of this kind is class IIa and
  would need a notified body, and the in-house exemption only relieves the hospital of MDR
  procedures, not of the AI Act's classification, so it is high_risk. Working assumption:
  high_risk. Role: the hospital develops the software and puts it into service under its own name
  for its own use (Art. 3(3), 3(11)), so it is the provider, and it is also the deployer (tag
  also_role:deployer). Deployer duties are tagged too; Art. 26(9) (DPIA) is kept because its
  condition is not settled by the facts. Doubt: a public-law hospital may be a public authority,
  which changes transition dates (Art. 111(2)).
