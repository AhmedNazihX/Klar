id: own-e-08-heart-rhythm-app
set_name: own
language: de
description: >-
  Wir sind ein Digital-Health-Unternehmen aus Hamburg mit 45 Beschäftigten. Unsere App liest die
  Pulsdaten gängiger Smartwatches aus, und ein selbst trainiertes Modell sucht darin nach Mustern,
  die auf Vorhofflimmern hindeuten können. Findet es welche, erscheint der Hinweis, das ärztlich
  abklären zu lassen. Ob wir die App als Medizinprodukt zertifizieren lassen oder als
  Fitness-Funktion ohne medizinische Zweckbestimmung anbieten, ist intern noch nicht entschieden;
  davon hängen Marketingtexte und Zulassungsweg ab. Der Marktstart ist für Herbst 2028 geplant,
  zunächst in Deutschland. Außerdem arbeiten wir gerade an einer Funktion für Schlaftracking.
label:
  risk_class: high_risk
  status: needs_more_information
  role: provider
label_citation: ["art:6:1:a", "art:6:1:b", "annex:I:A:11", "art:3:12"]
notes: >-
  Approved by user 2026-09-30. Missing fact: the intended purpose. If the company gives the app a
  medical purpose (detecting signs of atrial fibrillation), it is a medical device under the MDR
  (Annex I Section A point 11) and, as software informing diagnosis, would need a notified body,
  so Art. 6(1) would be met: high_risk. If it is marketed as a fitness feature with no medical
  purpose, the MDR doesn't cover it and it would be minimal_risk. The intended purpose is the
  provider's to set (Art. 3(12)) and the description says it is undecided. Working assumption:
  high_risk (stricter reading), with provider duties on the Annex I route; the launch is planned
  for autumn 2028, after the Annex I date (2 August 2028), so Art. 111(2) does not arise. Doubt:
  whether "not yet decided" should be needs_more_information (a fact the company can supply)
  rather than legally_ambiguous is read here as the former.
