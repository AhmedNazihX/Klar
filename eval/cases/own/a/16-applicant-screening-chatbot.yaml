id: own-a-16-applicant-screening-chatbot
set_name: own
language: de
description: >-
  Wir sind ein HR-Tech-Start-up aus Hamburg mit 18 Leuten und entwickeln einen
  Chatbot für die Personalabteilungen von Handelsketten. Bewerberinnen und Bewerber chatten auf der
  Karriereseite des Kunden mit ihm: Er fragt nach Erfahrung, Verfügbarkeit und Gehaltswunsch,
  formuliert Rückfragen selbst, bewertet die Antworten mit Punkten und sortiert alle Bewerbungen in
  eine Rangliste, nach der die Personaler entscheiden, wen sie einladen. Gebaut ist er auf einem
  lizenzierten großen Sprachmodell. Im Moment testen wir nur intern mit erfundenen Bewerbungen;
  verkaufen wollen wir ihn unter unserem Namen ab Februar 2028. Unser erster Messeauftritt ist im
  Herbst in Köln.
label:
  risk_class: high_risk
  role: provider
  annex_point: "annex:III:4:a"
label_citation: ["annex:III:4:a", "art:6:2", "art:6:3", "art:50:1", "art:50:2", "art:3:3"]
as_of: 2026-10-01
notes: >-
  Approved 2026-10-01 (the user delegated review of clear cases to the orchestrator; doubts checked against their sources). Class: the chatbot evaluates applicants and ranks them for
  shortlisting, which is Annex III 4(a), so high-risk under Art. 6(2); scoring and ranking people
  is profiling, so the Art. 6(3) exemption is unavailable. Trap: Art. 50 duties stack on top of
  high-risk (INIT > Risk classes): applicants chat with it directly (Art. 50(1)), and it writes its
  own questions, read as synthetic text (Art. 50(2)), as in own-d-06. Date: launch in February
  2028, after 2 December 2027, so Art. 111(2) does not arise and no Art. 111(4) grace period
  applies. Today's internal testing with invented applications is Art. 2(8) research and testing;
  the label classifies the planned system (E3 rule). Role: provider under its own name
  (Art. 3(3)), building on a licensed general-purpose model (gpai_based). The retail chains will
  be deployers.
