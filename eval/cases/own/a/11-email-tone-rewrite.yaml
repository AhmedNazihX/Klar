id: own-a-11-email-tone-rewrite
set_name: own
language: en
description: >-
  We're a small software company in the Baltics making an email app for small
  businesses. In September 2026 we added a "Polish" button: you write a draft, pick "more formal",
  "friendlier" or "shorter", and the app rewrites your email in that tone using a language model
  we fine-tuned ourselves. It keeps your facts, names and dates but may reorder sentences and swap
  most of the wording; you see the new version and send it yourself. There is no chat, and it
  never writes an email from scratch. Most of our 15,000 paying users are in the Baltics and
  Finland.
label:
  risk_class: limited_risk
  role: provider
label_citation: ["art:50:2", "guide:guide-art50:para:90", "guide:guide-art50:para:91", "guide:guide-art50:para:92"]
as_of: 2026-10-01
notes: >-
  Approved 2026-10-01 (the user delegated review of clear cases to the orchestrator; doubts checked against their sources).
  Relabelled 2026-10-06 by the user: guide para 92's marking example (rewriting text that changes
  style or structure) settles a tone rewrite that replaces most of the wording as a substantial
  alteration, so Art. 50(2) applies; paras 90-91 don't make it standard editing. Until then the
  case was legally_ambiguous between that reading and standard editing that keeps the meaning.
  Placed on the market in September 2026, after 2 August 2026, so no Art. 111(4) grace period. No
  Art. 50(1) duty: a one-button rewrite is closer to auto-completion than to a conversation (guide
  para 31). Role: provider under its own name (Art. 3(3)).
tags:
  - "category:a"
  - "obligation:art:4:1"
  - "obligation:art:50:2"
