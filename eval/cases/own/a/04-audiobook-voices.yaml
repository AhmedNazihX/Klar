id: own-a-04-audiobook-voices
set_name: own
language: de
description: >-
  Wir sind ein Audio-Tech-Unternehmen aus Köln mit 40 Leuten. Am 1. September 2026 haben wir
  „Vorleser“ gestartet: Verlage laden ein Manuskript hoch, wählen eine von 30 Stimmen, die wir mit
  bezahlten Sprecherinnen und Sprechern aufgenommen und lizenziert haben, und bekommen nach ein
  paar Stunden das fertige Hörbuch als Audiodatei. Die Stimme erzeugt dabei vollständig unser
  eigenes Sprachsynthese-Modell, live eingelesen wird nichts mehr. Gechattet wird nicht, die
  Verlage arbeiten nur über ein Upload-Portal. Erste Kunden sind drei Kinderbuchverlage aus Hamburg
  und Wien. Nebenbei betreiben wir noch ein kleines Tonstudio für Werbespots.
label:
  risk_class: limited_risk
  role: provider
label_citation: ["art:50:2", "art:111:4", "art:113", "art:3:3", "guide:guide-art50:para:60"]
notes: >-
  Draft, pending user approval. Class: the system generates synthetic audio (speech; guide para
  60), so its provider must mark the outputs under Art. 50(2); not high-risk, so limited_risk.
  Trap: placed on the market on 1 September 2026, after 2 August 2026, so the Art. 111(4) grace
  period does not apply and marking is due now (Art. 113). No Art. 50(1) duty: publishers only
  upload files, with no conversational exchange. Role: provider under its own name (Art. 3(3)).
  Whether an audiobook in a cloned real speaker's voice is a deep fake (Art. 50(4); guide para
  116 treats voices for fictional characters as no deep fake when nobody is misled about the
  narrator) is for the publishers as deployers, not for this provider.
tags:
