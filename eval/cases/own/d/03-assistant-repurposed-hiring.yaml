id: own-d-03-assistant-repurposed-hiring
set_name: own
language: en
description: >-
  We run 14 fitness studios across Ireland with about 260 employees. Everyone in head office has a
  seat on a well-known general AI assistant, mostly for emails and translations. The vendor's
  usage policy says the assistant must not be used to make hiring or employment decisions. Our HR
  lead has nevertheless built a workflow around it: every application from our careers page is
  passed to the assistant with a fixed prompt, and it answers "invite" or "reject" with a one-line
  reason. Studio managers only ever see the invited candidates; everyone else gets our standard
  rejection email automatically. We wrote the prompt and the email automation ourselves. The
  assistant also helps us plan class timetables.
label:
  risk_class: high_risk
  role: provider
  annex_point: "annex:III:4:a"
label_citation: ["art:25:1:c", "art:3:66", "annex:III:4:a", "art:6:3"]
business_function: hr
notes: >-
  Approved by user 2026-09-29 (Art. 26(7) left out: applicants are not workers subject to the
  system). The assistant is a general-purpose AI system
  (Art. 3(66)) whose provider excludes hiring decisions, so it was not classified as high-risk
  (compare guide:guide-high-risk-general:para:12: a clear, consistent exclusion matters). Using it
  to filter applications changes its intended purpose so that it becomes an Annex III 4(a) system:
  the gym chain becomes the provider under Art. 25(1)(c), for putting it into service for its own
  use (Art. 3(11)); it is also the deployer (also_role:deployer). Filtering applicants is
  profiling, so no Art. 6(3) exemption. GPAI flag: the model provider's Art. 53 duties stay with
  the model provider and are only flagged (INIT > Scope, out of scope). Conditional duties
  included: Art. 26(4) (it controls the input), 26(11) and 86(1) (automatic rejections). Kept as
  conditional because the facts don't settle it (user rule 2026-09-29): Art. 26(9) (DPIA). Left
  out because the facts rule them out: Art. 27(1) (private employer, not a public service),
  Art. 26(7) (applicants are not workers; INIT's worked example, which lists informing workers'
  representatives for a recruitment tool, is to be checked against this). No Art. 50 duty: applicants do not
  interact with the system and the rejection email is a fixed template.
