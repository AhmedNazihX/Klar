id: own-d-10-rebranded-health-pricing
set_name: own
language: de
description: >-
  Unser Unternehmen in Köln mit rund 60 Beschäftigten vertreibt Software für Versicherer. Von einem
  Entwickler aus Seoul haben wir die Rechte an einem System erworben, das für private
  Krankenversicherungen aus den Gesundheitsfragebögen der Antragsteller einen Risikozuschlag pro
  Person vorschlägt. In Deutschland bieten wir es seit diesem Frühjahr als „TarifKompass“ an, mit
  unserem Logo, unserer Hotline und unseren eigenen Handbüchern; der Name des Entwicklers taucht
  bei den Kunden nirgends auf. Technisch ist das System unverändert. Die Versicherer übernehmen den
  vorgeschlagenen Zuschlag in der Regel direkt ins Angebot. Außerdem sponsern wir einen
  Handballverein in Porz.
label:
  risk_class: high_risk
  role: provider
  annex_point: "annex:III:5:c"
label_citation: ["art:3:3", "art:25:1:a", "art:3:6", "annex:III:5:c", "art:6:3"]
business_function: finance
notes: >-
  Approved by user 2026-09-29 (role_switch set to none; Art. 3(3) is the basis). Class: risk
  assessment and pricing of natural persons for health insurance is Annex III 5(c); scoring
  applicants is profiling, so no Art. 6(3) exemption. Role: the Cologne company is the first to
  place the system on the Union market, under its own name and trademark, having acquired it from
  the developer, so it is the provider (Art. 3(3)). No Art. 25 switch is shown: the facts don't say
  the Seoul developer ever placed it on the Union market. If it had, Art. 25(1)(a) would give the
  same role. It is not an importer, because the system does not bear the name of a third-country
  company (Art. 3(6)). Established in the EU, so no Art. 22 authorised representative.
  The insurers are deployers (their FRIA under Art. 27 is not this company's duty). Art. 25(1)(a)
  (its own name on a high-risk system already on the market) is cited as a further basis for the
  provider role (B9 label filter, 2026-10-10, orchestrator under the user's standing delegation).
