id: own-d-07-office-assistant-seats
set_name: own
language: en
description: >-
  We're an accounting firm in Dublin with 45 employees. Since January everyone has a seat on a
  well-known general AI assistant under a business plan. Staff use it to draft client emails,
  summarise long tax circulars and translate letters from our German clients. Nothing is connected
  to our client database, we haven't built anything on top of it, and our internal policy forbids
  using it to assess clients or staff or to make decisions about them. A partner reviews every
  client-facing text before it goes out, and nothing it writes is published. The subscription is
  billed together with our video-conferencing licence.
label:
  risk_class: limited_risk
  role: deployer
label_citation: ["art:3:4", "art:50:1", "art:50:2", "art:4:1"]
notes: >-
  Approved by user 2026-09-29 as limited_risk: the class describes the system (INIT › Risk
  classes), whoever bears its Art. 50 duties. Role: the firm uses a general-purpose AI system
  under its authority as supplied, so it is a deployer (Art. 3(4)); nothing triggers Art. 25. GPAI
  flag: the assistant's provider and the model provider carry their own duties (Art. 50(1) and (2)
  for the system, Art. 53 for the model); only flagged. Obligations of the firm: AI literacy only
  (Art. 4); the deployer duties in Art. 50(3) and (4) do not apply (no emotion recognition, no deep
  fakes, no text published to inform the public). Doubt on the class: the system carries Art. 50
  duties, but they fall on its provider, not on this deployer. Labelled limited_risk because the
  class describes the system (INIT > Risk classes); minimal_risk is the other possible reading if
  the class is meant from the deployer's side. Keep consistent with category a.
tags:
  - "category:d"
  - "role_switch:none"
  - "gpai_based"
  - "obligation:art:4:1"
