  - "art:5:1:c"
  - "guide:guide-prohibited:para:176"
  - "art:3:4"
business_function: education
notes: >-
  APPROVAL PENDING (the orchestrator records the approval line). Class: the module scores
  applicants and the score decides admission to a programme (Annex III 3(a), Art. 6(2));
  scoring each applicant's grades, practice and statement is profiling, so Art. 6(3) cannot take
  it out. Not social scoring: the data comes only from the application for this programme and
  the treatment (admitted or not) stays in that admission context and is proportionate (Art.
  5(1)(c)(i) and (ii) not met; guidelines para. 176). Date: use starts with the winter semester
  2028/29, after 2 December 2027, so Art. 111(2) does not arise. Role: bought and used unchanged
  under its authority (Art. 3(4)): deployer. Included: 26(4) (it receives and passes on the
  uploaded documents that are the input), 26(11) (decisions about natural persons). Kept because
  the facts don't settle the condition: 26(9) (DPIA) and 86(1) (whether a refused admission has
  legal or similarly significant effects). Left out: 26(7) (applicants are not its workers),
  26(8) and 27 (a private institution, not a public body). Trap: a score that decides who is
  turned away reads like social scoring.
