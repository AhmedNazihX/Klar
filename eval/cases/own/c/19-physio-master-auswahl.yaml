id: own-c-19-physio-master-auswahl
set_name: own
language: de
description: >-
  Wir sind eine private Hochschule für Gesundheitsberufe in Nordrhein-Westfalen mit rund 3.000
  Studierenden. Für unseren Masterstudiengang Physiotherapie mit 40 Plätzen nutzen wir ab dem
  Wintersemester 2028/29 ein Auswahlmodul unseres Campus-Management-Anbieters. Es liest aus den
  hochgeladenen Unterlagen das Bachelorzeugnis, die Noten in den Kernfächern, die nachgewiesenen
  Praxisstunden und das Motivationsschreiben und vergibt jeder Bewerbung einen Punktwert. Die
  Auswahlkommission lässt von oben nach unten zu, bis die Plätze vergeben sind, und schaut sich
  nur die Grenzfälle rund um Platz 40 genauer an. Das Modul verwendet ausschließlich, was die
  Bewerberinnen und Bewerber für diesen Studiengang einreichen. Über denselben Anbieter läuft
  auch unsere Raumplanung.
label:
  risk_class: high_risk
  role: deployer
  annex_point: "annex:III:3:a"
label_citation:
