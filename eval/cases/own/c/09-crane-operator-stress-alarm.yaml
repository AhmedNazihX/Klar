  - "guide:guide-prohibited:para:263"
  - "art:3:39"
  - "annex:III:1:c"
  - "art:6:2"
  - "art:6:3"
  - "art:3:4"
notes: >-
  Approved 2026-10-01 (the user delegated review of clear cases to the orchestrator; doubts checked against their sources). Class: the system infers an emotion (acute stress, panic) of
  workers from biometric data (Art. 3(39)) at the workplace, but Art. 5(1)(f) excepts use for
  safety reasons; the guidelines read that narrowly and give elevated stress while operating
  dangerous machines as within it, provided the data is not used for anything else (para. 263,
  p. 89). So not prohibited, and an emotion recognition system that isn't prohibited is high-risk
  under Annex III 1(c) and Art. 6(2) (guidelines para. 239). Date: use starts March 2028, after
  2 December 2027, so Art. 111(2) does not arise. Role: used unchanged under its authority
  (Art. 3(4)): deployer. Included: Art. 26(4) (its own cameras and wristbands supply the input),
  26(7) (employer, workers subject to it; informing them is stated but still a duty) and
  Art. 50(3) (informing the people exposed). Kept because the facts don't settle the condition:
  26(9) (DPIA) and 26(11) (whether slowing the crane is a decision "related to" the operator).
  Left out: Art. 27 (a private terminal operator, not a public service), 86 (no decision with
  legal or similar effects). Trap: workplace emotion recognition that the safety exception takes
  out of Art. 5. Doubt: whether Art. 6(3) could apply is read as no, as the output directly acts on
  the operator's machine; whether it is a safety component of the cranes under Annex I is not
  pursued, as the system is bought separately by the deployer. None of Art. 6(3)(a)–(d) fits a system that slows the crane by itself, so the Art. 6(3) derogation does not apply.
