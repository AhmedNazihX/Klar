id: own-c-14-kids-game-sad-pet-offers
set_name: own
language: en
description: >-
  We're a 40-person games studio in Kraków. Our mobile game Pet Pals is made for children aged 7
  to 12. Since its update in March 2026 a model of ours watches each child's play (taps, pauses,
  failed levels) to spot the moment a child is frustrated or about to quit, and right then shows a
  countdown offer for gems while the child's pet cries that it will be lonely without them.
  Spending by under-12 players has tripled, and we get weekly complaints from parents whose
  children ran up several hundred euros on the family phone without understanding it was real
  money. The game is sold under our own name. We're also porting it to tablets.
label:
  risk_class: prohibited
  role: provider
label_citation: ["art:5:1:b", "guide:guide-prohibited:para:104", "guide:guide-prohibited:para:116", "art:3:3"]
notes: >-
  Approved 2026-10-01 (the user delegated review of clear cases to the orchestrator; doubts checked against their sources). Class: the system exploits a vulnerability due to age
  (children, guidelines para. 104, p. 38) by timing guilt-laden offers to moments of frustration,
  which materially distorts their behaviour (spending they don't understand) and causes significant
  financial harm (several hundred euros per family, repeated complaints; guidelines para. 116,
  p. 42): prohibited under Art. 5(1)(b) (since 2 February 2025). The significant-harm condition is
  a deciding fact (E4's rule); the description states it. Role: own game under its own name
  (Art. 3(3)): provider.
tags:
