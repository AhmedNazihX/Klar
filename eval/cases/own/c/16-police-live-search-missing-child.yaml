id: own-c-16-police-live-search-missing-child
set_name: own
language: en
description: >-
  We're a national police force in an EU country whose police act allows live facial recognition
  in public places for only two purposes, finding abducted or missing persons and stopping an
  imminent terrorist attack, and requires an investigating judge to approve each use in advance.
  We've bought a system from a French vendor and will use it from 2028, unchanged. In a case such
  as a missing child, cameras at named stations compare passers-by against that child's photo for
  at most 48 hours, and officers check every match before acting. We've completed the fundamental
  rights impact assessment, registered the system in the EU database, and notify the data
  protection authority of each use. Our fleet is also moving to electric cars.
label:
  risk_class: high_risk
  role: deployer
  annex_point: "annex:III:1:a"
