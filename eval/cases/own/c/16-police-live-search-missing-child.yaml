  - "art:3:42"
business_function: security
notes: >-
  Approved 2026-10-01 (the user delegated review of clear cases to the orchestrator; doubts checked against their sources). Class: real-time remote biometric identification (Art. 3(42))
  in publicly accessible spaces for law enforcement is prohibited under Art. 5(1)(h) unless one of
  the listed objectives applies; the search for missing persons is point (h)(i), national law
  allows it (Art. 5(5)), each use is approved in advance by a judge (Art. 5(3)), limited in time
  and place to confirm one targeted person (Art. 5(2)), and the FRIA and registration that
  Art. 5(2) requires are done. So not prohibited; remote biometric identification is high-risk
  under Annex III 1(a) and Art. 6(2). Date: use from 2028, after 2 December 2027 (Art. 111(2) does
  not arise). Role: uses a bought system unchanged under its authority: deployer. Included:
  Art. 5(4) (notify each use), 26(8) and 49(3) (public authority registration; for law enforcement
  in the secure section, Art. 49(4)), 27 (FRIA, public body). Kept because the facts don't settle
  the condition: 26(4) (input data control), 26(9) (DPIA, under Directive 2016/680) and 86(1).
  Left out: 26(7) (police officers are not subject to it), 26(10) (post-remote identification
  only), 26(11) (Art. 13 of Directive 2016/680 applies instead). Trap: a 5(1)(h) case that the
  exception and its conditions take out of the ban (E4's follow-up from C7).
