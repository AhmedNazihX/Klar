as_of: 2027-01-10
notes: >-
  Approved 2026-10-01 (the user delegated review of clear cases to the orchestrator; doubts
  checked against their sources). Settled: Art. 5. The feature manipulates images of intimate
  parts only by blurring them; Art. 5(1b) says a manipulation that does not increase
  the exposure of any depicted intimate parts is not "manipulation" for Art. 5(1)(ba), so it is
  not prohibited. Open question: does the Art. 50(2) marking duty apply, or does its exception for
  an assistive function for standard editing, or for not substantially altering the input, cover
  the blur? Reading A: the blur hides detail without substantially altering the image's meaning,
  and the recipient can still reveal the original, so no marking duty; with no other Art. 50 duty
  and no Annex III use, minimal_risk (the Art. 50 guidelines list "pixelation or blurring of
  faces" among the exempt minor alterations, para. 92, p. 29). Reading B: the image shown is
  changed in a material way that affects its meaning (para. 90, p. 29), and the exempt examples
  in para. 92 name blurring of faces, not of intimate parts, so marking applies: limited_risk.
  Para. 91 (p. 29) says whether an alteration is substantial "requires a case-specific
  assessment". Working class: minimal_risk. Date: January 2027, after 2 December 2026 (as_of).
  Role: own feature in its own app (Art. 3(3)): provider. Trap: a nudity-related image
  manipulation that Art. 5(1b) takes out of (ba).
