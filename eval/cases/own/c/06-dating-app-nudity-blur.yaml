id: own-c-06-dating-app-nudity-blur
set_name: own
language: de
description: >-
  Wir betreiben eine Dating-App aus Hamburg mit rund 60 Mitarbeitenden. Seit Januar 2027 läuft in
  den Chats eine Funktion, die wir selbst entwickelt haben: Ein Bildmodell erkennt, wenn jemand ein
  Nacktfoto schickt, und legt über die intimen Stellen eine starke Unschärfe, bevor das Bild beim
  Empfänger ankommt. Der Empfänger sieht einen Hinweis und kann selbst entscheiden, ob er das
  Original aufdeckt; sonst bleibt es verschwommen. Neue Inhalte erzeugt die Funktion nicht, sie
  verdeckt nur. Über die Nutzer entscheidet sie nichts, gesperrt wird niemand deswegen. Heute ist
  der 10. Januar 2027. Im Frühjahr kommt außerdem ein neues App-Design.
label:
  risk_class: minimal_risk
  role: provider
