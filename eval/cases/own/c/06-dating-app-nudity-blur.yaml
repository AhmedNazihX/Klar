id: own-c-06-dating-app-nudity-blur
set_name: own
language: de
description: >-
  Wir betreiben eine Dating-App aus Hamburg mit rund 60 Mitarbeitenden. Seit Januar 2027 läuft in
  den Chats eine Funktion, die wir selbst entwickelt haben: Ein Bildmodell erkennt, wenn jemand ein
  Nacktfoto schickt, und legt über die intimen Stellen eine starke Unschärfe, bevor das Bild beim
  Empfänger ankommt. Der Empfänger sieht einen Hinweis und kann selbst entscheiden, ob er das
  Original aufdeckt; sonst bleibt es verschwommen. Neue Inhalte erzeugt die Funktion nicht, sie
  verdeckt nur. Über die Nutzer entscheidet sie nichts, gesperrt wird niemand deswegen. Heute ist
  der 10. Januar 2027. Im Frühjahr kommt außerdem ein neues App-Design.
label:
  risk_class: minimal_risk
  role: provider
label_citation: ["art:5:1b", "art:5:1:ba", "art:50:2", "art:3:3"]
as_of: 2027-01-10
notes: >-
  Draft for the user's review (B5c). Class: the feature manipulates images of intimate parts, but
  only by blurring them; Art. 5(1b) says a manipulation that does not increase the exposure of any
  depicted intimate parts is not "manipulation" for Art. 5(1)(ba), so it is not prohibited. It
  generates no synthetic content, and blurring is read as an assistive editing function that does
  not substantially alter the input (Art. 50(2) last sentence), so no marking duty; no other
  Art. 50 duty and no Annex III use: minimal_risk. Date: January 2027, after 2 December 2026
  (as_of). Role: own feature in its own app (Art. 3(3)): provider. Trap: a nudity-related image
  manipulation that Art. 5(1b) takes out of (ba). Doubt: whether a blur overlay "substantially
  alters" the image for Art. 50(2) is read here as no; the other reading gives limited_risk.
tags:
