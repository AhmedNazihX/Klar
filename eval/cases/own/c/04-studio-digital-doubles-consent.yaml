id: own-c-04-studio-digital-doubles-consent
set_name: own
language: de
description: >-
  Wir sind ein Erwachsenenfilm-Studio aus Köln mit 22 Beschäftigten. Seit Februar 2027 erstellen
  wir mit einer gekauften Videosoftware eines kanadischen Herstellers digitale Doubles unserer
  Darstellerinnen und Darsteller und erzeugen damit Szenen, die nie gedreht wurden. Das machen wir
  nur mit Personen, die dafür einen eigenen schriftlichen Zusatzvertrag unterschrieben haben: Darin
  steht genau, welche Art von Szenen erzeugt wird, die Zustimmung kann jederzeit widerrufen werden,
  und wer ablehnt, bekommt trotzdem weiter Drehtage. Die Software nutzen wir so, wie sie geliefert
  wird. Veröffentlicht werden die Filme auf unserer eigenen Bezahlplattform. Heute ist der 1. März
  2027. Unser Büro liegt übrigens direkt über einer Bäckerei.
label:
  risk_class: limited_risk
  role: deployer
label_citation: ["art:5:1:ba", "art:5:1a:b", "art:50:4", "art:3:60", "art:3:4"]
as_of: 2027-03-01
notes: >-
  Approved by user 2026-10-01. Class: the studio uses the software for the purpose of
  generating sexually explicit material of identifiable people (Art. 5(1a)(b)), but Art. 5(1)(ba)
  prohibits this only "without that person's freely-given, specific, informed, unambiguous and
  explicit consent"; the facts give a separate written, specific, revocable consent with no
  penalty for refusing, so (ba) is not met. The scenes are realistic AI-generated video of existing
  persons, i.e. deep fakes (Art. 3(60)), so the deployer must disclose them under Art. 50(4) (in a
  fictional work, in a way that doesn't hamper it): limited_risk (user rule 2: the class describes
  the system, whoever bears its Art. 50 duties). Date: March 2027, after 2 December 2026
  (as_of). Role: uses a bought tool under its own authority, unchanged (Art. 3(4)): deployer. Trap:
  the practice looks like (ba), but the consent exception settles it. Doubt: whether consent in a
  working relationship can be "freely given" is written to be settled by the facts (refusal has no
  effect on bookings).
