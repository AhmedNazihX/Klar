id: own-b-09-voice-mood-prototype
set_name: own
language: de
description: >-
  Wir sind ein Start-up aus München mit elf Leuten und entwickeln gerade eine Software für
  Callcenter: Sie soll an der Stimme erkennen, ob ein anrufender Kunde verärgert, unsicher oder
  zufrieden ist, und das dem Mitarbeiter am Bildschirm anzeigen. Im Moment gibt es nur einen
  Prototyp. Trainiert und getestet wird er bei uns im Büro, mit gekauften Sprachaufnahmen von
  Schauspielern und mit künstlich erzeugten Stimmen. Echte Anrufe hat er noch nie gehört, wir
  haben noch keinen Pilotkunden, und verkauft oder irgendwo in Betrieb genommen ist er auch nicht.
  Den Marktstart planen wir frühestens Anfang 2028, vorher suchen wir noch eine Finanzierungsrunde.
  Unser Büro teilen wir uns übrigens mit einer Agentur für Hörbücher.
label:
  risk_class: high_risk
  role: provider
  annex_point: "annex:III:1:c"
label_citation: ["art:3:39", "art:3:34", "annex:III:1:c", "art:6:2", "art:2:8"]
business_function: customer_service
notes: >-
  Approved by user 2026-09-30 (relabelled from out_of_scope under the planned-system rule).
  Class: the software identifies callers' emotions from their voice, which is an emotion
  recognition system (Art. 3(39)); voice is behavioural biometric data (Art. 3(34)). That is
  Annex III 1(c), so the system is high-risk under Art. 6(2). Trap: it is not prohibited under
  Art. 5(1)(f), because the emotions recognised are the callers', not the employees' (the
  prohibition covers the workplace and education institutions). Doubt: Art. 6(3) is read as not
  applying, since recognising emotion is the system's purpose and shapes how agents treat callers.
  Role: the start-up develops the system and will sell it under its own name, so it is the
  provider (Art. 3(3)). The Art. 50(3) duty to inform the people exposed falls on the deploying
  call centres, not on the provider. Date: the launch in early 2028 is after 2 December 2027, so
  Art. 111(2) does not arise. Today's research, testing and development in the office is exempt
  under Art. 2(8); the label classifies the system as it will be placed on the market.
