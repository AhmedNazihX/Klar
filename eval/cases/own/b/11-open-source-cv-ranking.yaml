id: own-b-11-open-source-cv-ranking
set_name: own
language: de
description: >-
  Wir sind ein Logistikdienstleister aus Duisburg mit etwa 1.100 Beschäftigten und stellen jedes
  Jahr mehrere hundert Lagerkräfte und Disponenten ein. Unsere IT hat ein frei verfügbares
  Open-Source-Modell heruntergeladen, das Lebensläufe mit Stellenanzeigen vergleicht, und baut es
  gerade in unser Karriereportal ein. Jede Bewerbung soll so eine Passungsquote bekommen, und die
  Personalabteilung soll pro Stelle nur die 20 Bewerbungen mit der höchsten Quote sehen. Alle
  anderen sollen automatisch eine Absage erhalten. Der Start ist für Anfang 2028 geplant; das Tool
  soll nur bei uns laufen, unter unserem Namen, und wir werden es nicht weiterverkaufen. Weil das
  Modell Open Source ist, geht unsere IT davon aus, dass die KI-Verordnung dafür nicht gilt.
  Nebenbei nutzen wir das Portal auch für unser Azubi-Marketing.
label:
  risk_class: high_risk
  role: provider
  annex_point: "annex:III:4:a"
label_citation: ["art:2:12", "annex:III:4:a", "art:6:3", "art:3:3", "art:3:11"]
notes: >-
  Approved by user 2026-09-30. Scope: the Art. 2(12) open-source exclusion does not apply to a
  system put into service as a high-risk AI system, so the open-source licence of the model
  changes nothing. Class: scoring applications against job ads and showing only the top 20 is
  analysing and filtering applications, Annex III 4(a); scoring applicants is profiling, so no
  Art. 6(3) exemption. Role: the company builds the system from the model and will put it into
  service for its own use under its own name, so it is the provider (Art. 3(3), 3(11)) and also the
  deployer. Date: go-live in early 2028, after the Annex III obligations apply (2 Dec 2027), so
  Art. 111(2) does not arise and the duties below hold. Conditional duties included: Art. 26(4) (it
  controls the input), 26(11) and 86(1) (automatic rejections). Kept as conditional because the
  facts don't settle it (user rule 2026-09-29): Art. 26(9) (DPIA). Left out because the facts rule
  them out: 27(1) (private employer, not a public service), 26(7) (applicants are not workers),
  26(8) (not a public authority). Compare own-d-03 (the same duties for a repurposed assistant).
