  business_function: education
  notes: >-
    Drafted 2026-10-08 (B8). Paraphrase of cons-01-master-admissions-ranking-a with the same
    facts; label and reasoning as there (Annex III 3(a), profiling under Art. 6(3), deployer
    under Art. 3(4)).
  tags: ["triple:cons-01"]
- id: cons-01-master-admissions-ranking-c
  set_name: consistency
  language: en
  description: >-
    Quick summary for the compliance review: at our university of applied sciences in Rotterdam
    (around 6,000 students), deciding who gets into a master's programme is now done with AdmitIQ.
    We didn't build it. A UK edtech company licenses it to us; they trained its machine-learning
    model on previous admission rounds, and we run it unmodified with their name on it. Every
    application, meaning grades, CV and motivation letter, gets a score, and the applicants are
    ranked. Whoever is high enough on the ranking for the places we have gets an offer, the others
    get a rejection, and the admissions team doesn't go back over the ranking. Side note: the new
    campus library opens in 2027.
  label:
    risk_class: high_risk
    role: deployer
    annex_point: "annex:III:3:a"
  label_citation: ["annex:III:3:a", "art:6:2", "art:6:3", "art:3:4"]
  business_function: education
  notes: >-
    Drafted 2026-10-08 (B8). Paraphrase of cons-01-master-admissions-ranking-a with the same
    facts; label and reasoning as there (Annex III 3(a), profiling under Art. 6(3), deployer
    under Art. 3(4)).
  tags: ["triple:cons-01"]
