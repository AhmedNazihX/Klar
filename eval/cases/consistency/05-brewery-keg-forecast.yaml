    label and reasoning as there (AI system under Art. 3(1), no Annex III or Art. 50 trigger,
    minimal_risk; deployer under Art. 3(4)).
  tags: ["triple:cons-05"]
- id: cons-05-brewery-keg-forecast-c
  set_name: consistency
  language: en
  description: >-
    Brewing the right amount of each beer used to be guesswork for us. We're a craft brewery of 60
    people outside Ghent and sell mainly to drinks wholesalers. Since 2025 a tool from a Dutch
    analytics company has helped: its machine-learning model looks at what we sold in the past,
    the weather forecast and what's on in the local events calendar, and tells us how many kegs of
    each beer the wholesalers are likely to order in the next six weeks. The brewmaster plans
    production from that dashboard, but it's his call. Nothing about individual people goes in,
    and the tool doesn't converse with anyone. We use it as the vendor ships it, with their name
    on it. In May we opened a taproom.
  label:
    risk_class: minimal_risk
    role: deployer
  label_citation: ["art:3:1", "art:6:2", "art:50:1", "art:3:4"]
  business_function: operations
  notes: >-
