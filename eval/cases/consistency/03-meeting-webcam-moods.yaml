- id: cons-03-meeting-webcam-moods-a
  set_name: consistency
  language: en
  description: >-
    We are a software consultancy with about 400 employees in Warsaw and Kraków. Since spring
    2026 our video-meeting platform has run MeetPulse, an add-on we bought from a US vendor. During
    internal meetings it analyses each employee's facial expressions on their webcam and works out
    whether they are frustrated, bored or enthusiastic. Managers receive a weekly report with these
    emotions for every person in their team, and the reports are used in performance reviews. It
    is not used for health or safety purposes. We run MeetPulse as the vendor supplies it. Last
    year we moved the Kraków office into a new building.
  label:
    risk_class: prohibited
    role: deployer
  label_citation: ["art:5:1:f", "art:3:39", "art:3:4"]
  business_function: hr
  notes: >-
    Drafted 2026-10-08 (B8); clear label under the user's standing rule (the agent decides clear
    labels, hard ones go to the user). Class: the add-on infers employees' emotions from their
    facial expressions, which is biometric data, so it is an emotion recognition system
    (Art. 3(39)); used at the workplace and not for medical or safety reasons, its use is
    prohibited under Art. 5(1)(f), which applies since 2 February 2025. Role: the consultancy uses
    the bought add-on under its authority (Art. 3(4)): deployer. Same facts as -b and -c.
  tags: ["triple:cons-03"]
- id: cons-03-meeting-webcam-moods-b
