    label and reasoning as there (emotion recognition at the workplace, Art. 5(1)(f) with
    Art. 3(39); deployer under Art. 3(4)).
  tags: ["triple:cons-03"]
- id: cons-03-meeting-webcam-moods-c
  set_name: consistency
  language: en
  description: >-
    Our managers wanted a better feel for how their teams experience meetings, so since spring
    2026 we've used MeetPulse, an add-on for our video-meeting platform from a vendor in the US.
    We're a software consultancy, about 400 people between Warsaw and Kraków. The add-on watches
    the webcam picture of each employee in our internal meetings and reads from their facial
    expressions whether they are frustrated, bored or enthusiastic. Every week each manager gets
    those emotions per team member, and we draw on them in performance reviews. Health and safety
    play no part in it. We use the add-on exactly as supplied. The Kraków office moved to a new
    building last year.
  label:
    risk_class: prohibited
    role: deployer
  label_citation: ["art:5:1:f", "art:3:39", "art:3:4"]
  business_function: hr
  notes: >-
