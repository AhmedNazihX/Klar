id: cb-185-emergency-line-traffic-monitor
set_name: commission_b
language: en
description: >-
  We're a mobile network operator in Croatia with about 1,500 employees. Our network operations
  centre is introducing a monitoring tool from a telecom-software vendor in 2028. It watches the
  traffic of emergency calls across our network and shows, in real time, how many are coming in
  where, and where coverage or connectivity has dropped, for example after a storm knocks out a
  mast. Engineers use it to fix faults faster and to tell the emergency services where calls may
  not get through. It doesn't answer, classify or route any call and has no role in sending help.
  We run it as delivered. We're also rolling out 5G in the islands.
label:
  risk_class: minimal_risk
  role: deployer
label_citation: ["annex:III:5:d"]
source_example_id: hr-ex-185
accepted_bases: ["outside_use_case"]
label_status: settled
notes: >-
  Draft label, awaiting user approval. Class: conveying emergency-call traffic and connectivity
  gaps does not evaluate or classify calls or dispatch responders, so it falls outside Annex III
  point 5(d), even if it may affect the availability of services. Not a safety component of
  critical digital infrastructure either: it only monitors and reports (point 2). No Art. 50 duty:
  minimal_risk. Role: deployer of a bought tool.
tags:
  - "area:annex_iii_5"
  - "verdict:not_high"
