id: cb-168-securities-lending-limit
set_name: commission_b
language: en
description: >-
  We are an online brokerage in Frankfurt with about 250 employees and 400,000 private clients. Some
  clients want to borrow money against the shares and bonds they already hold with us, to invest
  more. From 2028 a model we built decides whether to offer this margin facility to an existing or
  new client and how much they can borrow, based on their portfolio, trading history and declared
  income. We use it only for margin lending; we don't offer consumer loans, mortgages or any other
  credit. Our app is also getting a new portfolio-analysis screen.
label:
  risk_class: minimal_risk
  role: provider
label_citation: ["annex:III:5:b"]
source_example_id: hr-ex-168
accepted_bases: ["outside_use_case"]
label_status: settled
notes: >-
  Label approved 2026-10-07 (checked against the source row by the orchestrator under the user's standing delegation for clear labels). Class: although it decides access to financial resources for
  natural persons, the model is used solely for margin credit against securities, a non-essential
  private service, so the Commission places it outside Annex III point 5(b). No Art. 50 duty:
  minimal_risk. Role: it builds the model and uses it itself (provider, also deployer).
tags:
  - "area:annex_iii_5"
  - "verdict:not_high"
  - "also_role:deployer"
