id: cb-164-loan-form-inline-help
set_name: commission_b
language: en
description: >-
  We're an online consumer-lending company in Riga with about 140 employees. From 2028 our loan
  application form gets built-in help from a form-software vendor. Next to each field there's a
  plain-language explanation of terms like "debt-to-income ratio" or "fixed costs", and at the top
  of the page an indicator, driven by a model, moves as the applicant fills in the form to show
  how their answers so far tend to affect the chance of approval, for instance that a blank field
  or a very short job history usually lowers it. There's no chat and it doesn't write any text.
  None of this feeds our real credit check, which a separate system and our underwriters carry
  out; it only helps applicants prepare. We're also launching a savings account.
label:
  risk_class: minimal_risk
  role: deployer
label_citation: ["annex:III:5:b"]
source_example_id: hr-ex-164
accepted_bases: ["outside_use_case"]
label_status: settled
notes: >-
  Label approved 2026-10-07 (checked against the source row by the orchestrator under the user's
  standing delegation for clear labels). Class: help built into the application form, explaining
  terms and showing how answers tend to affect approval, without taking part in the
  creditworthiness assessment or credit scoring, falls outside Annex III point 5(b). Written
  without a chat interface or generated text (convention 1), so no Art. 50 duty: minimal_risk.
  Role: deployer of a vendor's form feature.
tags:
  - "area:annex_iii_5"
  - "verdict:not_high"
