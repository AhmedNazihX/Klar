id: cb-120-employer-brand-ad-placement
set_name: commission_b
language: en
description: >-
  We're a Danish medical-technology manufacturer with about 2,400 employees. Our employer-branding
  team runs ad campaigns that show what it's like to work here: our culture, benefits, parental
  leave and career paths. None of the ads is about a specific job opening, and they're written and
  designed by our own team. From 2028 we're letting an ad platform's optimisation feature decide
  where and when the ads appear, based on overall figures like website visits, engagement rates
  and broad audience demographics, so they reach more people who might like working here. Our
  careers site is also getting a new design.
label:
  risk_class: minimal_risk
  role: deployer
label_citation: ["annex:III:4:a"]
source_example_id: hr-ex-120
accepted_bases: ["outside_use_case"]
label_status: settled
notes: >-
  Draft label, awaiting user approval. Class: optimising the placement of employer-branding ads
  that are not tied to any vacancy does not concern specific job openings, so it falls outside the
  targeted job advertisements of Annex III point 4(a). The ads are human-made, so no Art. 50 duty:
  minimal_risk. Role: deployer of an ad platform's feature.
tags:
  - "area:annex_iii_4"
  - "verdict:not_high"
