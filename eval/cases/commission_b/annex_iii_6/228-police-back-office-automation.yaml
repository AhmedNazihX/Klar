id: cb-228-police-back-office-automation
set_name: commission_b
language: en
description: >-
  We are the support services directorate of a national police force in Ireland, about 400
  civilian staff. From 2028 we're automating back-office work with tools from an enterprise
  software vendor: invoices and expense claims are read and booked automatically, vehicles and
  radios are tracked and booked for servicing, case files are routed to the right registry, and
  patrol rosters are drafted from staffing rules, leave and training dates. None of this touches
  investigations or judges anyone's performance. We use the vendor's standard modules. We're also
  installing solar panels on our depots.
label:
  risk_class: minimal_risk
  role: deployer
label_citation: ["annex:III:6"]
source_example_id: hr-ex-228
accepted_bases: ["outside_use_case"]
label_status: settled
notes: >-
  Label approved 2026-10-07 (checked against the source row by the orchestrator under the user's standing delegation for clear labels). Class: automating administration, accounting, case-file
  handling, equipment management and patrol scheduling are administrative activities that fall
  outside the law-enforcement uses in Annex III point 6. Rosters are built from staffing rules,
  leave and training, not from individual behaviour or performance, so not point 4(b) either. No
  Art. 50 duty: minimal_risk. Role: deployer of bought tools.
tags:
  - "area:annex_iii_6"
  - "verdict:not_high"
