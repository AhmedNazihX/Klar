id: cb-234-gunshot-sound-sensors
set_name: commission_b
language: en
description: >-
  We're a 30-person acoustics company in Malmö. We sell networks of microphones that cities and
  police forces mount on lamp posts and rooftops. Our model listens for the sound of gunshots in
  real time, tells them apart from fireworks or backfiring cars, works out roughly where the shot
  came from, and alerts the police control room within seconds. It reacts to sounds only and does
  not record conversations or identify anyone. We trained the model ourselves and release the new
  generation in 2028. We also build noise monitors for construction sites.
label:
  risk_class: minimal_risk
  role: provider
label_citation: ["annex:III:6"]
source_example_id: hr-ex-234
accepted_bases: ["outside_use_case"]
label_status: settled
notes: >-
  Label approved 2026-10-07 (checked against the source row by the orchestrator under the user's standing delegation for clear labels). Class: detecting gunshot sounds works on sounds, not people,
  so it falls outside the uses in Annex III point 6. No Art. 50 duty: minimal_risk. Role: it
  trains the model and sells the system under its own name.
