id: cb-086-admissions-round-pattern-audit
set_name: commission_b
language: en
description: >-
  We're a 40-person software company in Utrecht. Universities use our audit tool after an
  admissions round has closed and every decision has been made by the admissions committee. The
  tool goes through the committee's decisions and the files behind them, looks for patterns and
  inconsistencies (say, similar applicants treated differently, or one panel stricter than the
  others) and writes a report for the quality office. Nothing is reopened and no applicant's
  outcome changes; the report is used to improve the guidelines and training for next year's
  committees. We developed the tool ourselves and sell it under our name; version 2 ships in 2028.
  Our team also organises a yearly hackathon.
label:
  risk_class: minimal_risk
  role: provider
label_citation: ["art:6:3:c", "annex:III:3:a", "art:6:4"]
source_example_id: hr-ex-086
accepted_bases: ["art_6_3_filter"]
label_status: settled
notes: >-
  Draft label, awaiting user approval. Class: the tool is used in an Annex III point 3(a) setting
  (admissions), but it reviews completed decisions ex post to detect decision-making patterns and
  deviations, without replacing or influencing the committee's completed assessment: the Art.
  6(3)(c) exemption, so not high-risk. It analyses decisions, not individual applicants, so no
  profiling. No Art. 50 duty: minimal_risk. Art. 6(4): as provider, it must document this
  assessment before placing the tool on the market (and register it under Art. 49(2)).
tags:
  - "area:annex_iii_3"
  - "verdict:not_high"
  - "art_6_4_documentation"
