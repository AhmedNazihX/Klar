id: cb-100-school-leaver-pathway-trends
set_name: commission_b
language: en
description: >-
  We are a non-profit education research institute in Ljubljana with 25 researchers. We built an
  analysis tool that pulls together data from schools, universities and national statistics
  databases and shows which kinds of programmes and levels of education young people go on to
  after finishing secondary school, how that changes over the years and how it differs between
  regions. Ministries, school networks and other researchers subscribe to its dashboards from 2028.
  The tool works on aggregated figures; it is not used to decide anything about individual
  students, their placement or their opportunities. We also publish an annual report on teacher
  shortages.
label:
  risk_class: minimal_risk
  role: provider
