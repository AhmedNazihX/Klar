id: cb-069-heating-plant-patrol-robot
set_name: commission_b
language: en
description: >-
  We run a district-heating plant in Aarhus that supplies about 60,000 homes, with a staff of 150.
  In 2028 we're bringing in two four-legged inspection robots bought from a robotics company. They
  walk the same rounds through the boiler house several times a day, stop at fixed checkpoints,
  read gauges, take thermal images and listen for leaks, and their software flags anything unusual
  to the shift engineers. The robots can only look and report: they can't open or close valves,
  stop equipment or fix anything, and the plant's own protection systems are entirely separate.
  Our engineers decide what to do with the findings. We also gave the control room a new coat of
  paint.
label:
  risk_class: minimal_risk
  role: deployer
label_citation: ["annex:III:2", "art:3:14"]
source_example_id: hr-ex-069
accepted_bases: ["outside_use_case"]
label_status: settled
notes: >-
  Draft label, awaiting user approval. Class: the patrol robots only detect and report; they cannot
  take preventive measures, intervene in operations or avert dangers, so they fulfil no safety
  function (Art. 3(14)) in the supply of heating: not Annex III point 2. No Art. 50 duty:
  minimal_risk. Role: deployer of bought robots.
tags:
  - "area:annex_iii_2"
  - "verdict:not_high"
