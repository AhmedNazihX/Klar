id: cb-054-decoy-server-attack-learning
set_name: commission_b
language: en
description: >-
  We're a 70-person cybersecurity firm in Warsaw. Our main product is a decoy platform: it poses
  on the internet as poorly protected servers, and when attack tools, bots or malware connect, a
  model we trained decides at protocol level how to answer so that the attack keeps going and
  reveals its methods. Everything it sees is turned into reports on new attack techniques, which
  our customers, including a cloud hosting company and two internet exchanges, use to tune their
  own defences. The decoys sit apart from customers' real systems and can't change anything in
  them. A new release comes out in 2028, and we're hiring for a second office in Kraków.
label:
  risk_class: minimal_risk
  role: provider
label_citation: ["annex:III:2", "art:3:14", "recital:55"]
source_example_id: hr-ex-054
accepted_bases: ["outside_use_case"]
label_status: settled
notes: >-
  Draft label, awaiting user approval. Class: a decoy that engages attackers to learn their
  methods is a cybersecurity tool, not a safety component in the management or operation of
  critical digital infrastructure; recital 55 says components used solely for cybersecurity are
  not safety components. Not Annex III point 2. It talks to attack tools and malware at protocol
  level, not to natural persons, so no Art. 50(1) duty: minimal_risk. Role: it builds and sells
  the platform under its own name.
tags:
  - "area:annex_iii_2"
  - "verdict:not_high"
