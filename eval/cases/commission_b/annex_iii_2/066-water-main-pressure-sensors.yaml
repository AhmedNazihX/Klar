id: cb-066-water-main-pressure-sensors
set_name: commission_b
language: en
description: >-
  We are the drinking-water utility for a city of about 300,000 people in central Portugal, with
  roughly 400 employees. From 2028 we're fitting the distribution network with smart pressure
  sensors from a German manufacturer. A model inside each sensor tells real pressure surges and
  sudden drops apart from harmless fluctuations; when it detects a dangerous one, the sensor raises
  an alarm in our control room and signals the nearest automatic valves to close, protecting the
  pipes and the supply to homes. We install and use them as delivered. Our customer service is
  moving to a new billing platform the same year.
label:
