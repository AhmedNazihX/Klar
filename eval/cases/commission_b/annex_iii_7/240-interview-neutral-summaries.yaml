id: cb-240-interview-neutral-summaries
set_name: commission_b
language: de
description: >-
  Wir sind die Ausländerbehörde einer Großstadt in Bayern mit rund 300 Beschäftigten. Ab 2028
  erstellt ein Programm, das wir bei einem Softwarehaus gekauft haben, nach jeder Anhörung eine
  kurze Zusammenfassung des Gesprächs für die Akte. Es gibt wieder, was gefragt und geantwortet
  wurde, in der Reihenfolge des Gesprächs, ohne etwas zu gewichten, wegzulassen oder zu bewerten.
  Es sagt nichts darüber, ob die Person glaubwürdig ist, und gibt keine Empfehlung ab. Die
  Sachbearbeiterin liest die Zusammenfassung gegen und kann sie ändern. Außerdem bieten wir jetzt
  Termine auch samstags an.
label:
  risk_class: limited_risk
  role: deployer
