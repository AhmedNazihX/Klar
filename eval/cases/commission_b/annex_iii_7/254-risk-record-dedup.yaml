id: cb-254-risk-record-dedup
set_name: commission_b
language: en
description: >-
  We are the records unit of a national immigration service, with 30 staff. Once officers have
  finished their risk assessments on applicants, the records come to us for archiving. From 2028 a
  data-quality tool we've bought will tidy them up: it brings the wording of fields into line with
  our standard terminology and finds duplicate entries for the same case. It only runs after the
  human assessment is over, and it produces nothing about any person's risk and plays no part in
  decisions on entry or stay. We use it as supplied. We're also scanning our paper archive.
label:
  risk_class: minimal_risk
  role: deployer
label_citation: ["annex:III:7:b"]
source_example_id: hr-ex-254
accepted_bases: ["outside_use_case"]
label_status: settled
notes: >-
  Draft label, awaiting user approval. Class: harmonising terminology and finding duplicates in
  completed risk-assessment records, after the human assessment, produces no person-level risk
  output for entry or stay decisions, so outside Annex III point 7(b). No Art. 50 duty:
  minimal_risk. Role: deployer of a bought tool.
tags:
  - "area:annex_iii_7"
  - "verdict:not_high"
