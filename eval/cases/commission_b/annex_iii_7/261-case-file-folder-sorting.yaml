id: cb-261-case-file-folder-sorting
set_name: commission_b
language: en
description: >-
  We are a regional immigration office in Ireland with about 150 staff. From 2028 a document tool
  we've bought will sort everything that arrives for an application into fixed folders in the
  electronic file, such as "identity documents", "medical records", "interview notes" and
  "correspondence", so staff can store and find things easily. It uses only those preset labels;
  it doesn't rank anything by importance, leave anything out, or judge what a document shows.
  Officers examine every document themselves. We use the tool as supplied. We're also extending
  our phone-line hours.
label:
  risk_class: minimal_risk
  role: deployer
label_citation: ["art:6:3:a", "annex:III:7:c", "art:6:4"]
source_example_id: hr-ex-261
accepted_bases: ["art_6_3_filter"]
label_status: settled
notes: >-
  Draft label, awaiting user approval. Class: applying fixed, predefined labels to case documents
  for storage and retrieval, without ranking, omitting or evaluating anything, is a narrow
  procedural task in an Annex III point 7(c) setting: the Art. 6(3)(a) exemption. No Art. 50 duty:
  minimal_risk. Art. 6(4): the provider must document this assessment before placing the tool on
  the market (and register it under Art. 49(2)). Role: deployer of a bought tool.
tags:
  - "area:annex_iii_7"
  - "verdict:not_high"
  - "art_6_4_documentation"
