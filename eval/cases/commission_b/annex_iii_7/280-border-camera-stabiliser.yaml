id: cb-280-border-camera-stabiliser
set_name: commission_b
language: en
description: >-
  We're a 35-person video-processing company in Tampere. Border guards in two countries will use
  our software from 2028 on the feeds from their tower and vehicle cameras. It steadies shaky
  footage, removes noise and sharpens the image in fog or at dusk so operators get a clearer
  picture. It does not detect, recognise or identify people or anything else, and it raises no
  alerts or cues for a response; the operators watch the improved feed themselves. We developed it
  in-house and sell it under our brand. We also make video tools for wildlife researchers.
label:
  risk_class: minimal_risk
  role: provider
label_citation: ["art:6:3:d", "annex:III:7:d", "art:6:4"]
source_example_id: hr-ex-280
accepted_bases: ["art_6_3_filter"]
label_status: settled
notes: >-
  Label approved 2026-10-07 (checked against the source row by the orchestrator under the user's standing delegation for clear labels). Class: stabilising, denoising and enhancing video feeds used
  in border control, without detecting or identifying people or producing cues for a response, is
  a preparatory task: the Art. 6(3)(d) exemption from Annex III point 7(d). Enhancement does not
  substantially alter the footage, so no Art. 50(2) duty: minimal_risk. Art. 6(4): as provider it
  must document this assessment before placing the software on the market (and register it under
  Art. 49(2)).
tags:
  - "area:annex_iii_7"
  - "verdict:not_high"
  - "art_6_4_documentation"
