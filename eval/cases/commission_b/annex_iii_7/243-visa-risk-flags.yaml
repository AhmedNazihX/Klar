id: cb-243-visa-risk-flags
set_name: commission_b
language: de
description: >-
  Wir sind die Visastelle des Außenministeriums eines EU-Staates; in den Botschaften und in der
  Zentrale bearbeiten rund 900 Beschäftigte Visumanträge. Ab 2028 prüft ein Programm, das ein
  Dienstleister für uns betreibt, jeden Antrag automatisch. Anhand von Indikatoren, die aus
  aktuellen Entwicklungen und festen Prüfregeln abgeleitet sind, setzt es für jede antragstellende
  Person Warnhinweise zu Sicherheitsrisiken, zum Risiko irregulärer Migration und zu
  Gesundheitsrisiken. Personen mit Warnhinweis werden namentlich zur vertieften Prüfung
  weitergeleitet. Wir nutzen das Programm wie geliefert. Nebenbei stellen wir auf digitale
  Terminbuchung um.
label:
  risk_class: high_risk
  role: deployer
  annex_point: "annex:III:7:b"
label_citation: ["annex:III:7:b", "art:6:2", "art:6:3"]
source_example_id: hr-ex-243
accepted_bases: ["within_use_case"]
label_status: settled
notes: >-
  Draft label, awaiting user approval. Class: computing per-person security, irregular-migration and
  health risk flags in visa processing and referring named applicants for further checks is Annex
  III point 7(b), high-risk under Art. 6(2); no Art. 6(3) exemption (profiling). Role: deployer;
  the service provider runs the program on its behalf.
tags:
  - "area:annex_iii_7"
  - "verdict:high"
