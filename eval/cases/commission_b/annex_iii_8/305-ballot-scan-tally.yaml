id: cb-305-ballot-scan-tally
set_name: commission_b
language: de
description: >-
  Wir sind das Wahlamt einer Großstadt in Nordrhein-Westfalen mit 25 festen Mitarbeitenden und
  Tausenden Wahlhelfern am Wahltag. Für die Kommunalwahl 2030 testen wir Zählgeräte eines
  Herstellers aus den Niederlanden: Die Stimmzettel werden eingescannt, ein trainiertes
  Erkennungsmodell liest die Kreuze, auch schief gesetzte oder nachgezogene, und das Gerät zählt
  die Stimmen je Kandidat zusammen. Unklare Zettel legt es zur Entscheidung durch den Wahlvorstand
  beiseite. Mehr macht das Gerät nicht. Außerdem suchen wir noch Wahlhelferinnen und Wahlhelfer für
  die Briefwahlbezirke.
label:
  risk_class: minimal_risk
  role: deployer
label_citation: ["annex:III:8:b"]
source_example_id: hr-ex-305
accepted_bases: ["outside_use_case"]
label_status: settled
notes: >-
  Draft label, awaiting user approval. Class: recognising marks on scanned ballots and tallying
  them is a technical aid whose purpose is not to influence the outcome of an election or voting
  behaviour, so outside Annex III point 8(b). No Art. 50 duty: minimal_risk. Role: deployer of
  bought devices.
tags:
  - "area:annex_iii_8"
  - "verdict:not_high"
