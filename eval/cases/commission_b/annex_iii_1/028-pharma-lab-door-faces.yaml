id: cb-028-pharma-lab-door-faces
set_name: commission_b
language: en
description: >-
  We're a pharmaceutical manufacturer with about 2,000 employees and our headquarters in Ghent.
  Only cleared staff may enter the research labs, the server room and the vault for controlled
  substances. In January 2028 we start replacing the badge readers on those doors with
  face-recognition terminals supplied by a security integrator. Employees with clearance enrol
  once; after that they look into the terminal, it checks them against the enrolled staff and
  unlocks the door if they're authorised. It does not follow anyone around the building, record
  working hours or feed into HR. Visitors still get escorted with a paper pass. The same project
  is paying for a refurbished staff canteen.
label:
  risk_class: minimal_risk
  role: deployer
label_citation: ["annex:III:1:a", "art:3:36"]
source_example_id: hr-ex-028
accepted_bases: ["outside_use_case"]
label_status: settled
notes: >-
  Label approved 2026-10-07 (checked against the source row by the orchestrator under the user's standing delegation for clear labels). Class: the terminals confirm the identity of enrolled staff
  for the sole purpose of secure access to premises, which the Commission treats as biometric
  verification (Art. 3(36)), excluded from Annex III point 1(a). Not workplace monitoring under
  point 4(b): it records no hours and feeds nothing to HR. No Art. 50 duty: minimal_risk. Role:
  deployer of a bought system.
tags:
  - "area:annex_iii_1"
  - "verdict:not_high"
