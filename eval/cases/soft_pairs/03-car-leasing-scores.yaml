- id: soft-03-car-leasing-scores-plain
  set_name: soft_pairs
  language: en
  description: >-
    We are a car dealer group with nine showrooms in Austria and our own leasing company for
    private customers. Since this spring, every private leasing application goes through
    CrediDrive, a scoring tool we license from a Viennese fintech. It uses the customer's income,
    existing loans, payment history from a credit bureau and length of employment to estimate how
    likely they are to fall behind on the monthly instalments. Above a set score the lease is
    approved automatically; below it the customer is declined or asked for a larger deposit. We
    run the tool unchanged. Our showrooms also now offer free coffee from a local roaster.
  label:
    risk_class: high_risk
    role: deployer
    annex_point: "annex:III:5:b"
  label_citation: ["annex:III:5:b", "art:6:2", "art:6:3", "art:3:4"]
  pair_id: soft-03
  business_function: finance
  notes: >-
    Draft for user review (B6). Class: the tool evaluates the creditworthiness of natural persons
    applying for a lease, and its score decides approval, refusal or a larger deposit (Annex III
    5(b)); it is not used for fraud detection. Scoring each applicant's economic situation is
    profiling, so Art. 6(3) third subparagraph keeps it high-risk. Role: the dealer group's
    leasing company uses the licensed tool unchanged (Art. 3(4)): deployer.
  tags: ["pair:soft-03", "wording:plain"]
- id: soft-03-car-leasing-scores-soft
  set_name: soft_pairs
  language: en
  description: >-
    We are a car dealer group with nine showrooms in Austria and our own leasing company for
    private customers. To speed up the paperwork at the sales desk, we use CrediDrive from a
    Viennese fintech. It pulls together the customer's details, helps our salespeople prepare a
    suitable leasing offer on the spot and tells them which offer structure fits the customer
    best. We run it unchanged. Our showrooms also now offer free coffee from a local roaster.
  label:
    risk_class: high_risk
    role: deployer
    annex_point: "annex:III:5:b"
  label_citation: ["annex:III:5:b", "art:6:2", "art:6:3", "art:3:4"]
  pair_id: soft-03
  business_function: finance
  key_fact_answers:
    annex_iii_use: >-
      It gives every private applicant a score for how likely they are to miss monthly
      instalments. The score decides whether the lease is approved, declined or needs a larger
      deposit.
    "annex:III:5:b": >-
      Yes. It assesses whether the customer can pay, from their income, existing loans,
      credit-bureau history and length of employment. It is not used to detect fraud.
    profiling: >-
      Yes. It evaluates each applicant's economic situation and reliability from their personal
      data.
    "art:6:3": >-
      Above the set score the lease is approved automatically; below it the salesperson follows
      the tool's outcome.
    "art:3:1": >-
      Yes. The fintech trained a machine-learning model on past leasing contracts.
  notes: >-
    Draft for user review (B6). The same system as soft-03-car-leasing-scores-plain: "which offer
    structure fits the customer best" is the score-based approval, refusal or larger deposit.
    Label and reasoning as for the plain case (Annex III 5(b), profiling under Art. 6(3),
    deployer under Art. 3(4)).
  tags: ["pair:soft-03", "wording:soft"]
