- id: soft-05-conservatory-pre-auditions-plain
  set_name: soft_pairs
  language: en
  description: >-
    We are a conservatory of music in Porto with about 900 students. Each year around 1,400
    people apply for 120 first-year places, and every applicant uploads a pre-audition video.
    Since 2025 we have used TempoScreen, licensed from a Spanish company: it analyses each video
    for intonation, rhythm and technique, gives every applicant a score and ranks them per
    instrument. Only the top-ranked applicants are invited to the live audition; the others are
    told they have not been admitted. We use the tool as delivered. This year we also renovated
    our concert hall's organ.
  label:
    risk_class: high_risk
    role: deployer
    annex_point: "annex:III:3:a"
  label_citation: ["annex:III:3:a", "art:6:2", "art:6:3", "art:3:4"]
  pair_id: soft-05
  business_function: education
  notes: >-
    Draft for user review (B6). Class: the ranking decides who goes on to the live audition and
    who is refused a place, so the system determines admission to an educational institution
    (Annex III 3(a)); it ranks the applicants itself and no one reviews those below the line, so
    none of the Art. 6(3) conditions (a) to (d) applies. Role: the conservatory uses the licensed
    tool as delivered (Art. 3(4)): deployer.
  tags: ["pair:soft-05", "wording:plain"]
- id: soft-05-conservatory-pre-auditions-soft
  set_name: soft_pairs
  language: en
  description: >-
    We are a conservatory of music in Porto with about 900 students. Each year around 1,400
    people send us a pre-audition video. Since 2025 we have used TempoScreen, licensed from a
    Spanish company, to help our admissions office cope with the volume: it handles the video
    uploads, gives each recording a first technical listen and helps the office plan the live
    audition days. We use the tool as delivered. This year we also renovated our concert hall's
    organ.
  label:
    risk_class: high_risk
    role: deployer
    annex_point: "annex:III:3:a"
  label_citation: ["annex:III:3:a", "art:6:2", "art:6:3", "art:3:4"]
  pair_id: soft-05
  business_function: education
  key_fact_answers:
    annex_iii_use: >-
      It scores each pre-audition video for intonation, rhythm and technique and ranks the
      applicants per instrument.
    "annex:III:3:a": >-
      Only the top-ranked applicants are invited to the live audition; everyone else is told
      they have not been admitted.
    "art:6:3": >-
      No teacher watches the videos of applicants below the invitation line.
    "art:3:1": >-
      Yes. It is a machine-learning model trained on recordings that music teachers had rated.
  notes: >-
    Draft for user review (B6). The same system as soft-05-conservatory-pre-auditions-plain: the
    "first technical listen" is the score and ranking, and "plan the live audition days" is
    choosing who is invited, which decides admission. Label and reasoning as for the plain case
    (Annex III 3(a), no Art. 6(3) condition met, deployer under Art. 3(4)).
  tags: ["pair:soft-05", "wording:soft"]
