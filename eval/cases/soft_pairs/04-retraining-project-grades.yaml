- id: soft-04-retraining-project-grades-plain
  set_name: soft_pairs
  language: en
  description: >-
    We are a private IT training academy in Ghent offering state-recognised retraining courses
    for adults who switch careers into software development. Our in-house developers built
    GradeBot, which marks the final project every learner submits at the end of the 18-month
    course. It reads the code and the written report, applies our marking rubric and produces the
    final grade. A pass grade is required for the certificate; trainers only look at a project
    again if a learner appeals. We use GradeBot only in our own academy. We also run free coding
    meetups on Thursday evenings.
  label:
    risk_class: high_risk
    role: provider
    annex_point: "annex:III:3:b"
  label_citation: ["annex:III:3:b", "art:6:2", "art:6:3", "art:3:3"]
  pair_id: soft-04
  business_function: education
  notes: >-
    Draft for user review (B6). Class: the system evaluates learning outcomes at a vocational
    training institution, and its grade decides whether the learner gets the certificate (Annex
    III 3(b)); it produces the grade itself, so none of the Art. 6(3) conditions (a) to (d)
    applies. Role: the academy developed the system and puts it into service for its own use
    under its own name (Art. 3(3), 3(11)): provider (it is also the deployer).
  tags: ["pair:soft-04", "wording:plain"]
- id: soft-04-retraining-project-grades-soft
  set_name: soft_pairs
  language: en
  description: >-
    We are a private IT training academy in Ghent offering state-recognised retraining courses
    for adults moving into software development. Our developers built GradeBot, an internal
    helper for the end of the course: when learners hand in their final project, it reads through
    the code and the written report, checks them against our rubric and prepares a structured
    summary for the course records. It saves our trainers many hours of routine work. We also run
    free coding meetups on Thursday evenings.
  label:
    risk_class: high_risk
    role: provider
    annex_point: "annex:III:3:b"
  label_citation: ["annex:III:3:b", "art:6:2", "art:6:3", "art:3:3"]
  pair_id: soft-04
  business_function: education
  key_fact_answers:
    annex_iii_use: >-
      The summary includes the final grade for the project, and that grade goes into the course
      records as the learner's result.
    "annex:III:3:b": >-
      Yes. The final project grade decides whether the learner passes the course and receives
      the certificate.
    "art:6:3": >-
      Trainers do not re-mark the projects; they only look at one again if the learner appeals.
    "art:3:1": >-
      Yes. It uses a large language model that we fine-tuned on past marked projects.
    "art:3:3": >-
      We built it ourselves and use it only in our own academy, under our own name.
  notes: >-
    Draft for user review (B6). The same system as soft-04-retraining-project-grades-plain: the
    "structured summary for the course records" carries the final grade that decides the
    certificate. Label and reasoning as for the plain case (Annex III 3(b), no Art. 6(3)
    condition met, provider under Art. 3(3)).
  tags: ["pair:soft-04", "wording:soft"]
