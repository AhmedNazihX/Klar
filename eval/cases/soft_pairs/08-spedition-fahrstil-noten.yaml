- id: soft-08-spedition-fahrstil-noten-plain
  set_name: soft_pairs
  language: de
  description: >-
    Wir sind eine Spedition aus dem Raum Osnabrück mit 140 Lkw und rund 170 angestellten
    Fahrerinnen und Fahrern. Seit Anfang 2026 nutzen wir FleetScore, eine Telematiklösung eines
    Hamburger Anbieters. Sie wertet für jede Person am Steuer Bremsverhalten, Geschwindigkeit,
    Leerlaufzeiten und Pausen aus und vergibt monatlich eine Fahrstil-Note. Danach richtet die
    Disposition die Prämie aus; wer drei Monate in Folge unter dem Grenzwert liegt, wird zum
    Personalgespräch geladen und abgemahnt, und befristete Verträge werden dann in der Regel nicht
    verlängert. Wir nutzen die Software unverändert. Außerdem haben wir dieses Jahr eine neue
    Waschanlage für den Fuhrpark gebaut.
  label:
    risk_class: high_risk
    role: deployer
    annex_point: "annex:III:4:b"
  label_citation: ["annex:III:4:b", "art:6:2", "art:6:3", "art:3:4"]
  pair_id: soft-08
  business_function: hr
  notes: >-
    Draft for user review (B6). Class: the system monitors and evaluates the behaviour of
    employed drivers, and its grade decides bonuses, warnings and whether fixed-term contracts
    are renewed (Annex III 4(b)); grading each driver's behaviour from their own driving data is
    profiling, so Art. 6(3) third subparagraph keeps it high-risk. Role: the haulier uses the
    bought software unchanged (Art. 3(4)): deployer.
  tags: ["pair:soft-08", "wording:plain"]
- id: soft-08-spedition-fahrstil-noten-soft
  set_name: soft_pairs
  language: de
  description: >-
    Wir sind eine Spedition aus dem Raum Osnabrück mit 140 Lkw. Seit Anfang 2026 nutzen wir
    FleetScore, eine Flottenmanagement-App eines Hamburger Anbieters. Sie hilft uns, Fahrten
    auszuwerten, Spritkosten zu senken und den Verschleiß der Fahrzeuge im Blick zu behalten. Die
    Ergebnisse fließen in unsere monatliche Teamrunde und in die Personalplanung ein. Wir nutzen
    die Software unverändert. Außerdem haben wir dieses Jahr eine neue Waschanlage für den
    Fuhrpark gebaut.
  label:
    risk_class: high_risk
    role: deployer
    annex_point: "annex:III:4:b"
  label_citation: ["annex:III:4:b", "art:6:2", "art:6:3", "art:3:4"]
  pair_id: soft-08
  business_function: hr
  key_fact_answers:
    annex_iii_use: >-
      Die App vergibt jeder Fahrerin und jedem Fahrer monatlich eine Fahrstil-Note aus
      Bremsverhalten, Geschwindigkeit, Leerlaufzeiten und Pausen.
    profiling: >-
      Ja. Sie bewertet das Fahrverhalten und die Zuverlässigkeit jeder einzelnen Person anhand
      ihrer eigenen Fahrdaten.
    "annex:III:4:b": >-
      Nach der Note richtet sich die Prämie; wer drei Monate in Folge unter dem Grenzwert liegt,
      wird abgemahnt, und befristete Verträge werden dann meist nicht verlängert.
    "art:6:3": >-
      Die Disposition übernimmt die Noten, ohne die Fahrten selbst noch einmal zu prüfen.
    "art:3:1": >-
      Ja. Der Anbieter nutzt ein Modell, das mit Fahrdaten vieler Flotten trainiert wurde.
  notes: >-
    Draft for user review (B6). The same system as soft-08-spedition-fahrstil-noten-plain: the
    "Ergebnisse" are the per-driver grades, and "Personalplanung" covers the warnings and
    contract renewals. Label and reasoning as for the plain case (Annex III 4(b), profiling
    under Art. 6(3), deployer under Art. 3(4)).
  tags: ["pair:soft-08", "wording:soft"]
