- id: soft-10-grundsicherung-antraege-plain
  set_name: soft_pairs
  language: de
  description: >-
    Wir sind das Sozialamt eines Landkreises in Niedersachsen und bearbeiten jährlich rund 3.000
    Anträge auf Grundsicherung im Alter und bei Erwerbsminderung. Seit 2026 nutzen wir
    SozialCheck, eine Software unseres kommunalen IT-Dienstleisters. Sie prüft jeden Antrag samt
    Unterlagen, bewertet, ob die Person anspruchsberechtigt ist, berechnet die Höhe der Leistung
    und markiert Anträge, die abgelehnt werden sollen. Die Sachbearbeitung erlässt die Bescheide
    in aller Regel so, wie die Software sie vorschlägt. Wir haben an der Software nichts
    verändert. Im Frühjahr ist unser Amt außerdem in ein neues Kreishaus umgezogen.
  label:
    risk_class: high_risk
    role: deployer
    annex_point: "annex:III:5:a"
  label_citation: ["annex:III:5:a", "art:6:2", "art:6:3", "art:3:4"]
  pair_id: soft-10
  business_function: public_services
  notes: >-
    Draft for user review (B6). Class: a public authority uses the system to evaluate whether
    people are eligible for an essential public assistance benefit (basic income support in old
    age and reduced earning capacity) and to grant, size or refuse it (Annex III 5(a)); assessing
    each applicant's economic situation is profiling, so Art. 6(3) third subparagraph keeps it
    high-risk. Role: the district office uses the software unchanged under its authority
    (Art. 3(4)): deployer.
  tags: ["pair:soft-10", "wording:plain"]
- id: soft-10-grundsicherung-antraege-soft
  set_name: soft_pairs
  language: de
  description: >-
    Wir sind das Sozialamt eines Landkreises in Niedersachsen und bearbeiten jährlich rund 3.000
    Anträge auf Grundsicherung im Alter und bei Erwerbsminderung. Seit 2026 hilft uns
    SozialCheck, eine Software unseres kommunalen IT-Dienstleisters, die Antragsflut zu
    bewältigen: Sie sortiert eingehende Unterlagen, bereitet die Fälle für die Sachbearbeitung
    vor und macht Vorschläge, damit die Bescheide schneller rausgehen. Wir haben an der Software
    nichts verändert. Im Frühjahr ist unser Amt außerdem in ein neues Kreishaus umgezogen.
  label:
    risk_class: high_risk
    role: deployer
    annex_point: "annex:III:5:a"
  label_citation: ["annex:III:5:a", "art:6:2", "art:6:3", "art:3:4"]
  pair_id: soft-10
  business_function: public_services
  key_fact_answers:
    annex_iii_use: >-
      SozialCheck bewertet bei jedem Antrag, ob die Person anspruchsberechtigt ist, berechnet die
      Höhe der Grundsicherung und markiert Anträge, die abgelehnt werden sollen.
    public_scheme: >-
      Es ist eine staatliche Sozialleistung; wir sind als Sozialamt des Landkreises die
      zuständige Behörde.
    "annex:III:5:a": >-
      Ja. Die Vorschläge betreffen die Bewilligung, die Höhe oder die Ablehnung der
      Grundsicherung.
    profiling: >-
      Ja. Sie bewertet die wirtschaftliche Lage jeder antragstellenden Person anhand ihrer
      Unterlagen.
    "art:6:3": >-
      Die Sachbearbeitung erlässt die Bescheide in aller Regel so, wie die Software sie
      vorschlägt.
    "art:3:1": >-
      Ja. Der Dienstleister setzt ein Modell ein, das mit früheren Fällen trainiert wurde.
  notes: >-
    Draft for user review (B6). The same system as soft-10-grundsicherung-antraege-plain: the
    "Vorschläge" are the eligibility assessment, the amount and the refusal flags that the
    caseworkers usually adopt. Label and reasoning as for the plain case (Annex III 5(a),
    profiling under Art. 6(3), deployer under Art. 3(4)).
  tags: ["pair:soft-10", "wording:soft"]
