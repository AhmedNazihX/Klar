# Spot-check decisions for the academic set (eval/reports/academic_spotcheck.md), applied on top
# of the source by `aiact evaluate academic-import`. Every change is logged in eval/LABEL_CHANGES.md.
# Fields: id; expect_class (the source risk level) and expect_text (a fragment of the description),
# which the import checks so an override can't land on the wrong case; optional status /
# risk_class / label_citation / add_tags; notes (written into the case); reason (why, citing the
# provision); approved (who and when).
# The pattern-2 tag `scoring:low-or-out-of-scope` is applied by rule in the importer, not here.

# --- source label -> legally_ambiguous (risk_class keeps the stricter reading) ------------------

- id: academic-0005
  expect_class: prohibited
  expect_text: barely perceptible visual prompts
  status: legally_ambiguous
  label_citation: ["art:5:1:a"]
  notes: >-
    Open question: does nudging viewers into subscription upgrades cause, or reasonably risk,
    significant harm? Reading 1: yes, so the subliminal technique is prohibited under
    Art. 5(1)(a). Reading 2: no, so Art. 5(1)(a) doesn't apply and the system is not prohibited.
    Working assumption: prohibited.
  reason: >-
    Art. 5(1)(a) requires that the distortion causes or is reasonably likely to cause significant
    harm; the description can't settle that condition.
  approved: user, 2026-09-28 (B12 spot-check)

- id: academic-0136
  expect_class: high-risk
  expect_text: eligibility for pension benefits
  status: legally_ambiguous
  label_citation: ["annex:III:5:a"]
  notes: >-
    Open question: is the pension scheme public or private? Reading 1: a public authority (or
    someone on its behalf) evaluates eligibility for public benefits, so high-risk under
    Annex III 5(a). Reading 2: a private pension scheme, which Annex III 5(a) doesn't cover.
    Follow-up question: is the pension scheme public or private? Working assumption: high-risk.
  reason: >-
    Annex III 5(a) covers only AI systems used by or on behalf of public authorities; the
    description doesn't say who runs the scheme.
  approved: user, 2026-09-28 (B12 spot-check)

- id: academic-0150
  expect_class: high-risk
  expect_text: doctoral scholarships
  status: legally_ambiguous
  label_citation: ["annex:III:3:a", "annex:III:3:c"]
  notes: >-
    Open question: does the scholarship decide admission to the doctoral programme, or fund
    students already admitted? Reading 1: it decides admission or the level of education a
    person can access, so high-risk under Annex III 3(a) or 3(c). Reading 2: it only funds
    admitted students, which no Annex III point clearly covers. Follow-up question: does the
    scholarship decide admission? Working assumption: high-risk.
  reason: >-
    Annex III 3(a) and 3(c) cover access or admission to, and the level of, education; a
    scholarship is funding, and the description doesn't say whether it decides admission.
  approved: user, 2026-09-28 (B12 spot-check)

