  claim: |-
    Frage: Müssen Betreiber eines Emotionserkennungssystems die Betroffenen informieren?
    Antwort: Ja. Betreiber müssen die betroffenen Personen über den Betrieb des Systems informieren und vorher ihre ausdrückliche Einwilligung einholen.
  source: |-
    Art. 50 Abs. 3
    Die Betreiber eines Emotionserkennungssystems oder eines Systems zur biometrischen Kategorisierung informieren die davon betroffenen natürlichen Personen über den Betrieb des Systems und verarbeiten personenbezogene Daten gemäß den Verordnungen (EU) 2016/679 und (EU) 2018/1725 und der Richtlinie (EU) 2016/680. Diese Pflicht gilt nicht für gesetzlich zur Aufdeckung, Verhütung oder Ermittlung von Straftaten zugelassene KI-Systeme, die zur biometrischen Kategorisierung und Emotionserkennung im Einklang mit dem Unionsrecht verwendet werden, sofern geeignete Schutzvorkehrungen für die Rechte und Freiheiten Dritter bestehen.
- id: jv-de-15
  check: qa_support
  language: de
  provisions:
  - art:25:1
  claim: |-
    Frage: Wann wird ein Händler zum Anbieter eines Hochrisiko-KI-Systems?
    Antwort: Unter anderem, wenn er ein bereits in Verkehr gebrachtes Hochrisiko-KI-System mit seinem Namen oder seiner Handelsmarke versieht oder es so wesentlich verändert, dass es hochriskant bleibt.
  source: |-
    Art. 25 Abs. 1
    In den folgenden Fällen gelten Händler, Einführer, Betreiber oder sonstige Dritte als Anbieter eines Hochrisiko-KI-Systems für die Zwecke dieser Verordnung und unterliegen den Anbieterpflichten gemäß Artikel 16:
    a) wenn sie ein bereits in Verkehr gebrachtes oder in Betrieb genommenes Hochrisiko-KI-System mit ihrem Namen oder ihrer Handelsmarke versehen, unbeschadet vertraglicher Vereinbarungen, die eine andere Aufteilung der Pflichten vorsehen;
    b) wenn sie eine wesentliche Veränderung eines Hochrisiko-KI-Systems, das bereits in Verkehr gebracht oder in Betrieb genommen wurde, so vornehmen, dass es weiterhin ein Hochrisiko-KI-System gemäß Artikel 6 bleibt;
    c) wenn sie die Zweckbestimmung eines KI-Systems, einschließlich eines KI-Systems mit allgemeinem Verwendungszweck, das nicht als hochriskant eingestuft wurde und bereits in Verkehr gebracht oder in Betrieb genommen wurde, so verändern, dass das betreffende KI-System zu einem Hochrisiko-KI-System im Sinne von Artikel 6 wird.
- id: jv-de-16
  check: qa_support
  language: de
  provisions:
  - art:26:6
  claim: |-
    Frage: Wie lange müssen Betreiber die Protokolle eines Hochrisiko-KI-Systems aufbewahren?
    Antwort: Mindestens sechs Monate, soweit die Protokolle ihrer Kontrolle unterliegen und das Unionsrecht oder das nationale Recht nichts anderes bestimmt.
  source: |-
    Art. 26 Abs. 6
    Betreiber von Hochrisiko-KI-Systemen bewahren die von ihrem Hochrisiko-KI-System automatisch erzeugten Protokolle, soweit diese Protokolle ihrer Kontrolle unterliegen, für einen der Zweckbestimmung des Hochrisiko-KI-Systems angemessenen Zeitraum von mindestens sechs Monaten auf, sofern im geltenden Unionsrecht, insbesondere im Unionsrecht über den Schutz personenbezogener Daten, oder im geltenden nationalen Recht nichts anderes bestimmt ist.
    Betreiber, die Finanzinstitute sind und gemäß den Rechtsvorschriften der Union über Finanzdienstleistungen Anforderungen in Bezug auf ihre Regelungen oder Verfahren der internen Unternehmensführung unterliegen, bewahren die Protokolle als Teil der gemäß einschlägigem Unionsecht über Finanzdienstleistungen aufzubewahrenden Dokumentation auf.
- id: jv-de-17
  check: qa_support
  language: de
  provisions:
  - art:2:8
  claim: |-
    Frage: Gilt die KI-Verordnung für Tests eines KI-Systems vor der Markteinführung?
    Antwort: Nein. Forschungs-, Test- und Entwicklungstätigkeiten vor dem Inverkehrbringen sind ausgenommen, und das gilt auch für Tests unter Realbedingungen.
  source: |-
    Art. 2 Abs. 8
    Diese Verordnung gilt nicht für Forschungs-, Test- und Entwicklungstätigkeiten zu KI-Systemen oder KI-Modellen, bevor diese in Verkehr gebracht oder in Betrieb genommen werden. Solche Tätigkeiten werden im Einklang mit dem geltenden Unionsrecht durchgeführt. Tests unter Realbedingungen fallen nicht unter diesen Ausschluss.
- id: jv-de-18
  check: qa_support
  language: de
  provisions:
  - art:86:1
  claim: |-
    Frage: Welche Rechte haben Personen, über die mit Hilfe eines Hochrisiko-KI-Systems entschieden wurde?
    Antwort: Sie können vom Betreiber eine klare und aussagekräftige Erläuterung zur Rolle des KI-Systems im Entscheidungsprozess und zu den wichtigsten Elementen der Entscheidung verlangen; für Systeme nach Anhang III Nummer 2 gilt das nicht.
  source: |-
    Art. 86 Abs. 1
    Personen, die von einer Entscheidung betroffen sind, die der Betreiber auf der Grundlage der Ausgaben eines in Anhang III aufgeführten Hochrisiko-KI-Systems, mit Ausnahme der in Nummer 2 des genannten Anhangs aufgeführten Systeme, getroffen hat und die rechtliche Auswirkungen hat oder sie in ähnlicher Art erheblich auf eine Weise beeinträchtigt, die ihrer Ansicht nach ihre Gesundheit, ihre Sicherheit oder ihre Grundrechte beeinträchtigt, haben das Recht, vom Betreiber eine klare und aussagekräftige Erläuterung zur Rolle des KI-Systems im Entscheidungsprozess und zu den wichtigsten Elementen der getroffenen Entscheidung zu erhalten.
