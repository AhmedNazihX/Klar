# Judge validation cases (story V4, decision 006). Each case is a claim and the text it must
# rest on; the hand label lives in labels.yaml. Legal sources are quoted word for word from
# data/parsed/ai-act-consolidated.<language>.jsonl (the amended text); descriptions and
# supplied facts are invented for this set. Never ingested into the corpus.
- id: jv-en-01
  check: citation_support
  language: en
  provisions:
  - art:50:1
  claim: Providers must design an AI system that talks directly with people so that those people are told
    they are dealing with an AI system, unless this is obvious to a reasonably well-informed and observant
    person.
  source: |-
    Art. 50(1)
    Providers shall ensure that AI systems intended to interact directly with natural persons are designed and developed in such a way that the natural persons concerned are informed that they are interacting with an AI system, unless this is obvious from the point of view of a natural person who is reasonably well-informed, observant and circumspect, taking into account the circumstances and the context of use. This obligation shall not apply to AI systems authorised by law to detect, prevent, investigate or prosecute criminal offences, subject to appropriate safeguards for the rights and freedoms of third parties, unless those systems are available for the public to report a criminal offence.
- id: jv-en-02
  check: citation_support
  language: en
  provisions:
  - art:26:7
  claim: An employer that deploys a high-risk AI system at the workplace must obtain the written consent
    of each affected worker before using it.
  source: |-
    Art. 26(7)
    Before putting into service or using a high-risk AI system at the workplace, deployers who are employers shall inform workers’ representatives and the affected workers that they will be subject to the use of the high-risk AI system. This information shall be provided, where applicable, in accordance with the rules and procedures laid down in Union and national law and practice on information of workers and their representatives.
- id: jv-en-03
  check: citation_support
  language: en
  provisions:
  - art:6:3
  claim: An Annex III system that only performs a narrow procedural task is not high-risk, even when it
    profiles natural persons.
  source: |-
    Art. 6(3)
    By derogation from paragraph 2, an AI system referred to in Annex III shall not be considered to be high-risk where it does not pose a significant risk of harm to the health, safety or fundamental rights of natural persons, including by not materially influencing the outcome of decision making.
    The first subparagraph shall apply where any of the following conditions is fulfilled:
    (a) the AI system is intended to perform a narrow procedural task;
    (b) the AI system is intended to improve the result of a previously completed human activity;
    (c) the AI system is intended to detect decision-making patterns or deviations from prior decision-making patterns and is not meant to replace or influence the previously completed human assessment, without proper human review; or
    (d) the AI system is intended to perform a preparatory task to an assessment relevant for the purposes of the use cases listed in Annex III.
    Notwithstanding the first subparagraph, an AI system referred to in Annex III shall always be considered to be high-risk where the AI system performs profiling of natural persons.
- id: jv-en-04
  check: citation_support
  language: en
  provisions:
