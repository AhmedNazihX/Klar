- case_id: cb-014-bank-fraud-voice-watchlist
  date: '2026-10-14'
  answered_by: agent
  checker_release: 6.5.1
  result_text: "Results\nYour role\nAccording to the AI Act, you are considered as a deployer under Article 3 \n(opens in\
    \ a new tab)\n(4).\nRisk level assessment\nYour AI system is likely a high-risk system under the AI Act following Article\
    \ 6 \n(opens in a new tab)\n.\nYour AI system is likely covered by the AI Act as it does fall within the scope of Article\
    \ 3 \n(opens in a new tab)\n(1).\nYour obligations\nAccording to Article 4 \n(opens in a new tab)\n, you must take measures\
    \ to support the development of AI literacy of your staff and other persons dealing with the operation and use of AI systems\
    \ on your behalf, taking into account their technical knowledge, experience, education and training and the context the\
    \ AI systems are to be used in, and considering the persons or groups of persons on whom the AI systems are to be used.\
    \ This obligation does not require providers or deployers to guarantee any specific level of AI literacy of any individual.\n\
    Your AI system is likely classified as a high-risk system under the AI Act, following Article 6 \n(opens in a new tab)\n\
    . As a deployer of a high-risk AI system, pursuant to Article 26 \n(opens in a new tab)\nyou must:\ntake appropriate technical\
    \ and organisational measures to ensure that AI systems are used in accordance with the instructions accompanying the\
    \ AI systems;\nassign human oversight to natural persons who have the necessary competence, training and authority, as\
    \ well as the necessary support;\nto the extent the deployer exercises control over the input data, you shall ensure that\
    \ input data is relevant and sufficiently representative in view of the intended purpose of the high-risk AI system;\n\
    monitor the operation of the high-risk AI system on the basis of the instructions for use and, where relevant, inform\
    \ providers in accordance with Article 72 \n(opens in a new tab)\n. Where there is a reason to consider that the use of\
    \ the high-risk AI system in accordance with the instructions may result in that AI system presenting a risk you must\
    \ without undue delay inform the provider or distributor and the relevant market surveillance authority, and shall suspend\
    \ the use of that system;\nkeep the logs automatically generated by that high-risk AI system to the extent such logs are\
    \ under their control, for a period appropriate to the intended purpose of the high-risk AI system, of at least six months,\
    \ unless provided otherwise in applicable Union or national law, in particular in Union law on the protection of personal\
    \ data. Deployers that are financial institutions subject to requirements regarding their internal governance, arrangements\
    \ or processes under Union financial services law shall maintain the logs as part of the documentation kept pursuant to\
    \ the relevant Union financial service law.\nAdditionally:\nfor high-risk AI system at the workplace, deployers who are\
    \ employers shall inform workers' representatives and the affected workers that they will be subject to the use of the\
    \ high-risk AI system;\nin the framework of an investigation for the targeted search of a person suspected or convicted\
    \ of having committed a criminal offence, the deployer of a high-risk AI system for post-remote biometric identification\
    \ shall request an authorisation, ex-ante, or without undue delay and no later than 48 hours, by a judicial authority\
    \ or an administrative authority whose decision is binding and subject to judicial review, for the use of that system,\
    \ except when it is used for the initial identification of a potential suspect based on objective and verifiable facts\
    \ directly linked to the offence. Each use shall be limited to what is strictly necessary for the investigation of a specific\
    \ criminal offence;\ndeployers of high-risk AI systems referred to in Annex III \n(opens in a new tab)\nthat make decisions\
    \ or assist in making decisions related to natural persons shall inform the natural persons that they are subject to the\
    \ use of the high-risk AI system. For high-risk AI systems used for law enforcement purposes Аrticle-13 of Directive (EU)\
    \ 2016/680 shall apply;\ncooperate with competent authorities.\nIf you have selected several sectors within Annex III\
    \ \n(opens in a new tab)\nand one of the use cases is considered high-risk and the other(s) not, compliance with the whole\
    \ Chapter 3 applies only to the high-risk use case you have selected and the requirements must be assessed in view of\
    \ that intended purpose\nPrior to deploying a high-risk AI system, deployers that are bodies governed by public law, or\
    \ are private entities providing public services, and deployers of high-risk AI systems referred to in points 5 (b) and\
    \ (c) of Annex III \n(opens in a new tab)\n, shall perform an assessment of the impact on fundamental rights that the\
    \ use of such system may produce. For that purpose, deployers shall perform an assessment based on Article 27 \n(opens\
    \ in a new tab)\nrequirements.\nThe above obligation applies to the first use of the high-risk AI system. The deployer\
    \ may, in similar cases, rely on previously conducted fundamental rights impact assessments or existing impact assessments\
    \ carried out by provider.\nOnce the assessment has been performed, the deployer shall notify the market surveillance\
    \ authority of its results.\nIf any of the obligations laid down in Article 27 \n(opens in a new tab)\nis already met\
    \ through the data protection impact assessment conducted pursuant to Article-35 of Regulation (EU) 2016/679 or Article-27\
    \ of Directive (EU) 2016/680, the deployer may, when conducting the fundamental rights impact assessment referred to in\
    \ paragraph 1 of this Article, include cross-references to the relevant sections of that data protection impact assessment\
    \ or include relevant parts thereof in the fundamental rights impact assessment."
  result_headings:
  - Your AI system is likely a high-risk system under the AI Act following Article 6 .
  - Your AI system is likely covered by the AI Act as it does fall within the scope of Article 3 (1).
  answers:
  - question: Do you want to check an AI model or an AI system?
    answer: AI system
  - question: Is your system an AI system within the meaning of the AI Act?
    answer: 'Yes'
  - question: 'Are you or your organisation responsible for any of the following roles within the EU? Note: If you have multiple
      roles, such as provider and deployer, please complete the assessment separately for each role to ensure a comprehensive
      evaluation'
    answer: Deployer
  - question: As a downstream distributor, importer, deployer, or third-party, have you made any of the following modifications
      to an AI system?
    answer: None of the above
  - question: Do you meet any of the following statement?
    answer: Your AI system is placed or put in service within the EU; You are established or located within the EU; Your AI
      system's output is used in the EU
  - question: Does your AI system meet any of the following descriptions?
    answer: None of the above
  - question: Does your AI system fall under one of these AI practices?
    answer: None of the above
  - question: Is your AI system, or the product in which it is intended to be embedded in, subject to sector-specific regulations?
    answer: 'No'
  - question: Does your AI system fall within any of the following areas?
    answer: Biometrics
  - question: 'Is your AI system intended to be used for any of the following use-cases? Note: the use of your AI system must
      be permitted under relevant EU or national law.'
    answer: Remote biometric identification systems
  - question: 'Could your AI system be exempted from classifying as high-risk because it does not pose a significant risk
      of harm to the health, safety or fundamental rights of natural persons? Note: an AI system referred to in Annex III
      shall always be considered to be high-risk where the AI system performs profiling of natural persons (Article 6 (3)
      AI Act)'
    answer: None of the above
  - question: Does your AI system perform any of these functions?
    answer: None of the above
