  result_text: 'Results

    Your role

    According to the AI Act, you are considered as a deployer under Article 3 (opens in a new tab)

    (4).

    Risk level assessment

    Your AI system is likely covered by the AI Act as it does fall within the scope of Article 3 (opens in a new tab)

    (1).

    Your AI system is likely not considered as high-risk. It is likely that your AI system poses no to minimal risks.

    Your obligations

    According to Article 4 (opens in a new tab)

    , you must take measures to support the development of AI literacy of your staff and other persons dealing with the operation
    and use of AI systems on your behalf, taking into account their technical knowledge, experience, education and training
    and the context the AI systems are to be used in, and considering the persons or groups of persons on whom the AI systems
    are to be used. This obligation does not require providers or deployers to guarantee any specific level of AI literacy
    of any individual.

    Following Article 50 (opens in a new tab)

    of the AI Act, you must follow certain transparency requirements as a deployer.

    If you are deploying an emotion recognition system or a biometric categorisation system, you must inform the natural persons
    exposed thereto of the operation of the system, and shall process the personal data in accordance with Regulations (EU)
    2016/679 and (EU) 2018/1725 and Directive (EU) 2016/680, as applicable. This obligation does not apply to AI systems used
    for biometric categorisation and emotion recognition, which are permitted by law to detect, prevent or investigate criminal
    offences, subject to appropriate safeguards for the rights and freedoms of third parties, and in accordance with Union
    law.

    If your AI system generates or manipulates image, audio or video content constituting a deep fake, you must disclose that
    the content has been artificially generated or manipulated. This obligation shall not apply where the use is authorised
    by law to detect, prevent, investigate or prosecute criminal offence. Where the content forms part of an evidently artistic,
    creative, satirical, fictional or analogous work or programme, the transparency obligations set out in this paragraph
    are limited to disclosure of the existence of such generated or manipulated content in an appropriate manner that does
    not hamper the display or enjoyment of the work.

    If your AI system generates or manipulates text which is published with the purpose of informing the public on matters
    of public interest shall disclose that the text has been artificially generated or manipulated. This obligation shall
    not apply where the use is authorised by law to detect, prevent, investigate or prosecute criminal offences or where the
    AI-generated content has undergone a process of human review or editorial control and where a natural or legal person
    holds editorial responsibility for the publication of the content.

    The information should be provided to the natural persons concerned in a clear and distinguishable manner at the latest
    at the time of the first interaction or exposure. The information shall conform to the applicable accessibility requirements.

    Your AI system is likely not considered as high-risk. It is likely that your AI system does not have to comply with Chapter
    3 of the AI Act, which relates to high-risk AI systems.'
