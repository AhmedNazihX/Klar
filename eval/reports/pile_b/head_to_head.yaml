# Head-to-head (V10a, decision 036 and its amendment of 2026-10-14): the Commission's AI Act
# Service Desk checker.
# Checker: https://ai-act-service-desk.ec.europa.eu/en/eu-ai-act-compliance-checker
# The cases come from head_to_head_draw.json (seed and rule there). For each case, the checker's
# questions are answered from the case's description (eval/cases/<set>/) only. Where the
# description doesn't settle a question, pick the reading it most directly supports and list the
# question under uncertain_questions; never pick a "don't know"-style option. Then fill in:
#   date                 the day it was run (YYYY-MM-DD)
#   answered_by          agent in cases (a blind agent, one per case), hand in spot_checks (the
#                        user)
#   checker_release      the question release the checker page names, for example "6.5.1"
#   result_text          the checker's result, copied verbatim
#   result_headings      each sentence under the result's "Risk level assessment" section,
#                        exactly as written there (not section titles such as "Results" or
#                        "Your role"); the "(opens in a new tab)" link labels may be left out
#   answers             every question the checker asked, with the answer given, verbatim:
#                        - question: "..."
#                          answer: "..."
#   uncertain_questions  optional: the questions the description didn't settle, each copied from
#                        answers
#   screenshot           optional: a file name in head_to_head/ next to this file
# cases holds the scored runs, one per drawn case (the agent's). spot_checks holds the user's
# hand runs (answered_by: hand) of the 5 spot-check cases (seed 20261015,
# one per class), run blind to the agent's answers and never scored; the report sets them beside
# the agent's.
# headings: give every heading a run shows a row, its exact text and what it means, before any
# case is scored, for example:
#   headings:
#     "Exact heading text from the checker": high_risk
# Meanings: prohibited_practice, high_risk, transparency_only, no_specific_duties, act_does_not_apply, cannot_determine.
# Check:  uv run aiact evaluate head-to-head check   (--complete: every case and spot-check run)
# Report: uv run aiact evaluate head-to-head render
headings:
  ? Your AI system is likely prohibited under the AI Act, according to Article 5. As of February 2025, you are not allowed
    to place your AI system on the market, put it into service, or use it.
  : prohibited_practice
  Your AI system is likely a high-risk system under the AI Act following Article 6.: high_risk
  Following Article 50 of the AI Act, you must follow certain transparency requirements as a deployer.: transparency_only
  Following Article 50 of the AI Act, you must follow certain transparency requirements as a provider.: transparency_only
  Your AI system is likely not considered as high-risk. It is likely that your AI system poses no to minimal risks.: no_specific_duties
  Your AI system is likely covered by the AI Act as it does fall within the scope of Article 3 (1).: no_specific_duties
  Your AI system is likely not covered by the AI Act as it does not fall within the scope of Article 3 (1).: act_does_not_apply
  ? It is likely that your AI system falls outside the scope of the AI Act. You are not required to comply with the AI Act
    because your system is classified as one of the excluded systems mentioned in Article 2.
  : act_does_not_apply
  ? Your AI system is likely to fall outside the scope of the AI Act, according to Article 2. However, please double check
    with the AI Act provisions or consult a lawyer to verify this.
  : act_does_not_apply
