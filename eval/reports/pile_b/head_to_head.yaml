    Your obligations

    According to Article 4 , you must take measures to support the development of AI literacy of your staff and other persons
    dealing with the operation and use of AI systems on your behalf, taking into account their technical knowledge, experience,
    education and training and the context the AI systems are to be used in, and considering the persons or groups of persons
    on whom the AI systems are to be used. This obligation does not require providers or deployers to guarantee any specific
    level of AI literacy of any individual.

    Following Article 50 of the AI Act, you must follow certain transparency requirements as a provider.

    If your AI system interacts directly with natural persons (e.g. a chatbot), you must ensure that AI systems are designed
    and developed in such a way that the natural persons concerned are informed that they are interacting with an AI system.

    Unless this is obvious from the point of view of a natural person who is reasonably well-informed, observant and circumspect,
    taking into account the circumstances and the context of use.


    This obligation does not apply to AI systems authorised by law to detect, prevent, investigate or prosecute criminal offences,
    subject to appropriate safeguards for the rights and freedoms of third parties, unless those systems are available for
    the public to report a criminal offence.

    If your AI system generates synthetic audio, image, video or text content you must ensure that the outputs of the AI system
    are marked in a machine-readable format and detectable as artificially generated or manipulated. You must ensure that
    your technical solutions are effective, interoperable, robust and reliable as far as this is technically feasible, taking
    into account the specificities and limitations of various types of content, the costs of implementation and the generally
    acknowledged state of the art, as may be reflected in relevant technical standards.

    Transparency obligations shall not apply to the extent the AI systems perform an assistive function for standard editing
    or do not substantially alter the input data provided by the deployer or the semantics thereof, or where authorised by
    law to detect, prevent, investigate or prosecute criminal offences.

    The information shall be provided to the natural persons concerned in a clear and distinguishable manner at the latest
    at the time of the first interaction or exposure. The information shall conform to the applicable accessibility requirements.

    Your AI system is likely not considered as high-risk. It is likely that your AI system does not have to comply with Chapter
    3 of the AI Act, which relates to high-risk AI systems.'
