  date: '2026-10-14'
  answered_by: agent
  checker_release: 6.5.1
  result_text: "Results\nYour role\nAccording to the AI Act, you are considered as a provider under Article 3 \n(opens in\
    \ a new tab)\n(3).\nRisk level assessment\nYour AI system is likely a high-risk system under the AI Act following Article\
    \ 6 \n(opens in a new tab)\n.\nYour AI system is likely covered by the AI Act as it does fall within the scope of Article\
    \ 3 \n(opens in a new tab)\n(1).\nYour obligations\nAccording to Article 4 \n(opens in a new tab)\n, you must take measures\
    \ to support the development of AI literacy of your staff and other persons dealing with the operation and use of AI systems\
    \ on your behalf, taking into account their technical knowledge, experience, education and training and the context the\
    \ AI systems are to be used in, and considering the persons or groups of persons on whom the AI systems are to be used.\
    \ This obligation does not require providers or deployers to guarantee any specific level of AI literacy of any individual.\n\
    Your AI system is likely classified as a high-risk system under the AI Act, following Article 6 \n(opens in a new tab)\n\
    . You are required to comply with the obligations outlined in Articles 8-15 of the AI Act, which pertain to high-risk\
    \ AI systems. These requirements include:\nestablish a risk management system;\nensure adequate data governance and management\
    \ practices;\ndraw up technical documentation;\nensure traceability (record-keeping);\nenable deployers to interpret your\
    \ AI system's output;\nenable human oversight;\nensure an appropriate level of accuracy, robustness and cybersecurity.\n\
    Additionally, as indicated in Article 16 \n(opens in a new tab)\n, a provider must also:\nindicate on the high-risk AI\
    \ system or, where that is not possible, on its packaging or its accompanying documentation, as applicable, their name,\
    \ registered trade name or registered trademark, the address at which they can be contacted;\nhave a quality management\
    \ system in place which complies with Article 17 \n(opens in a new tab)\n;\nkeep the documentation referred to in Article\
    \ 18 \n(opens in a new tab)\n;\nwhen under their control, keep the logs automatically generated by their high-risk AI\
    \ systems as referred to in Article 19 \n(opens in a new tab)\n;\nensure that the high-risk AI system undergoes the relevant\
    \ conformity assessment procedure as referred to in Article 43 \n(opens in a new tab)\n;\ndraw up an EU declaration of\
    \ conformity in accordance with Article 47 \n(opens in a new tab)\n;\naffix the CE marking to the high-risk AI system,\
    \ in accordance with Article 48 \n(opens in a new tab)\n;\ncomply with the registration obligations referred to in Article\
    \ 49 \n(opens in a new tab)\n(1);\ntake the necessary corrective actions and provide information as required in Article\
    \ 20 \n(opens in a new tab)\n;\ncooperate with national competent authorities as required in Article 21 \n(opens in a\
    \ new tab)\n.\nensure that the high-risk AI system complies with accessibility requirements in accordance with Directives\
    \ (EU) 2016/2102 and (EU) 2019/882.\nIf you have selected several sectors within Annex III \n(opens in a new tab)\nand\
    \ one of the use cases is considered high-risk and the other(s) not, compliance with the whole Chapter 3 applies only\
    \ to the high-risk use case you have selected and the requirements must be assessed in view of that intended purpose"
